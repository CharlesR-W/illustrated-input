<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 222" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>Teulu Cynyr</title>
<desc>Family tree. Cynyr (tad, father) and Elen (mam, mother) are joined by a double line. Below them are their children Cai (mab, son) and Mali (merch, daughter); a bracket links Cai as brawd (brother) and Mali as chwaer (sister). Arth stands beside them, joined to the parents only by a dashed line with a question mark.</desc>
<g id="llinellau" fill="none" stroke="#1d2926" stroke-width="2" stroke-linecap="round">
  <path id="priodas" d="M126,26 H194 M126,33 H194"/>
  <path id="plant" d="M160,33 V92 M70,92 H180 M70,92 V108 M180,92 V108"/>
</g>
<g id="cynyr">
  <rect x="44" y="11" width="82" height="36" rx="7" fill="#dcefe5" stroke="#1d2926" stroke-width="2"/>
  <text x="85" y="36" font-size="21" text-anchor="middle" fill="#1d2926">Cynyr</text>
  <text x="85" y="70" font-size="19" text-anchor="middle" fill="#174f42" font-style="italic">tad</text>
</g>
<g id="elen">
  <rect x="194" y="11" width="82" height="36" rx="7" fill="#dcefe5" stroke="#1d2926" stroke-width="2"/>
  <text x="235" y="36" font-size="21" text-anchor="middle" fill="#1d2926">Elen</text>
  <text x="235" y="70" font-size="19" text-anchor="middle" fill="#174f42" font-style="italic">mam</text>
</g>
<g id="cai">
  <rect x="38" y="108" width="64" height="36" rx="7" fill="#fff6e6" stroke="#1d2926" stroke-width="2"/>
  <text x="70" y="133" font-size="21" text-anchor="middle" fill="#1d2926">Cai</text>
  <text x="70" y="166" font-size="19" text-anchor="middle" fill="#174f42" font-style="italic">mab</text>
</g>
<g id="mali">
  <rect x="146" y="108" width="68" height="36" rx="7" fill="#fff6e6" stroke="#1d2926" stroke-width="2"/>
  <text x="180" y="133" font-size="21" text-anchor="middle" fill="#1d2926">Mali</text>
  <text x="180" y="166" font-size="19" text-anchor="middle" fill="#174f42" font-style="italic">merch</text>
</g>
<g id="brawd-chwaer">
  <text x="70" y="190" font-size="19" text-anchor="middle" fill="#8a5a17" font-style="italic">brawd</text>
  <text x="180" y="190" font-size="19" text-anchor="middle" fill="#8a5a17" font-style="italic">chwaer</text>
  <path d="M70,197 V210 H180 V197" fill="none" stroke="#c98a2e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="arth">
  <path id="arth-cyswllt" d="M276,108 V92 H182" fill="none" stroke="#1d2926" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
  <circle cx="230" cy="92" r="13" fill="#fbfaf5" stroke="#1d2926" stroke-width="1.8"/>
  <text x="230" y="99" font-size="20" text-anchor="middle" fill="#1d2926" font-weight="bold">?</text>
  <rect x="244" y="108" width="64" height="36" rx="7" fill="#fbfaf5" stroke="#1d2926" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="276" y="133" font-size="21" text-anchor="middle" fill="#1d2926">Arth</text>
</g>
</svg>
