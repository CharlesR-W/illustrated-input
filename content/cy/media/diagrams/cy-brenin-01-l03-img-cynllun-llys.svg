<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>Llys Cynyr</title>
<desc>Plan of Llys Cynyr seen from above. A round wall of wooden stakes (wal) with a gate at the bottom. Inside: the long hall (neuadd) along the top with its door (drws) facing the yard; the kitchen (cegin) beside it on the right with a small window (ffenest); the kitchen garden (gardd) below the kitchen; the stable (stabl) on the left; and the open farmyard (buarth) in the middle.</desc>
