<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260"><title>Agor a chau ffenest</title><desc>A closed window at left and open window at right; agor points right towards the open window and cau points left towards the closed window.</desc><rect width="700" height="260" fill="#fffaf0"/><rect x="50" y="65" width="140" height="170" fill="#c9e9f2" stroke="#274859" stroke-width="6"/><line x1="120" y1="65" x2="120" y2="235" stroke="#274859" stroke-width="6"/><line x1="50" y1="150" x2="190" y2="150" stroke="#274859" stroke-width="6"/><rect x="430" y="65" width="170" height="170" fill="#e3f5fc" stroke="#274859" stroke-width="6"/><polygon points="430,65 480,90 480,210 430,235" fill="#c9e9f2" stroke="#274859" stroke-width="6"/><polygon points="600,65 550,90 550,210 600,235" fill="#c9e9f2" stroke="#274859" stroke-width="6"/><text x="50" y="44" fill="#172b35" font-size="42" font-family="sans-serif">ffenest</text><text x="225" y="115" fill="#172b35" font-size="42" font-family="sans-serif">agor →</text><text x="225" y="195" fill="#172b35" font-size="42" font-family="sans-serif">← cau</text></svg>