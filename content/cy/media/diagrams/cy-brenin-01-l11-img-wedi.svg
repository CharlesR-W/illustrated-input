<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>yn bwyta ↔ wedi bwyta</title>
<desc>Two small panels side by side. Left, labelled "yn bwyta": a tiny red dragon beside a plate with a whole round pie, biting it. Right, labelled "wedi bwyta": the same plate empty with a few crumbs, and the dragon sitting with a big round full belly and a puff of smoke. An arrow points from left to right.</desc>
