  <circle cx="78" cy="60" r="2" fill="#f2c230" stroke="none"/>
</g>
<g id="bachgen" stroke="#1d2926" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <circle cx="225" cy="58" r="11" fill="#f1d2b6"/>
