<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>ddoe ↔ nawr</title>
<desc>A time line from left to right. Above the left mark, labelled "ddoe", a small hawk flies high: "Hedfanodd Arth." Above the right mark, labelled "nawr", a boy stands on the ground: "Mae Arth wedi hedfan." The arrow runs from ddoe to nawr.</desc>
<defs>
  <marker id="saeth" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1d2926"/>
  </marker>
</defs>
<path d="M20,120 H282" stroke="#1d2926" stroke-width="2.5" marker-end="url(#saeth)"/>
<path d="M75,110 V130 M225,110 V130" stroke="#1d2926" stroke-width="2.5"/>
<g font-size="20" fill="#1d2926" text-anchor="middle">
  <text x="75" y="152">ddoe</text>
  <text x="225" y="152">nawr</text>
</g>
<g font-size="17" fill="#1d2926" text-anchor="middle">
  <text x="75" y="186">Hedfanodd Arth.</text>
  <text x="225" y="186">Mae e wedi hedfan.</text>
</g>
<g id="hebog" stroke="#1d2926" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="#8d8a80">
