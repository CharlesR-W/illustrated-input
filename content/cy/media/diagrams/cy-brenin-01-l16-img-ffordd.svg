<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-labelledby="t d">
  <title id="t">Ffordd y plant</title>
  <desc id="d">Route map from Llys Cynyr at the bottom to the hill at the top: over the bridge across the river, past Myrddin's tower, through the forest, over a small stream, towards the hill, to the pool below the cave. Welsh labels only.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a2e1d"/>
    </marker>
  </defs>
  <rect width="320" height="440" fill="#fbf7ee"/>
  <g font-family="Georgia, serif" font-size="18" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
  <!-- hill, cave and pool -->
  <path d="M40 120 Q160 -10 290 120 Z" fill="#c9cfa3" stroke="#5c6b3a" stroke-width="2"/>
  <ellipse cx="170" cy="52" rx="13" ry="9" fill="#2b2b2b" stroke="none"/>
  <text x="118" y="46" fill="#2b2b2b">ogof</text>
  <ellipse cx="205" cy="98" rx="22" ry="8" fill="#5b8fb9" stroke="#2f5d80" stroke-width="1.5"/>
  <text x="234" y="104" fill="#2f5d80">pwll</text>
  <!-- stream -->
  <path d="M0 172 Q80 162 160 174 T320 168" fill="none" stroke="#5b8fb9" stroke-width="3"/>
  <!-- forest -->
  <g fill="#4f7a3a" stroke="#2f4f22" stroke-width="1">
    <path d="M10 236 l14 -30 l14 30 z"/><path d="M40 244 l14 -30 l14 30 z"/><path d="M70 236 l14 -30 l14 30 z"/>
    <path d="M24 266 l14 -30 l14 30 z"/><path d="M58 270 l14 -30 l14 30 z"/>
    <path d="M276 226 l14 -30 l14 30 z"/><path d="M290 256 l14 -30 l14 30 z"/>
  </g>
  <!-- river and bridge -->
  <path d="M0 332 Q160 312 320 334" fill="none" stroke="#5b8fb9" stroke-width="14"/>
  <rect x="140" y="314" width="40" height="18" rx="4" fill="#a07a4f" stroke="#5a3e22" stroke-width="1.5"/>
  <!-- tower -->
  <path d="M238 300 l6 -46 l18 -2 l4 48 z" fill="#9a9a93" stroke="#555" stroke-width="1.5"/>
  <path d="M240 254 l12 -12 l12 10 z" fill="#555" stroke="none"/>
  <!-- llys -->
  <ellipse cx="160" cy="384" rx="58" ry="22" fill="#f0e2b6" stroke="#7a5a2a" stroke-width="2"/>
  <rect x="142" y="374" width="34" height="16" fill="#e9dfc6" stroke="#7a5a2a" stroke-width="1"/>
  <path d="M140 374 l19 -12 l19 12 z" fill="#d8b24a" stroke="#7a5a2a" stroke-width="1"/>
  <text x="160" y="430" text-anchor="middle" fill="#3a2a14">Llys Cynyr</text>
  <!-- route -->
  <path d="M160 360 L160 342" fill="none" stroke="#7a2e1d" stroke-width="3" marker-end="url(#a)"/>
  <text x="12" y="362" fill="#7a2e1d">dros y bont</text>
  <path d="M160 308 Q180 286 226 278" fill="none" stroke="#7a2e1d" stroke-width="3" marker-end="url(#a)"/>
  <text x="150" y="292" text-anchor="end" fill="#7a2e1d">heibio i'r tŵr</text>
  <path d="M228 270 Q170 240 160 192" fill="none" stroke="#7a2e1d" stroke-width="3" marker-end="url(#a)"/>
  <text x="182" y="216" fill="#7a2e1d">drwy'r</text>
  <text x="182" y="236" fill="#7a2e1d">goedwig</text>
  <path d="M160 188 L160 154" fill="none" stroke="#7a2e1d" stroke-width="3" marker-end="url(#a)"/>
  <text x="168" y="160" fill="#2f5d80">dros y nant</text>
  <path d="M158 148 Q165 125 188 106" fill="none" stroke="#7a2e1d" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="8" y="146" fill="#7a2e1d">tuag at y bryn</text>
  </g>
</svg>
