  <title id="t">Yr wythnos</title>
  <desc id="d">The pocket watch (Myrddin's, kept by Dafi) showing eight o'clock, with a quarter of the dial shaded and labelled 'chwarter awr', and below it the llys week: Monday practice, Tuesday the town, Wednesday money, Thursday Myrddin's lesson, Friday baking, Saturday sleeping, Sunday church. Welsh labels only.</desc>
