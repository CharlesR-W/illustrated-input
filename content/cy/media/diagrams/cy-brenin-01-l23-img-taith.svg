<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="t d">
  <title id="t">Y daith i Gaerllion</title>
  <desc id="d">Route map of the journey in the layout of the Pennod 1 inset of south Wales: from Cwm Helyg in the west, day 1 to the inn, day 2 over the mountain, day 3 across Afon Wysg by boat, day 4 through the flat vale to the walled city of Caerllion in the east. Welsh labels only.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a2e1d"/>
    </marker>
  </defs>
  <rect width="360" height="320" fill="#fbf7ee"/>
  <!-- sea along the bottom -->
  <path d="M0 290 Q90 278 180 288 T360 282 L360 320 L0 320 Z" fill="#cfe0ea" stroke="none"/>
  <!-- mountain -->
  <path d="M120 170 L165 92 L210 170 Z" fill="#c9cfa3" stroke="#5c6b3a" stroke-width="2"/>
  <path d="M152 114 L165 92 L178 114 Z" fill="#ffffff" stroke="none"/>
  <!-- river Wysg -->
  <path d="M262 40 Q250 120 270 180 T262 300" fill="none" stroke="#5b8fb9" stroke-width="9"/>
  <!-- Cwm Helyg -->
  <path d="M14 230 Q40 200 66 230" fill="#d7e3b5" stroke="#5c6b3a" stroke-width="2"/>
  <circle cx="40" cy="224" r="6" fill="#7a5a2a"/>
  <!-- inn -->
  <rect x="88" y="196" width="22" height="16" fill="#e9dfc6" stroke="#7a5a2a" stroke-width="1.5"/>
  <path d="M86 196 l13 -10 l13 10 z" fill="#d8b24a" stroke="#7a5a2a" stroke-width="1"/>
  <!-- boat -->
  <path d="M250 214 h26 l-4 8 h-18 z" fill="#a07a4f" stroke="#5a3e22" stroke-width="1.5"/>
  <!-- Caerllion walls -->
  <rect x="296" y="180" width="50" height="34" fill="#c98a6b" stroke="#7a3a22" stroke-width="2"/>
  <path d="M296 180 v-8 h8 v8 m8 0 v-8 h8 v8 m8 0 v-8 h8 v8 m8 0 v-8 h8 v8" fill="none" stroke="#7a3a22" stroke-width="2"/>
  <!-- route -->
  <g fill="none" stroke="#7a2e1d" stroke-width="3">
    <path d="M48 222 Q70 210 84 206" marker-end="url(#a)"/>
    <path d="M112 200 Q140 150 165 132" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <path d="M168 134 Q210 190 246 214" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <path d="M278 214 Q286 208 292 202" marker-end="url(#a)"/>
  </g>
  <g font-family="Georgia, serif" font-size="20" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="8" y="262" fill="#3a2a14">Cwm Helyg</text>
    <text x="76" y="244" fill="#3a2a14">y dafarn</text>
    <text x="126" y="80" fill="#3a2a14">y mynydd</text>
    <text x="214" y="30" fill="#2f5d80">Afon Wysg</text>
    <text x="214" y="248" fill="#5a3e22">y cwch</text>
    <text x="268" y="166" fill="#3a2a14">Caerllion</text>
    <text x="60" y="196" fill="#7a2e1d">1</text>
    <text x="118" y="150" fill="#7a2e1d">2</text>
    <text x="214" y="176" fill="#7a2e1d">3</text>
    <text x="300" y="236" fill="#7a2e1d">4</text>
  </g>
</svg>
