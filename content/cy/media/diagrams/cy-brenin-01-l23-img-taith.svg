<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="t d">
  <title id="t">Y daith i Gaerllion</title>
  <desc id="d">Route map of the four-day journey, Cwm Helyg in the west and Caerllion in the east as on the Pennod 1 map: day 1 to the inn, day 2 over the mountain, day 3 across Afon Wysg by boat, day 4 down the flat vale beside the river to the walled city of Caerllion near the sea. A scale bar shows ten miles. Welsh labels only.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a2e1d"/>
    </marker>
  </defs>
  <rect width="360" height="320" fill="#fbf7ee"/>
  <!-- sea along the bottom -->
  <path d="M0 302 Q90 293 180 301 T360 297 L360 320 L0 320 Z" fill="#cfe0ea" stroke="none"/>
  <!-- the flat vale (dyffryn) on the east bank -->
  <path d="M258 132 Q300 128 356 136 L356 236 Q320 230 282 234 Q266 190 258 132 Z" fill="#dfe8c4" stroke="#8a9a5c" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- mountain -->
  <path d="M112 176 L160 92 L208 176 Z" fill="#c9cfa3" stroke="#5c6b3a" stroke-width="2"/>
  <path d="M147 115 L160 92 L173 115 Z" fill="#ffffff" stroke="none"/>
  <!-- river Wysg, from the hills in the north down to the sea -->
  <path d="M244 40 Q234 100 246 140 Q258 190 262 240 Q266 275 274 306" fill="none" stroke="#5b8fb9" stroke-width="8" stroke-linecap="round"/>
  <!-- Cwm Helyg -->
  <path d="M14 236 Q40 206 66 236" fill="#d7e3b5" stroke="#5c6b3a" stroke-width="2"/>
  <circle cx="40" cy="228" r="6" fill="#7a5a2a"/>
  <!-- inn -->
  <rect x="80" y="196" width="22" height="16" fill="#e9dfc6" stroke="#7a5a2a" stroke-width="1.5"/>
  <path d="M78 196 l13 -10 l13 10 z" fill="#d8b24a" stroke="#7a5a2a" stroke-width="1"/>
  <!-- boat at the crossing -->
  <path d="M224 110 h28 l-4 8 h-20 z" fill="#a07a4f" stroke="#5a3e22" stroke-width="1.5"/>
  <!-- Caerllion: old red walls with a round-arched gate -->
  <rect x="290" y="244" width="48" height="30" fill="#c98a6b" stroke="#7a3a22" stroke-width="2"/>
  <path d="M290 254 h48 M290 264 h48" stroke="#a8573a" stroke-width="1.5"/>
  <path d="M308 274 v-11 a6 6 0 0 1 12 0 v11 z" fill="#5a3e22" stroke="#7a3a22" stroke-width="1"/>
  <!-- route -->
  <g fill="none" stroke="#7a2e1d" stroke-width="3">
    <path d="M48 226 Q64 214 76 208" marker-end="url(#a)"/>
    <path d="M104 198 Q130 150 156 118" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <path d="M166 112 Q192 98 218 110" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <path d="M258 118 Q298 150 306 200 Q309 222 312 238" marker-end="url(#a)"/>
  </g>
  <!-- scale bar: 10 milltir -->
  <g stroke="#3a2a14" stroke-width="2" fill="none">
    <path d="M140 288 h60 M140 283 v10 M200 283 v10 M170 285 v6"/>
  </g>
  <g font-family="Georgia, serif" font-size="20" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="8" y="264" fill="#3a2a14">Cwm Helyg</text>
    <text x="74" y="234" fill="#3a2a14">y dafarn</text>
    <text x="112" y="80" fill="#3a2a14">y mynydd</text>
    <text x="176" y="30" fill="#2f5d80">Afon Wysg</text>
    <text x="262" y="106" fill="#5a3e22">y cwch</text>
    <text x="266" y="188" font-style="italic" fill="#5c6b3a">y dyffryn</text>
    <text x="256" y="298" fill="#3a2a14">Caerllion</text>
    <text x="128" y="277" fill="#3a2a14">10 milltir</text>
    <text x="150" y="318" font-style="italic" fill="#4f7894">y môr</text>
    <text x="38" y="210" fill="#7a2e1d">1</text>
    <text x="112" y="150" fill="#7a2e1d">2</text>
    <text x="184" y="96" fill="#7a2e1d">3</text>
    <text x="322" y="228" fill="#7a2e1d">4</text>
  </g>
</svg>
