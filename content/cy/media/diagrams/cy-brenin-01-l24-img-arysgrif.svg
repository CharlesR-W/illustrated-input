<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="t d">
  <title id="t">Y geiriau ar y garreg</title>
  <desc id="d">The inscription carved on the grey stone in Latin capitals (QVICVMQVE HVNC GLADIVM DE HOC SAXO EXTRAXERIT, IS REX ERIT), with Mali's Welsh translation beneath it in handwriting on a wax tablet: Pwy bynnag sy'n tynnu'r cleddyf hwn o'r garreg, hwnnw yw'r brenin.</desc>
  <rect width="360" height="300" fill="#fbf7ee"/>
  <!-- stone face -->
  <path d="M14 18 Q180 4 346 18 L340 150 Q180 162 20 150 Z" fill="#b9b8ae" stroke="#5f5e57" stroke-width="2"/>
  <path d="M30 26 Q120 20 160 24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <g font-family="'Times New Roman', Georgia, serif" font-size="20" fill="#3b3a35" text-anchor="middle" letter-spacing="1">
    <text x="180" y="52">QVICVMQVE HVNC</text>
    <text x="180" y="78">GLADIVM DE HOC</text>
    <text x="180" y="104">SAXO EXTRAXERIT,</text>
    <text x="180" y="130">IS REX ERIT</text>
  </g>
  <!-- arrow -->
  <path d="M180 160 L180 182" stroke="#7a2e1d" stroke-width="3"/>
  <path d="M172 176 L180 188 L188 176 z" fill="#7a2e1d"/>
  <!-- wax tablet with Welsh -->
  <rect x="16" y="192" width="328" height="98" rx="6" fill="#8a6a3e" stroke="#5a3e22" stroke-width="2"/>
  <rect x="26" y="200" width="308" height="82" rx="3" fill="#e8d9a8"/>
  <g font-family="Georgia, serif" font-size="20" fill="#2b2b2b" font-style="italic" text-anchor="middle">
    <text x="180" y="224">Pwy bynnag sy'n tynnu'r cleddyf</text>
    <text x="180" y="248">hwn o'r garreg,</text>
    <text x="180" y="272">hwnnw yw'r brenin.</text>
  </g>
</svg>
