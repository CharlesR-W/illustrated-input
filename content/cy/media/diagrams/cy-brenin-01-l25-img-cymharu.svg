<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="t d">
  <title id="t">tal · talach · talaf · da · gwell · gorau</title>
  <desc id="d">Two comparison panels with the characters as bars. Top: Arth, Gwalchmai and Cai drawn as three standing bars of rising height, labelled tal, talach, talaf. Bottom: three bars of rising height for the day's results, labelled da (the third knight), gwell (Cai, second) and gorau (Gwalchmai, first). Welsh labels only.</desc>
  <rect width="360" height="330" fill="#fbf7ee"/>
  <g font-family="Georgia, serif" font-size="20" fill="#2b2b2b" text-anchor="middle">
    <!-- top panel: heights -->
    <line x1="20" y1="140" x2="340" y2="140" stroke="#7a5a2a" stroke-width="2"/>
    <circle cx="70" cy="74" r="12" fill="#e8c9a0" stroke="#5a3e22"/>
    <rect x="56" y="88" width="28" height="52" rx="6" fill="#7a9a5a" stroke="#4f6b3a"/>
    <circle cx="180" cy="50" r="12" fill="#e8c9a0" stroke="#5a3e22"/>
    <rect x="166" y="64" width="28" height="76" rx="6" fill="#4f6d8f" stroke="#2f4a66"/>
    <circle cx="290" cy="26" r="12" fill="#e8c9a0" stroke="#5a3e22"/>
    <rect x="276" y="40" width="28" height="100" rx="6" fill="#b5523b" stroke="#7a2e1d"/>
    <text x="70" y="164">Arth</text>
    <text x="180" y="164">Gwalchmai</text>
    <text x="290" y="164">Cai</text>
    <text x="70" y="188" fill="#7a2e1d">tal</text>
    <text x="180" y="188" fill="#7a2e1d">talach</text>
    <text x="290" y="188" fill="#7a2e1d">talaf</text>
    <!-- bottom panel: results -->
    <line x1="20" y1="290" x2="340" y2="290" stroke="#7a5a2a" stroke-width="2"/>
    <rect x="50" y="256" width="40" height="34" fill="#c9cfa3" stroke="#5c6b3a"/>
    <rect x="160" y="236" width="40" height="54" fill="#d8b24a" stroke="#7a5a2a"/>
    <rect x="270" y="210" width="40" height="80" fill="#e0a43a" stroke="#7a5a2a"/>
    <text x="70" y="250">3</text>
    <text x="180" y="230">2</text>
    <text x="290" y="204">1</text>
    <text x="70" y="316" fill="#7a2e1d">da</text>
    <text x="180" y="316" fill="#7a2e1d">gwell</text>
    <text x="290" y="316" fill="#7a2e1d">gorau</text>
  </g>
</svg>
