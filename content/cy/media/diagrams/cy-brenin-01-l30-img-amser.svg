<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>roedd … wedi</title>
<desc>A time line from left to right with three marks. Left mark, "cyn": a small crown, caption "Roedd Uthr wedi marw." Middle mark, "y storm": a cloud with lightning, caption "Daeth Myrddin." Right mark, "nawr": a boy with a sword, caption "Arthur". A curved arrow from the middle mark back to the left mark is labelled "roedd … wedi". Welsh labels only.</desc>
<defs>
  <marker id="saeth30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="#1d2926"/>
  </marker>
</defs>
<path d="M10,120 H292" stroke="#1d2926" stroke-width="2.5" marker-end="url(#saeth30)"/>
<path d="M50,110 V130 M150,110 V130 M250,110 V130" stroke="#1d2926" stroke-width="2.5"/>
<path d="M146,96 C125,62 75,62 54,96" fill="none" stroke="#9b2f2a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#saeth30)"/>
<text x="100" y="56" font-size="18" fill="#9b2f2a" text-anchor="middle" font-style="italic">roedd … wedi</text>
<g font-size="18" fill="#1d2926" text-anchor="middle">
  <text x="50" y="152">cyn</text>
  <text x="150" y="152">y storm</text>
  <text x="250" y="152">nawr</text>
</g>
<g font-size="18" fill="#1d2926" text-anchor="middle">
  <text x="50" y="186">Roedd Uthr</text>
  <text x="50" y="208">wedi marw.</text>
  <text x="150" y="186">Daeth</text>
  <text x="150" y="208">Myrddin.</text>
  <text x="250" y="186">Arthur</text>
</g>
<g id="coron" transform="translate(-10,0)" stroke="#1d2926" stroke-width="2" stroke-linejoin="round" fill="#e2b33c">
  <path d="M44,104 L44,84 L52,94 L60,80 L68,94 L76,84 L76,104 Z"/>
</g>
<g id="storm" transform="translate(-30,0)" stroke="#1d2926" stroke-width="2" stroke-linejoin="round">
  <path d="M160,96 C150,96 150,84 160,84 C160,74 176,72 180,80 C186,72 202,76 200,86 C208,88 206,98 198,98 Z" fill="#b9bec4"/>
  <path d="M182,98 L176,108 L182,108 L178,116" fill="none" stroke="#e2b33c" stroke-width="2.5"/>
