<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260"><title>darn o farf Cynyr</title><desc>Part–whole reference, not a second event: Cynyr’s long golden beard with a long lock highlighted, and the matching cut lock beside it. Labels barf Cynyr and darn o farf Cynyr.</desc><rect width="100%" height="100%" rx="10" fill="#fffaf0"/><g stroke="#493b30" stroke-width="2.5" stroke-linejoin="round"><ellipse cx="75" cy="55" rx="25" ry="32" fill="#d7ae85"/><path d="M49 63Q60 78 75 70Q90 78 101 63L111 93L99 151L75 190L50 151L40 93Z" fill="#c9923d"/><path d="M52 91L62 146M75 83V165M96 87L86 150" fill="none" stroke="#9d6d24"/><path d="M45 94L54 145L65 163L70 143L60 91Z" fill="#edbc63" stroke-dasharray="5 4"/><path d="M134 113H168M161 107L169 113L161 119" fill="none"/><path d="M202 69L212 119L224 144L229 117L219 66Z" fill="#edbc63"/><text x="77" y="219" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#30251c" stroke="none">barf Cynyr</text><text x="215" y="184" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#30251c" stroke="none">darn o farf</text><text x="215" y="208" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#30251c" stroke="none">Cynyr</text></g></svg>
