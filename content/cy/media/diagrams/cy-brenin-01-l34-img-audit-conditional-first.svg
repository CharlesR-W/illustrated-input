<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 305"><title>taswn → baswn</title><desc>Cai’s actual situation is contrasted with his imagined condition and consequence. In the imagined panel Taswn is aligned with being king and baswn with fighting; no actual kingship or fighting event is asserted.</desc><rect width="100%" height="100%" rx="10" fill="#fffaf0"/><g stroke="#493b30" stroke-width="2.5" stroke-linejoin="round"><rect x="15" y="12" width="270" height="70" rx="7" fill="#e5ecd8"/><rect x="15" y="102" width="270" height="191" rx="7" fill="#f6e5c1" stroke-dasharray="6 4"/><path d="M150 193V218M144 211L150 218L156 211" fill="none"/><text x="150" y="37" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#30251c" stroke="none">Cai · nawr</text><text x="150" y="64" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#30251c" stroke="none">Dw i ddim yn frenin.</text><text x="150" y="127" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#30251c" stroke="none">syniad yn y pen</text><text x="150" y="155" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#30251c" stroke="none">Taswn i&#x27;n frenin</text><text x="150" y="182" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#30251c" stroke="none">«Dw i&#x27;n frenin»</text><text x="150" y="244" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#30251c" stroke="none">baswn i&#x27;n ymladd</text><text x="150" y="273" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#30251c" stroke="none">«Dw i&#x27;n ymladd»</text></g></svg>
