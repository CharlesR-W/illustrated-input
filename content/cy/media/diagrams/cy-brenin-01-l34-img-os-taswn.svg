<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>os ↔ taswn / pe bai</title>
<desc>Two branches from one question. Upper branch, a solid path to a green box: "os → bydd", with the example "Os bydd angen brenin barfog, fi fydd e!" (efallai, an open possibility). Lower branch, a dashed path to a dashed bubble: "taswn / pe bai → baswn / basai", with the example "Taswn i'n gawr, baswn i'n chwerthin." (syniad yn y pen, imagined). Welsh labels only.</desc>
<g font-size="17" fill="#1d2926">
<circle cx="22" cy="160" r="12" fill="#f3e6c4" stroke="#1d2926" stroke-width="1.6"/>
<text x="22" y="166" text-anchor="middle" font-weight="bold">?</text>
<path d="M34,152 C60,120 70,86 92,80" fill="none" stroke="#1d2926" stroke-width="2.4"/>
<path d="M34,168 C60,200 70,236 92,242" fill="none" stroke="#1d2926" stroke-width="2.4" stroke-dasharray="6 5"/>
<rect x="92" y="18" width="202" height="122" rx="10" fill="#e3ede2" stroke="#3f7a52" stroke-width="2"/>
<text x="104" y="44" font-weight="bold">os → bydd</text>
<text x="104" y="72">Os bydd angen</text>
<text x="104" y="96">brenin barfog,</text>
<text x="104" y="120">fi fydd e!</text>
<text x="284" y="44" text-anchor="end" fill="#3f7a52">efallai</text>
<rect x="92" y="180" width="202" height="114" rx="28" fill="#ece5f2" stroke="#6a4f86" stroke-width="2" stroke-dasharray="7 5"/>
<text x="104" y="204" font-weight="bold">taswn → baswn</text>
<text x="104" y="228">pe bai → basai</text>
<text x="104" y="256">Taswn i'n gawr,</text>
<text x="104" y="280">baswn i'n chwerthin.</text>
<text x="294" y="314" text-anchor="end" fill="#6a4f86">syniad yn y pen</text>
</g>
</svg>
