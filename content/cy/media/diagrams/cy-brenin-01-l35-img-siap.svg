<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>siâp saeth</title>
<desc>Geese flying in a V (arrow) shape, seen from above, pointing up the page. One goose at the point is labelled "ar y blaen" (in front); the two lines of geese behind it are each labelled "rhes" (row); an arrow beside them points up to "gogledd" (north). Welsh labels only.</desc>
<defs><g id="g"><path d="M0,-10 c3,2 4,6 3,10 l12,6 l-2,3 l-11,-3 l-1,8 l4,3 l-1,2 l-4,-1 l-4,1 l-1,-2 l4,-3 l-1,-8 l-11,3 l-2,-3 l12,-6 c-1,-4 0,-8 3,-10 z" fill="#8a8f86" stroke="#1d2926" stroke-width="1.2" stroke-linejoin="round"/></g></defs>
<g>
<use href="#g" x="150" y="40"/>
<use href="#g" x="124" y="72"/><use href="#g" x="98" y="104"/><use href="#g" x="72" y="136"/><use href="#g" x="46" y="168"/>
<use href="#g" x="176" y="72"/><use href="#g" x="202" y="104"/><use href="#g" x="228" y="136"/><use href="#g" x="254" y="168"/>
</g>
<g font-size="18" fill="#1d2926">
<text x="150" y="18" text-anchor="middle" font-weight="bold">ar y blaen</text>
<text x="40" y="214" text-anchor="middle">rhes</text>
<text x="260" y="214" text-anchor="middle">rhes</text>
</g>
<path d="M150,240 v-24" stroke="#1d2926" stroke-width="2" fill="none"/>
<path d="M144,222 l6,-8 l6,8" stroke="#1d2926" stroke-width="2" fill="none"/>
<text x="150" y="200" font-size="18" fill="#3f5f7a" text-anchor="middle">gogledd</text>
</svg>
