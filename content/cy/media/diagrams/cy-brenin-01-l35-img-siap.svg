<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>siâp saeth</title>
<desc>Nine wild geese flying in a V (arrow) shape, seen from above, pointing up the page: long necks, outstretched wings with dark tips. The one goose at the point is labelled "ar y blaen" (in front); the two lines of geese behind it are each labelled "rhes" (row); inside the V an arrow points up to "gogledd" (north). Welsh labels only.</desc>
