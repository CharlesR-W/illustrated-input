<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>penhwyad · hebog · gwyddau</title>
<desc>Three small panels, one above the other, each with a Welsh caption sentence. Top: a big green pike with a long snout, open jaws full of sharp teeth and a cold yellow eye, while two small fish hide behind stones on the river bed: "Mae pawb yn ofni'r penhwyad." Middle: a hawk on a wooden perch, held by leather jesses on its legs and a leash tied to a ring on the perch post: "Dyw'r hebog ddim yn rhydd." Bottom: geese flying in a V; a curved dashed arrow shows the front goose dropping back to the end of a row while another takes its place: "Mae'r gwyddau'n rhannu'r gwaith."</desc>
