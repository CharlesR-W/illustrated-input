<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>penhwyad · hebog · gwyddau</title>
<desc>Three small panels, one above the other, each with a Welsh caption sentence. Top: a big pike with sharp teeth and small fish hiding under stones — "Mae pawb yn ofni'r penhwyad." Middle: a hawk on a wooden perch with leather jesses tied to its legs — "Dyw'r hebog ddim yn rhydd." Bottom: geese flying in a V, one at the front — "Mae'r gwyddau'n rhannu'r blaen."</desc>
<g fill="#e3ebec" stroke="#b9c8c9" stroke-width="1.5">
<rect x="4" y="4" width="292" height="140" rx="8"/><rect x="4" y="154" width="292" height="140" rx="8"/><rect x="4" y="304" width="292" height="142" rx="8"/>
</g>
<!-- pike -->
<g stroke="#1d2926" stroke-width="1.6" stroke-linejoin="round">
<path d="M40,60 C70,36 160,36 200,52 L236,40 L230,62 L236,84 L200,72 C160,90 70,86 40,66 Z" fill="#6f8f5a"/>
<path d="M40,60 l14,4 l-14,2" fill="#fff"/>
<path d="M46,62 l4,3 l4,-3 l4,3 l4,-3" fill="none"/>
<circle cx="66" cy="56" r="3" fill="#1d2926"/>
<ellipse cx="236" cy="100" rx="16" ry="7" fill="#c9b36a"/><ellipse cx="200" cy="104" rx="12" ry="6" fill="#b8bfc2"/>
<path d="M180,110 q30,-14 70,0 v6 h-70 z" fill="#8d8a80"/>
</g>
<!-- hawk -->
<g stroke="#1d2926" stroke-width="1.6" stroke-linejoin="round">
<rect x="90" y="226" width="120" height="8" fill="#8a5a33"/>
<path d="M150,170 c14,0 22,12 20,26 c10,8 12,20 6,30 l-26,0 l-26,0 c-6,-10 -4,-22 6,-30 c-2,-14 6,-26 20,-26 z" fill="#8f877b"/>
<path d="M150,180 l10,4 l-10,4 z" fill="#d6b040"/><circle cx="146" cy="184" r="2.5" fill="#1d2926"/>
<path d="M140,226 v-6 M160,226 v-6" stroke="#5a3a1f" stroke-width="3"/>
<path d="M140,226 c0,8 -6,10 -10,8 M160,226 c0,8 6,10 10,8" fill="none" stroke="#a0603a" stroke-width="2"/>
</g>
<!-- geese -->
<g fill="#8a8f86" stroke="#1d2926" stroke-width="1.2">
<path d="M150,318 l14,8 l-14,-2 l-14,2 z"/>
<path d="M126,334 l14,8 l-14,-2 l-14,2 z"/><path d="M102,350 l14,8 l-14,-2 l-14,2 z"/><path d="M78,366 l14,8 l-14,-2 l-14,2 z"/>
<path d="M174,334 l14,8 l-14,-2 l-14,2 z"/><path d="M198,350 l14,8 l-14,-2 l-14,2 z"/><path d="M222,366 l14,8 l-14,-2 l-14,2 z"/>
</g>
<g font-size="17" fill="#1d2926" text-anchor="middle">
<text x="150" y="134">Mae pawb yn ofni'r penhwyad.</text>
<text x="150" y="284">Dyw'r hebog ddim yn rhydd.</text>
<text x="150" y="430">Mae'r gwyddau'n rhannu'r blaen.</text>
</g>
</svg>
