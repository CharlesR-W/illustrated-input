<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 358" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
<title>De ↔ Gogledd</title>
<desc>A two-column word table headed "De" (south) and "Gogledd" (north), pairing the southern words the course teaches with northern words heard in the shepherd's hut: nawr / rŵan; mas / allan; llaeth / llefrith; tad-cu / taid; mam-gu / nain; bachgen / hogyn; merch / hogan; Mae … gyda fi / Mae gen i …; e, fe / o, fo; eisiau / isio; dewch / dowch; dych chi / dach chi. Welsh only.</desc>
