  <title id="t">Dwy stori</title>
  <desc id="d">Two columns comparing the same events. Left, headed 'Y cronicl' with a quill: 'gwelwyd y cawr', 'dallwyd ef gan fwg', 'claddwyd ef dan garnedd'. Right, headed 'Y dafarn' with a cup of ale: 'roedd tri chawr!', 'roedd e mor dal â thŵr!', 'gwnes i ymladd ar fy mhen fy hun!'. Welsh labels only.</desc>
