      <rect x="6" y="372" width="18" height="16"/><rect x="26" y="308" width="18" height="16"/><rect x="79" y="255" width="18" height="16"/>
    </g>
    <path d="M152 236 L156 228 L160 236 L164 228 L168 236 Z" fill="#d8b24a" stroke="#7a5a2a" stroke-width="1"/>
