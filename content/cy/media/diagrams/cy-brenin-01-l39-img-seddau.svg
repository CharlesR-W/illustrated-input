<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="t d">
  <title id="t">Y bwrdd crwn</title>
  <desc id="d">Two seating plans. Top, labelled 'y bwrdd hir': a long table with the king's chair at one end marked 'pen' and the far end marked 'gwaelod'; two lords' chairs crowd one seat beside the king. Bottom, labelled 'y bwrdd crwn': a ring of tables with twelve identical chairs, one of them the king's with a small crown, a fire in the middle marked 'tân' and the words 'dim pen'. Welsh labels only.</desc>
  <rect width="320" height="560" fill="#fbf7ee"/>
  <g font-family="Georgia, serif" fill="#3a2a14">
    <text x="160" y="30" text-anchor="middle" font-size="20" font-weight="bold">y bwrdd hir</text>
    <rect x="40" y="70" width="240" height="40" rx="4" fill="#c99a5b" stroke="#7a5a2a" stroke-width="2"/>
    <rect x="12" y="74" width="24" height="32" rx="3" fill="#d8b24a" stroke="#7a5a2a" stroke-width="2"/>
    <path d="M16 70 L20 62 L24 70 L28 62 L32 70 Z" fill="#d8b24a" stroke="#7a5a2a" stroke-width="1"/>
    <text x="24" y="134" text-anchor="middle" font-size="18">pen</text>
    <text x="270" y="134" text-anchor="middle" font-size="18">gwaelod</text>
    <rect x="44" y="48" width="18" height="18" rx="2" fill="#8a3a22"/>
    <rect x="58" y="44" width="18" height="18" rx="2" fill="#3a6a8a"/>
    <text x="66" y="40" text-anchor="middle" font-size="18">?!</text>
    <g fill="#efe6d2" stroke="#7a5a2a" stroke-width="1">
      <rect x="100" y="52" width="16" height="14"/><rect x="140" y="52" width="16" height="14"/><rect x="180" y="52" width="16" height="14"/><rect x="220" y="52" width="16" height="14"/>
      <rect x="60" y="114" width="16" height="14"/><rect x="100" y="114" width="16" height="14"/><rect x="140" y="114" width="16" height="14"/><rect x="180" y="114" width="16" height="14"/><rect x="220" y="114" width="16" height="14"/>
    </g>
    <line x1="20" y1="170" x2="300" y2="170" stroke="#c9b48a" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="160" y="206" text-anchor="middle" font-size="20" font-weight="bold">y bwrdd crwn</text>
    <circle cx="160" cy="380" r="110" fill="none" stroke="#c99a5b" stroke-width="30"/>
    <circle cx="160" cy="380" r="110" fill="none" stroke="#7a5a2a" stroke-width="1.5"/>
