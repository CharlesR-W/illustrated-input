      <rect x="151" y="236" width="18" height="16"/><rect x="223" y="255" width="18" height="16"/><rect x="276" y="308" width="18" height="16"/>
      <rect x="296" y="372" width="18" height="16"/><rect x="276" y="436" width="18" height="16"/><rect x="223" y="489" width="18" height="16"/>
