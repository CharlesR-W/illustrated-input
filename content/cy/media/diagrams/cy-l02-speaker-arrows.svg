  <g font-family="sans-serif" text-anchor="middle" fill="#26323a" font-weight="700">
    <text x="88" y="238" font-size="24">Dafi dw i</text>
    <text x="221" y="44" font-size="23">Pwy wyt ti?</text>
    <text x="88" y="270" font-size="18">i = Dafi</text>
    <text x="275" y="226" font-size="18">ti = Mali</text>
  </g>
</svg>
