    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#b94e3f"/>
    </marker>
  </defs>
  <rect width="360" height="280" rx="24" fill="#fbf5e9"/>
  <g stroke="#26323a" stroke-width="4" stroke-linejoin="round">
    <circle cx="88" cy="102" r="27" fill="#b94e3f"/>
    <path d="M65 82 L59 60 L78 75 M103 78 L115 58 L117 86" fill="#f0dfb0"/>
    <path d="M63 132 Q88 116 113 132 L121 193 L55 193Z" fill="#cf6b57"/>
