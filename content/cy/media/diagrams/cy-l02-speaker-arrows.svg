<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title desc">
  <title id="title">Dw i a wyt ti</title>
  <desc id="desc">Mae Dafi yn pwyntio ato fe ei hun gyda dw i, ac at Mali gyda wyt ti.</desc>
