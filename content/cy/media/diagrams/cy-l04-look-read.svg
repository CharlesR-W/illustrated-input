<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" role="img" aria-labelledby="title desc">
  <title id="title">Edrych, ond darllen?</title>
  <desc id="desc">Mae Dafi'n edrych ar y llyfr, ond dydy Dafi ddim yn darllen. Mae Mali'n darllen.</desc>
