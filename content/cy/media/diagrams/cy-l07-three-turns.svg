  <title id="title">Tair taith Dafi</title>
  <desc id="desc">Mae Dafi'n mynd i'r caffi, yn mynd yn ôl i'r llyfrgell, ac yn dod o'r llyfrgell gyda'r hen lyfr.</desc>
