<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 390" role="img" aria-labelledby="title desc">
  <title id="title">Y papur dan y bocs</title>
  <desc id="desc">Mae un papur dan hen focs. Mae tri phapur ar y bwrdd wrth y bocs.</desc>
  <rect width="460" height="390" rx="24" fill="#fbf5e8"/>
  <!-- table with three-piece image and one dotted gap -->
  <g transform="translate(25 82)" stroke="#503c31" stroke-width="5" stroke-linejoin="round">
