    <g transform="translate(19 30)" stroke-width="3">
      <path d="M0 0h67v48H0zM72 0h67v48H72zM0 53h67v48H0z" fill="#efd79d"/>
      <path d="M72 53h67v48H72z" fill="none" stroke="#aa5046" stroke-dasharray="7 6"/>
      <path d="M13 16q18-12 39 4M84 17q19 12 38 0M13 71q19-12 39 3" fill="none" stroke="#b84f43" stroke-width="7"/>
    </g>
  </g>
