<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 600" role="img" aria-labelledby="title desc">
  <title id="title">Ble mae'r papur?</title>
  <desc id="desc">Mae papur ar y bwrdd, dan y bwrdd, wrth y bwrdd, tu ôl i'r bwrdd, ac o flaen y bwrdd.</desc>
  <rect width="460" height="600" rx="24" fill="#fbf5e8"/>
  <g font-family="sans-serif" font-weight="700" fill="#304642" text-anchor="middle">
    <!-- on -->
    <g transform="translate(22 42)">
      <rect width="196" height="150" rx="18" fill="#e1ebe3" stroke="#577069" stroke-width="3"/>
      <path d="M42 85h112v19H42zM58 103v30M139 103v30" fill="#a96f4c" stroke="#49372c" stroke-width="5"/>
      <path d="M69 49h59v38H69z" fill="#d55a4b" stroke="#694039" stroke-width="4"/>
      <text x="98" y="29" font-size="26">ar</text>
    </g>
    <!-- under -->
    <g transform="translate(242 42)">
      <rect width="196" height="150" rx="18" fill="#e1ebe3" stroke="#577069" stroke-width="3"/>
      <path d="M42 58h112v19H42zM58 76v58M139 76v58" fill="#a96f4c" stroke="#49372c" stroke-width="5"/>
      <path d="M69 96h59v36H69z" fill="#d55a4b" stroke="#694039" stroke-width="4"/>
      <text x="98" y="29" font-size="26">dan</text>
    </g>
    <!-- beside -->
    <g transform="translate(22 218)">
      <rect width="196" height="150" rx="18" fill="#e1ebe3" stroke="#577069" stroke-width="3"/>
      <path d="M62 66h100v19H62zM76 84v51M148 84v51" fill="#a96f4c" stroke="#49372c" stroke-width="5"/>
      <path d="M10 87h46v34H10z" fill="#d55a4b" stroke="#694039" stroke-width="4"/>
      <text x="98" y="29" font-size="26">wrth</text>
    </g>
    <!-- behind -->
    <g transform="translate(242 218)">
      <rect width="196" height="150" rx="18" fill="#e1ebe3" stroke="#577069" stroke-width="3"/>
      <path d="M71 56h58v48H71z" fill="#d55a4b" stroke="#694039" stroke-width="4"/>
      <path d="M42 71h112v19H42zM58 89v45M139 89v45" fill="#a96f4c" stroke="#49372c" stroke-width="5"/>
      <text x="98" y="29" font-size="25">tu ôl i</text>
    </g>
    <!-- in front -->
    <g transform="translate(132 394)">
      <rect width="196" height="166" rx="18" fill="#e1ebe3" stroke="#577069" stroke-width="3"/>
      <path d="M42 66h112v19H42zM58 84v59M139 84v59" fill="#a96f4c" stroke="#49372c" stroke-width="5"/>
      <path d="M69 94h59v43H69z" fill="#d55a4b" stroke="#694039" stroke-width="4"/>
      <text x="98" y="29" font-size="25">o flaen</text>
    </g>
  </g>
</svg>
