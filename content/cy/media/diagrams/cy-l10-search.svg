    <path d="M35 40q0-42 37-43q40 1 35 45q-12-18-24-20q-9 18-22 2q-8 15-26 16z" fill="#31251f"/>
    <path d="M30 80q38-26 77 0l-9 83H40z" fill="#a9533f"/>
    <circle cx="57" cy="43" r="3"/><circle cx="80" cy="43" r="3"/>
    <path d="M59 57q9 6 18 0" fill="none"/>
  </g>
  <path d="M128 54h257q21 0 21 21v75q0 21-21 21H224l-35 31l8-31h-69q-21 0-21-21V75q0-21 21-21z" fill="#fffdf6" stroke="#536b65" stroke-width="4"/>
  <text x="258" y="126" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#304642">Ble mae'r papur?</text>

  <!-- Dafi follows the dotted search route -->
  <path d="M138 266q81-65 152 0t118-15" fill="none" stroke="#9b6f51" stroke-width="5" stroke-dasharray="10 9"/>
  <g transform="translate(105 228)" stroke="#58372f" stroke-width="4" stroke-linejoin="round">
