<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 390" role="img" aria-labelledby="title desc">
  <title id="title">Ble mae'r papur?</title>
  <desc id="desc">Mae Mali'n holi ble mae'r papur. Mae Dafi'n chwilio ar y bwrdd, dan y gadair, a tu ôl i'r silff.</desc>
  <rect width="460" height="390" rx="24" fill="#fbf5e8"/>
  <!-- Mali and speech bubble -->
  <g transform="translate(25 84)" stroke="#3b302b" stroke-width="4" stroke-linejoin="round">
