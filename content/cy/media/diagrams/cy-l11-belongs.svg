<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc">
  <title id="title">Mae'r papur yn perthyn i'r llyfr</title>
  <desc id="desc">Mae pedwar darn papur yn gwneud un llun. Mae saeth o'r llun at hen lyfr Iwan gyda'r gair perthyn.</desc>
  <rect width="360" height="300" rx="24" fill="#fbf7ea"/>
  <text x="180" y="34" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#263d3b">pedwar papur</text>
  <g transform="translate(25 62)" stroke="#6b604f" stroke-width="3">
    <rect x="0" y="0" width="70" height="62" fill="#f3e7c4"/><path d="M35 0v62M0 31h70" stroke-dasharray="5 4"/>
    <rect x="78" y="0" width="70" height="62" fill="#f3e7c4"/><path d="M113 0v62M78 31h70" stroke-dasharray="5 4"/>
    <rect x="0" y="70" width="70" height="62" fill="#f3e7c4"/><path d="M35 70v62M0 101h70" stroke-dasharray="5 4"/>
    <rect x="78" y="70" width="70" height="62" fill="#f3e7c4"/><path d="M113 70v62M78 101h70" stroke-dasharray="5 4"/>
    <path d="M15 106q20-34 42 0M92 45q18-30 39 0" fill="none" stroke="#315c83" stroke-width="5"/>
    <circle cx="112" cy="92" r="9" fill="#bd493d"/>
  </g>
  <path d="M185 130h54" stroke="#4f8b83" stroke-width="6" marker-end="url(#a)"/>
  <text x="211" y="114" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#4f8b83">perthyn</text>
  <g transform="translate(248 72)" stroke="#403329" stroke-width="4">
    <path d="M0 14q40-20 80 0v126q-40-18-80 0Z" fill="#85623e"/>
    <path d="M8 27q33-14 64 0v96q-32-12-64 0Z" fill="#e8d19e"/>
    <path d="M20 45h40M20 59h30" stroke="#7b5d38"/>
  </g>
  <text x="288" y="239" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#263d3b">hen lyfr Iwan</text>
  <text x="180" y="282" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#263d3b">Mae'r llun yn perthyn i'r llyfr.</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#4f8b83"/></marker></defs>
