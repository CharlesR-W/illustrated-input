<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
  <title id="title">Ei allwedd e?</title>
  <desc id="desc">Mae allwedd fach dan y papur, bachgen yn cysgu yn y llun, ac Iwan yn edrych arno. Mae'r berthynas yn gwestiwn.</desc>
  <rect width="360" height="320" rx="24" fill="#fbf7ea"/>
  <text x="180" y="34" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#263d3b">ei allwedd e?</text>
  <!-- old book and paper -->
  <g transform="translate(22 67)" stroke="#44382d" stroke-width="4">
    <path d="M0 18q60-25 120 0v126q-60-19-120 0Z" fill="#85623e"/>
    <rect x="13" y="32" width="94" height="90" rx="4" fill="#f0e4c2"/>
    <path d="M60 32v90M13 77h94" stroke="#8d816a" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M28 100q20-30 40 0" fill="none" stroke="#315c83" stroke-width="5"/>
    <circle cx="80" cy="55" r="8" fill="#bd493d"/>
  </g>
  <!-- key -->
  <g transform="translate(118 210) rotate(-12)" fill="#c7a14e" stroke="#594727" stroke-width="4">
    <circle cx="0" cy="0" r="14" fill="none"/>
    <path d="M13 2h64v12H62v15H48V14H13Z"/>
  </g>
  <text x="93" y="270" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#263d3b">allwedd fach</text>
  <!-- Artur in drawing -->
  <g transform="translate(204 68)" stroke="#293837" stroke-width="4">
    <rect width="132" height="120" rx="10" fill="#d8e1df"/>
    <path d="M18 94q41-45 96 0" fill="#6f789d"/>
    <circle cx="70" cy="55" r="25" fill="#c99870"/>
    <path d="M45 52q7-33 52-18l4 22q-29-14-56-4Z" fill="#282b31"/>
    <path d="M58 60q7 5 14 0m9 0q7 5 14 0" fill="none" stroke-width="2"/>
    <path d="M49 79q22-13 45 0l12 27H38Z" fill="#315c83"/>
  </g>
  <path d="M191 218Q230 196 265 187" fill="none" stroke="#4f8b83" stroke-width="6" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <!-- Iwan -->
  <g transform="translate(250 226)" stroke="#293837" stroke-width="4">
    <circle cx="34" cy="25" r="24" fill="#d1a27f"/>
    <path d="M11 23q4-29 48-17l5 20q-25-13-53-3Z" fill="#ddd5c9"/>
    <path d="M17 34q17 22 34 0-2 27-17 27T17 34Z" fill="#eee5d9"/>
  </g>
  <path d="M282 225Q277 195 273 187" fill="none" stroke="#a94f3d" stroke-width="4" stroke-dasharray="5 5"/>
  <text x="275" y="306" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#263d3b">hen ffrind?</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#4f8b83"/></marker></defs>
</svg>
