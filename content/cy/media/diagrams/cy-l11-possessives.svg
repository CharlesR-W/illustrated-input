<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="title desc">
  <title id="title">Fy, dy ac ei</title>
  <desc id="desc">Mae pedwar perchennog yn pwyntio at eu pethau: fy mag i, dy fag di, ei lyfr e ac ei llyfr hi.</desc>
  <rect width="360" height="330" rx="24" fill="#fbf7ea"/>
  <text x="180" y="34" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#263d3b">Pwy?</text>
  <g font-family="sans-serif" font-size="21" fill="#263d3b">
    <rect x="20" y="52" width="320" height="58" rx="14" fill="#e8d9be"/>
    <circle cx="55" cy="81" r="18" fill="#a94f3d" stroke="#34302b" stroke-width="3"/>
    <path d="M84 80h76" stroke="#4f8b83" stroke-width="5" marker-end="url(#a)"/>
    <path d="M177 68h50l-5 33h-40Z" fill="#a94f3d" stroke="#34302b" stroke-width="3"/>
    <text x="325" y="88" text-anchor="end"><tspan font-weight="700">fy m</tspan><tspan>ag i</tspan></text>

    <rect x="20" y="118" width="320" height="58" rx="14" fill="#dcece7"/>
    <circle cx="55" cy="147" r="18" fill="#d5a13b" stroke="#34302b" stroke-width="3"/>
    <path d="M84 146h76" stroke="#4f8b83" stroke-width="5" marker-end="url(#a)"/>
    <path d="M177 134h50l-5 33h-40Z" fill="#303a3c" stroke="#34302b" stroke-width="3"/>
    <text x="325" y="154" text-anchor="end"><tspan font-weight="700">dy f</tspan><tspan>ag di</tspan></text>

    <rect x="20" y="184" width="320" height="58" rx="14" fill="#e8d9be"/>
    <circle cx="55" cy="213" r="18" fill="#446b67" stroke="#34302b" stroke-width="3"/>
    <path d="M84 212h76" stroke="#4f8b83" stroke-width="5" marker-end="url(#a)"/>
    <rect x="176" y="198" width="52" height="32" rx="4" fill="#85623e" stroke="#34302b" stroke-width="3"/>
    <text x="325" y="220" text-anchor="end"><tspan font-weight="700">ei l</tspan><tspan>yfr e</tspan></text>

    <rect x="20" y="250" width="320" height="58" rx="14" fill="#dcece7"/>
    <circle cx="55" cy="279" r="18" fill="#6f789d" stroke="#34302b" stroke-width="3"/>
    <path d="M84 278h76" stroke="#4f8b83" stroke-width="5" marker-end="url(#a)"/>
    <rect x="176" y="264" width="52" height="32" rx="4" fill="#f7f2df" stroke="#34302b" stroke-width="3"/>
    <text x="325" y="286" text-anchor="end"><tspan font-weight="700">ei ll</tspan><tspan>yfr hi</tspan></text>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#4f8b83"/></marker></defs>
</svg>
