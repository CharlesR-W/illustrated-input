<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc">
  <title id="title">Brawd a chwaer</title>
  <desc id="desc">Mae Sam a'i chwaer gyda llinell rhyngddyn nhw. Ei chwaer e yw hi; ei brawd hi yw Sam.</desc>
  <rect width="360" height="300" rx="24" fill="#fbf7ea"/>
  <text x="180" y="36" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#263d3b">brawd a chwaer</text>
  <g stroke="#34302b" stroke-width="4">
    <circle cx="95" cy="108" r="35" fill="#8d5f45"/>
    <path d="M63 102q9-47 65-25l-1 30q-33-18-64-5Z" fill="#302923"/>
    <path d="M64 150q31-22 63 0l12 76H52Z" fill="#d5a13b"/>
    <circle cx="265" cy="108" r="35" fill="#b97754"/>
    <path d="M232 106q4-43 65-26l7 47-19-18-4-22q-20 22-49 19Z" fill="#3e2b27"/>
    <path d="M235 150q30-22 61 0l14 76h-90Z" fill="#a94f3d"/>
  </g>
  <path d="M140 126h80" stroke="#4f8b83" stroke-width="6"/>
  <circle cx="180" cy="126" r="9" fill="#4f8b83"/>
  <g font-family="sans-serif" font-size="22" fill="#263d3b" text-anchor="middle">
    <text x="95" y="258">ei brawd hi</text>
    <text x="265" y="258">ei chwaer e</text>
  </g>
  <path d="M245 236Q214 197 129 220" fill="none" stroke="#4f8b83" stroke-width="4" marker-end="url(#a)"/>
  <path d="M113 236Q149 192 230 218" fill="none" stroke="#a94f3d" stroke-width="4" marker-end="url(#b)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#4f8b83"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4Z" fill="#a94f3d"/></marker>
  </defs>
</svg>
