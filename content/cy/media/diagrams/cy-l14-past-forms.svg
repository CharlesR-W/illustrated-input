<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="title desc">
  <title id="title">Berfau ddoe</title>
  <desc id="desc">Pum pâr o ferfau: agor ac agorodd, cau a chaeodd, edrych ac edrychodd, helpu a helpodd, gofyn ac ateb yn y gorffennol.</desc>
  <rect width="600" height="450" rx="25" fill="#fbf5e8"/>
  <g fill="#f0e2c5" stroke="#52645f" stroke-width="3">
    <rect x="32" y="65" width="536" height="58" rx="13"/><rect x="32" y="133" width="536" height="58" rx="13"/>
    <rect x="32" y="201" width="536" height="58" rx="13"/><rect x="32" y="269" width="536" height="58" rx="13"/>
    <rect x="32" y="337" width="536" height="58" rx="13"/>
  </g>
  <path d="M290 83h41M290 151h41M290 219h41M290 287h41M290 355h41" stroke="#b45145" stroke-width="6"/>
  <path d="M320 74l13 9l-13 9M320 142l13 9l-13 9M320 210l13 9l-13 9M320 278l13 9l-13 9M320 346l13 9l-13 9" fill="none" stroke="#b45145" stroke-width="6" stroke-linejoin="round"/>
  <g font-family="sans-serif" font-size="27" text-anchor="middle" fill="#304642">
    <text x="180" y="104">agor</text><text x="440" y="104" font-weight="700">agorodd</text>
    <text x="180" y="172">cau</text><text x="440" y="172" font-weight="700">caeodd</text>
    <text x="180" y="240">edrych</text><text x="440" y="240" font-weight="700">edrychodd</text>
    <text x="180" y="308">helpu</text><text x="440" y="308" font-weight="700">helpodd</text>
    <text x="180" y="376">gofyn / ateb</text><text x="440" y="376" font-weight="700">gofynnodd / atebodd</text>
    <text x="300" y="42" font-size="31" font-weight="700">heddiw → ddoe</text>
    <text x="300" y="430" font-size="25">Ddoe, agorodd y drws.</text>
  </g>
</svg>
