<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" role="img" aria-labelledby="title desc">
  <title id="title">Cefndir a digwyddiadau</title>
  <desc id="desc">Llinell amser: roedd ac oedden fel cefndir hir, a daeth, helpodd, caeodd fel pwyntiau.</desc>
  <rect width="440" height="430" rx="28" fill="#fbf6e9"/>
  <text x="220" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#183642">PAN OEDD...</text>
  <rect x="42" y="82" width="356" height="100" rx="24" fill="#dce5f2" stroke="#3a5f8a" stroke-width="3"/>
  <text x="220" y="122" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#183642">roeddwn i'n ofnus</text>
  <text x="220" y="155" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#183642">roedden ni'n chwilio</text>
  <path d="M54 243h332" stroke="#264653" stroke-width="6" stroke-linecap="round"/>
  <g fill="#c95d4b" stroke="#7f3429" stroke-width="3">
    <circle cx="105" cy="243" r="13"/>
    <circle cx="220" cy="243" r="13"/>
    <circle cx="335" cy="243" r="13"/>
  </g>
  <g font-family="sans-serif" font-size="19" font-weight="700" fill="#183642" text-anchor="middle">
    <text x="105" y="292">DAETH</text>
    <text x="220" y="292">HELPOdd</text>
    <text x="335" y="292">CAEODD</text>
  </g>
  <path d="M105 224v-36M220 224v-36M335 224v-36" stroke="#7f3429" stroke-width="3"/>
  <g font-family="sans-serif" font-size="18" fill="#5a4b3e" text-anchor="middle">
    <text x="105" y="336">y storm</text>
    <text x="220" y="336">Iwan</text>
    <text x="335" y="336">y drws</text>
  </g>
  <path d="M66 382h308" stroke="#d49a49" stroke-width="4" stroke-linecap="round"/>
</svg>
