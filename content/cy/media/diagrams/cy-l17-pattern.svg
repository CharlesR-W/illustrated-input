<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title desc">
  <title id="title">Oeddwn, oeddet, oedden</title>
  <desc id="desc">Tri phâr o swigod siarad yn dangos personau'r amherffaith gyda pan.</desc>
  <rect width="420" height="520" rx="28" fill="#fbf6e9"/>
  <path d="M42 34h336" stroke="#264653" stroke-width="4" stroke-linecap="round"/>
  <text x="210" y="72" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#183642">PAN OEDD...</text>
  <g font-family="sans-serif" font-size="20" fill="#183642">
    <rect x="38" y="100" width="344" height="92" rx="22" fill="#d9eee9" stroke="#264653" stroke-width="3"/>
    <path d="M92 192l-18 28 43-24" fill="#d9eee9" stroke="#264653" stroke-width="3"/>
    <text x="210" y="137" text-anchor="middle" font-weight="700">Pan oeddwn i'n ifanc,</text>
    <text x="210" y="169" text-anchor="middle">roeddwn i'n gweithio.</text>
    <rect x="38" y="226" width="344" height="86" rx="22" fill="#f2d3bd" stroke="#9c4f3c" stroke-width="3"/>
    <path d="M328 312l22 26-47-22" fill="#f2d3bd" stroke="#9c4f3c" stroke-width="3"/>
    <text x="210" y="260" text-anchor="middle" font-weight="700">Oeddet ti'n ofnus?</text>
    <text x="210" y="291" text-anchor="middle">Oeddwn.</text>
    <rect x="38" y="346" width="344" height="112" rx="22" fill="#dce5f2" stroke="#3a5f8a" stroke-width="3"/>
    <path d="M98 458l-18 28 44-24" fill="#dce5f2" stroke="#3a5f8a" stroke-width="3"/>
    <text x="210" y="385" text-anchor="middle" font-weight="700">Pan oedden ni'n chwilio,</text>
    <text x="210" y="418" text-anchor="middle">roedden ni yn y môr.</text>
  </g>
  <circle cx="210" cy="492" r="6" fill="#d49a49"/>
</svg>
