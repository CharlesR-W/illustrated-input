  <title id="title">Paratoi tri chynllun</title>
  <desc id="desc">Mae bwrdd paratoi yn cysylltu'r haul â phabell tu allan, glaw â map sych tu mewn, a gwynt â phapurau wrth yr hen lyfr.</desc>
