<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="title desc">
  <title id="title">Tri changen gydag os bydd</title>
  <desc id="desc">Mae os bydd yn arwain at dair cangen: yr haul yn dod allan, hi'n bwrw glaw, a'r gwynt yn codi.</desc>
  <rect width="560" height="380" rx="22" fill="#fbf4e6"/>
  <rect x="188" y="22" width="184" height="54" rx="25" fill="#a84f38" stroke="#3d3a37" stroke-width="4"/>
  <text x="280" y="57" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#fff9ec">OS BYDD…</text>
  <path d="M280 78v43M280 121H91v37M280 121v37M280 121h189v37" fill="none" stroke="#4c6764" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#3d3a37" stroke-width="4">
    <rect x="22" y="158" width="138" height="116" rx="18" fill="#fff3c7"/>
    <circle cx="91" cy="202" r="23" fill="#e7b32e"/>
    <path d="M91 166v14M91 224v14M55 202h14M113 202h14M66 177l10 10M106 217l10 10M116 177l-10 10M76 217l-10 10" stroke="#e7b32e" stroke-width="6"/>
    <rect x="211" y="158" width="138" height="116" rx="18" fill="#dce9ef"/>
    <path d="M235 202q10-25 31-10 25-19 35 10 22 0 24 19h-91q-7-10 1-19" fill="#8198a4"/>
    <path d="M248 231l-9 19M272 231l-9 19M297 231l-9 19M319 231l-9 19" stroke="#337f9d" stroke-width="7"/>
    <rect x="400" y="158" width="138" height="116" rx="18" fill="#e2f0eb"/>
    <path d="M420 190q48-22 97 0M413 213q58-24 110 0M425 239q41-18 82 0" fill="none" stroke="#4d8791" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="91" y="303" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#343a39">
    <tspan x="91">YR HAUL YN</tspan><tspan x="91" dy="22">DOD ALLAN</tspan>
  </text>
  <text x="280" y="303" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#343a39">
    <tspan x="280">HI'N BWRW</tspan><tspan x="280" dy="22">GLAW</tspan>
  </text>
  <text x="469" y="303" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#343a39">
    <tspan x="469">Y GWYNT YN</tspan><tspan x="469" dy="22">CODI</tspan>
  </text>
  <path d="M91 338v18M280 338v18M469 338v18" stroke="#a84f38" stroke-width="5"/>
  <text x="91" y="374" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#355d57">TU ALLAN</text>
  <text x="280" y="374" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#355d57">TU MEWN</text>
  <text x="469" y="374" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#355d57">YR HEN LYFR</text>
</svg>
