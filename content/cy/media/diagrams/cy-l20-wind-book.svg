<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title desc">
  <title id="title">Y gwynt yn canu yn y llyfr</title>
  <desc id="desc">Mae'r gwynt yn mynd drwy bedwar drws bach yn y llyfr ac yn gwneud pedair sain.</desc>
