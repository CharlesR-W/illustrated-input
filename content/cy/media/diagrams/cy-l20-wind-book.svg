  <text x="62" y="36" text-anchor="middle" font-family="serif" font-size="25" font-weight="700" fill="#2d6f76">gwynt</text>
  <path d="M15 68q48-25 92 0M15 101q57-28 104 0M15 134q48-25 92 0" fill="none" stroke="#2d8b91" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(132 51)" stroke="#283b43" stroke-width="5" stroke-linejoin="round">
    <path d="M0 20Q46 0 92 17v146q-46-17-92 3Z" fill="#35434a"/><path d="M92 17q49-19 98 4v145q-48-20-98-3Z" fill="#425159"/><path d="M92 17v146" fill="none"/>
    <circle cx="25" cy="65" r="10" fill="#fbf6e9"/><circle cx="62" cy="65" r="10" fill="#fbf6e9"/><circle cx="25" cy="105" r="10" fill="#fbf6e9"/><circle cx="62" cy="105" r="10" fill="#fbf6e9"/>
  </g>
  <path d="M253 80q18-20 36 0M266 111q26-30 53 0M251 145q20-22 40 0M267 176q28-31 56 0" fill="none" stroke="#c99732" stroke-width="6" stroke-linecap="round"/>
