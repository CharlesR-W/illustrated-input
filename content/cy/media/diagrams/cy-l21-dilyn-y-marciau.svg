<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-labelledby="title desc">
  <title id="title">Dilyn y marciau</title>
  <desc id="desc">Mae llinell goch yn mynd o'r gornel drwy'r canol at yr ochr.</desc>
  <rect width="460" height="300" rx="24" fill="#fffaf0"/>
  <text x="230" y="38" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#315c61">dilyn y marciau</text>
  <rect x="52" y="62" width="356" height="191" fill="#e3ece4" stroke="#315c61" stroke-width="5"/>
  <!-- start star -->
  <path d="M85 78l7 15 17 2-13 12 4 17-15-8-15 8 4-17-13-12 17-2z" fill="#d65d4a" stroke="#76372e" stroke-width="3"/>
  <!-- central crown -->
  <path d="M203 154l9-24 16 17 16-17 9 24v20h-50z" fill="#d7ad45" stroke="#3d3730" stroke-width="3"/>
  <!-- key at side -->
  <circle cx="378" cy="212" r="12" fill="none" stroke="#a6751c" stroke-width="6"/>
  <path d="M366 212h-43m8 0v12m12-12v9" stroke="#a6751c" stroke-width="6" stroke-linecap="round"/>
  <path d="M89 117C109 174 157 184 201 161S287 136 323 210" fill="none" stroke="#b84138" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 13"/>
  <path d="M314 197l10 14-17 2" fill="none" stroke="#b84138" stroke-width="6"/>
  <text x="86" y="278" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#7c2d2d">cornel</text>
  <text x="228" y="278" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#7c2d2d">canol</text>
  <text x="374" y="278" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#7c2d2d">ochr</text>
</svg>
