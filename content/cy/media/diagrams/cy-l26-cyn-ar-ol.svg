<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc">
  <title id="title">Cyn ac ar ôl</title>
  <desc id="desc">Mae llinell amser yn symud o cyn, drwy'r gwaith, at ar ôl a gorffen.</desc>
  <rect width="360" height="300" rx="24" fill="#f7f0df"/>
  <path d="M38 151h276" stroke="#4d7177" stroke-width="9" stroke-linecap="round"/>
  <path d="M299 133l25 18-25 18" fill="none" stroke="#4d7177" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="75" cy="151" r="19" fill="#d66a58" stroke="#344853" stroke-width="5"/>
  <circle cx="181" cy="151" r="28" fill="#d4b24e" stroke="#344853" stroke-width="5"/>
  <circle cx="288" cy="151" r="19" fill="#5e8b77" stroke="#344853" stroke-width="5"/>
  <text x="75" y="84" text-anchor="middle" font-family="serif" font-size="25" font-weight="700" fill="#344853">CYN</text>
  <text x="181" y="84" text-anchor="middle" font-family="serif" font-size="21" font-weight="700" fill="#344853">GWAITH</text>
  <text x="288" y="84" text-anchor="middle" font-family="serif" font-size="23" font-weight="700" fill="#344853">AR ÔL</text>
  <path d="M157 218l18 18 40-47" fill="none" stroke="#5e8b77" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="186" y="272" text-anchor="middle" font-family="serif" font-size="22" font-weight="700" fill="#344853">GORFFEN</text>
</svg>
