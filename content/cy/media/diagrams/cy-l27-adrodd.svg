<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-labelledby="title desc">
  <title id="title">O eiriau uniongyrchol i adrodd</title>
  <desc id="desc">Mae Nia yn siarad yn gyntaf; wedyn mae brawddeg gyda dywedodd a fod yn adrodd ei geiriau.</desc>
