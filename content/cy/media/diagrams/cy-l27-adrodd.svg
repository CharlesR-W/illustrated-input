  <text x="112" y="67" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#263746">MAE'R DRWS</text>
  <text x="112" y="101" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#263746">AR GAU.</text>
