<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" role="img" aria-labelledby="title desc">
  <title id="title">Colli ac ennill</title>
  <desc id="desc">Mae llyfr yn symud i ffwrdd o ddwylo gwag i ddangos colli, ac mae llyfr yn symud i mewn i ddwylo agored i ddangos ennill.</desc>
  <rect width="500" height="310" rx="26" fill="#f7f0df"/>
  <path d="M250 25v258" stroke="#c9b893" stroke-width="5" stroke-dasharray="9 10"/>
  <text x="125" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="900" fill="#a5523b">COLLI</text>
  <text x="375" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="900" fill="#2f6f5f">ENNILL</text>
  <!-- lose: book departs -->
  <path d="M63 230q28-35 59 0M122 230q29-35 59 0" fill="none" stroke="#8b674d" stroke-width="10" stroke-linecap="round"/>
  <rect x="95" y="112" width="58" height="78" rx="5" fill="#b9553f" stroke="#5b4234" stroke-width="5"/>
  <path d="M124 113v76" stroke="#e7d3aa" stroke-width="4"/>
  <path d="M121 96V71" stroke="#a5523b" stroke-width="7" stroke-linecap="round"/>
  <path d="M104 83l17-18 17 18" fill="none" stroke="#a5523b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 254h90" stroke="#a5523b" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  <!-- gain: book arrives -->
  <path d="M313 230q28-35 59 0M372 230q29-35 59 0" fill="none" stroke="#8b674d" stroke-width="10" stroke-linecap="round"/>
  <rect x="346" y="136" width="58" height="78" rx="5" fill="#447d77" stroke="#40594d" stroke-width="5"/>
  <path d="M375 137v76" stroke="#e7d3aa" stroke-width="4"/>
  <path d="M375 72v43" stroke="#2f6f5f" stroke-width="7" stroke-linecap="round"/>
  <path d="M358 101l17 18 17-18" fill="none" stroke="#2f6f5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="375" cy="252" r="10" fill="#c89b43"/>
  <text x="125" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#72563c">NID YMA MWYACH</text>
  <text x="375" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#52695f">YMA NAWR</text>
</svg>
