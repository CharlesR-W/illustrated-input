<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-labelledby="title desc">
  <title id="title">Gyda a heb</title>
  <desc id="desc">Mae Artur gyda choron a chleddyf ar y chwith, ac mae Artur heb goron na chleddyf ar y dde.</desc>
  <rect width="460" height="300" rx="26" fill="#f7f0df"/>
  <path d="M230 25v248" stroke="#c9b893" stroke-width="5" stroke-dasharray="9 10"/>
  <text x="115" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="900" fill="#2f6f5f">GYDA</text>
  <text x="345" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="900" fill="#a5523b">HEB</text>
  <!-- two Arturs -->
  <g stroke="#4a3028" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="115" cy="125" r="31" fill="#d7a07b"/>
    <path d="M84 124q3-51 32-50 29 0 31 50-16-14-31-10-14-5-32 10Z" fill="#5b3b2d"/>
    <path d="M87 162l-24 101h105l-25-101Z" fill="#315b70"/>
    <circle cx="345" cy="125" r="31" fill="#d7a07b"/>
    <path d="M314 124q3-51 32-50 29 0 31 50-16-14-31-10-14-5-32 10Z" fill="#5b3b2d"/>
    <path d="M317 162l-24 101h105l-25-101Z" fill="#315b70"/>
  </g>
  <path d="M79 77l7-27 17 17 19-25 17 25 18-17 7 27Z" fill="#d3a648" stroke="#775523" stroke-width="4"/>
  <path d="M164 137l34-79M183 61l23 10M161 132l20 9" stroke="#795d43" stroke-width="7" stroke-linecap="round"/>
  <path d="M298 70l94 142M392 70l-94 142" stroke="#c75b49" stroke-width="8" stroke-linecap="round" opacity=".84"/>
  <text x="115" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#263746">GYDA CHORON</text>
  <text x="345" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#263746">HEB GORON</text>
</svg>
