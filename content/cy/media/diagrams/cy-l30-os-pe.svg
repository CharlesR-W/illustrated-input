  <text x="92" y="67" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="900" fill="#2f6f5f">OS BYDD</text>
  <path d="M161 77h91" stroke="#2f6f5f" stroke-width="8" stroke-linecap="round"/>
