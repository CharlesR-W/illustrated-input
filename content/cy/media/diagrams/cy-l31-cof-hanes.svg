    <path d="M35 142l-13 60h78l-14-60Z" fill="#6d5961"/>
  </g>
  <path d="M87 91q0-52 64-52 67 0 67 52 0 49-66 49-18 0-31-5l-29 18 10-31Q87 111 87 91Z" fill="#dce7e8" stroke="#5f7480" stroke-width="5"/>
