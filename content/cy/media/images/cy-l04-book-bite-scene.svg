<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Mae Dafi'n darllen?</title>
  <desc id="desc">Mae Mali'n darllen. Mae Dafi'n bwyta'r llyfr. Mae Pero'n edrych.</desc>
  <rect width="960" height="600" rx="30" fill="#fbf5e8"/>
  <rect x="28" y="28" width="904" height="425" rx="24" fill="#d5e6de" stroke="#314b48" stroke-width="5"/>
  <path d="M28 453h904v119H28z" fill="#caa77a"/>
  <path d="M28 500q230-32 452 0t452 0v72H28z" fill="#e1caab" opacity=".55"/>

  <!-- warm wooden shelves -->
  <g stroke="#4d3829" stroke-width="6" stroke-linejoin="round">
    <path d="M53 88h220v320H53zM687 88h220v320H687z" fill="#8e633f"/>
    <path d="M70 155h186M70 228h186M70 301h186M70 374h186M704 155h186M704 228h186M704 301h186M704 374h186" stroke="#d8b580" stroke-width="9"/>
  </g>
  <g fill="#b95b4e">
    <rect x="80" y="111" width="19" height="40"/><rect x="147" y="184" width="24" height="40"/>
    <rect x="221" y="258" width="18" height="39"/><rect x="718" y="110" width="22" height="41"/>
    <rect x="809" y="185" width="18" height="38"/><rect x="850" y="330" width="23" height="40"/>
  </g>
  <g fill="#e4b65d">
    <rect x="105" y="115" width="29" height="36"/><rect x="181" y="258" width="25" height="39"/>
    <rect x="754" y="186" width="26" height="37"/><rect x="799" y="332" width="28" height="38"/>
  </g>
  <g fill="#426f6b">
    <rect x="177" y="113" width="20" height="38"/><rect x="95" y="332" width="28" height="38"/>
    <rect x="770" y="113" width="18" height="38"/><rect x="838" y="259" width="31" height="38"/>
  </g>

  <!-- table -->
  <path d="M282 394h402l38 35H246z" fill="#a9784f" stroke="#563e2f" stroke-width="6"/>
  <path d="M292 428l-18 111m398-111 22 111" stroke="#563e2f" stroke-width="13" stroke-linecap="round"/>

  <!-- Mali: dark curls, rust cardigan, teal trousers, brown boots -->
  <g stroke="#43352e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="343" cy="213" r="45" fill="#a97454"/>
    <path d="M304 204q-8-53 39-64 55 8 41 70-11-29-25-37-28 28-55 31z" fill="#2d2524"/>
    <g fill="#2d2524" stroke="none">
      <circle cx="313" cy="169" r="16"/><circle cx="335" cy="155" r="17"/><circle cx="361" cy="157" r="17"/><circle cx="380" cy="176" r="16"/>
    </g>
    <circle cx="328" cy="212" r="4" fill="#2d2524" stroke="none"/><circle cx="357" cy="212" r="4" fill="#2d2524" stroke="none"/>
    <path d="M330 232q13 9 27 0" fill="none"/>
    <path d="M309 259q35-20 69 0l20 122H291z" fill="#a84f3c"/>
    <path d="M311 380l-17 120h35l18-111m34-9 29 120h34l-22-127" fill="#2f7a78"/>
    <path d="M289 498h43v25h-52q-4-19 9-25zm117 0h42v25h-49q-6-17 7-25z" fill="#70452e"/>
    <path d="M315 286l-5 76m65-76 16 71" fill="none"/>
  </g>

  <!-- Mali's upright open book, finger following text -->
  <g stroke="#5a4432" stroke-width="5" stroke-linejoin="round">
    <path d="M298 337q46-15 91 8v91q-45-20-91-6z" fill="#fff7df"/>
    <path d="M389 345q47-23 94-6v91q-49-13-94 6z" fill="#fff7df"/>
    <path d="M389 345v91" fill="none"/>
    <path d="M318 365h49m-49 19h54m-54 19h41m51-39h50m-50 19h58m-58 20h42" stroke="#66837d" stroke-width="4"/>
    <path d="M374 294l30 83" fill="none" stroke="#a97454" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Dafi: tiny red dragon with cream horns and tiny wings -->
  <g stroke="#7b3028" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="591" cy="382" rx="47" ry="58" fill="#c94f3f"/>
    <circle cx="589" cy="320" r="40" fill="#d95a45"/>
    <path d="M565 292l-6-38 25 31m26 7 10-38 19 33" fill="#f0d39a"/>
    <path d="M550 365l-39-31 10 51m111-21 40-30-11 52" fill="#d95a45"/>
    <circle cx="575" cy="317" r="5" fill="#263130" stroke="none"/><circle cx="600" cy="317" r="5" fill="#263130" stroke="none"/>
    <path d="M574 340q15 10 29-1m22 85q48 21 59-11" fill="none"/>
  </g>

  <!-- upside-down book at Dafi's mouth; crown mark inverted -->
  <g transform="translate(0 55) rotate(180 590 320)" stroke="#5a4432" stroke-width="5" stroke-linejoin="round">
    <path d="M520 274q37-17 71 4v91q-36-18-71-5zM591 278q37-21 74-5v91q-38-13-74 5z" fill="#8e6b45"/>
    <path d="M591 278v91" fill="none"/>
    <path d="M548 326l9-20 12 13 13-21 12 22 13-13 9 20z" fill="#c6a04c" stroke="#816b35" stroke-width="3"/>
    <path d="M646 352l19-9v21h-19z" fill="#fbf5e8" stroke="none"/>
  </g>
  <path d="M573 343l8 10 8-10 8 10 8-10" fill="#f8e7bf" stroke="#7b3028" stroke-width="3" stroke-linejoin="round"/>

  <!-- Pero: large black-and-white sheepdog watching -->
  <g stroke="#31302e" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="804" cy="408" rx="91" ry="60" fill="#f6f0df"/>
    <path d="M739 370q46-53 84 5l-5 76q-59 18-95-15z" fill="#292c2c"/>
    <path d="M787 358q45-26 72 21l-13 42q-38-10-66-49z" fill="#f6f0df"/>
    <path d="M837 372l35-31-4 53M738 371l-35-31 7 54" fill="#292c2c"/>
    <circle cx="758" cy="390" r="6" fill="#f6f0df" stroke="none"/><circle cx="819" cy="387" r="6" fill="#292c2c" stroke="none"/>
    <ellipse cx="789" cy="414" rx="11" ry="8" fill="#292c2c"/>
    <path d="M875 397q45-31 55 5-8 34-43 23M751 455v53m68-53v53" fill="none"/>
  </g>

  <!-- apple core, water bowl, and torn sleeper paper -->
  <g stroke="#4b3b31" stroke-width="4" stroke-linejoin="round">
    <path d="M267 450q15 11 29 0l-5 57q-10 11-19 0z" fill="#f1d492"/>
    <path d="M267 450q14-13 29 0M272 507q8 10 19 0" fill="#b94339"/>
    <path d="M280 441q0-17 14-24" fill="none"/>
    <ellipse cx="476" cy="493" rx="57" ry="18" fill="#668f9c"/>
    <path d="M422 489q8 35 54 35t55-35" fill="#89b8c2"/>
    <path d="M431 487q45-17 91 0" fill="none" stroke="#e4f2ef"/>
    <path d="M130 432l97-17 15 103-99 16z" fill="#fff9e9"/>
    <path d="M152 486q18-35 43 0" fill="#263b67"/>
    <circle cx="175" cy="458" r="13" fill="#2d2524"/>
    <path d="M132 432l37 11-9 27 34 6 6 38" fill="none" stroke="#b38b58" stroke-dasharray="7 5"/>
  </g>
</svg>
