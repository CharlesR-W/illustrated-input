    <path d="M-12-90q14 9 28 0" fill="none"/>
  </g>
  <!-- open book in Mali's hands -->
  <g transform="translate(452 394) rotate(4)" stroke="#293437" stroke-width="5" stroke-linejoin="round">
    <path d="M-116-66q60-20 113 18v131q-53-33-113-13z" fill="#f8edcf"/>
    <path d="M3-48q57-39 112-14v132q-59-20-112 13z" fill="#f8edcf"/>
    <path d="M-3-48v131" fill="none"/>
    <path d="M-90-38h63M-91-18h54M28-28h58" fill="none" stroke="#b9966e" stroke-width="4"/>
    <!-- sleeping Artur -->
    <path d="M20 42q43-48 78 0v18H20z" fill="#305a91"/>
    <circle cx="58" cy="17" r="19" fill="#c98867"/>
    <path d="M38 16q4-28 23-28 22 1 22 30-20-12-45-2z" fill="#30282a"/>
    <path d="M48 20q8 5 17 0" fill="none" stroke-width="3"/>
  </g>
