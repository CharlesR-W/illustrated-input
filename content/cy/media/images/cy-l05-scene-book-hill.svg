    <path d="M-11 7q-16 57 4 96h64q20-45 0-100" fill="#bf4a3c"/>
    <path d="M-5 101l-18 25M53 101l18 25M75 51q54 19 35 59" fill="none"/>
    <circle cx="-5" cy="-59" r="6" fill="#293437"/><circle cx="40" cy="-57" r="6" fill="#293437"/>
    <path d="M2-30q18-15 36 0" fill="none"/>
    <!-- one arm indicates book, one indicates hill -->
    <path d="M-15 24L-102-20" fill="none" stroke="#bf4a3c" stroke-width="18"/>
    <path d="M51 22L136-52" fill="none" stroke="#bf4a3c" stroke-width="18"/>
    <path d="M-108-23l-14-6m258-22 13-9" fill="none"/>
  </g>
  <!-- eaten food and empty water -->
  <g stroke="#293437" stroke-width="4" stroke-linejoin="round">
    <path d="M500 520q20-23 40 0-4 28-20 28t-20-28z" fill="#e9d2a6"/>
    <path d="M519 516v-15" fill="none"/>
    <path d="M558 500h54l-7 49h-40z" fill="#d9eef6"/>
    <path d="M563 539h43" stroke="#73a9c7"/>
  </g>
  <!-- book-to-hill clue path -->
  <path d="M548 376Q640 316 785 335" fill="none" stroke="#c8792b" stroke-width="7" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <g font-family="sans-serif" font-weight="800" fill="#293437">
    <rect x="146" y="585" width="708" height="54" rx="22" fill="#fffaf0" stroke="#293437" stroke-width="4"/>
    <text x="500" y="621" text-anchor="middle" font-size="28">Mae'r llyfr yma. Mae Dafi'n edrych ycw.</text>
  </g>
</svg>
