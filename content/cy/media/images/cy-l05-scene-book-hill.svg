<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">Y llyfr a'r bryn</title>
  <desc id="desc">Yn y llyfrgell gynnes mae Mali yn dal y llyfr ar agor wrth lun bachgen sy'n cysgu. Mae Dafi yn edrych yn drist ac yn dangos yn gyntaf at y llyfr ac wedyn at y bryn mawr y tu allan.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#c8792b"/>
    </marker>
  </defs>
  <rect width="1000" height="660" rx="36" fill="#fffaf0"/>
  <rect x="30" y="30" width="940" height="570" rx="28" fill="#c6ded4" stroke="#293437" stroke-width="7"/>
  <rect x="56" y="58" width="888" height="514" rx="15" fill="#f3dfbc" stroke="#293437" stroke-width="5"/>
  <!-- warm library -->
  <g stroke="#293437" stroke-width="5">
    <path d="M76 82h194v424H76zM730 82h190v424H730z" fill="#925f42"/>
    <g fill="#d9a95c">
      <rect x="91" y="105" width="28" height="111"/><rect x="126" y="125" width="34" height="91"/>
      <rect x="168" y="98" width="24" height="118"/><rect x="199" y="116" width="53" height="100"/>
      <rect x="91" y="239" width="44" height="116"/><rect x="143" y="257" width="29" height="98"/>
      <rect x="180" y="229" width="31" height="126"/><rect x="219" y="247" width="33" height="108"/>
      <rect x="747" y="105" width="30" height="111"/><rect x="785" y="122" width="42" height="94"/>
      <rect x="835" y="96" width="27" height="120"/><rect x="870" y="121" width="34" height="95"/>
    </g>
    <path d="M76 220h194M76 359h194M730 220h190" fill="none"/>
  </g>
  <!-- window and distant hill -->
  <g stroke="#293437" stroke-width="6" stroke-linejoin="round">
    <rect x="730" y="235" width="190" height="222" rx="4" fill="#b8d9df"/>
    <circle cx="856" cy="286" r="29" fill="#d9b958" stroke="#b08a30"/>
    <path d="M733 424q72-105 187-44v77H733z" fill="#6e8295"/>
    <path d="M733 440q60-61 122-42 31 10 65 42v17H733z" fill="#869a7b"/>
    <path d="M825 352l9-24 10 24 18-9-5 25h-47l-5-25z" fill="#c99a3a" stroke="#765d2b" stroke-width="3" opacity=".8"/>
    <path d="M825 235v222M730 345h190" fill="none" stroke="#56747a" stroke-width="4"/>
  </g>
  <ellipse cx="500" cy="526" rx="365" ry="42" fill="#dfcba6"/>
  <!-- Mali -->
  <g transform="translate(365 333)" stroke="#293437" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cy="-108" r="42" fill="#c98867"/>
    <path d="M-47-117q6-59 52-57 47 1 46 62-21-20-42-8-24-21-56 3z" fill="#30282a"/>
    <path d="M-44-67h88l26 151h-140z" fill="#a9533f"/>
    <path d="M-38 80l-13 119M37 80l14 119" stroke="#217d7b" stroke-width="30"/>
    <path d="M-57 201h31M26 201h31" stroke="#79513a" stroke-width="20"/>
    <path d="M-39-51l-42 94M40-49l49 86" fill="none" stroke="#c98867" stroke-width="18"/>
