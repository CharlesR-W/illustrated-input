<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Chwilio yn y llyfrgell</title>
  <desc id="desc">Mae Mali a Dafi'n chwilio yn yr ystafell. Mae Pero'n edrych tu ôl i'r silff. Mae Iwan wrth hen focs tu ôl i'r silff, ac mae papur dan y bocs.</desc>
  <rect width="1000" height="650" rx="28" fill="#fbf5e8"/>
  <path d="M25 36h950v535H25z" fill="#d8e8df" stroke="#3b4c47" stroke-width="6"/>
  <path d="M25 446q235-32 468 0t482 0v125H25z" fill="#c58b61" opacity=".6"/>

  <!-- window and evening coast -->
  <g stroke="#3b4c47" stroke-width="6">
    <rect x="68" y="78" width="240" height="190" rx="8" fill="#b9d7df"/>
    <path d="M78 214q72-43 145-6t75-4v54H78z" fill="#6d9ca2" stroke="none"/>
    <path d="M188 82v182M72 173h232" fill="none"/>
  </g>

  <!-- table in front of the window -->
  <g stroke="#4a382d" stroke-width="6" stroke-linejoin="round">
    <path d="M86 340h274v42H86z" fill="#a96f4c"/>
    <path d="M115 380v141M330 380v141" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g transform="translate(122 301)" stroke="#665247" stroke-width="3">
    <path d="M0 0h55v40H0zM61 0h55v40H61zM122 0h55v40h-55z" fill="#edd49b"/>
    <path d="M183 0h55v40h-55z" fill="none" stroke="#aa5046" stroke-dasharray="7 6"/>
    <path d="M15 14q13-12 27 2M75 13q13 12 27 0M137 17q13-13 27 1" fill="none" stroke="#b64f43" stroke-width="6"/>
  </g>

  <!-- shelf: its solid body visually hides Iwan -->
  <g transform="translate(690 78)" stroke="#48372d" stroke-width="6" stroke-linejoin="round">
    <path d="M0 0h235v430H0z" fill="#8e5c42"/>
    <path d="M20 24h195v360H20z" fill="#694532"/>
    <path d="M18 116h199M18 210h199M18 304h199" fill="none"/>
    <g stroke-width="3">
      <path d="M31 38h24v73H31z" fill="#b85448"/><path d="M58 53h31v58H58z" fill="#d3a34e"/>
      <path d="M93 43h25v68H93z" fill="#50827d"/><path d="M122 35h35v76h-35z" fill="#d8c082"/>
      <path d="M164 50h39v61h-39z" fill="#8f6aa5"/>
      <path d="M29 132h38v73H29z" fill="#d7b46a"/><path d="M71 143h26v62H71z" fill="#4f7f89"/>
      <path d="M101 126h34v79h-34z" fill="#b65b48"/><path d="M141 150h61v55h-61z" fill="#e4d29f"/>
      <path d="M30 225h29v74H30z" fill="#9270a2"/><path d="M63 239h39v60H63z" fill="#d5a04f"/>
      <path d="M106 218h26v81h-26z" fill="#4d7c77"/><path d="M136 233h67v66h-67z" fill="#c5684d"/>
    </g>
  </g>

  <!-- Iwan asleep behind the shelf: only visible through the cutaway side -->
  <g transform="translate(845 388)" stroke="#40342e" stroke-width="5" stroke-linejoin="round">
    <path d="M22 66q42-34 87 0l23 99H4z" fill="#c39a4c"/>
    <circle cx="67" cy="31" r="42" fill="#d3a27d"/>
    <path d="M25 25q6-51 55-43q33 6 31 49q-19-23-39-12q-18-20-47 6z" fill="#d9d2c5"/>
    <path d="M47 35q9 7 18 0M76 35q9 7 18 0" fill="none" stroke-linecap="round"/>
    <path d="M60 54q10 6 20 0" fill="none"/>
    <path d="M30 159l-27 49M106 159l28 49" stroke="#456a72" stroke-width="19" stroke-linecap="round"/>
  </g>

  <!-- old box and missing paper -->
  <g transform="translate(765 495)" stroke="#574538" stroke-width="5" stroke-linejoin="round">
    <path d="M0 0h154l18 82H-12z" fill="#aa744d"/>
    <path d="M6 0l18-22h126l20 22z" fill="#c08b5b"/>
    <path d="M63-7h49v17H63z" fill="#74503b"/>
    <path d="M48 72h83v48H48z" fill="#efd99e"/>
    <path d="M60 87q25-19 52 4" fill="none" stroke="#b64f43" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Mali searching: visual bible -->
  <g transform="translate(376 258)" stroke="#392f2a" stroke-width="5" stroke-linejoin="round">
    <path d="M52 128v145M101 128v145" stroke="#287b79" stroke-width="25"/>
    <path d="M38 270l-22 43M115 270l22 43" stroke="#704a35" stroke-width="18" stroke-linecap="round"/>
    <path d="M25 91q51-36 105 0l-12 112H39z" fill="#a9533f"/>
    <circle cx="78" cy="49" r="40" fill="#c88e68"/>
    <path d="M37 45q-2-47 42-51q46-2 42 52q-13-23-27-27q-8 20-27 2q-9 19-30 24z" fill="#31251f"/>
    <circle cx="64" cy="50" r="4"/><circle cx="92" cy="50" r="4"/>
    <path d="M67 67q11 7 22 0" fill="none"/>
    <path d="M119 112q58 25 101 4" fill="none" stroke="#c88e68" stroke-width="15" stroke-linecap="round"/>
    <path d="M220 116l-16-14M220 116l-16 14" fill="none" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Dafi searches under a chair -->
  <g transform="translate(523 390)" stroke="#58372f" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="60" cy="80" rx="47" ry="55" fill="#c84f42"/>
    <circle cx="60" cy="32" r="37" fill="#d85b4e"/>
    <path d="M36 2L28-25l22 21M82 0l18-25l6 34" fill="#f0d39b"/>
    <path d="M18 68l-31-24l5 48zM102 68l32-23l-5 47z" fill="#d88469"/>
    <circle cx="47" cy="31" r="5" fill="#242b2a"/><circle cx="73" cy="31" r="5" fill="#242b2a"/>
    <path d="M49 49q11 7 21 0" fill="none"/>
    <path d="M25 111l-14 28M94 111l14 28" stroke="#c84f42" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Pero peers behind the shelf -->
  <g transform="translate(635 430)" stroke="#2f3230" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="58" cy="79" rx="60" ry="40" fill="#f1eee4"/>
    <circle cx="98" cy="43" r="39" fill="#f1eee4"/>
    <path d="M73 13L51-22l7 57M117 7l25-28l-5 56" fill="#292d2c"/>
    <path d="M75 29q18-23 40-4l-3 45q-19 13-40-3z" fill="#2d3130"/>
    <circle cx="90" cy="39" r="4" fill="#f6f0df"/><circle cx="111" cy="39" r="4" fill="#f6f0df"/>
    <path d="M98 51h9l-4 7z" fill="#111"/>
    <path d="M8 73q-33-17-42 9" fill="none" stroke-width="14" stroke-linecap="round"/>
    <path d="M31 108v39M79 109v38" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- place lines and Welsh labels -->
  <g font-family="sans-serif" font-weight="700" fill="#304642">
    <text x="83" y="69" font-size="25">ffenestr</text>
    <text x="735" y="69" font-size="25">silff</text>
    <text x="545" y="623" font-size="26">papur dan y bocs</text>
    <path d="M742 603q48-11 77-39" fill="none" stroke="#a34c43" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
