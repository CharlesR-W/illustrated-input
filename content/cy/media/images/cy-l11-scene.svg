<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Y llyfrau, y bagiau a'r allwedd</title>
  <desc id="desc">Mae Mali, Sam, Nia, Dafi ac Iwan o amgylch bwrdd. Mae Dafi'n rhoi llyfr du yn y bag coch anghywir. Mae hen lyfr Iwan, y pedwar papur a'r allwedd fach ar y bwrdd.</desc>
  <rect width="900" height="520" fill="#fbf7ea"/>
  <rect x="24" y="24" width="852" height="472" rx="28" fill="#d9ece6" stroke="#263d3b" stroke-width="5"/>
  <path d="M24 350H876V496H24Z" fill="#a97850" opacity=".45"/>
  <rect x="105" y="190" width="690" height="190" rx="22" fill="#b77a4d" stroke="#3f3027" stroke-width="6"/>
  <path d="M135 380v85M765 380v85" stroke="#3f3027" stroke-width="18" stroke-linecap="round"/>

  <!-- Mali -->
  <g stroke="#293837" stroke-width="4" stroke-linejoin="round">
    <circle cx="170" cy="116" r="35" fill="#c98f6b"/>
    <path d="M135 113c2-36 63-49 71-2-8-13-19-17-30-15-10-16-31-4-41 17Z" fill="#2c2524"/>
    <circle cx="148" cy="90" r="12" fill="#2c2524"/><circle cx="173" cy="82" r="13" fill="#2c2524"/><circle cx="196" cy="92" r="12" fill="#2c2524"/>
    <path d="M145 151q25-18 50 0l15 85h-78Z" fill="#a94f3d"/>
    <path d="M145 236l-12 89h29l12-89m19 0 15 89h29l-27-89" fill="#2f807c"/>
    <path d="M131 325h34M205 325h35" stroke="#6b4931" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Sam -->
  <g stroke="#293837" stroke-width="4">
    <circle cx="310" cy="112" r="33" fill="#8d5f45"/>
    <path d="M279 107q6-46 64-24l-2 26q-28-19-62-2Z" fill="#302923"/>
    <path d="M282 146q28-18 55 0l11 82h-76Z" fill="#d5a13b"/>
  </g>

  <!-- Nia -->
  <g stroke="#293837" stroke-width="4">
    <circle cx="590" cy="112" r="33" fill="#d6a27e"/>
    <path d="M559 105q7-43 59-23l9 42-16-13-4-20q-24 20-48 14Z" fill="#6b3d2d"/>
    <path d="M560 146q29-18 58 0l12 82h-82Z" fill="#6f789d"/>
  </g>

  <!-- Iwan -->
  <g stroke="#293837" stroke-width="4">
    <circle cx="730" cy="116" r="36" fill="#d1a27f"/>
    <path d="M695 111q6-39 63-24l8 28q-30-18-71-4Z" fill="#ddd5c9"/>
    <path d="M708 127q22 31 44 0-2 37-22 37t-22-37Z" fill="#eee5d9"/>
    <path d="M699 158q31-17 62 0l12 75h-86Z" fill="#446b67"/>
  </g>

  <!-- Dafi moving the wrong book -->
  <g stroke="#552a26" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="390" cy="319" rx="47" ry="30" fill="#bd493d"/>
    <circle cx="422" cy="291" r="24" fill="#cf5545"/>
    <path d="M412 270l-8-20 16 12 11-22 5 27" fill="#f1dfb0"/>
    <path d="M359 311l-28-23 39 4m38 20 27 18" fill="none" stroke-width="8" stroke-linecap="round"/>
    <path d="M370 318q-24 4-29 28 28 0 40-17" fill="#e88870"/>
    <circle cx="430" cy="288" r="3" fill="#222"/>
  </g>
  <path d="M437 329q32 11 56 19" fill="none" stroke="#334d49" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- four books -->
  <g stroke="#34302b" stroke-width="4">
    <rect x="245" y="216" width="72" height="49" rx="5" fill="#aa4a3c"/>
    <path d="M254 226h53" stroke="#f0d8a0"/>
    <rect x="449" y="314" width="70" height="45" rx="5" fill="#303a3c"/>
    <path d="M459 324h50" stroke="#f0d8a0"/>
    <rect x="553" y="221" width="70" height="47" rx="5" fill="#f7f2df"/>
    <path d="M563 231h49" stroke="#6e786f"/>
    <rect x="660" y="216" width="86" height="58" rx="6" fill="#86643f"/>
    <path d="M675 229h55M675 241h42" stroke="#d6b56c"/>
  </g>

  <!-- bags -->
  <g stroke="#34302b" stroke-width="4">
    <path d="M472 362h92l-8 94h-76Z" fill="#a94f3d"/>
    <path d="M491 362q0-29 27-29t27 29" fill="none"/>
    <path d="M245 386h82l-7 70h-68Z" fill="#374143"/>
    <path d="M261 386q0-24 25-24t25 24" fill="none"/>
    <path d="M577 386h82l-7 70h-68Z" fill="#eee8d7"/>
    <path d="M593 386q0-24 25-24t25 24" fill="none"/>
    <path d="M690 374h90l-7 82h-76Z" fill="#81613f"/>
    <path d="M709 374q0-27 26-27t26 27" fill="none"/>
  </g>

  <!-- assembled drawing and key -->
  <g transform="translate(535 280) rotate(-4)" stroke="#635845" stroke-width="3">
    <rect width="145" height="76" rx="5" fill="#f7edcc"/>
    <path d="M72 0v76M0 38h145" stroke-dasharray="6 5"/>
    <path d="M18 58q20-26 42 0M96 55q10-25 25 0" fill="none" stroke="#315c83" stroke-width="6"/>
    <circle cx="52" cy="25" r="9" fill="#bd493d"/>
  </g>
  <g transform="translate(690 308) rotate(12)" fill="#c7a14e" stroke="#594727" stroke-width="4">
    <circle cx="0" cy="0" r="13" fill="none"/>
    <path d="M12 2h56v12H55v13H42V14H12Z"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4Z" fill="#334d49"/>
    </marker>
  </defs>
</svg>
