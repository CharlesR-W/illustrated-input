  <title id="title">Y drws yn agor</title>
  <desc id="desc">Mae mwg llwyd dros yr hen lyfr. Mae'r drws coch wedi agor yn y dudalen; daw llaw welw drwyddo ac mae bys yn pwyntio at y bryn y tu allan i ffenestr y llyfrgell. Mae Mali, Dafi a Pero'n edrych.</desc>
