<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Llais Artur y tu ôl i'r drws</title>
  <desc id="desc">Mae Artur ifanc heb goron yn sefyll y tu ôl i'r drws caeedig ac yn gofyn pwy wnaeth y penderfyniad fod angen brenin ar y dref.</desc>
