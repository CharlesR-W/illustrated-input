  <text x="244" y="94" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#263746">PWY WNAETH Y</text>
  <text x="244" y="132" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#263746">PENDERFYNIAD?</text>
  <text x="244" y="173" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#a5523b">PWY DDYWEDODD FOD ANGEN BRENIN?</text>
