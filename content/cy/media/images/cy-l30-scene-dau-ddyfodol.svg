  <text x="650" y="465" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#263746">PAWB YN GWEITHIO</text>
  <path d="M443 114l-17-34 17 12 17-12Z" fill="#d2a64d" stroke="#6f4d22" stroke-width="4"/>
  <text x="450" y="51" text-anchor="middle" font-family="system-ui,sans-serif" font-size="31" font-weight="900" fill="#f7f0df">DAU DDYFODOL POSIB</text>
