  <path d="M449 164Q641 102 849 153V491Q646 438 449 489Z" fill="url(#stormPage)" stroke="#6b5138" stroke-width="9"/>
  <path d="M441 162v328" stroke="#4c3829" stroke-width="16"/>
  <path d="M442 168q-22 40-3 91t0 98 3 132" fill="none" stroke="#c09a55" stroke-width="4"/>
  <text x="246" y="191" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="800" fill="#6f4d22">PE BAI ARTUR YN FRENIN…</text>
  <text x="651" y="191" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="800" fill="#263746">PE BAI ARTUR YN MYND…</text>
  <!-- first future: crowned young Artur -->
  <g stroke="#4a3028" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="242" cy="269" r="34" fill="#d7a07b"/>
    <path d="M208 269q3-56 36-55 33 0 34 55-19-17-36-11-15-7-34 11Z" fill="#5b3b2d"/>
    <path d="M203 306l-28 100h135l-30-100Z" fill="#315b70"/>
    <path d="M214 231l8-29 20 19 22-28 17 28 22-19 7 29Z" fill="#d3a648" stroke="#775523"/>
    <path d="M229 278q12 7 25 0" fill="none"/>
    <path d="M204 333l-56 39M281 333l56 40" fill="none"/>
  </g>
  <!-- waiting townspeople -->
  <g stroke="#4a3028" stroke-width="4" stroke-linejoin="round">
    <circle cx="105" cy="338" r="21" fill="#bc7d59"/><path d="M82 361l-15 69h73l-15-69Z" fill="#6a8e88"/>
    <circle cx="366" cy="337" r="21" fill="#d0a07c"/><path d="M343 360l-16 70h77l-16-70Z" fill="#b9553f"/>
