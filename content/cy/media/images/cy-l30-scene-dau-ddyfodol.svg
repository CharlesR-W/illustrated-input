<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Dau ddyfodol yn yr hen lyfr</title>
  <desc id="desc">Mae tudalen chwith yr hen lyfr yn dangos Artur â choron a phawb yn aros am ei orchymyn. Mae'r dudalen dde yn dangos pobl y dref yn cario llyfrau drwy'r glaw heb frenin.</desc>
  <defs>
    <linearGradient id="goldPage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8dd"/>
      <stop offset="1" stop-color="#e8d09a"/>
    </linearGradient>
    <linearGradient id="stormPage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce7e8"/>
      <stop offset="1" stop-color="#97afb9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="540" rx="28" fill="#263746"/>
  <path d="M0 80Q135 24 270 77t270 0 270 0 90-8V0H0Z" fill="#4d6274"/>
  <circle cx="76" cy="89" r="4" fill="#f7f0df"/><circle cx="822" cy="111" r="5" fill="#f7f0df"/>
  <circle cx="127" cy="48" r="3" fill="#d9ba68"/><circle cx="766" cy="50" r="3" fill="#d9ba68"/>
  <!-- enchanted open book -->
