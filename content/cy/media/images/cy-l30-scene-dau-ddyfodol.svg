  <!-- Dafi helping -->
  <g stroke="#6d3027" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="676" cy="284" r="22" fill="#cf5b3f"/>
    <path d="M661 268l-8-21 17 13M691 268l9-21-18 13" fill="#f0dfbd"/>
