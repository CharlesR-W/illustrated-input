<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Y trydydd llwybr</title>
  <desc id="desc">Mae Artur heb goron yn cario cadair ac yn rhannu ei stori, tra mae Mali, Nia, Sam, Iwan, Dafi a phobl y dref yn cadw'r cynllun a'r penderfyniadau ar ganol y bwrdd.</desc>
  <rect width="900" height="540" rx="28" fill="#f7f0df"/>
  <path d="M0 0h900v126Q746 94 588 128T282 116 0 139Z" fill="#4d6274"/>
  <text x="450" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="900" fill="#fffaf0">HELPU HEB WNEUD POB PENDERFYNIAD</text>
  <text x="450" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#e5ce91">Y TRYDYDD LLWYBR</text>
  <!-- library -->
  <rect x="40" y="152" width="820" height="330" rx="22" fill="#dfe9e4" stroke="#52695f" stroke-width="8"/>
  <path d="M62 445h775" stroke="#98795e" stroke-width="12"/>
  <rect x="74" y="185" width="145" height="235" rx="8" fill="#8a674e" stroke="#5b4234" stroke-width="6"/>
  <path d="M91 231h112M91 295h112M91 359h112" stroke="#e4c897" stroke-width="7"/>
  <g fill="#b95f4a"><rect x="99" y="196" width="17" height="34"/><rect x="124" y="194" width="20" height="36" fill="#4d7fa0"/><rect x="153" y="200" width="18" height="30" fill="#d0a64d"/></g>
