  <path d="M346 382q161-61 323 0" fill="none" stroke="#e7d3aa" stroke-width="3"/>
  <rect x="422" y="344" width="172" height="68" rx="8" fill="#fffaf0" stroke="#72563c" stroke-width="4"/>
  <text x="508" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="900" fill="#2f6f5f">CYNLLUN Y DREF</text>
