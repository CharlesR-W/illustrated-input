    <circle cx="762" cy="220" r="18" fill="#c88f6c"/><path d="M742 241l-11 47h63l-12-47Z" fill="#6d5961"/>
    <path d="M744 217q18-29 36 0" fill="none" stroke="#d4d0c7" stroke-width="7"/>
    <circle cx="816" cy="225" r="19" fill="#bc7d59"/><path d="M795 247l-12 48h66l-13-48Z" fill="#c49b48"/>
  </g>
  <!-- gold voting marks, weighted to third -->
  <g fill="#d3a648" stroke="#765421" stroke-width="2">
    <circle cx="86" cy="433" r="11"/><circle cx="124" cy="434" r="11"/><circle cx="390" cy="434" r="11"/>
    <circle cx="625" cy="433" r="11"/><circle cx="660" cy="445" r="11"/><circle cx="694" cy="431" r="11"/>
    <circle cx="729" cy="446" r="11"/><circle cx="764" cy="431" r="11"/><circle cx="800" cy="445" r="11"/><circle cx="835" cy="431" r="11"/>
