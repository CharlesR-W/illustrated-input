<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Dewis y gymuned</title>
  <desc id="desc">Mae ymwelwyr yn rhoi marciau aur ar dri chynllun. Mae'r rhan fwyaf wrth y trydydd cynllun, lle mae Artur heb goron yn gwrando ar y gymuned.</desc>
  <rect width="900" height="540" rx="28" fill="#f7f0df"/>
  <path d="M0 0h900v92Q721 66 552 99T238 91 0 112Z" fill="#4d6274"/>
  <text x="450" y="57" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="#fffaf0">BETH YDYCH CHI'N EI DDEWIS?</text>
  <!-- three plan boards -->
  <g stroke="#684b35" stroke-width="7">
    <rect x="45" y="127" width="243" height="279" rx="16" fill="#f1dfb2"/>
    <rect x="328" y="127" width="243" height="279" rx="16" fill="#dce7e8"/>
    <rect x="611" y="127" width="243" height="279" rx="16" fill="#dce9e2"/>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle" font-weight="900" fill="#263746">
    <text x="166" y="163" font-size="21">UN BRENIN</text>
    <text x="449" y="163" font-size="21">HEB ARTUR</text>
    <text x="732" y="163" font-size="21">GYDA'N GILYDD</text>
  </g>
  <!-- plan one -->
  <g stroke="#4a3028" stroke-width="5" stroke-linejoin="round">
    <circle cx="166" cy="229" r="29" fill="#d7a07b"/>
    <path d="M135 228q4-49 32-49 28 0 30 49-17-14-31-9-14-6-31 9Z" fill="#573a2e"/>
    <path d="M136 264l-25 89h112l-26-89Z" fill="#315b70"/>
    <path d="M128 184l7-25 18 16 18-24 17 24 19-16 7 25Z" fill="#d3a648" stroke="#765421"/>
    <circle cx="83" cy="325" r="17" fill="#c88967"/><circle cx="249" cy="325" r="17" fill="#bc7d59"/>
    <path d="M83 306q26-40 54-30M249 306q-26-40-51-29" fill="none" stroke="#8a674e" stroke-dasharray="7 7"/>
  </g>
  <!-- plan two -->
  <g stroke="#4a3028" stroke-width="5" stroke-linejoin="round">
    <rect x="369" y="205" width="160" height="125" fill="#88a69d"/>
    <path d="M358 205l91-55 91 55" fill="#b9553f"/>
    <path d="M433 330v-77h38v77" fill="#604735"/>
    <path d="M381 220h42v42h-42M479 220h39v42h-39" fill="#dce7e8"/>
    <path d="M365 348h169" stroke="#b9553f" stroke-width="13"/>
  </g>
  <text x="449" y="379" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="#8a3f36">Y DRWS AR GAU</text>
  <!-- plan three, shared table -->
  <ellipse cx="732" cy="300" rx="92" ry="42" fill="#b8895f" stroke="#684b35" stroke-width="6"/>
  <rect x="693" y="277" width="78" height="41" rx="5" fill="#fffaf0" stroke="#72563c" stroke-width="3"/>
  <path d="M705 291h54M705 303h54" stroke="#b89d71" stroke-width="4"/>
  <g stroke="#4a3028" stroke-width="4" stroke-linejoin="round">
    <circle cx="650" cy="225" r="20" fill="#d7a07b"/><path d="M628 247l-12 50h68l-13-50Z" fill="#315b70"/>
    <path d="M629 224q3-34 22-34t21 34q-22-12-43 0Z" fill="#573a2e"/>
    <circle cx="708" cy="221" r="19" fill="#d7a07b"/><path d="M687 243l-12 46h66l-13-46Z" fill="#b9553f"/>
