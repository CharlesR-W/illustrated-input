  <path d="M611 462q121 48 243 0" fill="none" stroke="#2f6f5f" stroke-width="7"/>
  <text x="732" y="502" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="900" fill="#2f6f5f">DEWIS Y GYMUNED</text>
  <!-- Dafi holds a mark -->
  <g stroke="#6d3027" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="566" cy="450" r="21" fill="#cf5b3f"/>
