  <title id="title">Croeso i arddangosfa'r gymuned</title>
  <desc id="desc">Mae Mali yn croesawu un ymwelydd a grŵp i'r llyfrgell. Mae Artur, Dafi a Pero wrth wal o fapiau, lluniau ac atgofion.</desc>
