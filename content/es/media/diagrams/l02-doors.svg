<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440"><title>Dos puertas cerradas</title><desc>The reading room door is large and closed. A shorter storage cupboard beside it is also closed. Neither is open in this comparison.</desc><rect width="680" height="440" fill="#fff9eb"/><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#38414b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect x="45" y="90" width="210" height="290" fill="#d0b298" stroke="#524d47" stroke-width="5"/><circle cx="230" cy="230" r="6" fill="#97672c"/><rect x="375" y="165" width="225" height="215" fill="#a7835f" stroke="#524d47" stroke-width="5"/><circle cx="572" cy="260" r="6" fill="#97672c"/><text x="45" y="45">la puerta de la sala</text><text x="390" y="115">el armario</text><text x="55" y="420">cerrada</text><text x="390" y="420">cerrada</text></svg>