<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440"><title>Viejo y nuevo</title><desc>A worn white chair and worn red book contrast with the clean new blue book. The objects retain their established colours.</desc><rect width="680" height="440" fill="#fff9eb"/><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#38414b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><g transform="translate(85,140) scale(1.2)"><path d="M0 0H65V75H0Z" fill="#faf5e6" stroke="#333" stroke-width="4"/><path d="M4 75L42 140M60 75L22 140M4 75L60 92" class="line"/><path d="M10 14L29 18M39 32L59 35M17 54L36 47" stroke="#8e7150" stroke-width="5"/></g><text x="35" y="70">una silla vieja</text><rect x="350" y="125" width="105" height="150" rx="5" fill="#c95147" stroke="#333" stroke-width="4"/><path d="M360 132L370 150L359 175M358 190L370 201M365 250L378 257" fill="none" stroke="#dfc4a0" stroke-width="6"/><rect x="520" y="125" width="105" height="150" rx="5" fill="#386fac" stroke="#333" stroke-width="4"/><path d="M530 133V267" stroke="white" stroke-width="3"/><text x="330" y="335">un libro viejo</text><text x="495" y="385">un libro nuevo</text></svg>