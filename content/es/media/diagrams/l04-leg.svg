<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550"><title>Quitar una pata</title><desc>Ana has removed one table leg; three legs remain attached. The removed leg is passed toward Luis. This is a vocabulary diagram of the first removal, not the final transport.</desc><rect width="680" height="550" fill="#fff9eb"/><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#38414b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><g transform="translate(100,250) scale(0.85)"><path d="M-20 55L-23 130M20 55L23 130" stroke="#354c67" stroke-width="22"/><path d="M-25 -35H25L34 55H-34Z" fill="#dfac43"/><path d="M-21 -25L-32 18L35 35M21 -25L45 35" fill="none" stroke="#bb805d" stroke-width="13" stroke-linecap="round"/><ellipse cx="0" cy="-68" rx="24" ry="29" fill="#bb805d"/><path d="M-24 -73Q-19 -111 20 -86L24 -70Q0 -88 -24 -73" fill="#34302d"/><circle cx="-8" cy="-68" r="2.5"/><circle cx="8" cy="-68" r="2.5"/><path d="M-7 -51Q0 -45 7 -51" class="line"/></g><text x="70" y="394.5">Ana</text><g transform="translate(570,250) scale(0.85)"><path d="M-20 55L-23 130M20 55L23 130" stroke="#354c67" stroke-width="22"/><path d="M-25 -35H25L34 55H-34Z" fill="#31857b"/><path d="M-21 -25L-50 35M21 -25L40 25" fill="none" stroke="#bb805d" stroke-width="13" stroke-linecap="round"/><ellipse cx="0" cy="-68" rx="24" ry="29" fill="#bb805d"/><path d="M-24 -73Q-19 -111 20 -86L24 -70Q0 -88 -24 -73" fill="#34302d"/><circle cx="-8" cy="-68" r="2.5"/><circle cx="8" cy="-68" r="2.5"/><path d="M-7 -51Q0 -45 7 -51" class="line"/></g><text x="540" y="394.5">Luis</text><path d="M210 220H450V240H210Z M235 240H250V425H235Z M405 240H420V425H405Z M325 240H340V410H325Z" fill="#96704c" stroke="#5b4332" stroke-width="2"/><path d="M395 280L400 263L530 282L525 299Z" fill="#96704c" stroke="#5b4332" stroke-width="3"/><path d="M150 310H380L360 294M380 310L360 326" class="line"/><text x="35" y="55">Ana quita una pata.</text><text x="380" y="110">Luis recibe la pata.</text><text x="270" y="485">tres patas</text><text x="480" y="485">una pata</text></svg>