<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480"><title>Escribir, recibir y leer</title><desc>Three separate vocabulary panels show Ana writing on a paper, Luis receiving that paper, and Luis reading it. Arrows mark the transfer; the panels are successive stages, not duplicate simultaneous people.</desc><rect width="680" height="480" fill="#fff9eb"/><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#38414b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><path d="M225 20V390M450 20V390" stroke="#d0bfa5" stroke-width="2"/><text x="25" y="45">Ana escribe.</text><text x="245" y="45">Luis recibe.</text><text x="470" y="45">Luis lee.</text><g transform="translate(105,180) scale(0.68)"><path d="M-20 55L-23 130M20 55L23 130" stroke="#354c67" stroke-width="22"/><path d="M-25 -35H25L34 55H-34Z" fill="#dfac43"/><path d="M-21 -25L-48 30M21 -25L48 30" fill="none" stroke="#bb805d" stroke-width="13" stroke-linecap="round"/><ellipse cx="0" cy="-68" rx="24" ry="29" fill="#bb805d"/><path d="M-24 -73Q-19 -111 20 -86L24 -70Q0 -88 -24 -73" fill="#34302d"/><circle cx="-8" cy="-68" r="2.5"/><circle cx="8" cy="-68" r="2.5"/><path d="M-7 -51Q0 -45 7 -51" class="line"/></g><text x="75" y="295.6">Ana</text><g transform="translate(335,180) scale(0.68)"><path d="M-20 55L-23 130M20 55L23 130" stroke="#354c67" stroke-width="22"/><path d="M-25 -35H25L34 55H-34Z" fill="#31857b"/><path d="M-21 -25L-48 30M21 -25L48 30" fill="none" stroke="#bb805d" stroke-width="13" stroke-linecap="round"/><ellipse cx="0" cy="-68" rx="24" ry="29" fill="#bb805d"/><path d="M-24 -73Q-19 -111 20 -86L24 -70Q0 -88 -24 -73" fill="#34302d"/><circle cx="-8" cy="-68" r="2.5"/><circle cx="8" cy="-68" r="2.5"/><path d="M-7 -51Q0 -45 7 -51" class="line"/></g><text x="305" y="295.6">Luis</text><g transform="translate(565,180) scale(0.68)"><path d="M-20 55L-23 130M20 55L23 130" stroke="#354c67" stroke-width="22"/><path d="M-25 -35H25L34 55H-34Z" fill="#31857b"/><path d="M-21 -25L-48 30M21 -25L48 30" fill="none" stroke="#bb805d" stroke-width="13" stroke-linecap="round"/><ellipse cx="0" cy="-68" rx="24" ry="29" fill="#bb805d"/><path d="M-24 -73Q-19 -111 20 -86L24 -70Q0 -88 -24 -73" fill="#34302d"/><circle cx="-8" cy="-68" r="2.5"/><circle cx="8" cy="-68" r="2.5"/><path d="M-7 -51Q0 -45 7 -51" class="line"/></g><text x="535" y="295.6">Luis</text><rect x="120" y="205" width="70" height="48" fill="white" stroke="#555" stroke-width="2"/><path d="M128 213L168 244" stroke="#6c4540" stroke-width="6"/><path d="M132 228H159M132 238H148" stroke="#555" stroke-width="2"/><rect x="355" y="195" width="70" height="48" fill="white" stroke="#555" stroke-width="2"/><path d="M270 217H350L333 205M350 217L333 229" class="line"/><rect x="580" y="190" width="70" height="55" fill="white" stroke="#555" stroke-width="2"/><path d="M565 135L610 190" stroke="#31857b" stroke-dasharray="5 5" stroke-width="2"/><text x="35" y="435">el papel</text></svg>