<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900"><title>La mesa y la puerta</title><desc>Elena in her red-house home with a bed visible. A high old table has four long legs; a low patio table shares the same ground level in the comparison. Separate vocabulary insets contrast dry and wet paper without depicting the later floor discovery.</desc><rect width="680" height="900" fill="#fff9eb"/><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#38414b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect x="20" y="60" width="630" height="345" fill="#ebdfc8" stroke="#6e5b4d" stroke-width="4"/><rect x="440" y="110" width="170" height="295" fill="#fbf4e4" stroke="#6e5b4d" stroke-width="4"/><text x="30" y="42">Elena vive aquí.</text><g transform="translate(550,275) scale(1)"><path d="M-20 55L-23 130M20 55L23 130" stroke="#354c67" stroke-width="22"/><path d="M-25 -35H25L34 55H-34Z" fill="#934555"/><path d="M-21 -25L-48 30M21 -25L48 30" fill="none" stroke="#bb805d" stroke-width="13" stroke-linecap="round"/><ellipse cx="0" cy="-68" rx="24" ry="29" fill="#bb805d"/><path d="M-24 -73Q-19 -111 20 -86L24 -70Q0 -88 -24 -73" fill="#34302d"/><circle cx="-8" cy="-68" r="2.5"/><circle cx="8" cy="-68" r="2.5"/><path d="M-7 -51Q0 -45 7 -51" class="line"/></g><text x="520" y="438">Elena</text><rect x="340" y="330" width="80" height="30" fill="#cebb9c" stroke="#6e5b4d" stroke-width="2"/><rect x="343" y="316" width="27" height="15" fill="white" stroke="#6e5b4d" stroke-width="2"/><path d="M65 275H315V295H65Z M95 295L65 405H83L112 295 M280 295L315 405H333L297 295 M118 295L95 390H110L136 295 M250 295L275 390H290L267 295" fill="#96704c" stroke="#5b4332" stroke-width="2"/><text x="55" y="250">mesa alta</text><text x="75" y="438">patas largas</text><path d="M20 445H660V560H20Z" fill="#d4c2a6"/><path d="M60 475H270V490H60ZM80 490H94V545H80ZM240 490H254V545H240Z" fill="#96704c"/><text x="300" y="505">mesa baja</text><text x="310" y="550">suelo seco</text><path d="M25 590H655" stroke="#c9b390" stroke-width="2"/><rect x="50" y="640" width="140" height="105" fill="white" stroke="#555" stroke-width="3"/><rect x="400" y="640" width="140" height="105" fill="white" stroke="#555" stroke-width="3"/><path d="M415 685Q450 655 480 690T525 705L520 735H420Z" fill="#76b4d1"/><text x="45" y="790">papel seco</text><text x="395" y="790">papel mojado</text><text x="40" y="855">La mesa no cabe en la puerta.</text><path d="M440 110L465 135V380L440 405Z" fill="#b58b62" stroke="#6e5b4d" stroke-width="3"/><path d="M335 285H425" stroke="#9b3c36" stroke-width="5"/><path d="M370 265L396 306M396 265L370 306" stroke="#9b3c36" stroke-width="5"/></svg>