<svg xmlns="http://www.w3.org/2000/svg" width="680" height="840" viewBox="0 0 680 840"><title>Una cuenta vieja</title><desc>The original fictional notebook page is headed reading room, dated 2019, and lists roof and wall expenditure of 40 and 20, totalling 60. Separate before-and-after repair sketches show a leaking gap covered by a patch. This is evidence of older repairs, not a claim they have just been performed.</desc><rect width="680" height="840" fill="#fff9eb"/><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#38414b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect x="25" y="25" width="630" height="785" rx="5" fill="#f2e3ba" stroke="#765e3e" stroke-width="5"/><path d="M65 25V810" stroke="#765e3e" stroke-width="5"/><text x="105" y="70">cuaderno de Elena</text><text x="105" y="120">sala · 2019</text><text x="105" y="175">cuenta</text><text x="100" y="240">techo</text><text x="485" y="240">$40</text><text x="100" y="305">pared</text><text x="485" y="305">$20</text><path d="M100 330H570" stroke="#765e3e" stroke-width="3"/><text x="485" y="380">$60</text><path d="M110 470H300" stroke="#795d43" stroke-width="8"/><path d="M195 470L205 490L193 510" fill="none" stroke="#795d43" stroke-width="4"/><path d="M200 532Q185 555 200 560Q215 555 200 532" fill="#6caaca" stroke="#41738c" stroke-width="2"/><path d="M335 520H390L375 505M390 520L375 535" class="line"/><path d="M420 470H600" stroke="#795d43" stroke-width="8"/><rect x="470" y="452" width="70" height="35" fill="#a58b66" stroke="#795d43" stroke-width="3"/><path d="M110 650H300M420 650H600" stroke="#795d43" stroke-width="6"/><path d="M175 650L183 674L170 695" class="line"/><rect x="470" y="635" width="65" height="45" fill="#a58b66" stroke="#795d43" stroke-width="3"/><text x="105" y="760">techo · pared</text></svg>