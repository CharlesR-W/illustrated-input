<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640"><title>El agua encima del estante</title><desc>At the discovery, a ceiling crack above the shelf is wet; drops trace down the wall to the shelf. The closed window is farther to the right. This view accompanies the newly observed source.</desc><rect width="680" height="640" fill="#fff9eb"/><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#38414b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect x="30" y="65" width="620" height="450" fill="#e8d8bb" stroke="#6e5b4d" stroke-width="4"/><path d="M30 65H650" stroke="#7d6c53" stroke-width="12"/><path d="M125 65L140 85L126 102" fill="none" stroke="#6b4b3e" stroke-width="4"/><path d="M135 107Q120 130 135 135Q150 130 135 107" fill="#6caaca" stroke="#41738c" stroke-width="2"/><path d="M235 192Q220 215 235 220Q250 215 235 192" fill="#6caaca" stroke="#41738c" stroke-width="2"/><path d="M260 252Q245 275 260 280Q275 275 260 252" fill="#6caaca" stroke="#41738c" stroke-width="2"/><path d="M70 350H300V365H70Z" fill="#8f6c47" stroke="#5b4332" stroke-width="3"/><path d="M90 340Q150 310 210 345L280 350H90Z" fill="#80b7cf"/><rect x="365" y="165" width="230" height="240" fill="#c3d9e5" stroke="#856143" stroke-width="8"/><path d="M480 165V405M365 280H595" stroke="#856143" stroke-width="7"/><text x="40" y="40">techo mojado</text><text x="40" y="185">gota</text><text x="50" y="435">estante mojado</text><text x="330" y="465">ventana cerrada</text><text x="45" y="575">Hay gotas en el techo y la pared.</text></svg>