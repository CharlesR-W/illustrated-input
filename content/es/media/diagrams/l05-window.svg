<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650"><title>La ventana y la lluvia</title><desc>A closed window shows rainfall outside. The wall and a cropped ceiling boundary are labelled, but this view does not depict the leak above the shelf.</desc><rect width="680" height="650" fill="#fff9eb"/><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#38414b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect x="30" y="65" width="620" height="420" fill="#e8d8bb" stroke="#6e5b4d" stroke-width="5"/><path d="M30 65H650" stroke="#7d6c53" stroke-width="12"/><text x="70" y="40">techo</text><rect x="270" y="155" width="300" height="240" fill="#c3d9e5" stroke="#856143" stroke-width="8"/><path d="M420 155V395M270 275H570" stroke="#856143" stroke-width="8"/><path d="M320 190L307 215" stroke="#6b98b0" stroke-width="4"/><path d="M370 230L357 255" stroke="#6b98b0" stroke-width="4"/><path d="M475 195L462 220" stroke="#6b98b0" stroke-width="4"/><path d="M520 325L507 350" stroke="#6b98b0" stroke-width="4"/><path d="M330 330L317 355" stroke="#6b98b0" stroke-width="4"/><path d="M495 245L482 270" stroke="#6b98b0" stroke-width="4"/><text x="65" y="130">pared</text><text x="300" y="445">ventana cerrada</text><text x="300" y="530">lluvia fuera</text><text x="35" y="595">Dentro: pared. Fuera: lluvia.</text></svg>
