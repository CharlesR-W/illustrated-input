<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650"><title>Permiso para entrar</title><desc>Two panels show Elena’s mother asking from outside an open door; Ana grants permission with Sí; the mother then enters.</desc><rect width="680" height="650" rx="10" fill="#fff9eb"/><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#7a796b;stroke-width:3}</style><rect x="350" y="65" width="200" height="240" fill="#e8d8bb" stroke="#6e5b4d" stroke-width="5"/><path d="M350 65L310 100V305H350" fill="#b7966c"/><g transform="translate(180 160) scale(1)"><circle cx="0" cy="0" r="21" fill="#b98563"/><path d="M-21 -4Q-20 -35 3 -24Q25 -20 21 -2Q0 -20 -21 -4" fill="#554438"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#4b3425" stroke-width="2"/><path d="M-18 25L-35 75H35L18 25Z" fill="#795b86"/><path d="M-21 75L-25 112H-6L0 82L6 112H25L21 75" fill="#435865"/><path d="M-20 31L-45 62M20 31L45 62" stroke="#b98563" stroke-width="12" stroke-linecap="round"/><text x="0" y="145" text-anchor="middle">madre</text></g><g transform="translate(460 160) scale(1)"><circle cx="0" cy="0" r="21" fill="#b98563"/><path d="M-21 -4Q-20 -35 3 -24Q25 -20 21 -2Q0 -20 -21 -4" fill="#554438"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#4b3425" stroke-width="2"/><path d="M-18 25L-35 75H35L18 25Z" fill="#678974"/><path d="M-21 75L-25 112H-6L0 82L6 112H25L21 75" fill="#435865"/><path d="M-20 31L-45 62M20 31L45 62" stroke="#b98563" stroke-width="12" stroke-linecap="round"/><text x="0" y="180" text-anchor="middle">Ana</text></g><text x="65" y="75">¿Entro? ¿Permiso?</text><text x="450" y="115">Sí.</text><path d="M245 370H430L410 355M430 370L410 385" fill="none" stroke="#38414b" stroke-width="5"/><text x="340" y="460" text-anchor="middle">La madre tiene permiso.</text><text x="340" y="515" text-anchor="middle">La madre entra.</text></svg>
