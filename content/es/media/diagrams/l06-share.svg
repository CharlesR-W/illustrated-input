<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800"><title>La llave y los turnos</title><desc>Two reading turns in the same room, Ana then the mother, are shown separately. A key passes from Elena to the mother and returns to the black chair, not to a private house.</desc><rect width="680" height="800" rx="10" fill="#fff9eb"/><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#7a796b;stroke-width:3}</style><text x="340" y="45" text-anchor="middle">turno de Ana</text><rect x="60" y="80" width="560" height="230" fill="#e8d8bb"/><g transform="translate(250 130) scale(0.8)"><circle cx="0" cy="0" r="21" fill="#b98563"/><path d="M-21 -4Q-20 -35 3 -24Q25 -20 21 -2Q0 -20 -21 -4" fill="#554438"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#4b3425" stroke-width="2"/><path d="M-18 25L-35 75H35L18 25Z" fill="#678974"/><path d="M-21 75L-25 112H-6L0 82L6 112H25L21 75" fill="#435865"/><path d="M-20 31L-45 62M20 31L45 62" stroke="#b98563" stroke-width="12" stroke-linecap="round"/><text x="0" y="145" text-anchor="middle" style="font-size:36px">Ana</text></g><rect x="225" y="170" width="50" height="35" fill="#467ca6" stroke="#24323d" stroke-width="2"/><text x="340" y="365" text-anchor="middle">turno de la madre</text><rect x="60" y="395" width="560" height="230" fill="#e8d8bb"/><g transform="translate(250 445) scale(0.8)"><circle cx="0" cy="0" r="21" fill="#b98563"/><path d="M-21 -4Q-20 -35 3 -24Q25 -20 21 -2Q0 -20 -21 -4" fill="#554438"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#4b3425" stroke-width="2"/><path d="M-18 25L-35 75H35L18 25Z" fill="#795b86"/><path d="M-21 75L-25 112H-6L0 82L6 112H25L21 75" fill="#435865"/><path d="M-20 31L-45 62M20 31L45 62" stroke="#b98563" stroke-width="12" stroke-linecap="round"/><text x="0" y="145" text-anchor="middle" style="font-size:36px">madre</text></g><rect x="225" y="485" width="50" height="35" fill="#f9f8ef" stroke="#24323d" stroke-width="2"/><path d="M470 440V530H550V560M470 530V560" fill="none" stroke="#323b46" stroke-width="10"/><circle cx="505" cy="495" r="10" fill="none" stroke="#9d8c56" stroke-width="5"/><path d="M515 495H545V505" fill="none" stroke="#9d8c56" stroke-width="5"/><text x="340" y="700" text-anchor="middle">Elena comparte la llave.</text><text x="340" y="750" text-anchor="middle">La llave está en la sala.</text></svg>
