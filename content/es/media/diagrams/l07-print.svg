<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600"><title>El papel grande y el cartel pequeño</title><desc>The same unnamed visitor’s large-paper reading and small-print difficulty are contrasted. Tiny print is deliberately the story obstacle, while all explanatory labels remain large; not Rosa. </desc><rect width="680" height="600" fill="#fff9eb"/><style>text{font:30px sans-serif;fill:#24323d}.line{stroke:#58636a;stroke-width:3;fill:none}</style><rect x="35" y="50" width="280" height="230" rx="7" fill="#fffef8" stroke="#807665" stroke-width="3"/><rect x="420" y="50" width="180" height="150" rx="7" fill="#fffef8" stroke="#807665" stroke-width="3"/><text x="70" y="135" style="font-size:64px">ocho</text><text x="70" y="210" style="font-size:64px">nueve</text><text x="455" y="130" style="font-size:28px">ocho</text><text x="455" y="175" style="font-size:28px">nueve</text><text x="70" y="330" style="font-size:32px">lee</text><text x="440" y="330" style="font-size:32px">no lee</text><g transform="translate(185 400) scale(1.0)"><circle cx="0" cy="0" r="16" fill="#bd8b67"/><path d="M-16 -3Q-13 -29 13 -12L16 -3Q0 -12 -16 -3" fill="#4d3b32"/><path d="M-12 22L-24 67H24L12 22Z" fill="#a8bfa3"/><path d="M-12 67V98M12 67V98" stroke="#38485b" stroke-width="14"/><path d="M-12 27L-29 56M12 27L29 56" stroke="#bd8b67" stroke-width="9" stroke-linecap="round"/></g><text x="270" y="455" style="font-size:32px">ocho · nueve</text><text x="270" y="510" style="font-size:30px">grande / pequeño</text></svg>
