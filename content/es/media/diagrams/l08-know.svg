<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280"><title>Saber un nombre</title><desc>Immediately visible inline English meaning cues distinguish knowing a name from saying it: Elena knows my name, and I know.</desc><rect width="680" height="280" rx="10" fill="#fff9eb"/><style>text{font:30px sans-serif;fill:#24323d}</style><text x="340" y="55" text-anchor="middle">Elena sabe mi nombre.</text><text x="340" y="105" text-anchor="middle">Elena knows my name.</text><path d="M60 140H620" stroke="#8d9b90" stroke-width="2"/><text x="340" y="205" text-anchor="middle">sé — I know</text></svg>
