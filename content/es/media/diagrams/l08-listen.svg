<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610"><title>La voz y el libro</title><desc>Luis reads while Rosa keeps the open book in her own hands. Sound curves travel toward Rosa. The book does not pass to Luis.</desc><rect width="680" height="610" rx="10" fill="#fff9eb"/><style>text{font:30px sans-serif;fill:#24323d}.line{fill:none;stroke:#6a7478;stroke-width:3;stroke-linecap:round}</style><g transform="translate(190 170)"><circle cx="0" cy="0" r="23" fill="#b98563"/><path d="M-23 -3Q-21 -34 4 -26Q28 -20 23 -1Q0 -18 -23 -3" fill="#504037"/><circle cx="-8" cy="0" r="2.5"/><circle cx="8" cy="0" r="2.5"/><path d="M-7 10Q0 15 8 10" fill="none" stroke="#513c2e" stroke-width="2"/><path d="M-20 28L-38 87H38L20 28Z" fill="#ae8c48"/><path d="M-25 87L-28 127H-7L0 95L7 127H28L25 87" fill="#435865"/><path d="M-22 35L-45 71M22 35L45 71" stroke="#b98563" stroke-width="13" stroke-linecap="round"/><text x="0" y="165" text-anchor="middle">Luis</text></g><g transform="translate(490 170)"><circle cx="0" cy="0" r="23" fill="#b98563"/><path d="M-23 -3Q-21 -34 4 -26Q28 -20 23 -1Q0 -18 -23 -3" fill="#9c9c91"/><circle cx="-8" cy="0" r="2.5"/><circle cx="8" cy="0" r="2.5"/><path d="M-7 10Q0 15 8 10" fill="none" stroke="#513c2e" stroke-width="2"/><path d="M-20 28L-38 87H38L20 28Z" fill="#81618c"/><path d="M-25 87L-28 127H-7L0 95L7 127H28L25 87" fill="#435865"/><path d="M-22 35L-45 71M22 35L45 71" stroke="#b98563" stroke-width="13" stroke-linecap="round"/><text x="0" y="165" text-anchor="middle">Rosa</text></g><path d="M425 220Q457.5 208 490.0 220Q522.5 208 555 220V300Q522.5 288 490.0 300Q457.5 288 425 300Z" fill="#fffef6" stroke="#826b51" stroke-width="4"/><path d="M490.0 220V300" stroke="#826b51" stroke-width="3"/><path class="line" d="M220 156Q330 100 449 154M235 184Q330 135 449 182"/><text x="340" y="83" text-anchor="middle">voz de Luis</text><text x="340" y="440" text-anchor="middle">Luis lee en voz alta.</text><text x="340" y="495" text-anchor="mid