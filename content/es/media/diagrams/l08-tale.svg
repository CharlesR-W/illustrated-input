<svg xmlns="http://www.w3.org/2000/svg" width="680" height="750" viewBox="0 0 680 750"><title>El cuento y su historia</title><desc>The printed fictional tale contains a sequence: a cat waits outside a closed house, then enters after a person opens the door. This is explicitly separate from the courtyard cat.</desc><rect width="680" height="750" rx="10" fill="#fff9eb"/><style>text{font:40px sans-serif;fill:#24323d}.line{fill:none;stroke:#6a7478;stroke-width:3;stroke-linecap:round}</style><text x="340" y="45" text-anchor="middle">cuento del libro</text><rect x="35" y="75" width="610" height="560" rx="8" fill="#fffef6" stroke="#826b51" stroke-width="5"/><text x="340" y="130" text-anchor="middle">historia del gato</text><rect x="380" y="190" width="170" height="170" fill="#e4d5b3" stroke="#826b51" stroke-width="5"/><circle cx="520" cy="280" r="5" fill="#826b51"/><g transform="translate(170 300) scale(1.5)"><path d="M-25 30V-8L-16 -30L0 -10L16 -30L25 -8V30Z" fill="#8b9191" stroke="#42535c" stroke-width="3"/><circle cx="-10" cy="0" r="3"/><circle cx="10" cy="0" r="3"/><path d="M-4 12H4M0 12V20" stroke="#42535c" stroke-width="2"/></g><text x="210" y="410" text-anchor="middle">fuera</text><path class="line" d="M335 450V505M320 490L335 505L350 490"/><path d="M390 475L440 495V600H390Z" fill="#b7966c"/><g transform="translate(510 555) scale(1.2)"><path d="M-25 30V-8L-16 -30L0 -10L16 -30L25 -8V30Z" fill="#8b9191" stroke="#42535c" stroke-width="3"/><circle cx="-10" cy="0" r="3"/><circle cx="10" cy="0" r="3"/><path d="M-4 12H4M0 12V20" stroke="#42535c" stroke-width="2"/></g><text x="210" y="570" text-anchor="middle">dentro</text><text x="340" y="700" text-anchor="middle">No es el gato de la caja.</text></svg>
