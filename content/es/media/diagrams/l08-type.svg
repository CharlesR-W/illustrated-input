<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900"><title>Rosa quiere leer</title><desc>Rosa asks to read at the open room. A separate close view labels a page and an individual printed letter. Gray strokes represent tiny print while domingo is legibly large; no learner label is miniature.</desc><rect width="680" height="900" rx="10" fill="#fff9eb"/><style>text{font:30px sans-serif;fill:#24323d}.line{fill:none;stroke:#6a7478;stroke-width:3;stroke-linecap:round}</style><rect x="390" y="100" width="190" height="230" fill="#e8d8bb" stroke="#7c6247" stroke-width="5"/><path d="M390 100L345 130V330H390" fill="#b7966c"/><g transform="translate(190 155)"><circle cx="0" cy="0" r="23" fill="#b98563"/><path d="M-23 -3Q-21 -34 4 -26Q28 -20 23 -1Q0 -18 -23 -3" fill="#9c9c91"/><circle cx="-8" cy="0" r="2.5"/><circle cx="8" cy="0" r="2.5"/><path d="M-7 10Q0 15 8 10" fill="none" stroke="#513c2e" stroke-width="2"/><path d="M-20 28L-38 87H38L20 28Z" fill="#81618c"/><path d="M-25 87L-28 127H-7L0 95L7 127H28L25 87" fill="#435865"/><path d="M-22 35L-45 71M22 35L45 71" stroke="#b98563" stroke-width="13" stroke-linecap="round"/><text x="0" y="165" text-anchor="middle">Rosa</text></g><rect x="145" y="195" width="95" height="55" fill="#d5b36d" stroke="#826b51" stroke-width="3"/><path class="line" d="M70 35H355V95H235L210 125L210 95H70Z"/><text x="93" y="76">Quiero leer aquí.</text><text x="484" y="365" text-anchor="middle">sala</text><text x="340" y="405" text-anchor="middle">Quiero leer: I want to read.</text><path class="line" d="M40 425H640"/><path d="M70 490Q137.5 478 205.0 490Q272.5 478 340 490V655Q272.5 643 205.0 655Q137.5 643 70 655Z" fill="#fffef6" stroke="#826b51" stroke-width="4"/><path d="M205.0 490V655" stroke="#826b51" stroke-width="3"/><text x="88" y="455">página</text><path class="line" d="M150 465L163 503"/><text x="495" y="520" text-anchor="middle" style="font-size:48px">domingo</text><text x="495" y="580" text-anchor="middle">letras gran