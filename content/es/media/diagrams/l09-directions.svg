<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450"><title>Recto, izquierda y derecha</title><desc>A forward-pointing traveller arrow establishes orientation at a junction; straight is ahead, left to its left, right to its right. The traveller is represented by an orientation arrow, not a character.</desc><rect width="680" height="450" rx="10" fill="#fff9eb"/><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:40px sans-serif;fill:#24323d}.line{fill:none;stroke:#526978;stroke-width:4}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}</style><text x="340" y="48" text-anchor="middle">en la esquina</text><path d="M340 420V205M60 205H620" fill="none" stroke="#e1d5b9" stroke-width="85"/><path class="arrow" d="M340 400V145"/><path class="arrow" d="M310 205H100"/><path class="arrow" d="M370 205H580"/><text x="340" y="105" text-anchor="middle">recto</text><text x="35" y="320">izquierda</text><text x="465" y="320">derecha</text><path d="M320 370L340 340L360 370Z" fill="#647e8b"/></svg>
