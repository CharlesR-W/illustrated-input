<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420"><title>Los libros vuelven a la biblioteca</title><desc>The library’s book travels to a house today and back to the library on Saturday. The same coloured book stays associated with the library at both ends; this is the original fictional arrangement, not a real library policy.</desc><rect width="680" height="420" rx="10" fill="#fff9eb"/><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:40px sans-serif;fill:#24323d}.line{fill:none;stroke:#526978;stroke-width:4}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}</style><rect x="25" y="105" width="225" height="170" fill="#e5c68f" stroke="#776a55" stroke-width="4"/><text x="137" y="82" text-anchor="middle">biblioteca</text><path d="M50 155H225M50 210H225" stroke="#776a55" stroke-width="8"/><rect x="65" y="125" width="30" height="28" fill="#be6a58"/><rect x="115" y="125" width="30" height="28" fill="#769d73"/><rect x="165" y="125" width="30" height="28" fill="#6e9cba"/><rect x="445" y="137" width="150" height="110" fill="#d9e3e7" stroke="#766550" stroke-width="4"/><path d="M475 137L520 110L565 137" fill="#a9755e"/><text x="520" y="294" text-anchor="middle">casa</text><path class="arrow" d="M270 145Q350 70 425 145"/><text x="345" y="42" text-anchor="middle">hoy</text><rect x="330" y="105" width="42" height="48" fill="#be6a58" stroke="#5a4337" stroke-width="3"/><path class="arrow" d="M425 235Q350 320 270 235"/><rect x="330" y="250" width="42" height="48" fill="#be6a58" stroke="#5a4337" stroke-width="3"/><text x="345" y="372" text-anchor="middle">sábado</text></svg>
