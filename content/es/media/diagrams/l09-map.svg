<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760"><title>El camino del patio a la biblioteca</title><desc>Fictional map only. The route starts at the bottom patio, goes north to the white-house corner, left west to the blue-house corner, then right north to the library. Two circled corners are labelled esquinas.</desc><rect width="680" height="760" rx="10" fill="#fff9eb"/><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#526978;stroke-width:4}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}</style><text x="340" y="40" text-anchor="middle">mapa del camino</text><path d="M500 600V340H170V130" fill="none" stroke="#e1d5b9" stroke-width="70"/><path d="M500 600V340H170V130" fill="none" stroke="#b96555" stroke-width="7"/><path class="arrow" d="M500 580V385"/><path class="arrow" d="M460 340H235"/><path class="arrow" d="M170 295V165"/><rect x="425" y="605" width="150" height="65" fill="#d0b982" stroke="#5e5b4f" stroke-width="3"/><text x="500" y="648" text-anchor="middle">patio</text><rect x="540" y="270" width="100" height="100" fill="#fff" stroke="#7f7566" stroke-width="4"/><text x="495" y="230">casa</text><text x="495" y="262">blanca</text><rect x="40" y="330" width="85" height="100" fill="#6f9fbb" stroke="#7f7566" stroke-width="4"/><text x="40" y="475">casa azul</text><rect x="70" y="75" width="200" height="65" fill="#e5c68f" stroke="#7f7566" stroke-width="4"/><text x="170" y="116" text-anchor="middle">biblioteca</text><circle cx="500" cy="340" r="15" fill="#fff" stroke="#384b57" stroke-width="4"/><circle cx="170" cy="340" r="15" fill="#fff" stroke="#384b57" stroke-width="4"/><text x="330" y="430">esquinas</text><path class="line" d="M380 385L490 352M335 385L180 352"/><text x="340" y="715" text-anchor="middle">del patio a la biblioteca</text></svg>
