<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530"><title>Un libro de letras grandes</title><desc>The same El gato title appears on Rosa’s small-print book and the library’s larger-print copy. The left book’s dense lines are intentionally unreadable representations of tiny body print; all meaning labels remain large. The right body text is readable.</desc><rect width="680" height="530" rx="10" fill="#fff9eb"/><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#526978;stroke-width:4}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}</style><text x="340" y="42" text-anchor="middle">El gato · el mismo cuento</text><rect x="35" y="95" width="250" height="230" fill="#fff" stroke="#a28d6c" stroke-width="5"/><text x="160" y="132" text-anchor="middle">libro de Rosa</text><text x="160" y="175" text-anchor="middle" style="font-size:28px">El gato</text><path d="M65 210H250M65 226H240M65 242H250M65 258H225M65 274H245M65 290H240" stroke="#3b4550" stroke-width="3"/><rect x="340" y="95" width="305" height="330" fill="#fff" stroke="#a28d6c" stroke-width="5"/><text x="493" y="132" text-anchor="middle">libro de la biblioteca</text><text x="493" y="190" text-anchor="middle" style="font-size:40px">El gato</text><text x="493" y="265" text-anchor="middle" style="font-size:32px">El gato busca</text><text x="493" y="315" text-anchor="middle" style="font-size:32px">una casa.</text><text x="160" y="380" text-anchor="middle">letras pequeñas</text><text x="493" y="475" text-anchor="middle">letras grandes</text></svg>
