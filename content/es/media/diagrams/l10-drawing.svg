<svg xmlns="http://www.w3.org/2000/svg" width="680" height="840" viewBox="0 0 680 840"><title>Un dibujo en el libro rojo</title><desc>An open red storybook contains a pen drawing of a cat outside a closed house door, captioned La casa.</desc><rect width="680" height="840" fill="#fff9eb"/><style>text{font:30px sans-serif;fill:#24323d}.line{stroke:#58636a;stroke-width:3;fill:none}</style><path d="M40 75Q190 35 340 75Q490 35 640 75V465Q490 430 340 470Q190 430 40 465Z" fill="#fffef6" stroke="#b66a57" stroke-width="12"/><path d="M340 75V470" stroke="#b9aa91" stroke-width="3"/><rect x="105" y="120" width="150" height="240" fill="#d4c3a3" stroke="#64574d" stroke-width="5"/><circle cx="230" cy="245" r="7" fill="#64574d"/><g transform="translate(440 325) scale(1.7)"><path d="M-25 20Q-30 -10 -20 -24L-7 -12L10 -25L23 -10Q32 15 14 28Z" fill="#aeb7ad" stroke="#5d685f" stroke-width="3"/><circle cx="-8" cy="0" r="3" fill="#24323d"/><circle cx="8" cy="0" r="3" fill="#24323d"/><path d="M15 24Q49 43 44 9" fill="none" stroke="#5d685f" stroke-width="6"/></g><text x="365" y="140" style="font-size:32px">dibujo = drawing</text><text x="110" y="415" style="font-size:32px">La casa</text><text x="40" y="550" style="font-size:30px">Me gusta = I like.</text><text x="40" y="605" style="font-size:30px">No me gusta = I do not like.</text><text x="40" y="660" style="font-size:30px">Prefiero = I prefer.</text><text x="40" y="715" style="font-size:30px">¿Por qué? = Why?</text><text x="40" y="770" style="font-size:30px">Porque = because.</text></svg>
