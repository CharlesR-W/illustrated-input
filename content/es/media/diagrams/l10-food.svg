<svg xmlns="http://www.w3.org/2000/svg" width="680" height="735" viewBox="0 0 680 735"><title>Pan, café y fruta</title><desc>A fictional serving scene shows bread and ripe fruit; one coffee is plain and labelled bitter, the other has visible sugar cubes and is labelled sweet. Books stay outside the serving area.</desc><rect width="680" height="735" fill="#fff9eb"/><style>text{font:30px sans-serif;fill:#24323d}.line{stroke:#58636a;stroke-width:3;fill:none}</style><rect x="30" y="355" width="620" height="55" rx="7" fill="#ba9765"/><path d="M80 410V590M600 410V590" stroke="#8a704a" stroke-width="18"/><path d="M65 205H215L195 340H85Z" fill="#e9d6c3" stroke="#756153" stroke-width="4"/><ellipse cx="140" cy="208" rx="75" ry="18" fill="#4b3025"/><path d="M215 230Q265 225 245 280L210 290" fill="none" stroke="#756153" stroke-width="10"/><text x="60" y="80" style="font-size:30px">café amargo</text><text x="60" y="115" style="font-size:30px">bitter coffee</text><text x="395" y="115" style="font-size:30px">sweet coffee</text><path d="M400 205H550L530 340H420Z" fill="#e9d6c3" stroke="#756153" stroke-width="4"/><ellipse cx="475" cy="208" rx="75" ry="18" fill="#6d4931"/><path d="M550 230Q600 225 580 280L545 290" fill="none" stroke="#756153" stroke-width="10"/><text x="395" y="80" style="font-size:30px">café dulce</text><rect x="445" y="140" width="27" height="27" rx="3" fill="#fff" stroke="#aaa69d" stroke-width="2"/><rect x="485" y="160" width="27" height="27" rx="3" fill="#fff" stroke="#aaa69d" stroke-width="2"/><rect x="525" y="130" width="27" height="27" rx="3" fill="#fff" stroke="#aaa69d" stroke-width="2"/><path d="M65 500Q80 440 210 455Q275 470 260 535Q140 565 65 540Z" fill="#c28f4e" stroke="#87613b" stroke-width="4"/><path d="M110 474L130 500M160 464L180 496M210 476L228 505" stroke="#eed1a0" stroke-width="8"/><text x="125" y="615" style="font-size:32px">pan</text><path d="M410 470Q470 565 575 475Q530 605 410 500Z" fill="#efd363" stroke="#aa8c3a" stroke-width="4"/><circle cx="405" cy="535" r="35" fill="#d48950" stroke="#95613b" stroke-width="3"/><text x="385" y="615" style="font-size:30px">fruta dulce</text><text x="40" y="690" style="font-size:30px">pan = bread; fruta = fruit</text></svg>
