<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570"><title>Siempre y nunca</title><desc>Three successive numbered occasions all have check marks for siempre and none have a check for nunca; written sí/no reinforces occurrence versus nonoccurrence without relying only on colour.</desc><rect width="680" height="570" rx="10" fill="#fff9eb"/><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:40px sans-serif;fill:#24323d}.line{fill:none;stroke:#526978;stroke-width:4}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}</style><text x="170" y="55" text-anchor="middle">siempre</text><text x="510" y="55" text-anchor="middle">nunca</text><rect x="30" y="100" width="280" height="100" rx="8" fill="#e9ead5"/><rect x="370" y="100" width="280" height="100" rx="8" fill="#efe0d7"/><text x="55" y="157">1</text><text x="395" y="157">1</text><path d="M135 140L160 165L210 120" fill="none" stroke="#507c58" stroke-width="9"/><path d="M475 125L525 170M525 125L475 170" stroke="#a36455" stroke-width="9"/><rect x="30" y="230" width="280" height="100" rx="8" fill="#e9ead5"/><rect x="370" y="230" width="280" height="100" rx="8" fill="#efe0d7"/><text x="55" y="287">2</text><text x="395" y="287">2</text><path d="M135 270L160 295L210 250" fill="none" stroke="#507c58" stroke-width="9"/><path d="M475 255L525 300M525 255L475 300" stroke="#a36455" stroke-width="9"/><rect x="30" y="360" width="280" height="100" rx="8" fill="#e9ead5"/><rect x="370" y="360" width="280" height="100" rx="8" fill="#efe0d7"/><text x="55" y="417">3</text><text x="395" y="417">3</text><path d="M135 400L160 425L210 380" fill="none" stroke="#507c58" stroke-width="9"/><path d="M475 385L525 430M525 385L475 430" stroke="#a36455" stroke-width="9"/><text x="170" y="530" text-anchor="middle">sí · sí · sí</text><text x="510" y="530" text-anchor="middle">no · no · no</text></svg