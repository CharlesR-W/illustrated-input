<svg xmlns="http://www.w3.org/2000/svg" width="680" height="665" viewBox="0 0 680 665"><title>Una carta y una firma</title><desc>The letter is addressed to Elena and asks who opens the room, followed by a wish to talk. A separate identifying cursive flourish is labelled firma; it is deliberately unreadable and supplies no new sender name. The envelope distinguishes a delivered message from the timetable or account.</desc><rect width="680" height="665" rx="10" fill="#fff9eb"/><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#526978;stroke-width:4}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}</style><text x="340" y="45" text-anchor="middle">carta = letter</text><path d="M35 115L130 70H230L325 115V295H35Z" fill="#e4d7b7" stroke="#8a7759" stroke-width="4"/><path d="M35 115L180 210L325 115M35 295L145 190M325 295L215 190" fill="none" stroke="#8a7759" stroke-width="3"/><rect x="155" y="175" width="470" height="445" fill="#fff" stroke="#9b896c" stroke-width="4"/><text x="195" y="235" style="font-size:32px">Elena.</text><text x="195" y="300" style="font-size:32px">¿Quién abre la sala?</text><text x="195" y="360" style="font-size:32px">Quiero hablar.</text><path d="M205 505Q230 435 250 495Q265 535 278 480Q290 455 306 500Q320 520 335 485Q360 460 375 510M200 525Q305 485 405 525" fill="none" stroke="#3f4850" stroke-width="5"/><path d="M425 500H490" stroke="#61727c" stroke-width="3"/><text x="505" y="510">firma</text><text x="465" y="552">signature</text></svg>
