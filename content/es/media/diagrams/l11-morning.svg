<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1010" viewBox="0 0 680 1010"><title>Antes de ir al patio</title><desc>Elena wakes in bed, rises, washes her own hands, and puts a shirt over fully clothed base clothes at home. The opening at seven contrasts with her early five-o’clock start.</desc><rect width="680" height="1010" rx="10" fill="#fff9eb"/><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:28px sans-serif;fill:#24323d}.line{fill:none;stroke:#526978;stroke-width:4}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}</style><text x="340" y="40" text-anchor="middle">temprano (early) · cinco</text><rect x="20" y="65" width="310" height="320" rx="8" fill="#eadfc7"/><rect x="350" y="65" width="310" height="320" rx="8" fill="#eadfc7"/><rect x="20" y="410" width="310" height="320" rx="8" fill="#eadfc7"/><rect x="350" y="410" width="310" height="320" rx="8" fill="#eadfc7"/><circle cx="90" cy="125" r="25" fill="#bf9475"/><path d="M75 125H85M95 125H105" stroke="#47372b" stroke-width="3"/><path class="arrow" d="M130 125H170"/><circle cx="220" cy="125" r="25" fill="#bf9475"/><ellipse cx="210" cy="125" rx="5" ry="8" fill="#fff"/><ellipse cx="230" cy="125" rx="5" ry="8" fill="#fff"/><circle cx="210" cy="125" r="3"/><circle cx="230" cy="125" r="3"/><rect x="55" y="185" width="230" height="105" fill="#fff" stroke="#a49575" stroke-width="5"/><circle cx="105" cy="220" r="24" fill="#bf9475"/><path d="M80 217Q100 180 130 217" fill="#554438"/><circle cx="97" cy="219" r="2"/><circle cx="112" cy="219" r="2"/><rect x="140" y="190" width="145" height="100" fill="#a9bdc2"/><text x="175" y="352" text-anchor="middle">se despierta</text><g transform="translate(510 165) scale(1.1)"><circle r="21" fill="#bf9475"/><path d="M-21 -4Q-20 -35 3 -24Q25 -20 21 -2Q0 -20 -21 -4" fill="#554438"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#4b3425" stroke-width="2"/><path d="M-18 25L-35 75H35L18 25Z" fill="#a8bac6"/><path d="M-21 75L-25 112H-6L0 82L6 112H25L21 75" fill="#435865"/><path d="M-20 31L-45 62M20 31L45 62" stroke="#bf9475" stroke-width="12" stroke-linecap="round"/></g><text x="505" y="352" text-anchor="middle">se levanta</text><g transform="translate(155 485) scale(1)"><circle r="21" fill="#bf9475"/><path d="M-21 -4Q-20 -35 3 -24Q25 -20 21 -2Q0 -20 -21 -4" fill="#554438"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#4b3425" stroke-width="2"/><path d="M-18 25L-35 75H35L18 25Z" fill="#b47761"/><path d="M-21 75L-25 112H-6L0 82L6 112H25L21 75" fill="#435865"/><path d="M-20 31L-45 62M20 31L45 62" stroke="#bf9475" stroke-width="12" stroke-linecap="round"/></g><path d="M115 555H220V585H115Z" fill="#c8d8de" stroke="#617784" stroke-width="4"/><path d="M185 480V520H165" fill="none" stroke="#617784" stroke-width="7"/><path d="M165 520V550" stroke="#6da4b7" stroke-width="5"/><text x="175" y="695" text-anchor="middle">se lava las manos</text><g transform="translate(510 485) scale(1)"><circle r="21" fill="#bf9475"/><path d="M-21 -4Q-20 -35 3 -24Q25 -20 21 -2Q0 -20 -21 -4" fill="#554438"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#4b3425" stroke-width="2"/><path d="M-18 25L-35 75H35L18 25Z" fill="#f1e6d0"/><path d="M-21 75L-25 112H-6L0 82L6 112H25L21 75" fill="#435865"/><path d="M-20 31L-45 62M20 31L45 62" stroke="#bf9475" stroke-width="12" stroke-linecap="round"/></g><path d="M465 510L480 490H540L555 510L540 530V590H480V530Z" fill="#b47761" stroke="#855843" stroke-width="3"/><text x="505" y="650" text-anchor="middle">ropa</text><text x="505" y="695" text-anchor="middle">se pone la ropa</text><path class="arrow" d="M300 220H360"/><path class="arrow" d="M505 392V397H175V430"/><path class="arrow" d="M300 565H360"/><text x="340" y="785" text-anchor="middle">Antes de ir al patio.</text><text x="340" y="835" text-anchor="middle">La sala abre a las siete.</text><circle cx="610" cy="820" r="17" fill="#d3a246"/><path d="M610 788V798M610 842V852M578 820H588M632 820H642M587 797L594 804M626 836L633 843M633 797L626 804M594 836L587 843" stroke="#d3a246" stroke-width="4"/><text x="340" y="895" text-anchor="middle">Después: al patio.</text><text x="175" y="380" text-anchor="middle">wakes up</text><text x="505" y="380" text-anchor="middle">gets up</text><text x="175" y="725" text-anchor="middle">washes her hands</text><text x="505" y="725" text-anchor="middle">puts on her clothes</text><text x="340" y="970" text-anchor="middle">antes = before; después = after</text></svg>
