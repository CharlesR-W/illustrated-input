<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460"><title>Pronto abre la sala</title><desc>A moment shortly before seven leads toward the imminent seven-o’clock opening, providing a relative-time example of pronto distinct from the early five-o’clock start.</desc><rect width="680" height="460" rx="10" fill="#fff9eb"/><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:40px sans-serif;fill:#24323d}.line{fill:none;stroke:#526978;stroke-width:4}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}</style><text x="340" y="45" text-anchor="middle">pronto</text><circle cx="170" cy="190" r="105" fill="#fff" stroke="#63747b" stroke-width="5"/><path d="M170 190L130 120M170 190L145 240" stroke="#63747b" stroke-width="7"/><text x="170" y="350" text-anchor="middle">6:55</text><path class="arrow" d="M310 190H390"/><circle cx="520" cy="190" r="105" fill="#fff" stroke="#63747b" stroke-width="5"/><path d="M520 190V110M520 190L490 240" stroke="#63747b" stroke-width="7"/><text x="520" y="350" text-anchor="middle">7:00</text><text x="340" y="425" text-anchor="middle">La sala abre pronto.</text></svg>
