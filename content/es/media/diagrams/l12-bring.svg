<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700"><title>La madre trae el libro de la biblioteca</title><desc>Elena’s mother brings the separately kept library copy open at its first page from her dry house to Rosa at the doorway. It has no price card and is not one of the private books for sale.</desc><rect width="680" height="700" fill="#fff9eb"/><style>text{font:30px sans-serif;fill:#24323d}.line{stroke:#647179;stroke-width:3;fill:none;stroke-linecap:round}</style><rect x="45" y="65" width="280" height="455" fill="#e8d8bb" stroke="#826b51" stroke-width="6"/><path d="M325 65L365 100V520H325" fill="#b7966c"/><g transform="translate(220 190) scale(1.2)"><circle cx="0" cy="0" r="21" fill="#b98563"/><path d="M-21 -3Q-22 -33 5 -25Q26 -20 21 -1Q0 -16 -21 -3" fill="#9c9c91"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#513c2e" stroke-width="2"/><path d="M-18 28L-34 85H34L18 28Z" fill="#bf7c5d"/><path d="M-22 85L-24 125H-7L0 96L7 125H24L22 85" fill="#435865"/><path d="M-20 35L-42 72M20 35L42 72" stroke="#b98563" stroke-width="12" stroke-linecap="round"/></g><g transform="translate(525 270) scale(1.2)"><circle cx="0" cy="0" r="21" fill="#b98563"/><path d="M-21 -3Q-22 -33 5 -25Q26 -20 21 -1Q0 -16 -21 -3" fill="#9c9c91"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#513c2e" stroke-width="2"/><path d="M-18 28L-34 85H34L18 28Z" fill="#81618c"/><path d="M-22 85L-24 125H-7L0 96L7 125H24L22 85" fill="#435865"/><path d="M-20 35L-42 72M20 35L42 72" stroke="#b98563" stroke-width="12" stroke-linecap="round"/></g><path d="M245 285Q305 265 365 285Q425 265 485 285V455Q425 435 365 455Q305 435 245 455Z" fill="#fff9e7" stroke="#826b51" stroke-width="4"/><path d="M365 285V455" stroke="#aa9876" stroke-width="3"/><text x="257" y="325" style="font-size:28px">El gato</text><path d="M320 245H450M425 225L450 245L425 265" class="line"/><text x="345" y="155" style="font-size:32px">lo trae</text><text x="40" y="595" style="font-size:32px">El libro que busca Rosa</text><text x="45" y="650" style="font-size:32px">No lo vende.</text><text x="345" y="198" style="font-size:30px">brings it</text></svg>
