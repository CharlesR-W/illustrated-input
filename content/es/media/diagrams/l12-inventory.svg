<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800"><title>Un cuento completo; una lista con una falta</title><desc>A generic complete story is represented by its beginning, middle and ending, then a separate inventory lists Rosa’s owned copy and a missing library copy. This does not reveal where the loan is kept.</desc><rect width="680" height="800" fill="#fff9eb"/><style>text{font:40px sans-serif;fill:#24323d}.line{stroke:#647179;stroke-width:3;fill:none;stroke-linecap:round}</style><text x="45" y="55" style="font-size:40px">cuento completo</text><rect x="35" y="90" width="190" height="220" rx="8" fill="#f1e8d2" stroke="#b3a58f" stroke-width="3"/><rect x="123" y="115" width="75" height="145" fill="#c7b18a" stroke="#826b51" stroke-width="4"/><path d="M63 245L61 220L75 230L90 218L103 235V262H63Z" fill="#adb7ad" stroke="#607165" stroke-width="3"/><rect x="250" y="90" width="190" height="220" rx="8" fill="#f1e8d2" stroke="#b3a58f" stroke-width="3"/><rect x="338" y="115" width="75" height="145" fill="#c7b18a" stroke="#826b51" stroke-width="4"/><path d="M338 115L315 135V280L338 260Z" fill="#9c845e"/><path d="M278 245L276 220L290 230L305 218L318 235V262H278Z" fill="#adb7ad" stroke="#607165" stroke-width="3"/><rect x="465" y="90" width="190" height="220" rx="8" fill="#f1e8d2" stroke="#b3a58f" stroke-width="3"/><rect x="553" y="115" width="75" height="145" fill="#c7b18a" stroke="#826b51" stroke-width="4"/><path d="M553 115L530 135V280L553 260Z" fill="#9c845e"/><path d="M565 245L563 220L577 230L592 218L605 235V262H565Z" fill="#adb7ad" stroke="#607165" stroke-width="3"/><text x="35" y="365" style="font-size:40px">empieza</text><text x="470" y="365" style="font-size:40px">termina</text><path d="M35 395H645" class="line"/><text x="45" y="455" style="font-size:40px">lista</text><rect x="35" y="480" width="610" height="280" rx="10" fill="#fffef8" stroke="#b4a58b" stroke-width="3"/><text x="65" y="545" style="font-size:40px">El gato · Rosa</text><text x="65" y="620" style="font-size:40px">El gato · biblioteca</text><text x="65" y="710" style="font-size:40px">falta: el libro no está</text></svg>
