<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560"><title>Ana recoge el papel</title><desc>Ana picks up the Saturday return slip from the floor beside the empty chair, keeping it separate from the missing volume and the unfamiliar-signature letter.</desc><rect width="680" height="560" fill="#fff9eb"/><style>text{font:30px sans-serif;fill:#24323d}.line{stroke:#647179;stroke-width:3;fill:none;stroke-linecap:round}</style><g transform="translate(150 130) scale(1.25)"><circle cx="0" cy="0" r="21" fill="#b98563"/><path d="M-21 -3Q-22 -33 5 -25Q26 -20 21 -1Q0 -16 -21 -3" fill="#493c34"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#513c2e" stroke-width="2"/><path d="M-18 28L-34 85H34L18 28Z" fill="#699991"/><path d="M-22 85L-24 125H-7L0 96L7 125H24L22 85" fill="#435865"/><path d="M-20 35L-42 72M20 35L42 72" stroke="#b98563" stroke-width="12" stroke-linecap="round"/></g><path d="M204 220L365 375" stroke="#b98563" stroke-width="14" stroke-linecap="round"/><path d="M30 470H650" stroke="#bcab8c" stroke-width="10"/><rect x="360" y="360" width="240" height="90" fill="#fffef8" stroke="#9a917c" stroke-width="3"/><text x="385" y="415" style="font-size:34px">sábado</text><path d="M485 350V270M463 292L485 270L507 292" class="line"/><text x="350" y="240" style="font-size:32px">lo recoge</text><text x="60" y="530" style="font-size:30px">El papel está en el suelo.</text></svg>
