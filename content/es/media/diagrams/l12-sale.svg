<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770"><title>Comprar y vender libros</title><desc>A generic book sale shows private books with fictional price cards, money passed to the seller and a book handed to the buyer. This illustrates an exchange, not a library fee.</desc><rect width="680" height="770" fill="#fff9eb"/><style>text{font:30px sans-serif;fill:#24323d}.line{stroke:#647179;stroke-width:3;fill:none;stroke-linecap:round}</style><g transform="translate(145 100) scale(1.05)"><circle cx="0" cy="0" r="21" fill="#b98563"/><path d="M-21 -3Q-22 -33 5 -25Q26 -20 21 -1Q0 -16 -21 -3" fill="#9c9c91"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#513c2e" stroke-width="2"/><path d="M-18 28L-34 85H34L18 28Z" fill="#bf7c5d"/><path d="M-22 85L-24 125H-7L0 96L7 125H24L22 85" fill="#435865"/><path d="M-20 35L-42 72M20 35L42 72" stroke="#b98563" stroke-width="12" stroke-linecap="round"/></g><g transform="translate(525 100) scale(1.05)"><circle cx="0" cy="0" r="21" fill="#b98563"/><path d="M-21 -3Q-22 -33 5 -25Q26 -20 21 -1Q0 -16 -21 -3" fill="#493c34"/><circle cx="-7" cy="0" r="2"/><circle cx="7" cy="0" r="2"/><path d="M-6 9Q0 15 7 9" fill="none" stroke="#513c2e" stroke-width="2"/><path d="M-18 28L-34 85H34L18 28Z" fill="#699991"/><path d="M-22 85L-24 125H-7L0 96L7 125H24L22 85" fill="#435865"/><path d="M-20 35L-42 72M20 35L42 72" stroke="#b98563" stroke-width="12" stroke-linecap="round"/></g><text x="40" y="290" style="font-size:30px">vende = sells</text><text x="445" y="290" style="font-size:30px">compra = buys</text><rect x="60" y="360" width="205" height="170" rx="5" fill="#c7ad7a" stroke="#826b51" stroke-width="4"/><path d="M69 363V527" stroke="#fff5da" stroke-width="3"/><text x="77" y="410" style="font-size:30px">El patio</text><rect x="420" y="395" width="180" height="135" rx="5" fill="#bfd2d4" stroke="#826b51" stroke-width="4"/><path d="M429 398V527" stroke="#fff5da" stroke-width="3"/><text x="437" y="445" style="font-size:30px">El patio</text><rect x="65" y="555" width="215" height="70" fill="#fffef7" stroke="#9a917c" stroke-width="3"/><rect x="415" y="555" width="220" height="70" fill="#fffef7" stroke="#9a917c" stroke-width="3"/><text x="80" y="600" style="font-size:30px">precio: diez</text><text x="430" y="600" style="font-size:30px">precio: cinco</text><circle cx="315" cy="150" r="18" fill="#ceb770" stroke="#8c783b" stroke-width="3"/><circle cx="350" cy="172" r="18" fill="#ceb770" stroke="#8c783b" stroke-width="3"/><circle cx="380" cy="145" r="18" fill="#ceb770" stroke="#8c783b" stroke-width="3"/><text x="255" y="95" style="font-size:30px">dinero = money</text><path d="M465 190L390 170M405 153L390 170L410 188" class="line"/><path d="M230 235H430M408 215L430 235L408 255" class="line"/><text x="270" y="315" style="font-size:32px">entrega</text><text x="65" y="735" style="font-size:30px">Libros de la casa; no de la biblioteca.</text><text x="255" y="348" style="font-size:28px">hands over</text><text x="255" y="685" style="font-size:30px">precio = price</text></svg>
