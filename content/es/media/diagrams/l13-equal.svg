<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" aria-labelledby="title desc"><title id="title">Tan alto como, tan larga como</title><desc id="desc">The low shelf is less tall than the cupboard. Two equally long furniture legs ground tan…como. English meanings are supplied inline.</desc><rect width="680" height="640" fill="#fff9ed"/><g font-family="sans-serif" fill="#173e48"><text x="340" y="48" text-anchor="middle" font-size="36" fill="#173e48">Tan… como…</text><rect x="75" y="150" width="210" height="130" rx="0" fill="none" stroke="#b97542" stroke-width="12"/><path d="M75 215.0L285 215.0" fill="none" stroke="#b97542" stroke-width="10" stroke-linecap="round"/><path d="M90 280L90 310" fill="none" stroke="#b97542" stroke-width="12" stroke-linecap="round"/><path d="M270 280L270 310" fill="none" stroke="#b97542" stroke-width="12" stroke-linecap="round"/><rect x="425" y="90" width="175" height="220" rx="0" fill="#d1af7d" stroke="#173e48" stroke-width="5"/><path d="M512 90L512 310" fill="none" stroke="#173e48" stroke-width="4" stroke-linecap="round"/><text x="340" y="365" text-anchor="middle" font-size="30" fill="#173e48">No es tan alto como el armario.</text><text x="340" y="410" text-anchor="middle" font-size="30" fill="#173e48">It is not as tall as the cupboard.</text><rect x="145" y="455" width="22" height="95" rx="0" fill="#b97542" stroke="none" stroke-width="3"/><rect x="510" y="455" width="22" height="95" rx="0" fill="#b97542" stroke="none" stroke-width="3"/><text x="340" y="525" text-anchor="middle" font-size="44" fill="#173e48">=</text><text x="340" y="595" text-anchor="middle" font-size="30" fill="#173e48">tan larga como = as long as</text></g></svg>
