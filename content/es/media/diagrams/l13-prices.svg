<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1120" viewBox="0 0 680 1120" role="img" aria-labelledby="title desc"><title id="title">Caro, barato, menos, mejor, peor</title><desc id="desc">Fictional seller drawing: a tall shelf costs ten; a short one five. A large book is higher than the short shelf opening. The proposed repair costs two from a five-unit budget. English comparison meanings are inline.</desc><rect width="680" height="1120" fill="#fff9ed"/><g font-family="sans-serif" fill="#173e48"><text x="340" y="48" text-anchor="middle" font-size="36" fill="#173e48">Dos estantes nuevos</text><rect x="75" y="100" width="220" height="270" rx="0" fill="none" stroke="#b97542" stroke-width="12"/><path d="M75 235.0L295 235.0" fill="none" stroke="#b97542" stroke-width="10" stroke-linecap="round"/><path d="M90 370L90 400" fill="none" stroke="#b97542" stroke-width="12" stroke-linecap="round"/><path d="M280 370L280 400" fill="none" stroke="#b97542" stroke-width="12" stroke-linecap="round"/><rect x="430" y="240" width="180" height="130" rx="0" fill="none" stroke="#b97542" stroke-width="12"/><path d="M430 305.0L610 305.0" fill="none" stroke="#b97542" stroke-width="10" stroke-linecap="round"/><path d="M445 370L445 400" fill="none" stroke="#b97542" stroke-width="12" stroke-linecap="round"/><path d="M595 370L595 400" fill="none" stroke="#b97542" stroke-width="12" stroke-linecap="round"/><rect x="110" y="255" width="55" height="100" rx="3" fill="#376b9a" stroke="#173e48" stroke-width="2"/><path d="M118 259L118 351" fill="none" stroke="#fff9ed" stroke-width="2" stroke-linecap="round"/><rect x="450" y="240" width="55" height="155" rx="3" fill="#376b9a" stroke="#173e48" stroke-width="2"/><path d="M458 244L458 391" fill="none" stroke="#fff9ed" stroke-width="2" stroke-linecap="round"/><text x="185" y="450" text-anchor="middle" font-size="30" fill="#173e48">diez · caro</text><text x="520" y="450" text-anchor="middle" font-size="30" fill="#173e48">cinco · barato</text><text x="185" y="495" text-anchor="middle" font-size="30" fill="#173e48">expensive</text><text x="520" y="495" text-anchor="middle" font-size="30" fill="#173e48">cheap</text><text x="520" y="200" text-anchor="middle" font-size="30" fill="#173e48">no cabe</text><path d="M475 215L475 235" fill="none" stroke="#ba4d48" stroke-width="4" stroke-linecap="round"/><path d="M50 545L630 545" fill="none" stroke="#d4c9b4" stroke-width="2" stroke-linecap="round"/><text x="340" y="600" text-anchor="middle" font-size="30" fill="#173e48">cinco es menos que diez</text><text x="340" y="645" text-anchor="middle" font-size="30" fill="#173e48">less</text><rect x="60" y="695" width="560" height="135" rx="15" fill="#e3ecdf" stroke="#2f7659" stroke-width="2"/><text x="340" y="740" text-anchor="middle" font-size="30" fill="#173e48">reparar: dos</text><text x="340" y="790" text-anchor="middle" font-size="30" fill="#173e48">El dinero de Elena: cinco</text><text x="340" y="895" text-anchor="middle" font-size="30" fill="#173e48">mejor = better</text><text x="340" y="945" text-anchor="middle" font-size="30" fill="#173e48">peor = worse</text><text x="340" y="1020" text-anchor="middle" font-size="30" fill="#173e48">El libro grande no cabe:</text><text x="340" y="1065" text-anchor="middle" font-size="30" fill="#173e48">el pequeño es peor que el viejo.</text></g></svg>
