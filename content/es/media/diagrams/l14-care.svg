<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1500" viewBox="0 0 680 1500" role="img" aria-labelledby="title desc"><title id="title">Cuidado, necesitar, deber, arreglar, limpiar, por, para</title><desc id="desc">Book care, a damaged and intact foot, and a dirty/clean floor contrast are labelled. Explicit English inline meanings introduce the verbs and distinguish causal por plus noun from purpose para plus infinitive.</desc><rect width="680" height="1500" fill="#fff9ed"/><g font-family="sans-serif" fill="#173e48"><text x="340" y="48" text-anchor="middle" font-size="36" fill="#173e48">El cuidado de la sala</text><rect x="130" y="100" width="45" height="75" rx="3" fill="#376b9a" stroke="#173e48" stroke-width="2"/><path d="M138 104L138 171" fill="none" stroke="#fff9ed" stroke-width="2" stroke-linecap="round"/><rect x="105" y="160" width="150" height="90" rx="0" fill="#d5b17c" stroke="#173e48" stroke-width="3"/><text x="460" y="135" text-anchor="middle" font-size="30" fill="#173e48">cuidado = care</text><text x="460" y="185" text-anchor="middle" font-size="30" fill="#173e48">necesitar = need</text><text x="460" y="235" text-anchor="middle" font-size="30" fill="#173e48">deber = must</text><path d="M45 300L635 300" fill="none" stroke="#d4c9b4" stroke-width="2" stroke-linecap="round"/><rect x="105" y="345" width="35" height="115" rx="0" fill="#b97542" stroke="none" stroke-width="3"/><path d="M100 410l45 10-40 14 42 11" fill="none" stroke="#ba4d48" stroke-width="5"/><text x="340" y="415" text-anchor="middle" font-size="44" fill="#173e48">→</text><rect x="535" y="345" width="35" height="115" rx="0" fill="#b97542" stroke="none" stroke-width="3"/><text x="340" y="525" text-anchor="middle" font-size="30" fill="#173e48">arreglar = fix</text><path d="M45 570L635 570" fill="none" stroke="#d4c9b4" stroke-width="2" stroke-linecap="round"/><rect x="95" y="620" width="200" height="120" rx="0" fill="#e2dfd3" stroke="#173e48" stroke-width="2"/><rect x="390" y="620" width="200" height="120" rx="0" fill="#ffffff" stroke="#173e48" stroke-width="2"/><circle cx="120" cy="650" r="7" fill="#9b8e78"/><circle cx="180" cy="680" r="7" fill="#9b8e78"/><circle cx="245" cy="710" r="7" fill="#9b8e78"/><circle cx="150" cy="720" r="7" fill="#9b8e78"/><circle cx="250" cy="650" r="7" fill="#9b8e78"/><text x="340" y="805" text-anchor="middle" font-size="30" fill="#173e48">limpiar = clean</text><path d="M45 850L635 850" fill="none" stroke="#d4c9b4" stroke-width="2" stroke-linecap="round"/><text x="340" y="920" text-anchor="middle" font-size="30" fill="#173e48">por + la lluvia</text><text x="340" y="965" text-anchor="middle" font-size="30" fill="#173e48">because of the rain</text><text x="340" y="1040" text-anchor="middle" font-size="30" fill="#173e48">El suelo está mojado por la lluvia.</text><path d="M45 1100L635 1100" fill="none" stroke="#d4c9b4" stroke-width="2" stroke-linecap="round"/><text x="340" y="1170" text-anchor="middle" font-size="30" fill="#173e48">para + proteger los libros</text><text x="340" y="1215" text-anchor="middle" font-size="30" fill="#173e48">in order to protect the books</text><text x="340" y="1300" text-anchor="middle" font-size="30" fill="#173e48">Limpiar para proteger los libros.</text><text x="340" y="1375" text-anchor="middle" font-size="30" fill="#173e48">cause: por + noun</text><text x="340" y="1425" text-anchor="middle" font-size="30" fill="#173e48">purpose: para + infinitive</text></g></svg>
