<svg xmlns="http://www.w3.org/2000/svg" width="680" height="950" viewBox="0 0 680 950" role="img" aria-labelledby="title desc"><title id="title">Recibo: techo dos; cuenta: pata dos</title><desc id="desc">Two separate records have different expense labels. All three actual budget units remain in one box; two are provisionally set aside and one separate. No payer, date, debt or new payment is identified.</desc><rect width="680" height="950" fill="#fff9ed"/><g font-family="sans-serif" fill="#173e48"><text x="340" y="48" text-anchor="middle" font-size="36" fill="#173e48">El recibo y la cuenta</text><rect x="65" y="105" width="250" height="180" rx="0" fill="#ffffff" stroke="#173e48" stroke-width="3"/><text x="190" y="155" text-anchor="middle" font-size="30" fill="#173e48">recibo</text><text x="190" y="210" text-anchor="middle" font-size="30" fill="#173e48">techo: dos</text><rect x="365" y="105" width="250" height="180" rx="0" fill="#ffffff" stroke="#173e48" stroke-width="3"/><text x="490" y="155" text-anchor="middle" font-size="30" fill="#173e48">cuenta nueva</text><text x="490" y="210" text-anchor="middle" font-size="30" fill="#173e48">pata: dos</text><text x="340" y="355" text-anchor="middle" font-size="30" fill="#173e48">recibo = receipt</text><text x="340" y="405" text-anchor="middle" font-size="30" fill="#173e48">Proof of a payment.</text><path d="M45 455L635 455" fill="none" stroke="#d4c9b4" stroke-width="2" stroke-linecap="round"/><rect x="90" y="520" width="500" height="190" rx="12" fill="#dfbd86" stroke="#173e48" stroke-width="4"/><circle cx="180" cy="615" r="32" fill="#d5b05b" stroke="#173e48" stroke-width="3"/><circle cx="270" cy="615" r="32" fill="#d5b05b" stroke="#173e48" stroke-width="3"/><circle cx="500" cy="615" r="32" fill="#d5b05b" stroke="#173e48" stroke-width="3"/><path d="M365 550L365 680" fill="none" stroke="#173e48" stroke-width="2" stroke-linecap="round"/><text x="225" y="765" text-anchor="middle" font-size="30" fill="#173e48">dos</text><text x="500" y="765" text-anchor="middle" font-size="30" fill="#173e48">uno</text><text x="340" y="830" text-anchor="middle" font-size="30" fill="#173e48">All three stay in the box.</text><text x="340" y="885" text-anchor="middle" font-size="30" fill="#173e48">Two set aside. No new payment.</text></g></svg>
