<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1400" viewBox="0 0 680 1400" role="img" aria-labelledby="title desc"><title id="title">Ayer, anoche, semana, visita</title><desc id="desc">A chronological arrow, a night panel, seven week cells and a clothed visitor at a doorway ground the four meanings. Regular preterite examples are translated in inline captions before the first reports.</desc><rect width="680" height="1400" fill="#fff9ed"/><g font-family="sans-serif" fill="#173e48"><text x="340" y="48" text-anchor="middle" font-size="36" fill="#173e48">Hoy · ayer · anoche</text><text x="170" y="130" text-anchor="middle" font-size="30" fill="#173e48">ayer</text><text x="510" y="130" text-anchor="middle" font-size="30" fill="#173e48">hoy</text><path d="M250 120L400 120" fill="none" stroke="#173e48" stroke-width="4" stroke-linecap="round"/><text x="400" y="130" text-anchor="middle" font-size="42" fill="#173e48">→</text><text x="170" y="185" text-anchor="middle" font-size="30" fill="#173e48">yesterday</text><text x="510" y="185" text-anchor="middle" font-size="30" fill="#173e48">today</text><path d="M45 235L635 235" fill="none" stroke="#d4c9b4" stroke-width="2" stroke-linecap="round"/><rect x="90" y="280" width="500" height="150" rx="0" fill="#284352" stroke="#173e48" stroke-width="2"/><circle cx="150" cy="330" r="26" fill="#f2dfa0"/><text x="380" y="330" text-anchor="middle" font-size="30" fill="#fff9ed">anoche</text><text x="380" y="380" text-anchor="middle" font-size="30" fill="#fff9ed">last night</text><path d="M45 475L635 475" fill="none" stroke="#d4c9b4" stroke-width="2" stroke-linecap="round"/><rect x="95" y="520" width="58" height="70" rx="0" fill="#e3ecdf" stroke="#2f7659" stroke-width="2"/><rect x="167" y="520" width="58" height="70" rx="0" fill="#e3ecdf" stroke="#2f7659" stroke-width="2"/><rect x="239" y="520" width="58" height="70" rx="0" fill="#e3ecdf" stroke="#2f7659" stroke-width="2"/><rect x="311" y="520" width="58" height="70" rx="0" fill="#e3ecdf" stroke="#2f7659" stroke-width="2"/><rect x="383" y="520" width="58" height="70" rx="0" fill="#e3ecdf" stroke="#2f7659" stroke-width="2"/><rect x="455" y="520" width="58" height="70" rx="0" fill="#e3ecdf" stroke="#2f7659" stroke-width="2"/><rect x="527" y="520" width="58" height="70" rx="0" fill="#e3ecdf" stroke="#2f7659" stroke-width="2"/><text x="340" y="650" text-anchor="middle" font-size="30" fill="#173e48">semana = week</text><path d="M45 700L635 700" fill="none" stroke="#d4c9b4" stroke-width="2" stroke-linecap="round"/><g transform="translate(155,780) scale(0.65)"><circle cx="0" cy="0" r="34" fill="#a56c4e"/><path d="M-33-6q0-47 35-38 35-3 31 38l-19-18-25-3z" fill="#383a37"/><rect x="-10" y="25" width="20" height="25" rx="0" fill="#a56c4e" stroke="none" stroke-width="3"/><path d="M-43 50q43-16 86 0l12 85h-110z" fill="#b97542"/><path d="M-31 133h26l-2 63h-26zM5 133h26l2 63h-26z" fill="#334c64"/><ellipse cx="-48" cy="116" rx="10" ry="18" fill="#a56c4e"/><ellipse cx="48" cy="116" rx="10" ry="18" fill="#a56c4e"/><circle cx="-11" cy="0" r="3" fill="#173e48"/><circle cx="11" cy="0" r="3" fill="#173e48"/><path d="M-10 15q10 7 20 0" fill="none" stroke="#173e48" stroke-width="2"/></g><rect x="420" y="750" width="125" height="170" rx="0" fill="#e4d4b1" stroke="#173e48" stroke-width="4"/><text x="340" y="1010" text-anchor="middle" font-size="30" fill="#173e48">visita = visit</text><path d="M45 1050L635 1050" fill="none" stroke="#d4c9b4" stroke-width="2" stroke-linecap="round"/><text x="340" y="1120" text-anchor="middle" font-size="30" fill="#173e48">hoy limpio · ayer limpié</text><text x="340" y="1170" text-anchor="middle" font-size="30" fill="#173e48">I clean · I cleaned</text><text x="340" y="1250" text-anchor="middle" font-size="30" fill="#173e48">leí = I read (completed)</text><text x="340" y="1320" text-anchor="middle" font-size="30" fill="#173e48">recibí = I received</text></g></svg>
