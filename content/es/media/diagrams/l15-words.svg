<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1500" viewBox="0 0 680 1500" role="img" aria-labelledby="title desc"><title id="title">Explicar, comprender, aprender, acabar, decidir, prometer</title><desc id="desc">Six separate inline meaning panels explicitly translate each new verb and a source-like example. They teach words and completed forms without asserting an unseen story action.</desc><rect width="680" height="1500" fill="#fff9ed"/><g font-family="sans-serif" fill="#173e48"><text x="340" y="48" text-anchor="middle" font-size="36" fill="#173e48">El trabajo y las palabras</text><rect x="45" y="90" width="590" height="180" rx="12" fill="#ffffff" stroke="#173e48" stroke-width="2"/><text x="340" y="130" text-anchor="middle" font-size="30" fill="#173e48">explicar = explain</text><text x="340" y="190" text-anchor="middle" font-size="30" fill="#173e48">Explico el trabajo.</text><text x="340" y="235" text-anchor="middle" font-size="30" fill="#173e48">I explain the work.</text><rect x="45" y="310" width="590" height="180" rx="12" fill="#ffffff" stroke="#173e48" stroke-width="2"/><text x="340" y="350" text-anchor="middle" font-size="30" fill="#173e48">comprender = understand</text><text x="340" y="410" text-anchor="middle" font-size="30" fill="#173e48">Comprendo el plan.</text><text x="340" y="455" text-anchor="middle" font-size="30" fill="#173e48">I understand the plan.</text><rect x="45" y="530" width="590" height="180" rx="12" fill="#ffffff" stroke="#173e48" stroke-width="2"/><text x="340" y="570" text-anchor="middle" font-size="30" fill="#173e48">aprender = learn</text><text x="340" y="630" text-anchor="middle" font-size="30" fill="#173e48">Aprendí el camino.</text><text x="340" y="675" text-anchor="middle" font-size="30" fill="#173e48">I learned the route.</text><rect x="45" y="750" width="590" height="180" rx="12" fill="#ffffff" stroke="#173e48" stroke-width="2"/><text x="340" y="790" text-anchor="middle" font-size="30" fill="#173e48">acabar = finish</text><text x="340" y="850" text-anchor="middle" font-size="30" fill="#173e48">Acabé el trabajo.</text><text x="340" y="895" text-anchor="middle" font-size="30" fill="#173e48">I finished the work.</text><rect x="45" y="970" width="590" height="180" rx="12" fill="#ffffff" stroke="#173e48" stroke-width="2"/><text x="340" y="1010" text-anchor="middle" font-size="30" fill="#173e48">decidir = decide</text><text x="340" y="1070" text-anchor="middle" font-size="30" fill="#173e48">Decidimos reparar.</text><text x="340" y="1115" text-anchor="middle" font-size="30" fill="#173e48">We decided to repair.</text><rect x="45" y="1190" width="590" height="180" rx="12" fill="#ffffff" stroke="#173e48" stroke-width="2"/><text x="340" y="1230" text-anchor="middle" font-size="30" fill="#173e48">prometer = promise</text><text x="340" y="1290" text-anchor="middle" font-size="30" fill="#173e48">No prometí reparar el techo.</text><text x="340" y="1335" text-anchor="middle" font-size="30" fill="#173e48">I did not promise to fix the ceiling.</text></g></svg>
