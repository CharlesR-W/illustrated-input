<svg xmlns="http://www.w3.org/2000/svg" width="680" height="715" viewBox="0 0 680 715"><title>Dos cuentas distintas</title><desc>A fictional financial institution and money account establish banco. Two separate records distinguish another year’s roof payment from the shelf-foot payment before the meeting; the room cash box still has three. No banking procedure is depicted as a real rule.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:28px sans-serif;fill:#24323d}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}.line{fill:none;stroke:#617481;stroke-width:4}</style><rect width="680" height="715" rx="12" fill="#fff9eb"/><text x="340" y="45" text-anchor="middle">banco</text><rect x="35" y="85" width="250" height="210" fill="#c5d4cf" stroke="#6d8b83" stroke-width="4"/><rect x="115" y="180" width="90" height="115" fill="#fff" stroke="#6d8b83" stroke-width="4"/><text x="160" y="145" text-anchor="middle">banco</text><circle cx="370" cy="165" r="30" fill="#d9ad55" stroke="#8c6d36" stroke-width="3"/><circle cx="445" cy="165" r="30" fill="#d9ad55" stroke="#8c6d36" stroke-width="3"/><path class="arrow" d="M415 215H535"/><rect x="530" y="110" width="110" height="170" fill="#fff" stroke="#98866b" stroke-width="4"/><text x="585" y="165" text-anchor="middle">cuenta</text><text x="585" y="215" text-anchor="middle">dos</text><rect x="25" y="340" width="305" height="265" rx="8" fill="#fff" stroke="#98866b" stroke-width="3"/><rect x="350" y="340" width="305" height="265" rx="8" fill="#fff" stroke="#98866b" stroke-width="3"/><text x="178" y="390" text-anchor="middle">cuenta vieja</text><text x="178" y="455" text-anchor="middle">otro año</text><text x="178" y="525" text-anchor="middle">techo: dos</text><text x="502" y="390" text-anchor="middle">cuenta nueva</text><text x="502" y="440" text-anchor="middle">antes de</text><text x="502" y="480" text-anchor="middle">la reunión</text><text x="502" y="550" text-anchor="middle">pata: dos</text><text x="340" y="665" text-anchor="middle">La caja de la sala: tres.</text></svg>
