<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540"><title>El padre condujo</title><desc>Elena’s father, fully clothed and visible at the steering wheel, drives an unlabelled vehicle toward the family’s red house. No vehicle noun, real route or transport rule is introduced.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:28px sans-serif;fill:#24323d}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}.line{fill:none;stroke:#617481;stroke-width:4}</style><rect width="680" height="540" rx="12" fill="#fff9eb"/><text x="340" y="55" text-anchor="middle">condujo</text><path d="M40 390H640" stroke="#7f8b80" stroke-width="8"/><rect x="70" y="235" width="385" height="115" rx="22" fill="#8aa9b7" stroke="#4c6b7a" stroke-width="5"/><path d="M125 235L175 140H335L405 235Z" fill="#8aa9b7" stroke="#4c6b7a" stroke-width="5"/><path d="M175 155H245V225H140ZM265 155H325L380 225H265Z" fill="#f2edda"/><circle cx="288" cy="180" r="12" fill="#bf9475"/><path d="M276 180Q277 159 291 167Q304 169 300 181Z" fill="#635c52"/><path d="M278 195H298L307 228H270Z" fill="#647a6a"/><path d="M280 200L315 217M297 200L335 220" fill="none" stroke="#bf9475" stroke-width="6" stroke-linecap="round"/><circle cx="325" cy="222" r="16" fill="none" stroke="#36494f" stroke-width="5"/><circle cx="150" cy="350" r="39" fill="#36494f"/><circle cx="375" cy="350" r="39" fill="#36494f"/><circle cx="150" cy="350" r="19" fill="#c1cacb"/><circle cx="375" cy="350" r="19" fill="#c1cacb"/><path class="arrow" d="M120 435H420"/><path d="M500 205L555 150L620 205V355H500Z" fill="#ad7560"/><rect x="535" y="265" width="50" height="90" fill="#eee3ca"/><text x="555" y="410" text-anchor="middle">casa</text><text x="340" y="495" text-anchor="middle">El padre de Elena.</text></svg>
