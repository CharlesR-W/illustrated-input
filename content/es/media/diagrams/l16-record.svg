<svg xmlns="http://www.w3.org/2000/svg" width="680" height="455" viewBox="0 0 680 455"><title>Cantidad y fecha</title><desc>Two counted units contrast with an illustrative calendar date. The date 5/6 is an example of a date shape, not an additional exact date asserted for a story transaction.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:40px sans-serif;fill:#24323d}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}.line{fill:none;stroke:#617481;stroke-width:4}</style><rect width="680" height="455" rx="12" fill="#fff9eb"/><text x="170" y="65" text-anchor="middle">cantidad</text><text x="510" y="65" text-anchor="middle">fecha</text><rect x="30" y="105" width="280" height="300" rx="10" fill="#ece3cf"/><rect x="370" y="105" width="280" height="300" rx="10" fill="#ece3cf"/><circle cx="120" cy="215" r="30" fill="#d9ad55" stroke="#8c6d36" stroke-width="3"/><circle cx="220" cy="215" r="30" fill="#d9ad55" stroke="#8c6d36" stroke-width="3"/><text x="170" y="350" text-anchor="middle">dos</text><rect x="410" y="145" width="200" height="185" fill="#fff" stroke="#617481" stroke-width="4"/><path d="M410 190H610M455 145V330M505 145V330M555 145V330M410 235H610M410 280H610" class="line"/><rect x="505" y="235" width="50" height="45" fill="#a8c3c9"/><text x="510" y="370" text-anchor="middle">5/6</text></svg>
