<svg xmlns="http://www.w3.org/2000/svg" width="680" height="485" viewBox="0 0 680 485"><title>Firmé el papel</title><desc>A hand adds Elena’s own legible name below the amount on the old roof paper; this is not the unrecognised mark on the earlier letter.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:40px sans-serif;fill:#24323d}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}.line{fill:none;stroke:#617481;stroke-width:4}</style><rect width="680" height="485" rx="12" fill="#fff9eb"/><text x="340" y="70" text-anchor="middle">firmé</text><rect x="75" y="110" width="530" height="330" fill="#fff" stroke="#98866b" stroke-width="4"/><text x="340" y="175" text-anchor="middle">techo: dos</text><text x="340" y="245" text-anchor="middle">Elena</text><path d="M200 270Q330 255 460 270" stroke="#688292" stroke-width="3"/><path d="M495 210L450 270" stroke="#5b5141" stroke-width="13" stroke-linecap="round"/><text x="340" y="365" text-anchor="middle">firma</text></svg>
