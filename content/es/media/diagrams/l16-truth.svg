<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690"><title>Verdad y mentira</title><desc>The same visible quantity of three is accurately reported as three or deliberately misreported as ten. The accompanying target-language definition specifies asking for more money, distinguishing a lie from the honest filing error in the story.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466b85"/></marker></defs><style>text{font:40px sans-serif;fill:#24323d}.arrow{fill:none;stroke:#466b85;stroke-width:5;marker-end:url(#tip)}.line{fill:none;stroke:#617481;stroke-width:4}</style><rect width="680" height="690" rx="12" fill="#fff9eb"/><text x="340" y="55" text-anchor="middle">hay tres</text><circle cx="240" cy="125" r="30" fill="#d9ad55" stroke="#8c6d36" stroke-width="3"/><circle cx="340" cy="125" r="30" fill="#d9ad55" stroke="#8c6d36" stroke-width="3"/><circle cx="440" cy="125" r="30" fill="#d9ad55" stroke="#8c6d36" stroke-width="3"/><rect x="30" y="200" width="620" height="200" rx="10" fill="#e1ead8"/><text x="340" y="265" text-anchor="middle">dice «tres»</text><text x="340" y="345" text-anchor="middle">verdad</text><rect x="30" y="430" width="620" height="210" rx="10" fill="#efddd1"/><text x="340" y="500" text-anchor="middle">dice «diez»</text><text x="340" y="585" text-anchor="middle">mentira</text></svg>
