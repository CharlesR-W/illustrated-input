<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900"><title>Entonces, cada y mientras</title><desc>Inline bilingual meaning captions distinguish then, each, summer, winter and while. A simultaneous reading-and-looking example translates every word group and does not substitute a first-use margin gloss.</desc><style>text{font:32px sans-serif;fill:#233440}.panel{fill:#ece5d5;stroke:#c3bba7;stroke-width:2}</style><rect width="680" height="900" rx="14" fill="#fff9eb"/><rect x="20" y="20" width="640" height="135" rx="12" class="panel"/><text x="340" y="65" text-anchor="middle" style="font-size:32px">entonces</text><text x="340" y="120" text-anchor="middle" style="font-size:32px">then / at that time</text><rect x="20" y="180" width="640" height="135" rx="12" class="panel"/><text x="340" y="225" text-anchor="middle" style="font-size:32px">cada verano</text><text x="340" y="280" text-anchor="middle" style="font-size:32px">each summer</text><rect x="20" y="340" width="640" height="135" rx="12" class="panel"/><text x="340" y="385" text-anchor="middle" style="font-size:32px">verano · invierno</text><text x="340" y="440" text-anchor="middle" style="font-size:32px">summer · winter</text><rect x="20" y="500" width="640" height="135" rx="12" class="panel"/><text x="340" y="545" text-anchor="middle" style="font-size:32px">mientras</text><text x="340" y="600" text-anchor="middle" style="font-size:32px">while</text><text x="340" y="700" text-anchor="middle" style="font-size:32px">El maestro lee mientras</text><text x="340" y="748" text-anchor="middle" style="font-size:32px">la alumna mira el libro.</text><text x="340" y="814" text-anchor="middle" style="font-size:32px">The teacher reads while</text><text x="340" y="860" text-anchor="middle" style="font-size:32px">the pupil looks at the book.</text></svg>