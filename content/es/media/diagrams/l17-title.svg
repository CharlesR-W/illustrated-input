<svg xmlns="http://www.w3.org/2000/svg" width="680" height="175" viewBox="0 0 680 175"><title>Cuando era niña</title><desc>Title-only English meaning support. Cuando and niña are not production targets or additions to the chapter lexicon.</desc><style>text{font:32px sans-serif;fill:#233440}.panel{fill:#ece5d5;stroke:#c3bba7;stroke-width:2}</style><rect width="680" height="175" rx="14" fill="#fff9eb"/><text x="340" y="62" text-anchor="middle" style="font-size:32px">Cuando era niña</text><text x="340" y="126" text-anchor="middle" style="font-size:32px">When I was a girl</text></svg>