<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 665" width="680" height="665" role="img" aria-labelledby="title desc"><title id="title">La carta, el libro y la vuelta</title><desc id="desc">The letter was left in the book and the book was put away before the pupil returned home. Earlier-than-past clauses are explicitly translated and reading only.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="665" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="30" fill="#233a47" font-weight="700">antes de volver a casa</text><text x="35" y="90" font-size="28" fill="#233a47" font-weight="400">before returning home</text><rect x="35" y="125" width="610" height="135" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><rect x="65" y="160" width="95" height="65" rx="8" fill="#efe4c8" stroke="#71838a" stroke-width="3"/><path d="M180 190L260 190" stroke="#367c85" stroke-width="6" marker-end="url(#arrow)"/><rect x="285" y="155" width="100" height="80" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><text x="420" y="183" font-size="28" fill="#233a47" font-weight="400">había dejado</text><text x="420" y="223" font-size="28" fill="#233a47" font-weight="400">had left</text><path d="M340 270L340 325" stroke="#367c85" stroke-width="6" marker-end="url(#arrow)"/><rect x="35" y="340" width="610" height="125" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><rect x="70" y="365" width="125" height="70" rx="8" fill="#b88e66" stroke="#71838a" stroke-width="3"/><rect x="92" y="351" width="75" height="58" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><text x="250" y="390" font-size="28" fill="#233a47" font-weight="400">había guardado</text><text x="250" y="435" font-size="28" fill="#233a47" font-weight="400">had put away</text><path d="M340 475L340 530" stroke="#367c85" stroke-width="6" marker-end="url(#arrow)"/><g transform="translate(55 520) scale(0.55)"><circle cx="38" cy="27" r="23" fill="#b77e5d"/><path d="M15 23Q12 -3 38 0Q65 0 62 24L55 16L23 16Z" fill="#473b36"/><path d="M12 63Q38 47 65 63L76 133H0Z" fill="#b85d59"/><path d="M10 134H35V194H7Z M41 134H66L72 194H43Z" fill="#3f5366"/><path d="M11 69L-2 115L5 121L25 76 M63 69L84 110L78 117L51 80" fill="#b77e5d"/><ellipse cx="17" cy="198" rx="22" ry="8" fill="#343a3c"/><ellipse cx="59" cy="198" rx="22" ry="8" fill="#343a3c"/></g><text x="180" y="575" font-size="30" fill="#233a47" font-weight="400">Volví a casa.</text><text x="180" y="625" font-size="28" fill="#233a47" font-weight="400">I returned home.</text></g></svg>
