<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 535" width="680" height="535" role="img" aria-labelledby="title desc"><title id="title">La experiencia de Rosa</title><desc id="desc">Clothed Rosa recalls her own analogous paper-in-a-book experience. It does not make her a witness to the mother’s childhood letter route.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="535" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="30" fill="#233a47" font-weight="700">experiencia = an experience</text><text x="35" y="90" font-size="28" fill="#233a47" font-weight="400">something lived through</text><g transform="translate(60 140) scale(0.8)"><circle cx="38" cy="27" r="23" fill="#b77e5d"/><path d="M15 23Q12 -3 38 0Q65 0 62 24L55 16L23 16Z" fill="#473b36"/><path d="M12 63Q38 47 65 63L76 133H0Z" fill="#7e7fa6"/><path d="M10 134H35V194H7Z M41 134H66L72 194H43Z" fill="#3f5366"/><path d="M11 69L-2 115L5 121L25 76 M63 69L84 110L78 117L51 80" fill="#b77e5d"/><ellipse cx="17" cy="198" rx="22" ry="8" fill="#343a3c"/><ellipse cx="59" cy="198" rx="22" ry="8" fill="#343a3c"/></g><rect x="210" y="180" width="140" height="100" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><rect x="230" y="150" width="95" height="65" rx="8" fill="#efe4c8" stroke="#71838a" stroke-width="3"/><path d="M370 230L450 230" stroke="#367c85" stroke-width="6" marker-end="url(#arrow)"/><rect x="470" y="185" width="140" height="95" rx="8" fill="#c89a72" stroke="#71838a" stroke-width="3"/><text x="40" y="385" font-size="28" fill="#233a47" font-weight="400">«Yo guardé un papel».</text><text x="40" y="435" font-size="28" fill="#233a47" font-weight="400">«Después busqué el papel».</text><text x="40" y="485" font-size="28" fill="#233a47" font-weight="400">El papel estaba en el libro.</text></g></svg>
