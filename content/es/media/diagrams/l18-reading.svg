<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" width="680" height="690" role="img" aria-labelledby="title desc"><title id="title">La carta ya leída</title><desc id="desc">Elena holds the open message already read in chapter11. Inline meaning cues distinguish already, again and not yet, with first perfect forms.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="690" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="30" fill="#233a47" font-weight="700">ya ha leído = has already read</text><g transform="translate(75 85) scale(1.0)"><circle cx="38" cy="27" r="23" fill="#b77e5d"/><path d="M15 23Q12 -3 38 0Q65 0 62 24L55 16L23 16Z" fill="#473b36"/><path d="M12 63Q38 47 65 63L76 133H0Z" fill="#b85d59"/><path d="M10 134H35V194H7Z M41 134H66L72 194H43Z" fill="#3f5366"/><path d="M11 69L-2 115L5 121L25 76 M63 69L84 110L78 117L51 80" fill="#b77e5d"/><ellipse cx="17" cy="198" rx="22" ry="8" fill="#343a3c"/><ellipse cx="59" cy="198" rx="22" ry="8" fill="#343a3c"/></g><rect x="205" y="125" width="165" height="135" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><text x="227" y="170" font-size="28" fill="#233a47" font-weight="400">Elena</text><text x="227" y="211" font-size="28" fill="#233a47" font-weight="400">¿Quién…?</text><path d="M385 190L535 190" stroke="#367c85" stroke-width="6" marker-end="url(#arrow)"/><text x="45" y="340" font-size="30" fill="#233a47" font-weight="400">otra vez = again</text><text x="45" y="395" font-size="28" fill="#233a47" font-weight="400">todavía = still · todavía no = not yet</text><text x="45" y="450" font-size="28" fill="#233a47" font-weight="400">He leído = I have read</text><text x="45" y="497" font-size="28" fill="#233a47" font-weight="400">ha leído = has read</text></g><text x="45" y="545" font-size="28" fill="#233a47">vez = occasion / time</text><text x="45" y="595" font-size="28" fill="#233a47">cambiar = change</text><text x="45" y="645" font-size="28" fill="#233a47">no han cambiado = have not changed</text></svg>
