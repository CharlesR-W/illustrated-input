<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1575" viewBox="0 0 680 1575"><title>Cartas, personas y puertas</title><desc>Instructional panels ground sending, post, envelopes, stamps, none and any, and a door opening. These are meaning diagrams, not extra story events.</desc><svg x="0" y="0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 655" width="680" height="655" role="img" aria-labelledby="title desc"><title id="title">Enviar, correo, sobre y sello</title><desc id="desc">A clothed sender sends a letter. A separate generic postal envelope shows its postage stamp; this is meaning support, not a claim that the owner used the post.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="655" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="32" fill="#233a47" font-weight="700">enviar = send</text><g transform="translate(55 85) scale(0.65)"><circle cx="38" cy="27" r="23" fill="#b77e5d"/><path d="M15 23Q12 -3 38 0Q65 0 62 24L55 16L23 16Z" fill="#473b36"/><path d="M12 63Q38 47 65 63L76 133H0Z" fill="#6c8a68"/><path d="M10 134H35V194H7Z M41 134H66L72 194H43Z" fill="#3f5366"/><path d="M11 69L-2 115L5 121L25 76 M63 69L84 110L78 117L51 80" fill="#b77e5d"/><ellipse cx="17" cy="198" rx="22" ry="8" fill="#343a3c"/><ellipse cx="59" cy="198" rx="22" ry="8" fill="#343a3c"/></g><rect x="175" y="115" width="95" height="65" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><path d="M290 145L440 145" stroke="#367c85" stroke-width="6" marker-end="url(#arrow)"/><rect x="480" y="105" width="140" height="110" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><text x="40" y="290" font-size="32" fill="#233a47" font-weight="700">por correo = by post / mail</text><rect x="55" y="340" width="550" height="205" rx="8" fill="#efe4c8" stroke="#71838a" stroke-width="3"/><path d="M55 340L330 465L605 340" fill="none" stroke="#8a7b68" stroke-width="3"/><rect x="500" y="360" width="72" height="70" rx="8" fill="#aed1b7" stroke="#71838a" stroke-width="3"/><text x="40" y="600" font-size="28" fill="#233a47" font-weight="400">sobre = envelope</text><text x="355" y="600" font-size="28" fill="#233a47" font-weight="400">sello = stamp</text><path d="M485 566L526 435" stroke="#367c85" stroke-width="6" marker-end="url(#arrow)"/></g></svg>
<svg x="0" y="655" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 435" width="680" height="435" role="img" aria-labelledby="title desc"><title id="title">Ninguno y alguna</title><desc id="desc">Three clothed people are not searching for the owner. Inline sense cues distinguish not one of them from an unspecified date.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="435" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="30" fill="#233a47" font-weight="700">ninguno = not one of them</text><text x="35" y="95" font-size="28" fill="#233a47" font-weight="400">¿Quién busca al dueño?</text><g transform="translate(80 135) scale(0.65)"><circle cx="38" cy="27" r="23" fill="#b77e5d"/><path d="M15 23Q12 -3 38 0Q65 0 62 24L55 16L23 16Z" fill="#473b36"/><path d="M12 63Q38 47 65 63L76 133H0Z" fill="#ad5861"/><path d="M10 134H35V194H7Z M41 134H66L72 194H43Z" fill="#3f5366"/><path d="M11 69L-2 115L5 121L25 76 M63 69L84 110L78 117L51 80" fill="#b77e5d"/><ellipse cx="17" cy="198" rx="22" ry="8" fill="#343a3c"/><ellipse cx="59" cy="198" rx="22" ry="8" fill="#343a3c"/></g><g transform="translate(270 135) scale(0.65)"><circle cx="38" cy="27" r="23" fill="#b77e5d"/><path d="M15 23Q12 -3 38 0Q65 0 62 24L55 16L23 16Z" fill="#473b36"/><path d="M12 63Q38 47 65 63L76 133H0Z" fill="#698ba0"/><path d="M10 134H35V194H7Z M41 134H66L72 194H43Z" fill="#3f5366"/><path d="M11 69L-2 115L5 121L25 76 M63 69L84 110L78 117L51 80" fill="#b77e5d"/><ellipse cx="17" cy="198" rx="22" ry="8" fill="#343a3c"/><ellipse cx="59" cy="198" rx="22" ry="8" fill="#343a3c"/></g><g transform="translate(460 135) scale(0.65)"><circle cx="38" cy="27" r="23" fill="#b77e5d"/><path d="M15 23Q12 -3 38 0Q65 0 62 24L55 16L23 16Z" fill="#473b36"/><path d="M12 63Q38 47 65 63L76 133H0Z" fill="#bf9755"/><path d="M10 134H35V194H7Z M41 134H66L72 194H43Z" fill="#3f5366"/><path d="M11 69L-2 115L5 121L25 76 M63 69L84 110L78 117L51 80" fill="#b77e5d"/><ellipse cx="17" cy="198" rx="22" ry="8" fill="#343a3c"/><ellipse cx="59" cy="198" rx="22" ry="8" fill="#343a3c"/></g><text x="35" y="330" font-size="30" fill="#233a47" font-weight="400">Ninguno.</text><text x="35" y="395" font-size="28" fill="#233a47" font-weight="400">alguna fecha = any date</text></g></svg>
<svg x="0" y="1090" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 485" width="680" height="485" role="img" aria-labelledby="title desc"><title id="title">La puerta se abre</title><desc id="desc">Two door states with an opening arrow support the allocated intransitive abrirse. No impersonal agent or new passive construction is introduced.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="485" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="32" fill="#233a47" font-weight="700">La puerta se abre.</text><text x="35" y="95" font-size="28" fill="#233a47" font-weight="400">The door opens.</text><rect x="80" y="145" width="200" height="245" rx="8" fill="#cbd8db" stroke="#71838a" stroke-width="3"/><path d="M80 145L220 185V385L80 390Z" fill="#966c4e" stroke="#604633" stroke-width="4"/><path d="M315 250L390 250" stroke="#367c85" stroke-width="6" marker-end="url(#arrow)"/><rect x="445" y="145" width="160" height="245" rx="8" fill="#cbd8db" stroke="#71838a" stroke-width="3"/><path d="M445 145L470 185V385L445 390Z" fill="#966c4e" stroke="#604633" stroke-width="4"/><text x="35" y="450" font-size="28" fill="#233a47" font-weight="400">se abre = opens</text></g></svg>
</svg>