<svg xmlns="http://www.w3.org/2000/svg" width="360" height="502" viewBox="0 0 360 502"><title>Chapter 19 reading aid</title><desc>volunteer: someone who freely offers help; reader: someone who reads; notice: a written message for people to read; organise: arrange the people, work and time</desc><rect width="360" height="502" rx="14" fill="#fbf5e8"/><text x="16" y="32" font-family="sans-serif" font-size="21" fill="#163e50">Palabras · Meanings</text><text x="16" y="74" font-family="sans-serif" font-size="21" fill="#163e50">voluntario / voluntaria</text><text x="16" y="116" font-family="sans-serif" font-size="19" fill="#222">volunteer: someone who freely</text><text x="16" y="144" font-family="sans-serif" font-size="19" fill="#222">offers help</text><text x="16" y="186" font-family="sans-serif" font-size="21" fill="#163e50">lector / lectora</text><text x="16" y="228" font-family="sans-serif" font-size="19" fill="#222">reader: someone who reads</text><text x="16" y="270" font-family="sans-serif" font-size="21" fill="#163e50">anuncio</text><text x="16" y="312" font-family="sans-serif" font-size="19" fill="#222">notice: a written message for</text><text x="16" y="340" font-family="sans-serif" font-size="19" fill="#222">people to read</text><text x="16" y="382" font-family="sans-serif" font-size="21" fill="#163e50">organizar</text><text x="16" y="424" font-family="sans-serif" font-size="19" fill="#222">organise: arrange the people,</text><text x="16" y="452" font-family="sans-serif" font-size="19" fill="#222">work and time</text></svg>
