<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180"><title>Chapter 19 reading aid</title><desc>Here se lo means “it to her”: se replaces le before lo.</desc><rect width="360" height="180" rx="14" fill="#edf3ed"/><text x="16" y="32" font-family="sans-serif" font-size="21" fill="#222">se lo lee = le lee el</text><text x="16" y="60" font-family="sans-serif" font-size="21" fill="#222">anuncio</text><text x="16" y="102" font-family="sans-serif" font-size="19" fill="#222">Here se lo means “it to her”:</text><text x="16" y="130" font-family="sans-serif" font-size="19" fill="#222">se replaces le before lo.</text></svg>
