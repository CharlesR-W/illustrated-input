<svg xmlns="http://www.w3.org/2000/svg" width="360" height="208" viewBox="0 0 360 208"><title>Chapter 19 reading aid</title><desc>Volunteers are wanted. Receptive se: the notice leaves the organiser unnamed.</desc><rect width="360" height="208" rx="14" fill="#edf3ed"/><text x="16" y="32" font-family="sans-serif" font-size="21" fill="#222">Se buscan voluntarios =</text><text x="16" y="60" font-family="sans-serif" font-size="21" fill="#222">buscamos voluntarios</text><text x="16" y="102" font-family="sans-serif" font-size="19" fill="#222">Volunteers are wanted.</text><text x="16" y="130" font-family="sans-serif" font-size="19" fill="#222">Receptive se: the notice leaves</text><text x="16" y="158" font-family="sans-serif" font-size="19" fill="#222">the organiser unnamed.</text></svg>
