<svg xmlns="http://www.w3.org/2000/svg" width="360" height="208" viewBox="0 0 360 208"><title>Chapter 19 reading aid</title><desc>It is possible to open. Reading support only; no se-form production item.</desc><rect width="360" height="208" rx="14" fill="#edf3ed"/><text x="16" y="32" font-family="sans-serif" font-size="21" fill="#222">Se puede abrir = podemos</text><text x="16" y="60" font-family="sans-serif" font-size="21" fill="#222">abrir</text><text x="16" y="102" font-family="sans-serif" font-size="19" fill="#222">It is possible to open.</text><text x="16" y="130" font-family="sans-serif" font-size="19" fill="#222">Impersonal se is reading-only;</text><text x="16" y="158" font-family="sans-serif" font-size="19" fill="#222">recipient se lo is practised.</text></svg>
