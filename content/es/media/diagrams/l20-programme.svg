<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" width="680" height="550" role="img" aria-labelledby="title desc"><title id="title">El programa antes de la solicitud</title><desc id="desc">The current order is letter, mother’s tale, Rosa’s page at six. This does not presume Rosa accepts a later change.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="550" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="32" fill="#233a47" font-weight="700">programa = programme</text><text x="35" y="95" font-size="28" fill="#233a47" font-weight="400">the order of the reading</text><rect x="60" y="135" width="560" height="375" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><text x="95" y="195" font-size="32" fill="#233a47" font-weight="700">seis</text><text x="95" y="275" font-size="30" fill="#233a47" font-weight="400">primero: carta</text><text x="95" y="355" font-size="30" fill="#233a47" font-weight="400">después: cuento</text><text x="95" y="435" font-size="30" fill="#233a47" font-weight="400">después: Rosa</text></g></svg>
