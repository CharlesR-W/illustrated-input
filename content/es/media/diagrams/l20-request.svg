<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img" aria-labelledby="title desc"><title id="title">Pedir una hora</title><desc id="desc">Clothed Elena requests one private room for one hour. The request noun, favour and three bounded polite frames are explicitly translated.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="640" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="30" fill="#233a47" font-weight="700">pedir = request / ask for</text><g transform="translate(60 115) scale(0.8)"><circle cx="38" cy="27" r="23" fill="#b77e5d"/><path d="M15 23Q12 -3 38 0Q65 0 62 24L55 16L23 16Z" fill="#473b36"/><path d="M12 63Q38 47 65 63L76 133H0Z" fill="#b85d59"/><path d="M10 134H35V194H7Z M41 134H66L72 194H43Z" fill="#3f5366"/><path d="M11 69L-2 115L5 121L25 76 M63 69L84 110L78 117L51 80" fill="#b77e5d"/><ellipse cx="17" cy="198" rx="22" ry="8" fill="#343a3c"/><ellipse cx="59" cy="198" rx="22" ry="8" fill="#343a3c"/></g><rect x="220" y="150" width="375" height="165" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><text x="245" y="195" font-size="28" fill="#233a47" font-weight="400">solicitud = request</text><text x="245" y="250" font-size="30" fill="#233a47" font-weight="400">seis a siete</text><text x="35" y="380" font-size="28" fill="#233a47" font-weight="400">favor = favour / act of help</text><text x="35" y="440" font-size="28" fill="#233a47" font-weight="400">¿Podría usted…? = Could you…?</text><text x="35" y="495" font-size="28" fill="#233a47" font-weight="400">¿Me haría el favor…?</text><text x="35" y="540" font-size="28" fill="#233a47" font-weight="400">Would you do me the favour…?</text><text x="35" y="600" font-size="28" fill="#233a47" font-weight="400">Me gustaría… = I would like…</text></g></svg>
