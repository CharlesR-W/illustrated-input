<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img" aria-labelledby="title desc"><title id="title">La sala privada si llueve</title><desc id="desc">Three white chairs and the mother’s red chair fit in the family room with a clear door-to-table route. Black public-room chair and key are not moved. Permission is Saturday six to seven if rain.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="640" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="32" fill="#233a47" font-weight="700">Si llueve → dentro</text><text x="35" y="90" font-size="28" fill="#233a47" font-weight="400">If it rains → inside</text><rect x="45" y="130" width="590" height="365" rx="8" fill="#f1e8d5" stroke="#71838a" stroke-width="3"/><rect x="270" y="235" width="220" height="130" rx="8" fill="#c89b6d" stroke="#71838a" stroke-width="3"/><text x="310" y="310" font-size="30" fill="#233a47" font-weight="400">mesa</text><rect x="75" y="155" width="110" height="70" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><rect x="75" y="365" width="110" height="70" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><rect x="480" y="155" width="110" height="70" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><rect x="480" y="390" width="110" height="70" rx="8" fill="#b85d59" stroke="#71838a" stroke-width="3"/><text x="65" y="540" font-size="30" fill="#233a47" font-weight="400">cuatro sillas</text><text x="335" y="540" font-size="30" fill="#233a47" font-weight="400">puerta</text><path d="M300 495V445H225V165" stroke="#367c85" stroke-width="7" fill="none" marker-end="url(#arrow)"/><text x="65" y="600" font-size="30" fill="#233a47" font-weight="400">de seis a siete</text></g></svg>
