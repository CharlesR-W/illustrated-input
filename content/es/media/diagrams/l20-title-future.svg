<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" width="680" height="570" role="img" aria-labelledby="title desc"><title id="title">El día de mañana</title><desc id="desc">The supplied title is explicitly translated. Clothed Ana accepts the door task; future labels establish will open, will come and future. Día is title metadata only.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="570" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="32" fill="#233a47" font-weight="700">El día de mañana</text><text x="35" y="92" font-size="28" fill="#233a47" font-weight="400">Tomorrow; also: the future</text><g transform="translate(65 155) scale(1)"><circle cx="38" cy="27" r="23" fill="#b77e5d"/><path d="M15 23Q12 -3 38 0Q65 0 62 24L55 16L23 16Z" fill="#473b36"/><path d="M12 63Q38 47 65 63L76 133H0Z" fill="#b85d59"/><path d="M10 134H35V194H7Z M41 134H66L72 194H43Z" fill="#3f5366"/><path d="M11 69L-2 115L5 121L25 76 M63 69L84 110L78 117L51 80" fill="#b77e5d"/><ellipse cx="17" cy="198" rx="22" ry="8" fill="#343a3c"/><ellipse cx="59" cy="198" rx="22" ry="8" fill="#343a3c"/></g><rect x="185" y="190" width="170" height="125" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><text x="205" y="240" font-size="28" fill="#233a47" font-weight="400">puerta</text><text x="395" y="220" font-size="30" fill="#233a47" font-weight="400">abriré</text><text x="395" y="265" font-size="28" fill="#233a47" font-weight="400">I will open</text><text x="395" y="340" font-size="30" fill="#233a47" font-weight="400">vendrá</text><text x="395" y="385" font-size="28" fill="#233a47" font-weight="400">will come</text><text x="35" y="480" font-size="30" fill="#233a47" font-weight="400">futuro = future</text><text x="35" y="530" font-size="28" fill="#233a47" font-weight="400">mañana: no es hoy</text></g></svg>
