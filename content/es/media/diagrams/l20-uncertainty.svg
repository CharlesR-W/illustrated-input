<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" height="590" role="img" aria-labelledby="title desc"><title id="title">Quizá, probablemente y el tiempo</title><desc id="desc">Both rain and no rain remain possible. Inline cues distinguish perhaps/probably and restrict tiempo to weather.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="590" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="30" fill="#233a47" font-weight="700">quizá / quizás = perhaps / maybe</text><rect x="35" y="100" width="275" height="125" rx="8" fill="#d5e6ed" stroke="#71838a" stroke-width="3"/><rect x="370" y="100" width="275" height="125" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><text x="60" y="175" font-size="30" fill="#233a47" font-weight="400">lloverá</text><text x="395" y="175" font-size="30" fill="#233a47" font-weight="400">no lloverá</text><text x="35" y="300" font-size="30" fill="#233a47" font-weight="700">probablemente = probably</text><text x="35" y="365" font-size="28" fill="#233a47" font-weight="400">No sabemos.</text><text x="35" y="440" font-size="32" fill="#233a47" font-weight="700">tiempo = weather</text><text x="35" y="500" font-size="28" fill="#233a47" font-weight="400">¿Qué tiempo hará mañana?</text><text x="35" y="550" font-size="28" fill="#233a47" font-weight="400">What will the weather be like?</text></g></svg>
