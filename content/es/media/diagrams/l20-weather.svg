<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" height="590" role="img" aria-labelledby="title desc"><title id="title">Viento y lluvia</title><desc id="desc">Wind carries the paper; current rain makes the paper and outdoor chairs vulnerable. This illustrates Friday, without certifying Saturday’s weather.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#367c85"/></marker></defs><rect width="680" height="590" fill="#faf4e8"/><g font-family="sans-serif"><text x="35" y="45" font-size="32" fill="#233a47" font-weight="700">viento = wind</text><path d="M40 110C95 70 155 145 210 105M40 155C105 115 155 200 225 150M40 200C100 165 155 240 225 200" stroke="#5c9fa6" stroke-width="9" fill="none"/><rect x="290" y="105" width="130" height="100" rx="8" fill="#fff" stroke="#71838a" stroke-width="3"/><text x="305" y="165" font-size="28" fill="#233a47" font-weight="400">papel</text><path d="M450 165L595 165" stroke="#367c85" stroke-width="6" marker-end="url(#arrow)"/><text x="35" y="290" font-size="32" fill="#233a47" font-weight="700">llover = to rain</text><path d="M65 325l-18 50M95 400l-18 50" stroke="#5f98bd" stroke-width="7"/><path d="M150 325l-18 50M180 400l-18 50" stroke="#5f98bd" stroke-width="7"/><path d="M235 325l-18 50M265 400l-18 50" stroke="#5f98bd" stroke-width="7"/><path d="M320 325l-18 50M350 400l-18 50" stroke="#5f98bd" stroke-width="7"/><path d="M405 325l-18 50M435 400l-18 50" stroke="#5f98bd" stroke-width="7"/><path d="M490 325l-18 50M520 400l-18 50" stroke="#5f98bd" stroke-width="7"/><path d="M575 325l-18 50M605 400l-18 50" stroke="#5f98bd" stroke-width="7"/><path d="M35 480Q175 465 330 482T645 480" fill="none" stroke="#5f98bd" stroke-width="7"/><text x="35" y="550" font-size="28" fill="#233a47" font-weight="400">lluvia: agua fuera</text></g></svg>
