<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760"><title>Quién, qué y dónde</title><desc>Three questions distinguish a person, an object and a location. Luis points to the red key in his own hand as here, and to Ana farther away as there.</desc><rect width="680" height="760" fill="#fff9eb"/><style>text{font:25px sans-serif;fill:#24323d}.fine{fill:none;stroke:#36454f;stroke-width:3}</style><g transform="translate(104,190)"><ellipse cx="0" cy="-64" rx="24" ry="29" fill="#bb805d"/><path d="M-23 -72Q-20 -113 20 -83L23 -67Q0 -84 -23 -72" fill="#34302d"/><circle cx="-8" cy="-65" r="2.5" fill="#302722"/><circle cx="8" cy="-65" r="2.5" fill="#302722"/><path d="M-6 -49Q0 -44 6 -49" class="fine"/><path d="M-23 -33L23 -33L34 54L-34 54Z" fill="#dfac43"/><path d="M-22 54L-23 125M22 54L23 125" stroke="#354c67" stroke-width="23"/><path d="M-20 -22L-57 35M20 -22L60 8" fill="none" stroke="#bb805d" stroke-width="13" stroke-linecap="round"/><text x="-25" y="160">Ana</text></g><g transform="translate(365,190)"><ellipse cx="0" cy="-64" rx="24" ry="29" fill="#bb805d"/><path d="M-23 -72Q-20 -113 20 -83L23 -67Q0 -84 -23 -72" fill="#34302d"/><circle cx="-8" cy="-65" r="2.5" fill="#302722"/><circle cx="8" cy="-65" r="2.5" fill="#302722"/><path d="M-6 -49Q0 -44 6 -49" class="fine"/><path d="M-23 -33L23 -33L34 54L-34 54Z" fill="#31857b"/><path d="M-22 54L-23 125M22 54L23 125" stroke="#354c67" stroke-width="23"/><path d="M-20 -22L-57 35M20 -22L60 8" fill="none" stroke="#bb805d" stroke-width="13" stroke-linecap="round"/><text x="-25" y="160">Luis</text></g><g transform="translate(425,196)"><circle r="14" fill="#c95147" stroke="#3b4045" stroke-width="3"/><path d="M0 14V48H12V38H0" fill="none" stroke="#9c833a" stroke-width="7"/></g><text x="30" y="405">¿Quién tiene la llave? — Luis.</text><text x="30" y="460">¿Qué tiene Luis? — Una llave.</text><text x="30" y="515">¿Dónde está la llave?</text><text x="65" y="550">— En la mano de Luis.</text><path d="M320 0H650V70H320Z" fill="white" stroke="#31857b" stroke-width="3"/><text x="335" y="35">Luis: la llave está aquí.</text><path d="M425 70V180" stroke="#31857b" stroke-width="4"/><path d="M30 595H650V705H30Z" fill="white" stroke="#31857b" stroke-width="3"/><text x="55" y="635">Luis: Ana está allí.</text><path d="M45 595H12V310H75" fill="none" stroke="#31857b" stroke-width="3" stroke-dasharray="7 5"/></svg>