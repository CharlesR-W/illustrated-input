<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" width="480" height="500" role="img" aria-labelledby="t d">
  <title id="t">ἀνα- κατα- δια- εἰσ- ἐκ- ἀπο- προσ-</title>
  <desc id="d">A cross-section of the estate. Upper left, a house on level ground; the ground slopes down to a river in the middle; across it a hill rises to a terrace where a small temple with four columns stands at the edge of an oak wood that covers the upper hill on the right. Labelled arrows: ἐκ- out through the house door; ἀπο- away from the house on its other side; κατα- down the slope to the river; δια- across the river; ἀνα- up the hill; προσ- towards the temple; εἰσ- into the wood.</desc>
