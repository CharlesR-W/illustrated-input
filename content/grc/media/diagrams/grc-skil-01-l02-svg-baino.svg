  <title id="t">διαβαίνω · ἐκβαίνω</title>
  <desc id="d">Two panels of a river seen from above. Top, διαβαίνω: a line of bare footprints goes from one bank straight across the water to the other bank. Bottom, ἐκβαίνω: ripples in mid-river where someone fell, and footprints leading only out of the water up onto the bank.</desc>
