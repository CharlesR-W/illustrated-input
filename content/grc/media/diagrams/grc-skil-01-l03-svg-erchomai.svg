  <title id="t">προσέρχεται · ἀπέρχεται</title>
  <desc id="d">Two panels of a road seen from above, with the farmhouse at its right-hand end. Top, προσέρχεται: footprints walk along the road towards the house, and an arrow points at the house. Bottom, ἀπέρχεται: footprints walk along the road away from the house, and an arrow points away from it.</desc>
