  <title id="t">εἰσέρχεται · ἐξέρχεται</title>
  <desc id="d">Two panels. Top, εἰσέρχεται: the farmhouse with its door open; footprints walk along the path and in through the door, and an arrow points inside. Bottom, ἐξέρχεται: the edge of a wood; footprints come out from among the trees onto open ground towards a river, and an arrow points out of the wood.</desc>
