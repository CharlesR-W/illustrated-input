<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" role="img" aria-labelledby="title desc">
<title id="title">ἀπάγει · προσάγει</title>
<desc id="desc">Two panels. Top, labelled ἀπάγει: a man leads a horse away from the river ford towards a wooded ravine, with an arrow pointing away from the ford. Bottom, labelled προσάγει: the same man leads the horse towards a tall standing figure labelled ὁ Κλέανδρος, with an arrow pointing to him.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b3e2c"/></marker>
<g id="owner"><path d="M-23 52Q-30 69-32 98L-24 142H26L32 98Q30 68 21 52Z" fill="#ad5541" stroke="#5b3a28" stroke-width="2"/><path d="M-21 62L-38 95-30 105-6 75M20 62L38 91 30 102 8 76" fill="#cba17d" stroke="#5b3a28" stroke-width="2"/><path d="M-18 140L-15 170H-5L0 143M8 142L12 170H23L22 140" fill="#cba17d" stroke="#5b3a28" stroke-width="2"/><ellipse cy="31" rx="19" ry="25" fill="#cba17d" stroke="#5b3a28" stroke-width="2"/><path d="M-20 31Q-26 0 0 3Q28 3 21 40L14 19Q-3 7-17 28Z" fill="#4a3729"/><path d="M-18 39Q-19 66 1 66Q21 60 20 38L9 48-7 48Z" fill="#544333"/><circle cx="-6" cy="31" r="2"/><circle cx="8" cy="31" r="2"/></g>
