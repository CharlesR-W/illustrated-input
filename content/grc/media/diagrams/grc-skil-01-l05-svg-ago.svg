<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 675" width="680" height="675" role="img" aria-labelledby="title desc">
<title id="title">ἀπάγω · προσάγω</title><desc id="desc">Two panels compare a horse being led away from Kleandros with a horse brought towards him. The arrows show the paths, and the owner stays on the left.</desc>
