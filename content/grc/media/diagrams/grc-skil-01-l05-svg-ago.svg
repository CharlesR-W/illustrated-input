<g id="horse"><path d="M15 58Q11 37 49 35L101 40 119 16 140 12 157 28 148 44 125 43 117 76 99 88 34 84Z" fill="#9d704b" stroke="#59412e" stroke-width="3"/><path d="M128 17L126 1 139 14M145 17L150 3 151 23" fill="#9d704b" stroke="#59412e" stroke-width="2"/><path d="M24 74L20 128H31L41 82M50 79L53 128H63L66 81M94 80L96 128H108L108 75M110 68L119 125H130L124 59" fill="#9d704b" stroke="#59412e" stroke-width="2"/><path d="M16 52Q-9 55-5 93" fill="none" stroke="#4b3427" stroke-width="9"/><path d="M119 16Q117 47 105 58" fill="none" stroke="#4b3427" stroke-width="7"/><circle cx="141" cy="25" r="3"/><path d="M148 31L131 35" stroke="#e3ccb1" stroke-width="3"/></g>
</defs>
