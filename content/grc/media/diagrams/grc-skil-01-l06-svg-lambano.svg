<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" role="img" aria-labelledby="title desc">
<title id="title">ἀπολαμβάνει · καταλαμβάνει</title>
<desc id="desc">Two panels. Top, labelled ἀπολαμβάνει: a tall man takes back the reins of his own horse, which is tied to a tree; a curved arrow returns the horse to him. Bottom, labelled καταλαμβάνει: a running man reaches out and catches up with a running hound; a straight arrow behind him ends at the hound.</desc>
<defs>
