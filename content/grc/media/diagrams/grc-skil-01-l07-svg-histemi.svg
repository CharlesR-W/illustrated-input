<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
<title id="title">ἀνίσταται · καθίστησι</title>
<desc id="desc">Two panels. Left, labelled ἀνίσταται: a shepherd who was sitting on a stone rises to his feet; an arrow points straight up beside him. Right, labelled καθίστησι: a man in a cloak sets two boys in place behind him with an outstretched arm; a curved arrow runs from the boys' old position to the place behind him. Pale figures show the earlier positions.</desc>
