<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-label="Xenophon gets up; Xenophon sets cheese on the ground">
<title>ἀνίσταται · κατέστησεν</title><desc>Xenophon rises from a chair on the left. On the right he sets cheese on the ground. The two actions have different objects and are not interchangeable up/down forms.</desc>
