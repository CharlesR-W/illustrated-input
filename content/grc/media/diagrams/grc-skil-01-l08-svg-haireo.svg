<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="title desc"><title id="title">ἀφαιρέω · ἀναιρέω</title><desc id="desc">Taking the cup away from Kleandros compared with picking the cup up from a surface.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#92502e" stroke-width="2"/></marker><g id="cup"><path d="M-22-16H22L16 13Q0 25-16 13Z" fill="#e1e6e9" stroke="#394b59" stroke-width="3"/><path d="M-7 22H7M0 18V22" stroke="#394b59" stroke-width="3"/></g></defs><rect width="840" height="340" rx="18" fill="#faf5ea"/><path d="M420 30V310" stroke="#d0c5ae"/><g font-family="serif" text-anchor="middle" fill="#283a42"><text x="210" y="48" font-size="28">ἀπό- → ἀφαιρέω</text><text x="630" y="48" font-size="28">ἀνά- → ἀναιρέω</text><text x="110" y="265" font-size="24">Κλέανδρος</text><text x="310" y="265" font-size="24">οἱ λῃσταί</text><text x="210" y="310" font-size="22">ἀφείλοντο τὸ ἔκπωμα</text><text x="630" y="310" font-size="22">ἀναιρεῖ τὸ ἔκπωμα</text><text x="720" y="145" font-size="22">ἄνω</text><text x="720" y="252" font-size="22">κάτω</text></g><use href="#cup" x="110" y="180"/><path d="M155 180H300" stroke="#92502e" stroke-width="3" marker-end="url(#arrow)"/><path d="M520 265H670" stroke="#776650" stroke-width="5"/><use href="#cup" x="570" y="240"/><use href="#cup" x="570" y="125" opacity=".65"/><path d="M630 230V130" stroke="#92502e" stroke-width="3" marker-end="url(#arrow)"/></svg>
