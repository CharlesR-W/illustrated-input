<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
<title id="title">ἀφαιρεῖται · ἀναιρεῖ</title>
<desc id="desc">Two panels. Left: a clothed man takes a cup from another man's outstretched hands; a sideways arrow leads away from the other man. Right: a clothed boy lifts a cup from a low table among bronze pots; a straight arrow points up. Pale cups mark the starting positions.</desc>
