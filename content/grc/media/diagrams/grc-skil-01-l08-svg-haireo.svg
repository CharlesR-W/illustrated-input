<g id="man" stroke="#5b3a28" stroke-width="2" stroke-linejoin="round">
<path d="M-25 56L25 56 35 153H-34Z" fill="#657e83"/>
<path d="M-16 152L-17 198H-4L1 153M8 153L13 198H26L22 152" fill="#cba17d"/>
