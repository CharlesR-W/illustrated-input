<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240"><title>Into and out</title><desc>Meat is thrown into the fire; Psyche is driven out of the temple.</desc><rect width="760" height="240" fill="#faf6eb"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#735638"/></marker></defs><g font-family="serif" fill="#302c25" text-anchor="middle"><text x="190" y="35" font-size="24">ἐν- → ἐμ-βάλλει</text><text x="570" y="35" font-size="24">ἐκ-βάλλει</text><rect x="125" y="95" width="130" height="105" fill="#f4dfbf" stroke="#735638" stroke-width="2"/><text x="190" y="155" font-size="22">τὸ πῦρ</text><path d="M25 120H120" stroke="#735638" stroke-width="3" marker-end="url(#a)"/><text x="65" y="90" font-size="20">κρέα</text><rect x="440" y="95" width="130" height="105" fill="#e8e5d6" stroke="#735638" stroke-width="2"/><text x="505" y="155" font-size="22">ὁ ναός</text><path d="M580 120H710" stroke="#735638" stroke-width="3" marker-end="url(#a)"/><text x="650" y="90" font-size="20">ἡ Ψυχή</text></g></svg>