<title id="title">ἐμβάλλει · ἐκβάλλει</title>
<desc id="desc">Two panels. Left: a clothed man throws a piece of meat into a fire; an arrow points into the flames. Right: a clothed man gestures from a temple doorway as a dog runs outside; an arrow points out of the doorway. The diagram shows direction, without depicting the dog being thrown.</desc>
