<pattern id="wicker" width="16" height="14" patternUnits="userSpaceOnUse"><rect width="16" height="14" fill="#c79e65"/><path d="M0 3H16M4 0V14M12 0V14" stroke="#967044" stroke-width="1.5"/></pattern>
</defs>
