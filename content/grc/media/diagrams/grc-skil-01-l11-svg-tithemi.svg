<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
<title id="title">ἐκτίθησι · ἐπιτίθησι</title>
<desc id="desc">Two spatial panels. Left: a herdsman sets a basket down on a bare mountainside outside a hut; an arrow leads away from the hut to the basket. Right: a woman lowers a gold necklace onto a swaddled baby lying in a basket; an arrow points down onto it.</desc>
