<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title desc"><title id="title">Ὅπως· τρία ἔργα</title><desc id="desc">Three learner-reference columns distinguish purpose, care or effort, and a reported question. The examples match the grammar table.</desc><rect width="900" height="660" rx="18" fill="#f8f4e9"/><path d="M300 120v510M600 120v510M20 215h860" stroke="#66858a" stroke-width="3"/><g fill="#203c45" font-family="serif" text-anchor="middle" font-size="54"><text x="450" y="75">Ὅπως· τρία ἔργα</text><text x="150" y="180">τέλος</text><text x="450" y="180">ἐπιμέλεια</text><text x="750" y="180">ἐρώτησις</text><text x="150" y="290">ἀφεῖλον</text><text x="150" y="355">ὅπως …</text><text x="150" y="420">γνωρίζοι</text><text x="450" y="290">ἐπεμελεῖτο</text><text x="450" y="355">ὅπως …</text><text x="450" y="420">σβέσουσιν</text><text x="750" y="290">ἐρωτᾷ</text><text x="750" y="355">ὅπως …</text><text x="750" y="420">ἔπεσεν</text><text x="150" y="530">τίνος</text><text x="150" y="595">ἕνεκα;</text><text x="450" y="530">τί</text><text x="450" y="595">γενήσεται;</text><text x="750" y="530">πῶς;</text></g></svg>
