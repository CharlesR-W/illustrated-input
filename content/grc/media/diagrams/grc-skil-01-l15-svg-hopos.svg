<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Ὅπως· τρία ἔργα</title>
<desc id="desc">Three columns distinguish purpose, effort, and reported question. Each gives the main verb type, mood, and the corresponding chapter example: s005, s004, s093. Future indicative is retained in this chapter’s effort examples after past main verbs.</desc>
<rect width="900" height="900" rx="20" fill="#f8f4e9" />
<path d="M300 115v760M600 115v760M20 210h860M20 390h860M20 565h860" fill="none" stroke="#91a3a0" stroke-width="2" />
<g fill="#203c45" font-family="'DejaVu Serif',serif" text-anchor="middle">
<text x="450" y="72" font-size="52">Ὅπως· τρία ἔργα</text>
<g font-size="50" font-weight="bold"><text x="150" y="175">τέλος</text><text x="450" y="175">ἐπιμέλεια</text><text x="750" y="175">ἐρώτησις</text></g>
<g font-size="50">
<text x="150" y="273">πρᾶξις</text><text x="150" y="342">ἔπεμψεν</text>
<text x="450" y="273">ἐπιμέλεια</text><text x="450" y="342" transform="translate(450 0) scale(0.968 1) translate(-450 0)">ἐπεμελεῖτο</text>
<text x="750" y="273">οἶδα</text><text x="750" y="342">ἐρωτῶ</text>
<text x="150" y="446">ὑποτακτ.</text><text x="150" y="500">ἢ εὐκτική</text>
<text x="450" y="446">μέλλων</text><text x="450" y="500">ὁριστική</text>
<text x="750" y="446">ὁριστική</text><text x="750" y="500">ἢ εὐκτική</text>
<text x="150" y="628">ἔπεμψεν,</text><text x="150" y="688">ὅπως …</text><text x="150" y="744">παρεῖεν</text>
<text x="450" y="628" transform="translate(450 0) scale(0.968 1) translate(-450 0)">ἐπεμελεῖτο</text><text x="450" y="688">ὅπως …</text><text x="450" y="744" transform="translate(450 0) scale(0.863 1) translate(-450 0)">εὑρεθήσεται</text>
<text x="750" y="628">ὅπως …</text><text x="750" y="688">ἦλθεν,</text><text x="750" y="744">οὐδεὶς</text><text x="750" y="800">οἶδεν</text>
