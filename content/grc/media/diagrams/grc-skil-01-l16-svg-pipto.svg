<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1380" viewBox="0 0 900 1380" role="img" aria-labelledby="title desc">
<title id="title">ἐκπίπτω καὶ ἐμπίπτω</title>
<desc id="desc">Two panels show falling out of a city or fire and falling upon a box labelled for the Greeks. The examples distinguish exile, a falling piece of wood, fear and attack.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a84f28"/></marker></defs>
<rect width="900" height="1380" rx="24" fill="#faf7ed"/>
<g font-family="Georgia, 'Noto Serif', serif" text-anchor="middle" fill="#253b40">
<rect x="20" y="20" width="860" height="590" rx="22" fill="#edf2ee" stroke="#c2cec6" stroke-width="2"/>
<text x="450" y="91" font-size="60">ἐκ-πίπτω</text>
<circle cx="300" cy="260" r="110" fill="#fffdf6" stroke="#4b6d68" stroke-width="5"/>
<text x="300" y="248" font-size="50">πόλις</text><text x="300" y="309" font-size="50">πῦρ</text>
<path d="M 425 260 H 740" stroke="#a84f28" stroke-width="9" marker-end="url(#arrow)"/>
<circle cx="752" cy="260" r="13" fill="#253b40"/>
<text x="450" y="429" font-size="50">ἐκ τῶν Ἀθηνῶν</text>
<text x="450" y="481" font-size="50">ἐξέπεσες</text>
<text x="450" y="561" font-size="50">ἐκ τοῦ πυρὸς ἐξέπεσεν</text>
<rect x="20" y="630" width="860" height="730" rx="22" fill="#f5ece1" stroke="#d4c0ac" stroke-width="2"/>
<text x="450" y="703" font-size="60">ἐμ-πίπτω</text>
<path d="M 450 745 V 870" stroke="#a84f28" stroke-width="9" marker-end="url(#arrow)"/>
<rect x="260" y="885" width="380" height="110" rx="18" fill="#fffdf6" stroke="#4b6d68" stroke-width="5"/>
<text x="450" y="958" font-size="50">τοῖς Ἕλλησι</text>
<text x="450" y="1124" font-size="50">φόβος αὐτοῖς ἐνέπεσεν</text>
<text x="450" y="1220" font-size="50">φεύγουσιν αὐτοῖς</text>
<text x="450" y="1290" font-size="50">ἐμπέσετε</text>
</g></svg>
