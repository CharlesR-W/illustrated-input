<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Πίπτω· ἐκ- / ἐμ-</title><desc id="desc">Outward movement from a city contrasts with inward movement into fire. Exile is an established meaning of the outward compound; the inward compound can take a dative.</desc><rect width="900" height="620" rx="18" fill="#f8f4e9"/><g font-family="serif" text-anchor="middle" fill="#203c45" font-size="54"><text x="450" y="75">πίπτω</text><text x="225" y="155">ἐκ-</text><text x="675" y="155">ἐν- → ἐμ-</text><text x="225" y="460">ἐξ Ἀθηνῶν</text><text x="225" y="535">ἐξέπεσον</text><text x="675" y="460">τῷ πυρί</text><text x="675" y="535">ἐμπίπτει</text></g><g fill="none" stroke="#426e76" stroke-width="6"><rect x="190" y="215" width="150" height="150"/><path d="M265 290H75m0 0 35-25m-35 25 35 25"/><rect x="665" y="215" width="150" height="150"/><path d="M530 290H740m0 0-35-25m35 25-35 25"/></g></svg>
