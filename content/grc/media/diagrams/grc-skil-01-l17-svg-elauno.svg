<svg xmlns="http://www.w3.org/2000/svg" width="728" height="1300" viewBox="0 0 728 1300" role="img" aria-labelledby="title desc">
 <title id="title">ἐξελαύνω καὶ ἀπελαύνω</title>
 <desc id="desc">An arrow leaves the field across its boundary, then continues away toward Damaretus’s field. A marked stone stands inside the first field.</desc>
 <defs><marker id="arrow" markerWidth="30" markerHeight="30" refX="24" refY="15" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L30 15L0 30Z" fill="#385b55"/></marker></defs>
 <rect width="728" height="1300" rx="24" fill="#faf7ed"/>
 <g font-family="Noto Serif, DejaVu Serif, serif" font-size="40" fill="#273d36">
  <rect x="48" y="60" width="632" height="440" rx="16" fill="#e1ead5" stroke="#617b51" stroke-width="4"/>
  <text x="364" y="132" text-anchor="middle">ὁ ἀγρός</text>
  <rect x="220" y="190" width="340" height="100" rx="12" fill="#e5dfd0" stroke="#817f70" stroke-width="3"/>
  <text x="390" y="255" text-anchor="middle">ὁ λίθος</text>
  <path d="M112 350V735" fill="none" stroke="#385b55" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="162" y="594">ἐξ-ελαύνω ·</text>
  <text x="162" y="656">ἐκ τοῦ ἀγροῦ</text>
  <path d="M112 790V1058" fill="none" stroke="#385b55" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="162" y="899">ἀπ-ελαύνω ·</text>
  <text x="162" y="961">οἴκαδε</text>
  <rect x="48" y="1100" width="632" height="140" rx="16" fill="#e8e0cd" stroke="#8f8061" stroke-width="4"/>
  <text x="364" y="1186" text-anchor="middle">ὁ τοῦ Δαμαρέτου ἀγρός</text>
 </g>
</svg>
