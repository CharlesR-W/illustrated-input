<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Ἐξελαύνω · ἀπελαύνω</title>
<desc id="desc">A blue path starts inside a bounded meadow and crosses its right boundary: drive out. A second orange arrow continues away from the spring toward the road: drive away. Both arrows point in the direction of the flock’s movement.</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#175f92"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a04c13"/></marker></defs>
<rect width="900" height="650" fill="#fffdf6"/>
<g font-family="Georgia, serif" font-size="54" fill="#252c2f" text-anchor="middle">
<text x="450" y="68">ἐλαύνω → ἄγω</text>
<rect x="40" y="108" width="420" height="235" rx="18" fill="#e4efda" stroke="#527245" stroke-width="5"/>
<text x="245" y="172">ὁ ἀγρός</text>
<ellipse cx="166" cy="280" rx="75" ry="23" fill="#a6d8ed" stroke="#175f92" stroke-width="4"/>
<text x="173" y="246">ἡ πηγή</text>
<path d="M260 288 L570 288" stroke="#175f92" stroke-width="9" marker-end="url(#blue)"/>
<text x="480" y="415" fill="#175f92">ἐξ- → ἐξελαύνω</text>
<text x="450" y="480">ἐκ τοῦ ἀγροῦ</text>
<path d="M600 288 L825 288" stroke="#a04c13" stroke-width="9" marker-end="url(#orange)"/>
<text x="690" y="205">ἡ ὁδός</text>
<text x="450" y="556" fill="#a04c13">ἀπ- → ἀπελαύνω</text>
<text x="450" y="622">ἀπὸ τῆς πηγῆς</text>
</g></svg>
