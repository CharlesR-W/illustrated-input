<svg xmlns="http://www.w3.org/2000/svg" width="900" height="840" viewBox="0 0 900 840" role="img" aria-labelledby="title desc">
<title id="title">Θερμοπύλαι · ὑπομένω · ἀναμένω</title>
<desc id="desc">A schematic, not a geographic map: a narrow passage lies between mountain and sea. The two verbs contrast holding one’s ground against an enemy and waiting for a messenger.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#555" stroke-width="1.5"/></marker></defs>
<rect width="900" height="840" rx="22" fill="#fffdf7"/>
<g font-family="Noto Serif,DejaVu Serif,serif" font-size="52" fill="#263b37">
<text x="450" y="72" text-anchor="middle" font-size="56">Θερμοπύλαι</text>
<rect x="25" y="125" width="255" height="255" rx="16" fill="#e7e0d5" stroke="#8b8171" stroke-width="3"/>
<text x="152" y="270" text-anchor="middle">ὄρος</text>
<rect x="335" y="125" width="230" height="255" rx="8" fill="#f6edca" stroke="#baaa69" stroke-width="3"/>
<text x="450" y="235" text-anchor="middle">στενὴ</text>
<text x="450" y="305" text-anchor="middle">ὁδός</text>
<rect x="620" y="125" width="255" height="255" rx="16" fill="#dcecf2" stroke="#6697aa" stroke-width="3"/>
<text x="747" y="270" text-anchor="middle">θάλαττα</text>
<path d="M330 410 H570" stroke="#875545" stroke-width="8"/>
<text x="450" y="475" text-anchor="middle">Λάκωνες</text>
<path d="M35 505 H865" stroke="#d4cbb8" stroke-width="2"/>
<text x="55" y="575">ὑπο- → ὑπομένω</text>
<text x="55" y="645">τοὺς πολεμίους</text>
<path d="M815 614 H620" fill="none" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
<text x="55" y="725">ἀνα- → ἀναμένω</text>
<text x="55" y="795">τὸν ἄγγελον</text>
<path d="M815 764 H620" fill="none" stroke="#555" stroke-width="4" marker-end="url(#arrow)"/>
</g></svg>
