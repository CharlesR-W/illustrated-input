<svg xmlns="http://www.w3.org/2000/svg" width="728" height="780" viewBox="0 0 728 780" role="img" aria-labelledby="title desc">
  <title id="title">Τὰ στενὰ ἐν Θερμοπύλαις</title>
  <desc id="desc">A schematic narrow pass between mountain above and sea below. A short wall crosses the road. Persians approach from the left; Greeks are on the right. The diagram shows spatial relations, not a geographic coastline.</desc>
  <rect width="728" height="780" rx="24" fill="#faf6ea"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="44" text-anchor="middle" fill="#24333a">
    <rect x="28" y="28" width="672" height="144" rx="20" fill="#d9dfd3"/>
    <text x="364" y="116">τὸ ὄρος</text>
    <rect x="28" y="208" width="672" height="336" rx="20" fill="#eadfbd"/>
    <text x="364" y="272">τὰ στενά</text>
    <rect x="42" y="330" width="274" height="100" rx="16" fill="#fffdf5"/>
    <text x="179" y="393" font-size="42">οἱ Πέρσαι →</text>
    <rect x="412" y="330" width="274" height="100" rx="16" fill="#fffdf5"/>
    <text x="549" y="393" font-size="42">οἱ Ἕλληνες</text>
    <rect x="354" y="318" width="20" height="178" rx="4" fill="#726955"/>
    <text x="364" y="602">τὸ τεῖχος</text>
    <rect x="28" y="638" width="672" height="114" rx="20" fill="#c8e0e8"/>
    <text x="364" y="712">ἡ θάλαττα</text>
  </g>
</svg>
