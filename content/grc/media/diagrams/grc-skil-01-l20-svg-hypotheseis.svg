<svg xmlns="http://www.w3.org/2000/svg" width="256" height="850" viewBox="0 0 256 850" role="img" aria-labelledby="title"><title id="title">Εἰ … ἐάν … ἄν</title><desc>εἰ μετεκίνησεν, οὐκ ἐκέλευσα · ἐὰν δέξηται, ἔσται · εἰ εἴη, ἂν ἐκβάλλοι · εἰ ᾔδειν, ἂν ἦλθον</desc><rect width="256" height="850" fill="#faf8f2"/><g font-family="serif" fill="#202d39"><text x="14" y="28" font-size="20px">Εἰ … ἐάν … ἄν</text><rect x="9" y="46" width="238" height="184" rx="8" fill="#fff" stroke="#697682" stroke-width="1.5"/><text x="22" y="79" font-size="19px">εἰ …, …</text><text x="22" y="121" font-size="18px">εἰ μετεκίνησεν</text><text x="22" y="157" font-size="18px">ἐγὼ οὐκ ἐκέλευσα</text><rect x="9" y="244" width="238" height="184" rx="8" fill="#fff" stroke="#697682" stroke-width="1.5"/><text x="22" y="277" font-size="19px">ἐάν …, …</text><text x="22" y="319" font-size="18px">ἐὰν δέξηται</text><text x="22" y="355" font-size="18px">φίλος ἡμῖν ἔσται</text><rect x="9" y="442" width="238" height="184" rx="8" fill="#fff" stroke="#697682" stroke-width="1.5"/><text x="22" y="475" font-size="19px">εἰ …, ἄν …</text><text x="22" y="517" font-size="18px">εἰ κοινὴ εἴη ἡ νομή</text><text x="22" y="553" font-size="18px">οὐδεὶς ἂν …</text><text x="22" y="589" font-size="18px">ἐκβάλλοι</text><rect x="9" y="640" width="238" height="184" rx="8" fill="#fff" stroke="#697682" stroke-width="1.5"/><text x="22" y="673" font-size="19px">εἰ …, ἄν …</text><text x="22" y="715" font-size="18px">εἰ ᾔδειν</text><text x="22" y="751" font-size="18px">πρῶτον ἂν πρὸς σὲ</text><text x="22" y="787" font-size="18px">ἦλθον</text></g></svg>
