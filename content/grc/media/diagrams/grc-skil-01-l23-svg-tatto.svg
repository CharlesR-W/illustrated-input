<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
<title id="title">Συντάττω · παρατάττω</title><desc id="desc">Two panels. Top: six scattered horsemen are gathered into one ordered block of six (συντάττω, into one order). Bottom: that block of six horsemen stands beside the hoplites' battle line (παρατάττω, beside the phalanx).</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#225f84"/></marker></defs>
<rect width="600" height="760" fill="#fffdf6"/>
<g font-family="Georgia,serif" text-anchor="middle" fill="#24313b">
<text x="300" y="60" font-size="46">συντάττω</text>
<g fill="#e8d8b0" stroke="#8a6d3b" stroke-width="3">
<rect x="30" y="100" width="40" height="32" rx="5"/><rect x="110" y="130" width="40" height="32" rx="5"/><rect x="50" y="175" width="40" height="32" rx="5"/>
<rect x="150" y="90" width="40" height="32" rx="5"/><rect x="140" y="200" width="40" height="32" rx="5"/><rect x="30" y="240" width="40" height="32" rx="5"/>
<rect x="390" y="130" width="40" height="32" rx="5"/><rect x="440" y="130" width="40" height="32" rx="5"/><rect x="490" y="130" width="40" height="32" rx="5"/>
<rect x="390" y="172" width="40" height="32" rx="5"/><rect x="440" y="172" width="40" height="32" rx="5"/><rect x="490" y="172" width="40" height="32" rx="5"/>
</g>
<path d="M215 168L360 168" stroke="#225f84" stroke-width="8" marker-end="url(#arrow)"/>
<text x="300" y="330" font-size="38">εἰς μίαν τάξιν</text>
<path d="M30 370H570" stroke="#d1d1c5" stroke-width="3"/>
<text x="300" y="430" font-size="46">παρατάττω</text>
<rect x="30" y="480" width="330" height="96" rx="8" fill="#c9d6df" stroke="#3c5a6e" stroke-width="3"/>
<text x="195" y="542" font-size="38">φάλαγξ</text>
<g fill="#e8d8b0" stroke="#8a6d3b" stroke-width="3">
<rect x="410" y="490" width="40" height="32" rx="5"/><rect x="460" y="490" width="40" height="32" rx="5"/><rect x="510" y="490" width="40" height="32" rx="5"/>
<rect x="410" y="534" width="40" height="32" rx="5"/><rect x="460" y="534" width="40" height="32" rx="5"/><rect x="510" y="534" width="40" height="32" rx="5"/>
</g>
<text x="480" y="630" font-size="36">ἱππεῖς</text>
<text x="300" y="720" font-size="38">παρὰ τὴν φάλαγγα</text>
</g></svg>
