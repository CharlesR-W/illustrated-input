<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" role="img" aria-labelledby="title desc">
  <title id="title">Δαρείου καὶ Παρυσάτιδος παῖδες</title>
  <desc id="desc">Family tree. Darius and Parysatis at the top, joined by a line; below them their two sons: on the left Artaxerxes, the elder, king; on the right Cyrus, the younger, satrap.</desc>
  <rect width="560" height="500" rx="24" fill="#faf6ea"/>
  <g stroke="#726955" stroke-width="5" fill="none">
    <path d="M250 70 H310"/>
    <path d="M280 70 V200"/>
    <path d="M140 200 H420"/>
    <path d="M140 200 V260"/>
    <path d="M420 200 V260"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle" fill="#24333a">
    <rect x="20" y="25" width="230" height="90" rx="18" fill="#d9dfd3"/>
    <text x="135" y="83" font-size="36">Δαρεῖος</text>
    <rect x="310" y="25" width="230" height="90" rx="18" fill="#d9dfd3"/>
    <text x="425" y="83" font-size="36">Παρύσατις</text>
    <rect x="20" y="260" width="240" height="210" rx="18" fill="#eadfbd"/>
    <text x="140" y="318" font-size="36">Ἀρταξέρξης</text>
    <text x="140" y="378" font-size="32">πρεσβύτερος</text>
    <text x="140" y="430" font-size="32">βασιλεύς</text>
    <rect x="300" y="260" width="240" height="210" rx="18" fill="#eadfbd"/>
    <text x="420" y="318" font-size="36">Κῦρος</text>
    <text x="420" y="378" font-size="32">νεώτερος</text>
    <text x="420" y="430" font-size="32">σατράπης</text>
  </g>
</svg>
