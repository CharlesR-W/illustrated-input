<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc">
  <title id="title">παρελαύνει · προσελαύνει</title>
  <desc id="desc">The review seen from above. Below, the Greek line as three labelled boxes: left wing, middle, right wing, facing up. Above the line a long arrow runs from left to right along the whole front, labelled “rides past” (Cyrus’s path). From the middle of that path a short arrow goes straight down to the middle of the line and stops there, labelled “rides up to” (Pigres riding up to the generals).</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a2e1e"/></marker></defs>
  <rect width="600" height="330" rx="20" fill="#faf6ea"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#24333a" text-anchor="middle">
    <text x="160" y="44">παρελαύνει</text>
  </g>
  <path d="M24,74 L568,74" stroke="#7a2e1e" stroke-width="5" fill="none" marker-end="url(#ah)"/>
  <circle cx="300" cy="74" r="9" fill="#7a2e1e"/>
  <path d="M300,84 L300,178" stroke="#7a2e1e" stroke-width="5" fill="none" stroke-dasharray="10 6" marker-end="url(#ah)"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#24333a"><text x="316" y="142">προσελαύνει</text></g>
  <rect x="14" y="196" width="180" height="112" rx="14" fill="#eadfbd" stroke="#8a7d5c" stroke-width="2"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#24333a" text-anchor="middle"><text x="104" y="244">εὐώνυμον</text><text x="104" y="286">κέρας</text></g>
  <rect x="210" y="196" width="180" height="112" rx="14" fill="#eadfbd" stroke="#8a7d5c" stroke-width="2"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#24333a" text-anchor="middle"><text x="300" y="264">μέσον</text></g>
  <rect x="406" y="196" width="180" height="112" rx="14" fill="#eadfbd" stroke="#8a7d5c" stroke-width="2"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#24333a" text-anchor="middle"><text x="496" y="244">δεξιόν</text><text x="496" y="286">κέρας</text></g>
</svg>
