<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
  <title id="title">συγκαλεῖ · παρακαλεῖ</title>
  <desc id="desc">Two panels. Left, labelled συγκαλεῖ and “πάντας εἰς ἕν”: four small boxes, one in each corner, each with an arrow pointing inward to one central dot, the caller: many are called together to one place. Right, labelled παρακαλεῖ and “παρ’ ἑαυτόν”: one small box with a single arrow that ends beside a central dot, the caller: one person is summoned to the caller’s side.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a2e1e"/></marker></defs>
  <rect width="600" height="340" rx="20" fill="#faf6ea"/>
  <path d="M300,20 L300,320" stroke="#8a7d5c" stroke-width="2" stroke-dasharray="6 6"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#24333a" text-anchor="middle"><text x="150" y="48">συγκαλεῖ</text><text x="450" y="48">παρακαλεῖ</text></g>
  <g font-family="DejaVu Sans, sans-serif" font-size="33" fill="#6b5e3f" text-anchor="middle" font-style="italic"><text x="150" y="318">πάντας εἰς ἕν</text><text x="450" y="318">παρ’ ἑαυτόν</text></g>
  <circle cx="150" cy="180" r="16" fill="#7a2e1e"/>
  <rect x="8" y="62" width="44" height="36" rx="8" fill="#eadfbd" stroke="#8a7d5c" stroke-width="2"/>
  <path d="M53,97 L130,163" stroke="#7a2e1e" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <rect x="208" y="62" width="44" height="36" rx="8" fill="#eadfbd" stroke="#8a7d5c" stroke-width="2"/>
  <path d="M211,100 L166,160" stroke="#7a2e1e" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <rect x="8" y="222" width="44" height="36" rx="8" fill="#eadfbd" stroke="#8a7d5c" stroke-width="2"/>
  <path d="M57,228 L127,192" stroke="#7a2e1e" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <rect x="208" y="222" width="44" height="36" rx="8" fill="#eadfbd" stroke="#8a7d5c" stroke-width="2"/>
  <path d="M206,224 L171,196" stroke="#7a2e1e" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <circle cx="450" cy="180" r="16" fill="#7a2e1e"/>
  <rect x="508" y="72" width="44" height="36" rx="8" fill="#eadfbd" stroke="#8a7d5c" stroke-width="2"/>
  <rect x="464" y="162" width="44" height="36" rx="8" fill="none" stroke="#8a7d5c" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M530,112 L496,152" stroke="#7a2e1e" stroke-width="4" fill="none" marker-end="url(#ah)"/>
</svg>
