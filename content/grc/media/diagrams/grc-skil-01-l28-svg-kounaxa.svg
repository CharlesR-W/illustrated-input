  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#24333a"><text x="272" y="70" text-anchor="middle">βασιλεύς</text></g>
<rect x="60" y="150" width="18" height="12" rx="2" fill="#7a2e1e"/><rect x="104" y="150" width="18" height="12" rx="2" fill="#7a2e1e"/><rect x="148" y="150" width="18" height="12" rx="2" fill="#7a2e1e"/><rect x="192" y="150" width="18" height="12" rx="2" fill="#7a2e1e"/><rect x="236" y="150" width="18" height="12" rx="2" fill="#7a2e1e"/><rect x="280" y="150" width="18" height="12" rx="2" fill="#7a2e1e"/><rect x="324" y="150" width="18" height="12" rx="2" fill="#7a2e1e"/><rect x="368" y="150" width="18" height="12" rx="2" fill="#7a2e1e"/><rect x="412" y="150" width="18" height="12" rx="2" fill="#7a2e1e"/><rect x="456" y="150" width="18" height="12" rx="2" fill="#7a2e1e"/>
