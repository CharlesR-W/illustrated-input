<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
  <title id="title">Κούναξα</title>
  <desc id="desc">Schematic battle plan of Cunaxa seen from above. On the right edge a blue river, the Euphrates. At the top, the King’s battle line, a long dark bar reaching from the river far to the left; a dot marks the King in its middle, which lies beyond the left end of Cyrus’s shorter line. Between the lines a row of small marks, the scythed chariots. At the bottom, Cyrus’s line, shorter: its right part next to the river is the Greeks, and a dot in its middle marks Cyrus. A dashed arrow runs from Cyrus up towards the King. Not to scale.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a2e1e"/></marker></defs>
  <rect width="600" height="420" rx="20" fill="#faf6ea"/>
