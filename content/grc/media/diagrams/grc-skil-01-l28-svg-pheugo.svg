<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
  <title id="title">διαφεύγει · καταφεύγει</title>
  <desc id="desc">Two panels. Left, labelled διαφεύγει: an arrow runs from the bottom right through a gap between two dark blocks (the danger) and on out of the top of the panel: escaping clean away. Right, labelled καταφεύγει: an arrow runs from the bottom left and ends inside a light box with a roof, labelled πρός τινα: fleeing to someone for refuge.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a2e1e"/></marker></defs>
  <rect width="600" height="340" rx="20" fill="#faf6ea"/>
  <path d="M300,20 L300,320" stroke="#8a7d5c" stroke-width="2" stroke-dasharray="6 6"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#24333a" text-anchor="middle"><text x="150" y="50">διαφεύγει</text><text x="450" y="50">καταφεύγει</text></g>
  <rect x="40" y="140" width="80" height="60" rx="6" fill="#5b4a3a"/>
  <rect x="180" y="140" width="80" height="60" rx="6" fill="#5b4a3a"/>
  <path d="M200,300 C170,250 150,220 150,170 C150,130 150,110 150,74" stroke="#7a2e1e" stroke-width="5" fill="none" marker-end="url(#ah)"/>
  <path d="M390,190 L450,140 L510,190 Z" fill="#eadfbd" stroke="#8a7d5c" stroke-width="2"/>
  <rect x="400" y="190" width="100" height="70" fill="#eadfbd" stroke="#8a7d5c" stroke-width="2"/>
  <path d="M330,300 C360,290 400,260 436,232" stroke="#7a2e1e" stroke-width="5" fill="none" marker-end="url(#ah)"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="33" fill="#6b5e3f" font-style="italic" text-anchor="middle"><text x="450" y="312">πρός τινα</text></g>
</svg>
