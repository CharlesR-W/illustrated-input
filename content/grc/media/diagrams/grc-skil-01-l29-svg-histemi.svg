<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">ἔστησε · ἔστη</title>
  <desc id="desc">Two panels. Left, labelled ἔστησε: a bronze-coloured block lies flat on the ground line, and a curved arrow lifts it into a second, upright block beside it; under it the label «τί; τὸν θώρακα»: someone set something up. Right, labelled ἔστη: one upright block stands on the ground line with no arrow; under it the label «αὐτός»: the subject itself stood.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a2e1e"/></marker></defs>
  <rect width="600" height="360" rx="20" fill="#faf6ea"/>
  <path d="M300,20 L300,340" stroke="#8a7d5c" stroke-width="2" stroke-dasharray="6 6"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="36" fill="#24333a" text-anchor="middle"><text x="150" y="58">ἔστησε</text><text x="450" y="58">ἔστη</text></g>
  <path d="M30,262 L270,262 M330,262 L570,262" stroke="#8a7d5c" stroke-width="3"/>
  <rect x="40" y="236" width="96" height="26" rx="5" fill="#b08d3c" opacity="0.45" stroke="#8a7d5c" stroke-width="2"/>
  <rect x="192" y="140" width="44" height="122" rx="6" fill="#b08d3c" stroke="#8a7d5c" stroke-width="2"/>
  <path d="M92,228 C100,150 150,118 182,150" stroke="#7a2e1e" stroke-width="5" fill="none" marker-end="url(#ah)"/>
  <rect x="428" y="140" width="44" height="122" rx="6" fill="#b08d3c" stroke="#8a7d5c" stroke-width="2"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#6b5e3f" font-style="italic" text-anchor="middle"><text x="150" y="314">τί; τὸν θώρακα</text><text x="450" y="314">αὐτός</text></g>
</svg>
