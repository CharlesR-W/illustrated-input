<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
  <title id="title">ἀνατίθημι · κατατίθημι</title>
  <desc id="desc">Two panels. Left, labelled ἀνατίθημι: a small bronze object rests on the ground line, and a curved arrow carries it up onto the top of a tall stone pedestal; under it the label «τῇ θεῷ»: something is set up for a god. Right, labelled κατατίθημι: a small bronze object is held high, and a straight arrow brings it down onto a low bed shape on the ground line; under it the label «ἐν τῇ κλίνῃ»: something is laid down.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a2e1e"/></marker></defs>
  <rect width="600" height="380" rx="20" fill="#faf6ea"/>
  <path d="M300,20 L300,360" stroke="#8a7d5c" stroke-width="2" stroke-dasharray="6 6"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#24333a" text-anchor="middle"><text x="150" y="56">ἀνατίθημι</text><text x="450" y="56">κατατίθημι</text></g>
  <path d="M30,282 L270,282 M330,282 L570,282" stroke="#8a7d5c" stroke-width="3"/>
  <rect x="176" y="146" width="70" height="136" rx="4" fill="#d9cfb4" stroke="#8a7d5c" stroke-width="2"/>
  <rect x="168" y="138" width="86" height="14" rx="3" fill="#d9cfb4" stroke="#8a7d5c" stroke-width="2"/>
  <rect x="196" y="104" width="30" height="34" rx="5" fill="#b08d3c" stroke="#8a7d5c" stroke-width="2"/>
  <rect x="52" y="250" width="30" height="32" rx="5" fill="#b08d3c" opacity="0.45" stroke="#8a7d5c" stroke-width="2"/>
  <path d="M70,240 C76,150 130,96 184,108" stroke="#7a2e1e" stroke-width="5" fill="none" marker-end="url(#ah)"/>
  <rect x="380" y="232" width="150" height="26" rx="6" fill="#d9cfb4" stroke="#8a7d5c" stroke-width="2"/>
  <path d="M388,258 L388,282 M522,258 L522,282" stroke="#8a7d5c" stroke-width="6"/>
  <rect x="440" y="196" width="30" height="34" rx="5" fill="#b08d3c" stroke="#8a7d5c" stroke-width="2"/>
  <rect x="440" y="88" width="30" height="34" rx="5" fill="#b08d3c" opacity="0.45" stroke="#8a7d5c" stroke-width="2"/>
  <path d="M455,130 L455,186" stroke="#7a2e1e" stroke-width="5" fill="none" marker-end="url(#ah)"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="34" fill="#6b5e3f" font-style="italic" text-anchor="middle"><text x="150" y="336">τῇ θεῷ</text><text x="450" y="336">ἐν τῇ κλίνῃ</text></g>
</svg>
