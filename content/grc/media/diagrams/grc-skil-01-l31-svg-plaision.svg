<svg xmlns="http://www.w3.org/2000/svg" width="560" height="530" viewBox="0 0 560 530" font-family="'Gentium Plus','GFS Didot','DejaVu Serif',serif" role="img" aria-labelledby="title desc">
  <title id="title">πλαίσιον</title>
  <desc id="desc">The hollow square seen from above: four thick bronze-coloured bars form a square. An arrow at the top points forward, labelled «πορεία». Above the front bar «Χειρίσοφος»; along the two side bars «οἱ πρεσβύτατοι»; below the rear bar «ὀπισθοφύλακες» and «Ξενοφῶν καὶ Τιμασίων»; inside the square «ὑποζύγια καὶ ὄχλος».</desc>
  <rect x="0" y="0" width="560" height="530" fill="#fbf7ee"/>
  <line x1="280" y1="64" x2="280" y2="34" stroke="#5a4630" stroke-width="5"/>
  <polygon points="280,8 266,36 294,36" fill="#5a4630"/>
  <text x="330" y="46" font-size="32" fill="#5a4630">πορεία</text>
  <text x="280" y="102" font-size="32" text-anchor="middle" fill="#2b2b2b">Χειρίσοφος</text>
  <rect x="140" y="140" width="280" height="250" fill="#efe4c8" stroke="none"/>
  <rect x="120" y="120" width="320" height="22" fill="#8a6d3b"/>
  <rect x="120" y="388" width="320" height="22" fill="#8a6d3b"/>
  <rect x="120" y="120" width="22" height="290" fill="#8a6d3b"/>
  <rect x="418" y="120" width="22" height="290" fill="#8a6d3b"/>
  <text x="280" y="250" font-size="32" text-anchor="middle" fill="#2b2b2b">ὑποζύγια</text>
  <text x="280" y="294" font-size="32" text-anchor="middle" fill="#2b2b2b">καὶ ὄχλος</text>
  <text transform="translate(88,265) rotate(-90)" font-size="32" text-anchor="middle" fill="#2b2b2b">οἱ πρεσβύτατοι</text>
  <text transform="translate(472,265) rotate(90)" font-size="32" text-anchor="middle" fill="#2b2b2b">οἱ πρεσβύτατοι</text>
  <text x="280" y="452" font-size="32" text-anchor="middle" fill="#2b2b2b">ὀπισθοφύλακες</text>
  <text x="280" y="500" font-size="32" text-anchor="middle" fill="#2b2b2b">Ξενοφῶν καὶ Τιμασίων</text>
</svg>
