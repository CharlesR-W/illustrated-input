<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 214" width="340" height="214" role="img" aria-labelledby="t d">
  <title id="t">Sleipnir: átta fætur</title>
  <desc id="d">Siggi's toy horse Sleipnir, carved from pale driftwood, seen from the side: a chunky wooden horse with a carved mane, a short tail and a burnt-dot eye, standing on eight straight peg legs, four under the chest and four under the hindquarters. The legs are numbered 1 to 8.</desc>
  <!-- Redrawn 2026-10-21 (agent AIDS) after owner review: the toy of media-src/is/visual-bible.md §6 and
       reference/prop-sleipnir.png, in strict profile so that all eight pegs can be counted at margin size
       (a Gemini raster could not keep them countable below ~260 px). -->
  <style>
    text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; font-size: 19px; }
    .i { stroke: #3b2f27; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .g { fill: none; stroke: #c4ab80; stroke-width: 1.4; stroke-linecap: round; }
    .p { fill: #dccaa4; }
  </style>
  <rect x="1" y="1" width="338" height="212" fill="#fbf7ee" stroke="#c9bb9a"/>
  <path d="M40 178 H300" stroke="#c9bb9a" stroke-width="1.5"/>
  <g class="i">
    <!-- far-side tail and pegs are drawn first, then the body over their tops -->
    <path d="M268 86 C284 92 292 108 290 132 C286 134 281 132 279 128 C280 114 276 102 266 96 Z" fill="#e6d6b4"/>
    <path d="M281 104 C284 112 285 120 284 128" class="g"/>
    <rect class="p" x="92" y="116" width="11" height="62" rx="4"/>
    <rect class="p" x="108" y="116" width="11" height="62" rx="4"/>
    <rect class="p" x="124" y="116" width="11" height="62" rx="4"/>
    <rect class="p" x="140" y="116" width="11" height="62" rx="4"/>
    <rect class="p" x="206" y="116" width="11" height="62" rx="4"/>
    <rect class="p" x="222" y="116" width="11" height="62" rx="4"/>
    <rect class="p" x="238" y="116" width="11" height="62" rx="4"/>
    <rect class="p" x="254" y="116" width="11" height="62" rx="4"/>
    <!-- one carved silhouette: chest, neck, head, back, rump -->
    <path d="M100 128 C92 120 88 104 86 92 C84 84 80 78 74 74 C66 78 56 84 46 82 C38 80 36 70 40 64 C46 54 56 42 64 35 L66 18 L76 30 C96 32 112 44 122 60 C128 70 134 76 146 78 L246 76 C262 76 272 86 272 100 L270 120 C268 128 262 130 252 130 L216 130 C196 126 168 126 150 130 L104 130 Z" fill="#ece0c6"/>
    <path d="M70 30 L77 22 L82 33 Z" fill="#e2d2ae"/>
