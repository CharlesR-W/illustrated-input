    <path d="M76 30 C96 32 112 44 122 60 C128 70 134 76 146 78 C138 82 128 80 122 76 C121 72 116 70 114 66 C115 61 110 58 108 54 C108 49 102 47 100 44 C99 40 93 39 90 37 C88 34 82 34 80 34 Z" fill="#d9c49c"/>
    <circle cx="62" cy="50" r="3" fill="#4a3a2c" stroke="none"/>
    <circle cx="44.5" cy="69" r="1.7" fill="#6b5640" stroke="none"/>
  </g>
