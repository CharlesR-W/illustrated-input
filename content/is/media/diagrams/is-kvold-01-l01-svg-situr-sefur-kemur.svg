<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170" role="img" aria-labelledby="t d">
  <title id="t">situr, sefur, kemur</title>
  <desc id="d">Three small pictures side by side. Left: afi, an old man with white hair and a white chin-beard in a dark-blue jacket, sits upright on a flat stone with his stick, eyes open; labelled situr. Middle: the same old man on the same stone, head sunk on his chest, eyes shut, asleep; labelled sefur. Right: Snati, a golden sheepdog with a curled tail, trots towards a small turf farmhouse with three wooden gables, an arrow pointing to the house; labelled kemur.</desc>
  <!-- Redrawn 2026-10-21 (agent AIDS) after owner review: drawn, clothed course characters at the Russian
       ru-mir-01-l02-svg-pozy standard; colours from media-src/is/visual-bible.md §5 and the reference sheets. -->
  <style>
    text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; font-size: 20px; }
    .i { stroke: #3b2f27; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .n { fill: none; }
  </style>
  <defs>
    <!-- afi seated on his stone, facing right, without his head (head drawn per pose) -->
    <g id="afi-body" class="i">
      <path d="M26 128 C24 116 30 106 42 104 L74 104 C84 105 89 115 87 128 Z" fill="#9b968c"/>
      <path d="M34 110 C42 107 56 107 66 109" class="n" stroke="#c4bfb4" stroke-width="2"/>
      <path d="M44 95 L77 96 C82 96 84 100 83 104 L81 107 L45 107 Z" fill="#3a332c"/>
      <path d="M74 103 L82 103 L81 122 L75 122 Z" fill="#8c8a84"/>
      <path d="M73 121 L82 121 C86 121 90 123 90 127 L72 127 C72 125 72 123 73 121 Z" fill="#c9ae8a"/>
      <path d="M43 104 C42 90 44 78 48 70 C51 64 60 63 64 66 C67 73 68 88 68 101 L66 106 L44 106 Z" fill="#3e5470"/>
      <path d="M56 66 L60 76 L64 66" fill="#f4f0e6"/>
      <path d="M59 70 L59 92" class="n" stroke="#2a3a4e" stroke-width="1"/>
    </g>
    <g id="afi-arm" class="i">
      <path d="M50 70 C56 78 68 85 80 85 L81 91 C67 91 55 85 48 78 Z" fill="#34485f"/>
      <circle cx="83" cy="88" r="3.6" fill="#e6caa8"/>
      <path d="M86 76 C86 72 91 72 91 76 L90 127" class="n" stroke="#8a6440" stroke-width="3"/>
    </g>
  </defs>

  <rect x="1" y="1" width="358" height="168" fill="#fbf7ee" stroke="#c9bb9a"/>
  <path d="M12 128 H108 M132 128 H228 M252 128 H350" stroke="#c9bb9a" stroke-width="1.5"/>

  <!-- 1. situr: afi upright, eyes open -->
  <use href="#afi-body"/>
  <g class="i">
    <circle cx="60" cy="54" r="10" fill="#e6caa8"/>
    <path d="M69 53 L72 58 L68 59" fill="#e6caa8"/>
    <path d="M51 58 C47 49 51 43 58 42 C62 42 65 43 66 45 C61 45 57 47 56 52 C57 58 57 63 53 68 C50 66 50 62 51 58 Z" fill="#f2efe8"/>
    <path d="M60 61 C61 67 66 69 69 64 C68 62 67 61 66 60 Z" fill="#f2efe8"/>
    <path d="M62 49 L67 48" stroke="#f2efe8" stroke-width="2.4"/>
    <circle cx="65" cy="52" r="1.3" fill="#3b2f27" stroke="none"/>
  </g>
  <use href="#afi-arm"/>

  <!-- 2. sefur: the same, asleep: head sunk forward, eyes shut -->
  <use href="#afi-body" x="120"/>
  <g class="i" transform="translate(120 0) rotate(30 58 68)">
    <circle cx="60" cy="54" r="10" fill="#e6caa8"/>
    <path d="M69 53 L72 58 L68 59" fill="#e6caa8"/>
    <path d="M51 58 C47 49 51 43 58 42 C62 42 65 43 66 45 C61 45 57 47 56 52 C57 58 57 63 53 68 C50 66 50 62 51 58 Z" fill="#f2efe8"/>
    <path d="M60 61 C61 67 66 69 69 64 C68 62 67 61 66 60 Z" fill="#f2efe8"/>
    <path d="M62 49 L67 48" stroke="#f2efe8" stroke-width="2.4"/>
    <path d="M62.5 52.5 C63.5 54 66 54 67 52.5" class="n" stroke-width="1.3"/>
  </g>
  <use href="#afi-arm" x="120"/>
  <g class="n" stroke="#5b6f86" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M200 44 h7 l-7 8 h7"/>
    <path d="M211 26 h10 l-10 11 h10"/>
  </g>

  <!-- 3. kemur: Snati trots to the farm -->
  <g class="i">
    <!-- the farmhouse: three tarred gables with white barge-boards, grass-roofed turf between -->
    <path d="M312 128 V112 C312 104 318 97 324 100 C328 94 342 94 346 100 C352 97 358 104 358 112 V128 Z" fill="#7f9a55"/>
    <path d="M318 103 C322 101 326 101 328 99 M340 99 C343 101 347 100 350 101" class="n" stroke="#a7bd78" stroke-width="1.4"/>
    <path d="M313 128 V118 H357 V128 Z" fill="#a9a196"/>
    <path d="M315 128 V112 L321 103 L327 112 V128 Z" fill="#4a4038"/>
    <path d="M329 128 V110 L335 101 L341 110 V128 Z" fill="#4a4038"/>
    <path d="M343 128 V112 L349 103 L355 112 V128 Z" fill="#4a4038"/>
    <path d="M314 113 L321 102.5 L328 113 M328 111 L335 100.5 L342 111 M342 113 L349 102.5 L356 113" class="n" stroke="#f4f0e6" stroke-width="1.8"/>
    <rect x="319" y="115" width="4.5" height="4.5" fill="#f4f0e6" stroke-width="1"/>
    <rect x="347" y="115" width="4.5" height="4.5" fill="#f4f0e6" stroke-width="1"/>
    <path d="M332.5 128 V118 H337.5 V128" fill="#2e2620"/>
