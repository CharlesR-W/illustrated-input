    <path d="M262 135 H300" class="n" stroke="#b0452f" stroke-width="2.6"/>
    <path d="M298 130.5 L307 135 L298 139.5 Z" fill="#b0452f" stroke="#b0452f" stroke-width="1"/>
    <!-- Snati, trotting right -->
    <g transform="translate(252 128)">
      <path d="M8 -15 L1 -6 L-2 -1 L3 0 L7 -6 L13 -13 Z" fill="#e3b46a"/>
      <path d="M-2 -1 L3 0 L4 -3 L-0.5 -4 Z" fill="#f7efe0"/>
      <path d="M33 -15 L41 -6 L46 -2 L48 -5 L43 -9 L38 -16 Z" fill="#e3b46a"/>
      <path d="M46 -2 L48 -5 L45 -7 L43 -4 Z" fill="#f7efe0"/>
      <path d="M12 -15 L14 -6 L16 0 L21 0 L18 -6 L18 -14 Z" fill="#d49b4e"/>
      <path d="M16 0 L21 0 L20 -3 L16 -3 Z" fill="#f7efe0"/>
      <path d="M34 -15 L31 -6 L29 0 L34 0 L36 -6 L39 -14 Z" fill="#d49b4e"/>
      <path d="M29 0 L34 0 L34.5 -3 L30 -3 Z" fill="#f7efe0"/>
      <path d="M4 -22 C4 -30 14 -32 24 -31 C32 -31 38 -30 41 -25 L41 -16 C32 -12 14 -12 6 -15 C4 -17 4 -20 4 -22 Z" fill="#e3b46a"/>
      <path d="M7 -26 C-2 -30 -2 -45 9 -46 C18 -47 21 -38 15 -34 C14 -40 7 -40 9 -33 Z" fill="#e3b46a"/>
      <path d="M2 -39 C0 -44 4 -47 8 -46" class="n" stroke="#fbf3e2" stroke-width="2.2"/>
      <path d="M34 -28 C36 -34 40 -38 44 -39 L49 -33 C46 -26 44 -20 41 -16 C38 -19 35 -23 34 -28 Z" fill="#f7efe0"/>
      <g transform="translate(46 -34) scale(1.22) translate(-46 34)">
        <path d="M41 -36 L40 -49 L46 -42 Z" fill="#e3b46a"/>
        <path d="M45 -42 L49 -50 L52 -40 Z" fill="#d49b4e"/>
        <path d="M40 -37 C40 -43 45 -45 50 -43 C53 -42 54 -40 55 -38 L61 -35 C60 -32 56 -31 52 -31 C47 -30 42 -32 40 -37 Z" fill="#e3b46a"/>
        <path d="M50 -43 C49 -40 50 -36 52 -31 C56 -31 60 -32 61 -35 L55 -38 C54 -40 52 -42 50 -43 Z" fill="#f7efe0" stroke="none"/>
        <path d="M40 -37 C40 -43 45 -45 50 -43 C53 -42 54 -40 55 -38 L61 -35 C60 -32 56 -31 52 -31 C47 -30 42 -32 40 -37 Z" class="n"/>
        <circle cx="61" cy="-35" r="1.6" fill="#2b2b2b" stroke="none"/>
        <circle cx="51" cy="-39" r="1.2" fill="#3b2f27" stroke="none"/>
      </g>
    </g>
  </g>

  <text x="60" y="158" text-anchor="middle">situr</text>
  <text x="180" y="158" text-anchor="middle">sefur</text>
  <text x="298" y="158" text-anchor="middle">kemur</text>
</svg>
