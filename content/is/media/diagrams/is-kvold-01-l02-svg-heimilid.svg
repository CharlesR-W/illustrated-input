<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" width="360" height="474" role="img" aria-labelledby="t d">
  <title id="t">Heimilið á Hömrum</title>
  <desc id="d">The household of Hamrar as a family tree with a small drawn portrait of each person. Top right: afi, an old man with white hair and a white chin-beard, Guðrún's father. Below him a married couple joined by a dotted line: Bjarni, a dark-bearded man (pabbi), and Guðrún, a fair-haired woman in a black jacket and tasselled cap (mamma). From them a line descends to their three children: Helga, a young woman with honey-blond braids; Siggi, a sandy-haired boy; and Ásta, a small girl in a red dress and black cap. These six stand on a pale panel labelled fjölskylda. Below the panel, outside it: Óli, a red-bearded young man (vinnumaður), and Þórunn, a dark-haired woman with a brown shawl (vinnukona).</desc>
