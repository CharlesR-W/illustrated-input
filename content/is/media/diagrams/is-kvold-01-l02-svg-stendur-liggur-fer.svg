<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170" role="img" aria-labelledby="t d">
  <title id="t">stendur, liggur, fer</title>
  <desc id="d">Three small pictures of Ásta, a little girl with white-blond braids, a dark-red dress, a white apron and a small black tasselled cap. Left: she stands very straight, hands folded; labelled stendur. Middle: she lies in a wooden bed under a striped cover, eyes wide open; labelled liggur. Right: she walks away from a small turf farmhouse with three wooden gables, an arrow pointing away from the house; labelled fer.</desc>
