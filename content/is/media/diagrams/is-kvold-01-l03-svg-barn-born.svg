<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-labelledby="t d">
  <title id="t">barn, börn: a verður ö</title>
  <desc id="d">A picture for the u-umlaut, a becoming ö. Top left: Ásta alone, a little girl with white-blond braids, a dark-red dress, a white apron and a small black tasselled cap; labelled barn (one child). An arrow points right to Siggi and Ásta standing side by side: Siggi is a thin eleven-year-old boy with tousled sandy hair, a brown homespun jacket, grey-brown breeches and sheepskin shoes, a head taller than Ásta; labelled börn (children). Below, three rows of words with a drawn arrow in each: barn to börn, saga to sögur, svart to svört. In every row the a of the left word is bold dark red and the ö of the right word is bold blue.</desc>
  <!-- Drawn 2026-10-26 for Kafli 3. Ásta from is-kvold-01-l02-svg-stendur-liggur-fer.svg; Siggi after his
       portrait in is-kvold-01-l02-svg-heimilid.svg and the l01 tún picture (brown jacket, sandy hair). -->
