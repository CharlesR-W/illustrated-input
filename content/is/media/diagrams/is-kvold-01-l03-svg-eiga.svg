  <title id="t">Bjarni á börn. Afi á bók.</title>
  <desc id="d">Two rows showing what someone has. Top: Bjarni's portrait (dark-bearded, as in the household tree), an arrow, then the portraits of his two children Siggi and Ásta; labelled Bjarni á börn (Bjarni has children). Bottom: afi's portrait (white hair and chin-beard), an arrow, then an old brown leather-bound book; labelled Afi á bók (afi has a book: the book is his).</desc>
