<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="360" height="270" role="img" aria-labelledby="t d">
  <title id="t">Óli er fljótur.</title>
  <desc id="d">Top: a haycock on the left and the turf hay barn on the right; between them Óli runs, leaning forward with an armful of hay, with speed lines behind him, under a two-way arrow labelled kemur og fer (comes and goes). Bottom: three small groups of haycocks, four, then three, then two, joined by arrows: the hay leaves the field quickly. Caption: Óli er fljótur (Óli is quick).</desc>
  <!-- Drawn 2026-11-04 for Kafli 3 s029 (fljótur), after the 2026-11-04 Codex review suggestion. Hand-written. -->
  <style>
    text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; font-size: 21px; }
    .k { font-weight: bold; fill: #b0452f; }
    .s { font-size: 20px; fill: #5f5244; }
  </style>
  <defs>
    <g id="sata"><path d="M-13 0 C-12 -14 -6 -24 0 -25 C6 -24 12 -14 13 0 Z" fill="#d9b86a" stroke="#7a5f2a" stroke-width="1.3" stroke-linejoin="round"/><path d="M-6 -6 L-3 -14 M3 -5 L5 -15 M0 -3 L0 -18" stroke="#a8873f" stroke-width="1"/></g>
  </defs>
  <rect x="1" y="1" width="358" height="268" fill="#fbf7ee" stroke="#c9bb9a"/>
  <!-- ground -->
  <path d="M18 128 H342" stroke="#9fb27a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- haycock, left -->
  <g transform="translate(46 127) scale(1.25)"><use href="#sata"/></g>
  <!-- hay barn, right: turf walls and grass roof, open door -->
  <g transform="translate(300 127)">
    <path d="M-38 0 V-30 H38 V0 Z" fill="#a69a86" stroke="#5f5244" stroke-width="1.4"/>
    <path d="M-38 -10 H38 M-38 -20 H38" stroke="#7d725f" stroke-width="1"/>
    <path d="M-44 -29 C-30 -50 30 -50 44 -29 Z" fill="#8fae5b" stroke="#55703a" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M-10 0 V-22 H10 V0 Z" fill="#3b2f27"/>
  </g>
  <!-- two-way arrow: kemur og fer -->
  <path d="M84 28 H262" stroke="#8a7a5a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M262 21 L276 28 L262 35 Z" fill="#b0452f"/>
  <path d="M84 21 L70 28 L84 35 Z" fill="#b0452f"/>
  <text x="173" y="20" text-anchor="middle" class="s">kemur og fer</text>
  <!-- speed lines -->
  <path d="M112 80 H144 M104 94 H142 M116 108 H146" stroke="#b0452f" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
  <!-- Óli running, leaning forward, armful of hay -->
  <g transform="translate(176 127) scale(0.82)" stroke="#3b2f27" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-2 -40 L-20 -18 L-30 -2" fill="none" stroke="#5a4636" stroke-width="5"/>
    <path d="M-2 -40 L12 -20 L26 -10" fill="none" stroke="#5a4636" stroke-width="5"/>
    <path d="M-10 -44 L6 -78 L16 -74 L4 -40 Z" fill="#efe6d2" stroke-width="1.4"/>
    <path d="M8 -70 L28 -62" fill="none" stroke="#efe6d2" stroke-width="5"/>
    <path d="M12 -84 C24 -96 46 -88 44 -70 C42 -58 22 -56 14 -64 Z" fill="#d9b86a" stroke="#7a5f2a" stroke-width="1.3"/>
    <path d="M20 -80 L32 -72 M28 -86 L38 -76" stroke="#a8873f" stroke-width="1"/>
    <circle cx="12" cy="-92" r="9" fill="#f0d3b8" stroke-width="1.3"/>
    <path d="M6 -88 C8 -82 16 -82 19 -88" fill="#b5532f" stroke="#7a3a22" stroke-width="1"/>
    <path d="M3 -96 C4 -104 20 -105 21 -97 Z" fill="#4a4a4a" stroke-width="1.1"/>
  </g>
  <!-- bottom row: four, three, two haycocks -->
  <g transform="translate(0 196)">
    <g transform="translate(38 0) scale(0.7)"><use href="#sata" x="0"/><use href="#sata" x="30"/><use href="#sata" x="60"/><use href="#sata" x="90"/></g>
    <path d="M118 -9 H138" stroke="#8a7a5a" stroke-width="2" stroke-linecap="round"/><path d="M137 -14 L147 -9 L137 -4 Z" fill="#b0452f"/>
    <g transform="translate(166 0) scale(0.7)"><use href="#sata" x="0"/><use href="#sata" x="30"/><use href="#sata" x="60"/></g>
    <path d="M226 -9 H246" stroke="#8a7a5a" stroke-width="2" stroke-linecap="round"/><path d="M245 -14 L255 -9 L245 -4 Z" fill="#b0452f"/>
    <g transform="translate(274 0) scale(0.7)"><use href="#sata" x="0"/><use href="#sata" x="30"/></g>
    <path d="M18 2 H342" stroke="#9fb27a" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="180" y="250" text-anchor="middle">Óli er <tspan class="k">fljótur</tspan>.</text>
</svg>
