<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440" role="img" aria-labelledby="t d">
  <title id="t">Túnið: sól og rigning</title>
  <desc id="d">Two pictures of the same home field at the turf farm, with the small farmhouse of three wooden gables and a long low turf hay barn at the right. Top, fair weather: a sun in the top left, labelled sól, and two small white clouds; behind the field a long brown-green moor rises to the skyline, labelled heiði; in the left foreground a strip of standing green grass, labelled gras; on the mown field pale rows of drying hay, labelled hey; Óli, the red-bearded farmhand in cap and shirt sleeves, rakes the hay with a long wooden rake, labelled hrífa; beside him a rounded haycock, labelled sáta. Bottom, the storm: the same view, darker; one big black cloud over the moor, labelled ský, with slanted grey rain streaks falling from it, labelled rigning; the field is bare stubble, all the hay gone, and the barn door stands open with hay heaped inside and at the door; the barn is labelled hlaða.</desc>
  <!-- Drawn 2026-10-26 for Kafli 3 (Túnið). Farmhouse from is-kvold-01-l01-svg-situr-sefur-kemur.svg;
       Óli after his portrait in is-kvold-01-l02-svg-heimilid.svg (red hair and beard, white shirt). -->
