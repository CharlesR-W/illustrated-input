<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 248" width="360" height="248" role="img" aria-labelledby="t d">
  <title id="t">mark · Bjarni · Jón</title>
  <desc id="d">Two white Icelandic ewes, head and neck in side view, facing away from each other, each with a large ear pointing in towards the middle. Left: the tip of her ear is cut straight across, a clean flat end marked in red; labelled Bjarni. Right: her ear has one V-shaped notch cut into its upper (front) edge, marked in red, and the tip is whole; labelled Jón. Above, between them, the word mark with a thin arrow to the cut on each ear.</desc>
  <!-- Drawn 2026-10-26 for Kafli 4 (Göngur): earmarks of ownership. Ewe heads after the ewe in
       is-kvold-01-l04-svg-uppi-nidri.svg. Kept distinct from the strange lamb's mark of Kafli 5
       (two V-notches on the back edge and a round hole). -->
  <style>
    text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; font-size: 21px; }
    .i { stroke: #3b2f27; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .n { fill: none; }
  </style>

  <rect x="1" y="1" width="358" height="246" fill="#fbf7ee" stroke="#c9bb9a"/>

  <!-- left ewe: Bjarni's mark -->
  <g class="i">
      <path d="M90 103 C106 91 130 85 150 83 L150 104 C132 107 114 112 96 119 Z" fill="#f4efe4" stroke-width="2"/>
      <path d="M106 105 C118 98 132 94 146 92 L146 97 C132 99 120 103 108 109 Z" fill="#e8b4a4" stroke="none"/>
      <path d="M150 83 L150 104" class="n" stroke="#b0452f" stroke-width="4.4"/>
      <!-- woolly neck and shoulder -->
      <path d="M92 104 C112 108 128 124 138 146 C146 164 150 186 152 204 H58 C60 186 66 166 74 150 C80 138 86 124 92 104 Z" fill="#f1ede3"/>
      <path d="M100 128 c3 -3 7 -3 9 0 M112 146 c3 -3 7 -3 9 0 M90 154 c3 -3 7 -3 9 0 M120 172 c3 -3 7 -3 9 0 M98 178 c3 -3 7 -3 9 0 M76 182 c3 -3 7 -3 9 0 M128 192 c3 -3 7 -3 9 0" class="n" stroke="#cfc6b2" stroke-width="1.3"/>
      <!-- the head -->
      <path d="M98 94 C86 88 70 92 58 104 C46 116 34 130 28 140 C25 147 29 154 38 155 C50 156 64 150 76 143 C90 135 104 124 107 112 C108 103 105 97 98 94 Z" fill="#f8f5ef"/>
      <path d="M71 111 C74 108 79 108 82 111" class="n" stroke-width="1.3"/>
      <circle cx="76.5" cy="114.5" r="2.4" fill="#3b2f27" stroke="none"/>
      <path d="M36 142 c2 -2 4 -1 4 1" class="n" stroke-width="1.8"/>
      <path d="M33 150 C40 152 48 151 55 147" class="n" stroke-width="1.3"/>
      <circle cx="58" cy="128" r="3.4" fill="#f0d8cf" stroke="none"/>
  </g>
  <!-- right ewe: Jón's mark (mirrored) -->
  <g class="i" transform="translate(360 0) scale(-1 1)">
      <path d="M90 103 C100 96 112 91 121 89 L131 102 L140 86 C150 84 160 84 167 87 C172 91 171 97 165 99 C146 104 120 110 96 119 Z" fill="#f4efe4" stroke-width="2"/>
      <path d="M108 107 C116 103 122 101 127 100 L131 106 L136 99 C146 96 156 94 163 93 C156 97 140 100 126 103 C118 105 112 107 108 110 Z" fill="#e8b4a4" stroke="none"/>
      <path d="M121 89 L131 102 L140 86" class="n" stroke="#b0452f" stroke-width="4.4"/>
      <!-- woolly neck and shoulder -->
      <path d="M92 104 C112 108 128 124 138 146 C146 164 150 186 152 204 H58 C60 186 66 166 74 150 C80 138 86 124 92 104 Z" fill="#f1ede3"/>
      <path d="M100 128 c3 -3 7 -3 9 0 M112 146 c3 -3 7 -3 9 0 M90 154 c3 -3 7 -3 9 0 M120 172 c3 -3 7 -3 9 0 M98 178 c3 -3 7 -3 9 0 M76 182 c3 -3 7 -3 9 0 M128 192 c3 -3 7 -3 9 0" class="n" stroke="#cfc6b2" stroke-width="1.3"/>
      <!-- the head -->
      <path d="M98 94 C86 88 70 92 58 104 C46 116 34 130 28 140 C25 147 29 154 38 155 C50 156 64 150 76 143 C90 135 104 124 107 112 C108 103 105 97 98 94 Z" fill="#f8f5ef"/>
      <path d="M71 111 C74 108 79 108 82 111" class="n" stroke-width="1.3"/>
      <circle cx="76.5" cy="114.5" r="2.4" fill="#3b2f27" stroke="none"/>
      <path d="M36 142 c2 -2 4 -1 4 1" class="n" stroke-width="1.8"/>
      <path d="M33 150 C40 152 48 151 55 147" class="n" stroke-width="1.3"/>
      <circle cx="58" cy="128" r="3.4" fill="#f0d8cf" stroke="none"/>
  </g>

  <!-- leaders from the word to each cut -->
  <g class="n" stroke="#3b2f27" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M166 50 L155.5 75"/>
    <path d="M194 50 L225 81"/>
  </g>
  <path d="M151.4 72.6 L153.8 80.5 L158.7 74 Z M221 80.8 L229 83.5 L226.2 75.6 Z" fill="#3b2f27" stroke="#3b2f27" stroke-width="1" stroke-linejoin="round"/>

  <text x="180" y="40" text-anchor="middle">mark</text>
  <text x="104" y="234" text-anchor="middle">Bjarni</text>
  <text x="256" y="234" text-anchor="middle">Jón</text>
</svg>
