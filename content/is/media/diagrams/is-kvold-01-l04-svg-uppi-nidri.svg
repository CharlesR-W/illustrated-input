<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" width="360" height="430" role="img" aria-labelledby="t d">
  <title id="t">uppi, niðri: í gilinu</title>
  <desc id="d">A cross-section of a narrow, steep ravine on the heath in autumn fog, with a little stream at the bottom; labelled gil. On the top edge at the left stand two men calling with a hand cupped at the mouth: Bjarni, broad, with a dark beard and a brown homespun jacket, and in front of him Jón, a lean man with a grey-brown beard and a sheepskin-coloured jacket; labelled uppi. Halfway down the left wall, on a rocky ledge, stand a white ewe and a small white lamb; labelled niðri. On the rock face between them two boys climb: higher up Siggi, a thin boy with tousled sandy hair and a brown jacket, climbs down, looking at his feet, with a red arrow pointing down beside him, labelled niður; lower down Ketill, a stockier boy with straight black hair, a dark knitted cap and a patched dark-blue jacket, climbs up, reaching for a hold, with a red arrow pointing up beside him, labelled upp. Pale wisps of fog drift over the top of the ravine.</desc>
  <!-- Drawn 2026-10-26 for Kafli 4 (Göngur). Siggi after is-kvold-01-l03-svg-barn-born.svg (sandy hair, brown jacket,
       grey-brown breeches); Bjarni and Jón built on Óli's profile figure in is-kvold-01-l03-svg-tunid.svg;
       Ketill and Jón first drawn here. -->
