<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-label="Two groups of coins contrast a small amount of money with a large amount.">
<title>Fé</title><desc>Two coins beside six coins show a small and a large amount of money. The small amount is labelled cheap.</desc>
<rect width="640" height="260" rx="12" fill="#f8f3e8"/>
<g fill="#c8c0ab" stroke="#514c40" stroke-width="2">
<circle cx="110" cy="100" r="25"/><circle cx="170" cy="100" r="25"/>
<circle cx="390" cy="70" r="25"/><circle cx="450" cy="70" r="25"/><circle cx="510" cy="70" r="25"/>
<circle cx="390" cy="130" r="25"/><circle cx="450" cy="130" r="25"/><circle cx="510" cy="130" r="25"/>
</g>
<g fill="none" stroke="#77705f" stroke-width="1"><circle cx="110" cy="100" r="19"/><circle cx="170" cy="100" r="19"/><circle cx="390" cy="70" r="19"/><circle cx="450" cy="70" r="19"/><circle cx="510" cy="70" r="19"/><circle cx="390" cy="130" r="19"/><circle cx="450" cy="130" r="19"/><circle cx="510" cy="130" r="19"/></g>
<g font-family="sans-serif" font-size="36" fill="#302b23" text-anchor="middle"><text x="140" y="190">lítið fé</text><text x="140" y="226">ódýrt</text><text x="450" y="190">mikið fé</text></g>
</svg>
