<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-labelledby="t d">
<title id="t">rétt · dilkur</title>
<desc id="d">A sorting pen seen from above: a big round pen in the middle full of sheep, with eight small pens around its wall like petals. One small pen is labelled Bjarni, another Jón; an arrow leads a sheep from the big pen into Bjarni's pen, and the label dilkur points at a small pen. The whole is labelled rétt.</desc>
