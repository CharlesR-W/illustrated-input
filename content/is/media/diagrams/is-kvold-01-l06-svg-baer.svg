<svg xmlns="http://www.w3.org/2000/svg" width="660" height="490" viewBox="0 0 660 490" role="img" aria-labelledby="title desc"><title id="title">Bær</title><desc id="desc">Göng eru í bænum. Baðstofa, fjós og hlaða eru þar. Tún er úti.</desc><rect width="660" height="490" rx="12" fill="#faf8ef"/><rect x="34" y="389" width="592" height="75" rx="12" fill="#dce5cd"/><g stroke="#585e50" stroke-width="10" fill="#eeeadb"><rect x="150" y="35" width="360" height="140" rx="6"/><path d="M95 195 H246 V345 H95 Z"/><path d="M414 195 H565 V345 H414 Z"/><path d="M260 175 V401 M400 175 V401" fill="none"/></g><rect x="238" y="229" width="16" height="53" fill="#faf8ef"/><rect x="406" y="229" width="16" height="53" fill="#faf8ef"/><rect x="269" y="175" width="122" height="225" fill="#f5eddb"/><g stroke="#585e50" stroke-width="10"><path d="M246 195 V225 M246 285 V345 M414 195 V225 M414 285 V345"/><path d="M150 175 H260 M400 175 H510"/></g><g fill="#d4cbb7" stroke="#9a917f" stroke-width="2"><rect x="170" y="54" width="88" height="21" rx="4"/><rect x="402" y="54" width="88" height="21" rx="4"/><rect x="170" y="137" width="88" height="20" rx="4"/><rect x="402" y="137" width="88" height="20" rx="4"/></g><g font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="600" fill="#303931" text-anchor="middle"><text x="330" y="118">baðstofa</text><text x="170" y="278">fjós</text><text x="490" y="278">hlaða</text><text x="330" y="290">göng</text><text x="330" y="439">tún</text></g></svg>