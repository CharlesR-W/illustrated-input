  <path d="M18 576 141 484 269 576 251 584 141 510 35 584Z" fill="#698a3e" stroke="#4e6c32" stroke-width="5" stroke-linejoin="round"/>
  <g fill="none" stroke="#87a955" stroke-width="5" stroke-linecap="round"><path d="M63 542 63 530 M90 523 92 510 M116 504 116 491 M150 505 154 491 M181 525 184 513 M213 546 216 534"/></g>
  <path d="M110 703V616Q141 590 172 616V703" fill="#53544b" stroke="#6b6655" stroke-width="5"/>
  <rect x="52" y="611" width="36" height="42" fill="#d6dfc7" stroke="#676c5b" stroke-width="5"/>
  <path d="M70 612V653 M52 632H88" stroke="#676c5b" stroke-width="3"/>
  <!-- Open front of a tall hall; the chair platforms establish successive heights. -->
  <path d="M302 242H603V704H302Z" fill="#ebe1c5" stroke="#6b6250" stroke-width="7"/>
  <path d="M302 242V704 M603 242V704" fill="none" stroke="#918066" stroke-width="15"/>
  <path d="M287 247 452 121 617 247Z" fill="#d6a91c" stroke="#79602b" stroke-width="7" stroke-linejoin="round"/>
  <g clip-path="url(#roof)">
    <use href="#shield" x="452" y="139"/>
    <use href="#shield" x="426" y="174"/><use href="#shield" x="478" y="174"/>
    <use href="#shield" x="374" y="209"/><use href="#shield" x="426" y="209"/><use href="#shield" x="478" y="209"/><use href="#shield" x="530" y="209"/>
    <use href="#shield" x="322" y="244"/><use href="#shield" x="374" y="244"/><use href="#shield" x="426" y="244"/><use href="#shield" x="478" y="244"/><use href="#shield" x="530" y="244"/><use href="#shield" x="582" y="244"/>
  </g>
  <path d="M290 248H615" stroke="#79602b" stroke-width="7"/>
  <g stroke="#a18a65" stroke-width="5" fill="#d4c099"><path d="M315 413H590V427H315Z"/><path d="M315 548H590V562H315Z"/><path d="M315 683H590V697H315Z"/></g>
