    <text x="315" y="76">Ásgarður · gull</text>
    <text x="320" y="382" textLength="174" lengthAdjust="spacingAndGlyphs">hátt uppi</text>
    <text x="320" y="517">uppi</text>
    <text x="320" y="652">niðri</text>
