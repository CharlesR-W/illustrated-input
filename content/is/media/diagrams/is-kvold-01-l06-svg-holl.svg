<svg xmlns="http://www.w3.org/2000/svg" width="640" height="750" viewBox="0 0 640 750" role="img" aria-labelledby="title desc">
  <title id="title">Gras og gull</title>
  <desc id="desc">Á Hömrum er gras á þakinu. Í Ásgarði er gull á þakinu. Í höllinni eru þrjú sæti: eitt niðri, eitt uppi og eitt hátt uppi.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff08a"/><stop offset=".48" stop-color="#f4c531"/><stop offset="1" stop-color="#ba7b0b"/></linearGradient>
    <clipPath id="roof"><path d="M282 244 452 116 622 244Z"/></clipPath>
    <g id="shield"><path d="M-22-19 Q0-28 22-19 V7 Q17 23 0 34 Q-17 23-22 7Z" fill="url(#gold)" stroke="#a26910" stroke-width="3"/><path d="M-13-15 0-18 13-15" fill="none" stroke="#fff2a1" stroke-width="3"/></g>
    <g id="seat" fill="#806142" stroke="#473f35" stroke-width="5" stroke-linejoin="round"><rect x="-28" y="-68" width="56" height="57" rx="5"/><path d="M-36-20H36V-4H-36Z"/><path d="M-28-4V16 M28-4V16 M-36-20V-39 M36-20V-39" fill="none"/><path d="M-18-55H18 M-18-43H18" fill="none" stroke="#bfa57a" stroke-width="3"/></g>
  </defs>
  <rect width="640" height="750" rx="14" fill="#faf8ef"/>
  <path d="M18 710H620" stroke="#aaa58b" stroke-width="5"/>
