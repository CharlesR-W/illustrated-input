<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title desc">
  <title id="title">Rokkur</title>
  <desc id="desc">Rokkur með stóru hjóli, fótstigi og snældu. Ull verður að þræði á snældunni.</desc>
  <rect width="640" height="620" rx="14" fill="#faf8ef"/>
  <g stroke="#6a513b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wooden bed, uprights and feet. -->
    <path d="M99 527H560" stroke-width="22"/>
    <path d="M127 537 101 586 M528 537 553 586" stroke-width="17"/>
    <path d="M214 361V520 M475 290V520" stroke-width="17"/>
    <path d="M421 519 474 368 530 519" fill="none" stroke-width="12"/>
    <!-- Drive band, behind the wheel and flyer. -->
    <path d="M214 200 491 236Q523 258 491 285L214 500" fill="none" stroke="#b4a17c" stroke-width="5"/>
    <!-- Large wheel, its spokes and hub. -->
    <g fill="none" stroke-width="9"><circle cx="214" cy="350" r="150"/><circle cx="214" cy="350" r="133" stroke-width="5"/>
      <path d="M214 217V483 M81 350H347 M120 256 308 444 M120 444 308 256 M149 234 279 466 M98 285 330 415 M98 415 330 285 M149 466 279 234" stroke-width="6"/>
    </g>
    <circle cx="214" cy="350" r="22" fill="#b29465" stroke-width="7"/>
    <!-- Flyer and bobbin: thread winds onto the small horizontal spindle. -->
    <path d="M414 218V293 M562 218V293" fill="none" stroke-width="12"/>
    <path d="M423 233Q490 199 554 233 M423 280Q490 310 554 280" fill="none" stroke-width="7"/>
    <path d="M422 258H557" stroke-width="7"/>
    <rect x="457" y="237" width="68" height="41" rx="8" fill="#d5c69e" stroke-width="4"/>
    <path d="M458 233V283 M525 233V283" stroke-width="7"/>
    <g stroke="#b19a72" stroke-width="3"><path d="M469 240V276 M478 239V277 M487 239V277 M496 239V277 M505 239V277 M514 240V276"/></g>
    <!-- Treadle and crank connection. -->
    <path d="M143 568 335 563 344 576 151 583Z" fill="#b29465" stroke-width="6"/>
    <path d="M226 371 271 568" fill="none" stroke-width="6"/>
    <circle cx="226" cy="371" r="7" fill="#b29465" stroke-width="4"/>
    <path d="M334 565V585" stroke-width="7"/>
  </g>
  <!-- A loose tuft of wool narrows into a thread at the bobbin. -->
  <path d="M518 139Q503 116 518 102Q531 87 548 100Q559 79 579 91Q597 91 597 111Q616 118 604 136Q601 157 582 156Q565 174 552 156Q533 167 518 139Z" fill="#f3efe0" stroke="#a59c87" stroke-width="4"/>
  <g fill="none" stroke="#cec5ae" stroke-width="3"><path d="M528 111Q555 138 586 109 M524 130Q556 151 590 129 M549 102Q565 129 580 150"/></g>
  <path d="M561 158Q572 192 549 214Q534 230 514 247" fill="none" stroke="#a89367" stroke-width="4"/>
  <text x="320" y="65" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="600" fill="#303931">rokkur</text>
</svg>
