<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" role="img" aria-labelledby="title desc"><title id="title">Hurð · hvaðan? · hvert?</title><desc id="desc">Maður er úti í snjónum. Ör liggur úr snjónum, um opna hurð og inn í bæinn.</desc>
