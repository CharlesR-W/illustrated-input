<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840" role="img" aria-labelledby="title desc"><title id="title">Ég er · þú ert · hann er · við erum · þið eruð · þau eru</title><desc id="desc">Hallur segir ég er. Hann talar við Ástu: þú ert. Ásta talar um Hall: hann er. Siggi og Ásta segja við erum. Hallur talar við börnin: þið eruð, og um þau: þau eru.</desc><rect width="640" height="840" rx="14" fill="#faf8ef"/>
