chor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">sonur</text><rect x="230" y="805" width="394" height="140" rx="12" fill="#fffdf6" stroke="#d9d7c9" stroke-width="3"/><text x="427.0" y="854" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">Helga</text><text x="427.0" y="902" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">Bjarna·dóttir</text><rect x="230" y="1040" width="394" height="140" rx="12" fill="#fffdf6" stroke="#d9d7c9" stroke-width="3"/><text x="427.0" y="1089" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">Sigurður (Siggi)</text><text x="427.0" y="1137" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">Bjarna·son</text><rect x="230" y="1275" width="394" height="140" rx="12" fill="#fffdf6" stroke="#d9d7c9" stroke-width="3"/><text x="427.0" y="1324" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">Ástríður (Ásta)</text><text x="427.0" y="1372" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">Bjarna·dóttir</text><text x="144" y="847" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">dóttir</text><text x="144" y="1082" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">sonur</text><text x="144" y="1317" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">dóttir</text><path d="M30 1470H610" stroke="#d9d7c9" stroke-width="3"/><text x="320" y="1540" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">Bjarna ← Bjarni</text><text x="320" y="1610" text-an