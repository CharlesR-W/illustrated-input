<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1800" viewBox="0 0 640 1800" role="img" aria-labelledby="title desc"><title id="title">Ætt — sonur og dóttir</title><desc id="desc">Sigurður er faðir Einars Sigurðssonar. Einar er faðir Guðrúnar Einarsdóttur. Jón er faðir Bjarna Jónssonar. Helga, Sigurður og Ástríður eru börn Bjarna og Guðrúnar.</desc><rect width="640" height="1800" rx="14" fill="#faf8ef"/><text x="320" y="65" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#303931">Ætt</text><g fill="none" stroke="#7b8975" stroke-width="5" stroke-linejoin="round">
