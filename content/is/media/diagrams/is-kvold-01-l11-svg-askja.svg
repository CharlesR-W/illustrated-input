<svg xmlns="http://www.w3.org/2000/svg" width="480" height="625" viewBox="0 0 480 625" role="img" aria-labelledby="title desc"><title id="title">Askja · heiðin · Hamrar</title><desc id="desc">Schematic orientation map, not a real coastline or a map to scale: Hamrar in Jökuldalur is east of the heath; Askja is beyond the heath to the west-south-west. Ash reaches across the heath towards the valley.</desc><rect width="480" height="625" rx="14" fill="#faf8ef"/><!-- Grey fan travels east-north-east from Askja towards the heath and valley. -->
