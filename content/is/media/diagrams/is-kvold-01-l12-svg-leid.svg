<title id="title">Hamrar · heiðin · á · Vopnafjörður</title><desc id="desc">Schematic orientation sketch, not a real map, coastline or route to scale. From Hamrar the travellers cross the heath and a river to Vopnafjörður, where a long fjord opens into the sea and a black ship lies on the water.</desc>
