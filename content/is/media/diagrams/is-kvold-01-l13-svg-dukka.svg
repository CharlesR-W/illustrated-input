<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img" aria-labelledby="title desc">
<title id="title">Dúkka</title><desc id="desc">A small rag doll with a tied cloth head, stitched face and cloth body, held in two child-sized hands emerging from wool sleeves. The label names the doll.</desc>
<rect width="420" height="360" rx="16" fill="#f8f4e9"/>

<g stroke="#5d5046" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
