<svg xmlns="http://www.w3.org/2000/svg" width="470" height="360" viewBox="0 0 470 360" role="img" aria-labelledby="title desc">
<title id="title">Borð · listi · bæklingur</title><desc id="desc">A plain wooden table holds loose sheets, one sheet with a list represented only by short grey strokes, and two small closed pamphlets. The Icelandic labels name table, list and pamphlet.</desc>
<rect width="470" height="360" rx="16" fill="#f8f4e9"/>

<g stroke="#665444" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
<!-- A small plain wooden table: its front legs remain visible below the top. -->
<path d="M88 177 L106 177 L102 276 L88 276 Z M347 177 L365 177 L365 276 L351 276 Z" fill="#927351"/>
<path d="M104 137 L117 137 L123 238 L110 238 Z M338 137 L351 137 L345 239 L332 239 Z" fill="#a2835e"/>
<path d="M58 174 L113 101 L350 101 L411 174 L411 189 L58 189 Z" fill="#a9865c"/>
<path d="M58 174 L411 174 M130 103 L98 173 M201 103 L188 172 M271 103 L281 172 M333 103 L361 173" fill="none" stroke="#82623f" stroke-width="1.5"/>
<path d="M59 189 L411 189 L411 200 L59 200 Z" fill="#8b6c49"/>
<!-- Two loose sheets, with one small list; strokes are not lettering. -->
<path d="M112 128 L151 111 L187 148 L147 166 Z" fill="#eee6d5" stroke="#9f9784" stroke-width="1.3"/>
<path d="M162 108 L222 114 L207 153 L146 148 Z" fill="#faf5e7" stroke="#9f9784" stroke-width="1.3"/>
<path d="M171 120 L198 123 M168 127 L205 131 M165 135 L191 138 M161 142 L197 146" stroke="#a5a39b" stroke-width="2"/>
<!-- Two small closed pamphlets with plain covers; no letters or words. -->
