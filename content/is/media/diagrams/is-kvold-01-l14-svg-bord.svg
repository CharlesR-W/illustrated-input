<path d="M251 121 L267 149 M270 153 L299 146" fill="none" stroke="#e6ddc7" stroke-width="2.2"/>
<path d="M307 118 L334 111 L354 144 L327 152 Z" fill="#b8a38a" stroke="#7d6954" stroke-width="1.8"/>
<path d="M309 122 L327 149 M329 153 L354 145" fill="none" stroke="#e6ddc7" stroke-width="2.2"/>
</g>
<text x="235" y="324" text-anchor="middle" font-family="serif" font-size="28" fill="#322e29">borð · listi · bæklingur</text>
</svg>
