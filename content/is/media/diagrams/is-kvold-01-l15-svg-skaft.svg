<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">Langt skaft · Mjölnir: stutt skaft</title><desc id="desc">Two hammers stand separately as objects. The ordinary hammer on the left has a slender iron head and a long wooden handle. Mjölnir on the right has a visibly heavier, broader head and a much shorter wooden handle. The labels identify their handle lengths.</desc>
<rect width="600" height="380" rx="16" fill="#f8f4e9"/>

<g stroke-linecap="round" stroke-linejoin="round">
<!-- Ordinary working hammer: a long handle below a modest iron head. -->
<path d="M143 107 L162 107 L169 292 Q159 302 143 294 Z" fill="#a47b4d" stroke="#624d37" stroke-width="2.4"/>
<path d="M151 124 L155 283" fill="none" stroke="#ccad79" stroke-width="2"/>
<path d="M88 71 L185 71 L205 87 L205 107 L177 111 L165 105 L89 105 Z" fill="#73777a" stroke="#41474b" stroke-width="2.8"/>
<path d="M95 77 L180 77 L195 89" fill="none" stroke="#aeb0b0" stroke-width="2.5"/>
<path d="M92 105 L92 73" fill="none" stroke="#4a5054" stroke-width="2"/>
<!-- Mjölnir: broad heavy head, short visible handle; no fantasy ornaments. -->
<path d="M421 141 L442 141 L445 223 Q433 231 419 224 Z" fill="#946f46" stroke="#624d37" stroke-width="2.4"/>
<path d="M429 155 L432 218" fill="none" stroke="#ccb084" stroke-width="2"/>
<path d="M346 63 L505 63 L522 79 L522 141 L505 157 L346 157 L330 141 L330 79 Z" fill="#666d72" stroke="#3c444a" stroke-width="3"/>
<path d="M347 71 L501 71 L513 83 M339 85 L339 136 L350 148 L498 148" fill="none" stroke="#9da3a6" stroke-width="2.5"/>
<path d="M355 79 L498 79 L505 88 L505 131 L495 140 L355 140 L347 131 L347 88 Z" fill="none" stroke="#515a60" stroke-width="1.8"/>
<!-- Each leader is separate from both the object and the label. -->
<g fill="none" stroke="#756b5e" stroke-width="1.6">
<path d="M153 303 L153 313"/><path d="M433 240 L433 313"/>
</g>
</g>
<g font-family="serif" font-size="34" text-anchor="middle" fill="#322e29">
<text x="153" y="361">langt skaft</text><text x="433" y="361">Mjölnir: stutt skaft</text>
</g>
</svg>
