<svg xmlns="http://www.w3.org/2000/svg" width="500" height="380" viewBox="0 0 500 380" role="img" aria-labelledby="title desc">
<title id="title">Húfa · skúfhólkur · skúfur</title><desc id="desc">A side view of a small flat black knitted skotthúfa. Its long narrow tail hangs down from the rear. A small metal tube is fixed at the end of the tail, with a long black silk tassel below. Three separate Icelandic labels have short leader lines.</desc>
<rect width="500" height="380" rx="16" fill="#f8f4e9"/>

<g stroke-linecap="round" stroke-linejoin="round">
<!-- Flat knitted cap in side profile; the long cap-tail hangs at its rear. -->
<path d="M70 112 Q85 73 142 69 Q192 66 220 86 Q233 102 230 123 Q215 137 169 141 Q105 141 70 128 Z" fill="#303033" stroke="#1d1d20" stroke-width="2.5"/>
<path d="M72 120 Q146 141 229 115 L229 130 Q157 153 70 133 Z" fill="#232326" stroke="#19191c" stroke-width="2"/>
<path d="M211 88 Q247 112 251 161 Q254 199 242 231 L224 230 Q236 191 231 160 Q228 125 211 113 Z" fill="#2c2c30" stroke="#19191c" stroke-width="2.5"/>
<!-- Quiet knit strokes, not lettering or texture borrowed from a raster. -->
<g fill="none" stroke="#505055" stroke-width="1.1">
<path d="M86 107 Q143 82 211 102 M81 115 Q146 92 220 112 M99 91 L106 122 M119 82 L126 129 M141 77 L148 133 M163 78 L170 132 M185 82 L192 127"/>
<path d="M229 132 L243 135 M234 150 L247 153 M237 170 L249 172 M237 191 L248 193 M233 211 L245 213"/>
</g>
<!-- A short brass tube around the join, above the long silk tassel. -->
<path d="M221 229 L245 231 L243 258 L219 256 Z" fill="#b7a16c" stroke="#75613c" stroke-width="2"/>
<path d="M225 232 L223 253 M240 234 L238 254" fill="none" stroke="#dfd0a4" stroke-width="2"/>
<path d="M221 256 Q209 280 206 337 Q229 351 252 338 Q249 280 241 258 Z" fill="#29292d" stroke="#19191c" stroke-width="2.2"/>
<g fill="none" stroke="#515158" stroke-width="1.1">
<path d="M224 263 Q216 294 213 337 M229 262 L222 343 M234 263 L233 344 M238 264 Q244 297 246 337"/>
</g>
<!-- Label leaders stop clear of the letters and point to each distinct object. -->
<g fill="none" stroke="#756b5e" stroke-width="1.6">
<path d="M246 104 L290 104"/><path d="M251 243 L290 243"/><path d="M260 306 L290 306"/>
</g>
</g>
<g font-family="serif" font-size="28" fill="#322e29">
<text x="306" y="113">húfa</text><text x="306" y="252">skúfhólkur</text><text x="306" y="315">skúfur</text>
