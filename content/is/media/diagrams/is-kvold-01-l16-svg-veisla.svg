<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc">
<title id="title">Einn uxi · átta laxar · þrjár tunnur af miði</title>
<desc id="desc">The bride’s meal: one ox, eight separate salmon in two rows of four, and three wooden casks of mead. Each group has its own Icelandic label underneath.</desc>
<rect width="480" height="660" rx="16" fill="#f8f4e9"/>
<defs>
<g id="salmon" fill="#a8b8b5" stroke="#465956" stroke-width="2" stroke-linejoin="round">
<path d="M0 0 Q25 -18 55 0 Q25 18 0 0 L-13 11 L-13 -11 Z"/>
<path d="M23 -8 L31 -18 L39 -7 M25 8 L33 16 L38 7" fill="#7e9591"/>
<circle cx="45" cy="-2" r="2" fill="#303d3a" stroke="none"/>
<path d="M36 -8 Q31 0 36 8" fill="none"/>
</g>
<g id="cask" stroke="#624d37" stroke-width="2.4">
<path d="M-29 -46 Q-42 0 -29 46 Q0 57 29 46 Q42 0 29 -46 Z" fill="#b98f5b"/>
<path d="M-13 -47 Q-21 0 -13 49 M10 -47 Q18 0 10 49" fill="none" stroke="#967041"/>
<ellipse cy="-46" rx="29" ry="9" fill="#cfac78"/>
<path d="M-35 -22 Q0 -11 35 -22 L36 -10 Q0 1 -36 -10 Z M-36 16 Q0 28 36 16 L33 28 Q0 40 -33 28 Z" fill="#6e7475" stroke="#484f50"/>
</g>
</defs>
<!-- One ox, shown whole and clearly separate from its label. -->
<g stroke="#624d37" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="227" cy="95" rx="77" ry="42" fill="#aa8357"/>
<path d="M174 119 L169 157 L181 157 L192 123 M254 124 L263 157 L275 157 L272 117" fill="#aa8357"/>
<path d="M288 75 L311 61 L330 67 L340 91 L333 114 L309 116 L292 99 Z" fill="#aa8357"/>
<path d="M312 65 Q298 44 305 35 M328 67 Q346 49 340 36" fill="none" stroke="#ad9b79" stroke-width="7"/>
<path d="M151 84 Q125 91 133 126" fill="none"/><path d="M133 121 L128 136 L139 134" fill="#624d37"/>
<path d="M311 74 L294 69 L298 83" fill="#aa8357"/>
<circle cx="325" cy="86" r="2.7" fill="#322e29" stroke="none"/>
<path d="M330 104 L338 102" fill="none"/>
</g>
<text x="240" y="205" text-anchor="middle" font-family="serif" font-size="28" fill="#322e29">einn uxi</text>
<!-- Exactly eight salmon, four in each row. -->
<g>
<use href="#salmon" transform="translate(60 274)"/><use href="#salmon" transform="translate(165 274)"/><use href="#salmon" transform="translate(270 274)"/><use href="#salmon" transform="translate(375 274)"/>
<use href="#salmon" transform="translate(60 334)"/><use href="#salmon" transform="translate(165 334)"/><use href="#salmon" transform="translate(270 334)"/><use href="#salmon" transform="translate(375 334)"/>
</g>
<text x="240" y="399" text-anchor="middle" font-family="serif" font-size="28" fill="#322e29">átta laxar</text>
<!-- Exactly three casks, with ample clearance below each. -->
<use href="#cask" transform="translate(120 509)"/><use href="#cask" transform="translate(240 509)"/><use href="#cask" transform="translate(360 509)"/>
<text x="240" y="625" text-anchor="middle" font-family="serif" font-size="28" fill="#322e29">þrjár tunnur af miði</text>
</svg>
