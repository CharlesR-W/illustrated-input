<svg xmlns="http://www.w3.org/2000/svg" width="760" height="870" viewBox="0 0 760 870"><title>Ætt Guðrúnar og Bjarna</title><desc>Jón is Bjarni's father; Einar is Guðrún's father. Bjarni and Guðrún are the parents of Helga, Sigurður and Ástríður.</desc><rect width="760" height="870" rx="18" fill="#f7f1df"/><g fill="none" stroke="#7e654b" stroke-width="3"><path d="M380 75V105M380 355V385"/></g><g text-anchor="middle" fill="#28231f" font-family="serif" font-size="43"><text x="380" y="65">Jón</text><text x="380" y="155">Bjarni Jóns·son</text><text x="380" y="295">Einar (afi)</text><text x="380" y="435">Guðrún Einars·dóttir</text><text x="380" y="575">Börn Bjarna og Guðrúnar:</text><text x="380" y="670">Helga Bjarna·dóttir</text><text x="380" y="745">Sigurður Bjarna·son</text><text x="380" y="820">Ástríður Bjarna·dóttir</text></g></svg>
