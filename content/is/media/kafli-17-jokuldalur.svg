<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" role="img" aria-labelledby="titill lysing">
  <title id="titill">Jökuldalur og Hrafnkelsdalur — einfalt kort</title>
  <desc id="lysing">Skýringarmynd af efri hluta Jökuldals og Hrafnkelsdal suðvestan við hann. Jökulsá á Dal rennur um Jökuldal. Hrafnkela rennur úr Hrafnkelsdal í Jökulsá á Dal. Aðalból er inni í Hrafnkelsdal. Kortið sýnir hvorki nákvæmar fjarlægðir né alla bugðótta árfarvegi. Hamrar eru ekki merktir.</desc>
  <metadata>Landfræðileg viðmið: https://www.east.is/is/stadur/adalbol ; https://www.vegagerdin.is/vefur2.nsf/Files/Jokuldalsvegur_Vidauki_III_Grodurfar_landslag/$file/Jokuldalsvegur_Vidauki_III_Grodurfar_landslag.pdf . Höfundarteikning; ekki landmæling.</metadata>
  <rect width="480" height="680" rx="14" fill="#f7f1df"/>
  <g text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#302d27">
    <text x="240" y="43">Jökuldalur</text>
    <text x="240" y="80">og Hrafnkelsdalur</text>
  </g>
  <!-- The broad corridors are schematic valley floors, not measured boundaries. -->
  <path d="M345 560 Q337 458 300 390 Q275 330 311 277 Q355 214 425 180" fill="none" stroke="#e5dfc7" stroke-width="84" stroke-linecap="round"/>
  <path d="M70 550 Q136 477 210 410 Q255 368 290 320" fill="none" stroke="#e5dfc7" stroke-width="76" stroke-linecap="round"/>
  <!-- The tributary joins the main river in the upper valley. -->
  <path d="M345 560 Q337 458 300 390 Q275 330 311 277 Q355 214 425 180" fill="none" stroke="#466e85" stroke-width="6" stroke-linecap="round"/>
  <path d="M70 550 Q136 477 210 410 Q255 368 290 320" fill="none" stroke="#466e85" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Georgia, serif" font-size="28" fill="#302d27">
    <text x="340" y="315" transform="rotate(-56 340 315)">Jökuldalur</text>
    <text x="70" y="360" transform="rotate(-40 70 360)">Hrafnkelsdalur</text>
    <text x="421" y="560" fill="#34596e" transform="rotate(-83 421 560)">Jökulsá á Dal</text>
    <text x="185" y="510" fill="#34596e" transform="rotate(-43 185 510)">Hrafnkela</text>
    <circle cx="121" cy="469" r="5"/>
    <path d="M121 469L132 482" stroke="#302d27" stroke-width="1.5"/>
    <text x="35" y="446">Aðalból</text>
  </g>
  <g stroke="#3e3a30" stroke-width="2" fill="none">
    <path d="M48 210V148"/>
    <path d="M48 140L42 152L54 152Z" fill="#3e3a30"/>
  </g>
  <text x="48" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#302d27">N</text>
  <g text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#575246">
  </g>
</svg>
