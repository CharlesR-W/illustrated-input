<svg xmlns="http://www.w3.org/2000/svg" width="480" height="590" viewBox="0 0 480 590" role="img" aria-labelledby="title desc">
<title id="title">Sleipnir, Loki og Svaðilfari</title>
<desc id="desc">Svaðilfari er faðir Sleipnis. Loki sem meri er móðir Sleipnis. Sleipnir er grátt folald með átta fætur.</desc>
