<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" role="img" aria-labelledby="title desc">
<title id="title">Mig langar, mér líður, mér er kalt, mér líst</title>
<desc id="desc">Helga: Mig langar vestur. Mér líður illa. Ásta: Mér er kalt. Bjarni: Mér líst ekki á það. Hjartað mitt er hálft hér og hálft fyrir vestan.</desc>
