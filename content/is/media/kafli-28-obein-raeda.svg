<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400" role="img" aria-labelledby="title desc">
<title id="title">„Óli vill fara.“ → Helga skrifar að Óli vilji fara.</title>
<desc id="desc">Helga's own words in quotation marks, „Óli vill fara.“, at the top. An arrow leads down to the report with a present verb, „Helga skrifar að Óli vilji fara.“, and a second arrow to the report with a past verb, „Helga skrifaði að Óli vildi fara.“ The changed verbs are coloured and underlined.</desc>
<!-- Authored 2026-11-15 for Kafli 28 (G28 reported speech). Text-only diagram; Icelandic labels only; no figures. -->
<rect x="1" y="1" width="318" height="398" rx="14" fill="#f7f1df" stroke="#c9bb9a" stroke-width="2"/>
<g font-family="Georgia, 'Noto Serif', serif" fill="#302d27" font-size="22">
 <rect x="50" y="20" width="220" height="52" rx="10" fill="#fffaf0" stroke="#8c7b5e" stroke-width="1.6"/>
 <text x="160" y="54" text-anchor="middle">„Óli <tspan fill="#8a3b2e" font-weight="bold">vill</tspan> fara.“</text>
 <path d="M160 78 V118 M150 106 L160 118 L170 106" stroke="#79594b" stroke-width="2.6" fill="none"/>
 <text x="160" y="150" text-anchor="middle">Helga <tspan fill="#2f5d73" font-weight="bold" text-decoration="underline">skrifar</tspan></text>
 <text x="160" y="182" text-anchor="middle">að Óli <tspan fill="#2f5d73" font-weight="bold" text-decoration="underline">vilji</tspan> fara.</text>
 <path d="M160 200 V240 M150 228 L160 240 L170 228" stroke="#79594b" stroke-width="2.6" fill="none"/>
 <text x="160" y="272" text-anchor="middle">Helga <tspan fill="#8a3b2e" font-weight="bold" text-decoration="underline">skrifaði</tspan></text>
 <text x="160" y="304" text-anchor="middle">að Óli <tspan fill="#8a3b2e" font-weight="bold" text-decoration="underline">vildi</tspan> fara.</text>
 <line x1="30" y1="330" x2="290" y2="330" stroke="#c9bb9a" stroke-width="1.5"/>
 <text x="160" y="362" text-anchor="middle" font-size="19" fill="#5b5146">skrifar → vilji</text>
 <text x="160" y="388" text-anchor="middle" font-size="19" fill="#5b5146">skrifaði → vildi</text>
</g>
</svg>
