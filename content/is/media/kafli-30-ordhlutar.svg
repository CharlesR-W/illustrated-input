<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400" role="img" aria-labelledby="title desc">
<title id="title">for + seti → forseti; sjálf + stæði → sjálfstæði; alþingis + maður → alþingismaður</title>
<desc id="desc">Three long words, each split into its two parts with a plus sign and an arrow down to the whole word: for plus seti gives forseti; sjálf plus stæði gives sjálfstæði; alþingis plus maður gives alþingismaður. The genitive ending -s in alþingis is coloured.</desc>
<!-- Authored 2026-11-15 for Kafli 30 (G30 word formation). Text-only diagram; Icelandic labels only; no figures. -->
<rect x="1" y="1" width="318" height="398" rx="14" fill="#f7f1df" stroke="#c9bb9a" stroke-width="2"/>
<g font-family="Georgia, 'Noto Serif', serif" fill="#302d27" font-size="22" text-anchor="middle">
 <text x="160" y="44"><tspan fill="#2f5d73">for</tspan>  +  <tspan fill="#2f5d73">seti</tspan></text>
 <path d="M160 56 V82 M151 72 L160 84 L169 72" stroke="#79594b" stroke-width="2.4" fill="none"/>
 <rect x="80" y="90" width="160" height="38" rx="9" fill="#fffaf0" stroke="#8c7b5e" stroke-width="1.6"/>
 <text x="160" y="117" font-weight="bold">forseti</text>

 <text x="160" y="170"><tspan fill="#2f5d73">sjálf</tspan>  +  <tspan fill="#2f5d73">stæði</tspan></text>
 <path d="M160 182 V208 M151 198 L160 210 L169 198" stroke="#79594b" stroke-width="2.4" fill="none"/>
 <rect x="70" y="216" width="180" height="38" rx="9" fill="#fffaf0" stroke="#8c7b5e" stroke-width="1.6"/>
 <text x="160" y="243" font-weight="bold">sjálfstæði</text>

 <text x="160" y="296"><tspan fill="#2f5d73">alþingi</tspan><tspan fill="#8a3b2e" font-weight="bold">s</tspan>  +  <tspan fill="#2f5d73">maður</tspan></text>
 <path d="M160 308 V334 M151 324 L160 336 L169 324" stroke="#79594b" stroke-width="2.4" fill="none"/>
 <rect x="45" y="342" width="230" height="38" rx="9" fill="#fffaf0" stroke="#8c7b5e" stroke-width="1.6"/>
 <text x="160" y="369" font-weight="bold">alþingi<tspan fill="#8a3b2e">s</tspan>maður</text>
</g>
</svg>
