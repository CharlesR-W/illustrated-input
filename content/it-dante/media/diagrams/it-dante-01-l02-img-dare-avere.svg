  <title id="t">deve dare · deve avere</title>
  <desc id="d">A ledger opening: the left page headed deve dare, the right page headed deve avere. One purchase is written on both pages: on the left, la lana, trenta fiorini; on the right, il mercante di Siena, trenta fiorini. A thin arc joins the two entries.</desc>
