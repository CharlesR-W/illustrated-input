    <text x="66" y="36" font-size="16" font-style="italic" font-weight="bold" fill="#7a2a14">deve dare</text>
    <text x="190" y="36" font-size="16" font-style="italic" font-weight="bold" fill="#7a2a14">deve avere</text>
    <line x1="22" y1="46" x2="110" y2="46" stroke="#a8875c" stroke-width="1"/>
