<svg xmlns="http://www.w3.org/2000/svg" width="320" height="290" viewBox="0 0 320 290"><title>Sicura e non sicura</title><desc>Precise meaning aid for the adjacent Italian story; labels are outside scaled drawing groups.</desc><rect width="320" height="290" fill="#faf7ef"/><style>text{font:18px DejaVu Sans,sans-serif;fill:#253544}</style><path d="M35 55h65v70h-65Z" fill="#45494c" stroke="#283241" stroke-width="3"/><path d="M27 120h83v15h-83Z" fill="#45494c" stroke="#283241" stroke-width="3"/><path d="M35 135v62h10v-62 M88 135v62h10v-62" fill="#45494c" stroke="#283241" stroke-width="2"/><path d="M195 55h65v70h-65Z" fill="#8c6a4b" stroke="#283241" stroke-width="3"/><path d="M187 120h83v15h-83Z" fill="#8c6a4b" stroke="#283241" stroke-width="3"/><path d="M195 135v62h10v-62 M248 135v62h10v-62" fill="#8c6a4b" stroke="#283241" stroke-width="2"/><path d="M245 155l18-4v30h-18Z" fill="#faf7ef"/><path d="M241 195l25-15" stroke="#9d583d" stroke-width="5"/><path d="M40 80l38 15m-38 22 35 10" stroke="#ad9270" stroke-width="3"/><text x="25" y="30">sicura</text><text x="165" y="30">non è sicura</text><text x="20" y="245">vecchia, ma sicura</text><text x="20" y="277">Ada: non è sicura</text></svg>