<svg xmlns="http://www.w3.org/2000/svg" width="320" height="460" viewBox="0 0 320 460"><title>Nostro, vostro, loro</title><desc>A precise diagram for the ownership and broken-chair sequence, with no envelope contents disclosed.</desc><rect width="320" height="460" fill="#faf7ef"/><style>text{font:18px DejaVu Sans,sans-serif;fill:#253544}</style><text x="15" y="32">Elena e Paolo:</text><text x="15" y="66">la nostra stanza</text><text x="15" y="98">le nostre sedie</text><path d="M15 125h290" stroke="#b1a58e"/><text x="15" y="165">Elena → i due amici:</text><text x="15" y="200">i vostri libri</text><text x="15" y="232">la busta non è vostra</text><path d="M15 260h290" stroke="#b1a58e"/><text x="15" y="300">i libri di due amici:</text><text x="15" y="334">i loro libri</text><text x="15" y="368">i libri sono loro</text></svg>