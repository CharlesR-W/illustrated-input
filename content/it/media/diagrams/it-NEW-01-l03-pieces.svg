<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560"><title>La sedia e la gamba rotta</title><desc>A precise diagram for the ownership and broken-chair sequence, with no envelope contents disclosed.</desc><rect width="880" height="560" fill="#faf7ef"/><style>text{font:18px DejaVu Sans,sans-serif;fill:#253544}</style><text x="35" y="40">una sedia · tre gambe · una gamba rotta</text><g transform="translate(0 55)"><path d="M85 150l150-65 120 85-155 70Z" fill="#343b41" stroke="#1f2937" stroke-width="4"/><path d="M85 150v180l18 10V160 M235 85v180l18 10V95 M335 170v180l18 10V180" fill="#343b41" stroke="#1f2937" stroke-width="3"/><circle cx="200" cy="222" r="10" fill="#f8edda" stroke="#b0976d" stroke-width="3"/><path d="M85 100L235 35l120 85v50l-120-85-150 65Z" fill="#343b41" stroke="#1f2937" stroke-width="3"/></g><text x="80" y="445">la sedia nera</text><path d="M435 120v150l12 13 12-14V120Z" fill="#343b41" stroke="#1f2937" stroke-width="3"/><path d="M435 320l12-14 12 14v65h-24Z" fill="#f1e5ca" stroke="#9d835a" stroke-width="3"/><text x="390" y="85">la gamba rotta</text><text x="390" y="423">un pezzo bianco</text><path d="M640 320h24l-10 15-14-7Z" fill="#333c42" stroke="#273649" stroke-width="2"/><text x="590" y="385">un pezzo nero</text><text x="35" y="505">il pezzo bianco ↔ il pezzo nero</text></svg>