<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"><title>L’attrezzo e la gamba</title><desc>A meaning diagram with explicit relationships, stages and object sizes.</desc><rect width="760" height="460" fill="#faf7ef"/><style>text{font:18px DejaVu Sans,sans-serif;fill:#253544}</style><text x="30" y="35">l’attrezzo piccolo</text><text x="400" y="35">l’attrezzo di Paolo, grande</text><path d="M70 95h140v40H110v30h100v40H70Z" fill="#74828a" stroke="#334155" stroke-width="3"/><path d="M160 142h160v50H160Z" fill="#343b41" stroke="#1f2937" stroke-width="3"/><path d="M450 95h140v40H490v90h100v40H450Z" fill="#74828a" stroke="#334155" stroke-width="3"/><path d="M540 142h160v50H540Z" fill="#343b41" stroke="#1f2937" stroke-width="3"/><path d="M90 137v30m-6-24 6-6 6 6m-12 18 6 6 6-6" stroke="#b75246" stroke-width="2" fill="none"/><text x="20" y="370">la gamba non è dentro</text><text x="410" y="370">la gamba è dentro</text><text x="20" y="420">aperto, ma piccolo</text><text x="410" y="420">aperto e grande</text></svg>