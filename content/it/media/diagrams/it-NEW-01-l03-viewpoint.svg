<svg xmlns="http://www.w3.org/2000/svg" width="320" height="560" viewBox="0 0 320 560"><title>Mia, tua, sua</title><desc>A precise diagram for the ownership and broken-chair sequence, with no envelope contents disclosed.</desc><rect width="320" height="560" fill="#faf7ef"/><style>text{font:18px DejaVu Sans,sans-serif;fill:#253544}</style><text x="15" y="25">Elena</text><path d="M150 55l75-15 70 22-70 22Z" fill="#d8bc98" stroke="#334155" stroke-width="2"/><path d="M150 55v65l75 22V84Z M225 84l70-22v65l-70 15Z" fill="#b75246" stroke="#334155" stroke-width="2"/><text x="15" y="165">la mia scatola</text><text x="15" y="200">Paolo → Elena</text><path d="M150 230l75-15 70 22-70 22Z" fill="#d8bc98" stroke="#334155" stroke-width="2"/><path d="M150 230v65l75 22V259Z M225 259l70-22v65l-70 15Z" fill="#b75246" stroke="#334155" stroke-width="2"/><text x="15" y="340">la tua scatola</text><text x="15" y="375">la scatola di Elena</text><path d="M150 405l75-15 70 22-70 22Z" fill="#d8bc98" stroke="#334155" stroke-width="2"/><path d="M150 405v65l75 22V434Z M225 434l70-22v65l-70 15Z" fill="#b75246" stroke="#334155" stroke-width="2"/><text x="15" y="515">la sua scatola</text></svg>