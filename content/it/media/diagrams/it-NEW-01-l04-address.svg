<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="0 0 320 420"><title>Tu e Lei</title><desc>A delivered, labelled meaning diagram matching the adjacent story stage.</desc><rect width="320" height="420" fill="#faf7ef"/><style>text{font:18px DejaVu Sans,sans-serif;fill:#253544}</style><text x="15" y="35">Paolo → mamma</text><text x="15" y="85">Tu parli; io aspetto.</text><path d="M15 130h290" stroke="#aa987f"/><text x="15" y="185">Elena → mamma</text><text x="15" y="235">Lei lavora qui?</text><text x="15" y="285">Io sono Elena.</text></svg>