<svg xmlns="http://www.w3.org/2000/svg" width="320" height="520" viewBox="0 0 320 520"><title>Noi, voi, loro</title><desc>A delivered, labelled meaning diagram matching the adjacent story stage.</desc><rect width="320" height="520" fill="#faf7ef"/><style>text{font:18px DejaVu Sans,sans-serif;fill:#253544}</style><text x="15" y="30">Paolo → Elena:</text><text x="15" y="65">noi = Paolo e Elena</text><text x="15" y="100">noi portiamo</text><path d="M15 130h290" stroke="#aa987f"/><text x="15" y="175">Elena → Ada e l’amico:</text><text x="15" y="210">voi = Ada e l’amico</text><text x="15" y="245">voi aiutate</text><path d="M15 280h290" stroke="#aa987f"/><text x="15" y="325">Elena → Paolo:</text><text x="15" y="360">loro = mamma e padre</text><text x="15" y="395">loro lavorano</text><text x="15" y="475">tutti: quattro persone</text></svg>