<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"><title>Il cartello e le due stanze</title><desc>A delivered, labelled meaning diagram matching the adjacent story stage.</desc><rect width="840" height="400" fill="#faf7ef"/><style>text{font:18px DejaVu Sans,sans-serif;fill:#253544}</style><rect x="50" y="60" width="230" height="210" fill="#e4cfb4" stroke="#70543a" stroke-width="4"/><text x="140" y="100">uno</text><path d="M70 150h180v15H70Z M82 165v90 M238 165v90" fill="#a37b52" stroke="#715335" stroke-width="5"/><rect x="370" y="60" width="170" height="210" fill="#e4cfb4" stroke="#70543a" stroke-width="4"/><text x="425" y="100">due</text><rect x="585" y="70" width="225" height="170" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="600" y="115">Noi parliamo</text><text x="600" y="145">insieme.</text><text x="600" y="195">Stanza due.</text><path d="M580 70h50v15h-50Z M765 70h50v15h-50Z" fill="#cdbb8f"/><path d="M680 255v45H460v-20" fill="none" stroke="#488262" stroke-width="4"/><text x="65" y="320">il tavolo: stanza uno</text><text x="580" y="350">il cartello</text><text x="375" y="350">non ha il tavolo</text></svg>