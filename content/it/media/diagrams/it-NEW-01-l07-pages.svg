<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430"><title>La storia dentro il libro blu</title><desc>A delivered, labelled meaning diagram matching the adjacent story stage.</desc><rect width="820" height="430" fill="#faf7ef"/><style>text{font:18px DejaVu Sans,sans-serif;fill:#253544}</style><rect x="30" y="30" width="760" height="365" fill="#617d9a" stroke="#334155" stroke-width="4"/><path d="M55 50h340v320H55Z M425 50h340v320H425Z" fill="#fff8e9" stroke="#d0c1a8" stroke-width="2"/><text x="100" y="95">Una persona porta</text><text x="100" y="130">una pianta.</text><text x="100" y="195">La pianta è verde.</text><text x="100" y="250">Il fiore è giallo.</text><path d="M590 175v100" stroke="#488262" stroke-width="7"/><ellipse cx="570" cy="225" rx="25" ry="12" fill="#488262"/><ellipse cx="610" cy="205" rx="25" ry="12" fill="#488262"/><circle cx="590" cy="175" r="25" fill="#e5c847" stroke="#b39a2f" stroke-width="2"/><text x="95" y="345">il testo</text><text x="485" y="345">la foto: una pianta</text></svg>