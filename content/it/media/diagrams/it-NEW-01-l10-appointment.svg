<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350"><title>La riunione e l’appuntamento</title><desc>A delivered, labelled meaning diagram matching the adjacent story stage.</desc><rect width="820" height="350" fill="#faf7ef"/><style>text{font:18px DejaVu Sans,sans-serif;fill:#253544}</style><rect x="30" y="35" width="345" height="275" fill="#fff8e9" stroke="#8b7559" stroke-width="3"/><rect x="445" y="35" width="345" height="275" fill="#fff8e9" stroke="#8b7559" stroke-width="3"/><text x="80" y="90" style="font-size:24px">la riunione</text><text x="75" y="145" style="font-size:24px">domani, alle tre</text><text x="75" y="220">in biblioteca</text><text x="485" y="90" style="font-size:24px">l’appuntamento</text><text x="480" y="145" style="font-size:24px">oggi, dopo le quattro</text><text x="485" y="220">nella bottega</text></svg>