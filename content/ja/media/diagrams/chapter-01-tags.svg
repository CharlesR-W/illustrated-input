<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">A loose card and an attached tag</title><desc id="desc">The large loose card in Yui’s hand bears her name. The red umbrella has a distinct small tag attached by a cord; the name on it has not been identified.</desc><rect width="960" height="450" fill="#faf5e9"/><path d="M20 410L170 345L208 280L255 280L265 330L190 420Z" fill="#dfb58f"/><rect x="190" y="100" width="300" height="200" rx="14" fill="#fffdf5" stroke="#887351" stroke-width="5"/><text x="340" y="220" text-anchor="middle" font-size="72" fill="#263b30">ゆい</text><path d="M690 65Q790 -25 900 65Q845 40 800 65Q745 40 690 65Z" fill="#c45245" stroke="#86372f" stroke-width="5"/><path d="M800 65V370Q800 410 835 390" fill="none" stroke="#54423b" stroke-width="10"/><path d="M800 150L755 205" stroke="#897251" stroke-width="5"/><rect x="635" y="205" width="185" height="120" rx="9" fill="#fffdf5" stroke="#887351" stroke-width="4"/><path d="M663 244H785M663 274H765M663 304H780" stroke="#aaa391" stroke-width="9"/><text x="337" y="380" text-anchor="middle" font-size="48" fill="#263b30">おおきいふだ</text><text x="720" y="440" text-anchor="middle" font-size="48" fill="#263b30">ちいさいふだ</text></svg>
