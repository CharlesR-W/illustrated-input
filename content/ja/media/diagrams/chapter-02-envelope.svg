<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">The envelope and Mei's card</title><desc id="d">On the desk lies an open empty envelope. Mei's recovered name card lies beside it, outside it. The envelope does not contain another card.</desc><rect width="960" height="500" fill="#faf5e9"/><rect x="40" y="285" width="880" height="45" fill="#b78d57" stroke="#765934" stroke-width="5"/><path d="M70 330V465M885 330V465" stroke="#765934" stroke-width="22"/><path d="M170 270V150L330 45L490 150V270Z" fill="#e4d7b9" stroke="#877456" stroke-width="5"/><path d="M170 270L330 180L490 270M170 150L330 245L490 150" fill="#fffdf5" stroke="#877456" stroke-width="5"/><rect x="600" y="190" width="205" height="85" rx="5" fill="#fffdf5" stroke="#877456" stroke-width="4"/><text x="703" y="250" text-anchor="middle" font-size="55">めい</text><text x="320" y="390" text-anchor="middle" font-size="48">ふうとう</text><text x="710" y="390" text-anchor="middle" font-size="48">ふだ</text><text x="480" y="485" text-anchor="middle" font-size="48">つくえのうえ</text></svg>
