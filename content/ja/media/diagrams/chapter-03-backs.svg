<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="t d"><title id="t">Comparing the three reverse sides</title><desc id="d">Yui's large card has her name on its reverse. Mei and Ren have distinct small cards, the same size, with matching copies of a reading-room photograph. Turning a card over does not make a new card.</desc><defs><g id="room"><rect x="0" y="0" width="165" height="115" fill="#dbd5c7" stroke="#746d61" stroke-width="4"/><path d="M15 95V15H150V95M15 95H150" fill="none" stroke="#746d61" stroke-width="4"/><path d="M50 70H122M60 70V92M110 70V92" stroke="#746d61" stroke-width="7"/><rect x="60" y="58" width="38" height="10" fill="#47725c"/><path d="M25 80H45M30 80V98M40 80V98M30 80V55H43V80" fill="none" stroke="#746d61" stroke-width="4"/></g></defs><rect width="960" height="550" fill="#faf5e9"/><text x="480" y="65" text-anchor="middle" font-size="56">うら</text><rect x="40" y="105" width="280" height="290" rx="10" fill="#fffdf5" stroke="#877456" stroke-width="5"/><text x="180" y="270" text-anchor="middle" font-size="70">ゆい</text><rect x="380" y="160" width="215" height="200" rx="8" fill="#fffdf5" stroke="#877456" stroke-width="5"/><use href="#room" x="405" y="195"/><rect x="680" y="160" width="215" height="200" rx="8" fill="#fffdf5" stroke="#877456" stroke-width="5"/><use href="#room" x="705" y="195"/><text x="180" y="475" text-anchor="middle" font-size="54">ゆい</text><text x="488" y="475" text-anchor="middle" font-size="54">めい</text><text x="788" y="475" text-anchor="middle" font-size="54">れん</text></svg>
