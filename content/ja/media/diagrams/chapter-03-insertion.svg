<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">One card inside the envelope</title><desc id="d">Mei's hand places her small card in the open envelope. It is the only card inside. Yui still holds her large card separately; the envelope's two recipient names are Mei and Ren.</desc><rect width="960" height="500" fill="#faf5e9"/><path d="M365 390V170L590 35L815 170V390Z" fill="#e4d7b9" stroke="#877456" stroke-width="5"/><rect x="520" y="70" width="145" height="160" rx="7" fill="#fffdf5" stroke="#877456" stroke-width="4"/><text x="592" y="130" text-anchor="middle" font-size="54">めい</text><path d="M365 390L590 245L815 390M365 170L590 340L815 170" fill="#fffdf5" stroke="#877456" stroke-width="5"/><path d="M795 70L690 125L657 178L632 175L625 140L671 88L755 25Z" fill="#d3a37d"/><rect x="50" y="110" width="240" height="175" rx="10" fill="#fffdf5" stroke="#877456" stroke-width="5"/><text x="170" y="220" text-anchor="middle" font-size="64">ゆい</text><text x="590" y="460" text-anchor="middle" font-size="54">ひとつ</text></svg>
