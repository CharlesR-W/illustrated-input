<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">The two cards and the addressed envelope</title><desc id="d">The open envelope is addressed to Mei and Ren. Mei's small name card lies beside it. Yui holds her separate larger name card. No missing card or reverse-side information is revealed.</desc><rect width="960" height="560" fill="#faf5e9"/><rect x="35" y="390" width="890" height="42" fill="#b78d57"/><path d="M60 432V540M900 432V540" stroke="#765934" stroke-width="20"/><path d="M385 365V210L575 70L765 210V365Z" fill="#e4d7b9" stroke="#877456" stroke-width="5"/><path d="M385 365L575 255L765 365M385 210L575 325L765 210" fill="#fffdf5" stroke="#877456" stroke-width="5"/><text x="575" y="235" text-anchor="middle" font-size="54">めい と れん</text><rect x="80" y="70" width="230" height="170" rx="10" fill="#fffdf5" stroke="#877456" stroke-width="5"/><text x="195" y="175" text-anchor="middle" font-size="64">ゆい</text><path d="M30 355L90 225L130 220L145 242L110 345Z" fill="#dfb58f"/><rect x="105" y="285" width="150" height="83" rx="7" fill="#fffdf5" stroke="#877456" stroke-width="4"/><text x="180" y="344" text-anchor="middle" font-size="54">めい</text><text x="195" y="505" text-anchor="middle" font-size="48">ふだ</text><text x="585" y="505" text-anchor="middle" font-size="48">ふうとう</text></svg>
