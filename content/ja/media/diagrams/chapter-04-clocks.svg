<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1000" role="img" aria-labelledby="t d"><title id="t">Three o'clock and half past three</title><desc id="d">A reading-reference diagram, not an extra story object: both clocks are p.m. The upper clock shows three o'clock, with the minute hand straight up and hour hand right. The lower shows 3:30, with the minute hand down and hour hand halfway between three and four.</desc><defs><g id="face"><circle r="145" fill="#fffdf5" stroke="#746d61" stroke-width="8"/><path d="M0 -125V-113M62 -108L56 -98M108 -62L98 -56M125 0H113M108 62L98 56M62 108L56 98M0 125V113M-62 108L-56 98M-108 62L-98 56M-125 0H-113M-108 -62L-98 -56M-62 -108L-56 -98" stroke="#746d61" stroke-width="7"/></g></defs><rect width="480" height="1000" fill="#faf5e9"/><text x="240" y="80" text-anchor="middle" font-size="80">ごご</text><use href="#face" x="240" y="275"/><path d="M240 275V165" stroke="#3976af" stroke-width="12" stroke-linecap="round"/><path d="M240 275H321" stroke="#c45245" stroke-width="17" stroke-linecap="round"/><circle cx="240" cy="275" r="11" fill="#746d61"/><text x="240" y="525" text-anchor="middle" font-size="80">さんじ</text><use href="#face" x="240" y="710"/><path d="M240 710V820" stroke="#3976af" stroke-width="12" stroke-linecap="round"/><path d="M240 710L318 731" stroke="#c45245" stroke-width="17" stroke-linecap="round"/><circle cx="240" cy="710" r="11" fill="#746d61"/><text x="240" y="950" text-anchor="middle" font-size="80">さんじはん</text></svg>
