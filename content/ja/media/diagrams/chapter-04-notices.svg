<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="t d"><title id="t">Today's programme and tomorrow's notice</title><desc id="d">The first notice applies to today, with morning books, daytime photographs and an evening gathering. The relevant second notice applies to tomorrow and specifies the reading-room gathering at 3:30 p.m. These are two distinct notices.</desc><rect width="960" height="700" fill="#faf5e9"/><rect x="30" y="35" width="420" height="630" rx="10" fill="#fffdf5" stroke="#877456" stroke-width="5"/><rect x="510" y="35" width="420" height="630" rx="10" fill="#fffdf5" stroke="#877456" stroke-width="5"/><text x="240" y="125" text-anchor="middle" font-size="64">きょう</text><text x="240" y="205" text-anchor="middle" font-size="56">おしらせ</text><path d="M60 240H420M540 240H900" stroke="#b5a88d" stroke-width="4"/><text x="70" y="335" font-size="56">あさ</text><text x="255" y="335" font-size="56">ほん</text><text x="70" y="445" font-size="56">ひる</text><text x="235" y="445" font-size="48">しゃしん</text><text x="70" y="555" font-size="56">よる</text><text x="235" y="555" font-size="48">あつまり</text><text x="720" y="125" text-anchor="middle" font-size="64">あした</text><text x="720" y="205" text-anchor="middle" font-size="56">おしらせ</text><text x="720" y="330" text-anchor="middle" font-size="64">ごご</text><text x="720" y="425" text-anchor="middle" font-size="64">さんじはん</text><text x="720" y="545" text-anchor="middle" font-size="56">ほんのへや</text><text x="720" y="615" text-anchor="middle" font-size="56">あつまり</text></svg>
