<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="t d"><title id="t">The day and the blank time field</title><desc id="d">At the opening Mei holds the two small invitations. One front shows Mei's name and Tomorrow. The other visible reverse has the reading-room photograph and an empty Time field. Yui's larger name card stays separate. No meeting time is revealed.</desc><rect width="960" height="580" fill="#faf5e9"/><rect x="25" y="80" width="260" height="360" rx="12" fill="#fffdf5" stroke="#877456" stroke-width="5"/><text x="155" y="165" text-anchor="middle" font-size="64">ゆい</text><path d="M40 475L75 415L120 415L132 440L105 492Z" fill="#dfb58f"/><rect x="355" y="140" width="235" height="285" rx="9" fill="#fffdf5" stroke="#877456" stroke-width="5"/><text x="473" y="225" text-anchor="middle" font-size="62">めい</text><text x="473" y="325" text-anchor="middle" font-size="56">あした</text><rect x="665" y="140" width="235" height="285" rx="9" fill="#fffdf5" stroke="#877456" stroke-width="5"/><rect x="690" y="175" width="185" height="100" fill="#dbd5c7" stroke="#746d61" stroke-width="4"/><path d="M705 255V190H860V255M735 235H835M748 235V260M823 235V260" fill="none" stroke="#746d61" stroke-width="5"/><text x="782" y="335" text-anchor="middle" font-size="48">じかん</text><rect x="690" y="355" width="185" height="42" fill="#fffdf5" stroke="#877456" stroke-width="3"/><path d="M565 500L545 425L580 400L612 423L620 475Z" fill="#d3a37d"/><path d="M705 500L685 425L720 400L752 423L760 475Z" fill="#d3a37d"/><text x="615" y="555" text-anchor="middle" font-size="48">しょうたいじょう</text></svg>
