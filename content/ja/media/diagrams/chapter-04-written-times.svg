<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="t d"><title id="t">The same agreed time in three records</title><desc id="d">Yui's large personal name card now has a When heading with Tomorrow and the agreed 3:30 p.m. memo. Separate close-ups show the filled time fields on Mei and Ren's two small invitations. Ren has completed his tentative three o'clock by adding half past. These remain three distinct cards.</desc><rect width="960" height="680" fill="#faf5e9"/><rect x="20" y="70" width="300" height="565" rx="12" fill="#fffdf5" stroke="#877456" stroke-width="5"/><text x="170" y="155" text-anchor="middle" font-size="64">ゆい</text><text x="170" y="250" text-anchor="middle" font-size="60">いつ</text><text x="170" y="325" text-anchor="middle" font-size="60">あした</text><text x="170" y="420" text-anchor="middle" font-size="52">じかん</text><text x="170" y="500" text-anchor="middle" font-size="60">ごご</text><text x="170" y="585" text-anchor="middle" font-size="52">さんじはん</text><text x="490" y="105" text-anchor="middle" font-size="60">めい</text><text x="800" y="105" text-anchor="middle" font-size="60">れん</text><rect x="350" y="150" width="280" height="380" rx="10" fill="#fffdf5" stroke="#877456" stroke-width="5"/><rect x="660" y="150" width="280" height="380" rx="10" fill="#fffdf5" stroke="#877456" stroke-width="5"/><path d="M375 185H605M685 185H915" stroke="#b5a88d" stroke-width="14"/><text x="490" y="285" text-anchor="middle" font-size="54">じかん</text><text x="490" y="375" text-anchor="middle" font-size="60">ごご</text><text x="490" y="465" text-anchor="middle" font-size="48">さんじはん</text><text x="800" y="285" text-anchor="middle" font-size="54">じかん</text><text x="800" y="375" text-anchor="middle" font-size="60">ごご</text><text x="800" y="465" text-anchor="middle" font-size="48">さんじはん</text></svg>
