<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img"><title>ja-NEW-01-l05-img-correction</title><desc>Ren cancels both original wrong labels with clear crossing strokes, then writes station at left and river at right. Only the new labels remain active. The public road sign supplies the correction.</desc><style>text{font-family:sans-serif;fill:#18352d}.jp{font-size:22px}.small{font-size:20px}.en{font-size:20px}.line{stroke:#45675e;stroke-width:5;fill:none}.paper{fill:#fffdf4;stroke:#526b60;stroke-width:2}</style><rect width="360" height="280" rx="12" fill="#e8f0e6"/><text x="180" y="30" class="jp" text-anchor="middle">ちず</text><text x="180" y="57" class="en" text-anchor="middle">Old names crossed out.</text><text x="180" y="79" class="en" text-anchor="middle">New names are active.</text><path d="M180 238V204L78 170M180 204L282 170" class="line"/><path d="M78 170l8 22m-8-22l23-3M282 170l-8 22m8-22l-23-3" class="line"/><text x="78" y="113" class="jp" text-anchor="middle" opacity=".6">かわ</text><path d="M51 104L105 111" stroke="#a03d32" stroke-width="3"/><text x="282" y="113" class="jp" text-anchor="middle" opacity=".6">えき</text><path d="M255 104L309 111" stroke="#a03d32" stroke-width="3"/><text x="78" y="148" class="jp" text-anchor="middle">えき</text><text x="282" y="148" class="jp" text-anchor="middle">かわ</text><text x="180" y="194" class="small" text-anchor="middle">かど</text><text x="180" y="269" class="jp" text-anchor="middle">ほんのへや</text></svg>
