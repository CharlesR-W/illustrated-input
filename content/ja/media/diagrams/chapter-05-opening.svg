<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img"><title>ja-NEW-01-l05-img-opening</title><desc>Today’s room-closing deadline and the key caretaker’s midday station notice. Tomorrow’s gathering is a separate event.</desc><style>text{font-family:sans-serif;fill:#18352d}.jp{font-size:22px}.small{font-size:18px}.en{font-size:17px}.line{stroke:#45675e;stroke-width:5;fill:none}.paper{fill:#fffdf4;stroke:#526b60;stroke-width:2}</style><rect width="360" height="240" rx="12" fill="#e8f0e6"/><text x="180" y="32" class="jp" text-anchor="middle">ほんのへや</text><rect x="16" y="50" width="328" height="68" class="paper"/><text x="32" y="78" class="small">きょう　さんじはん</text><text x="32" y="103" class="small">しまります</text><rect x="16" y="130" width="328" height="86" class="paper"/><text x="32" y="158" class="small">かぎのかかり</text><text x="32" y="185" class="small">きょうのひる　えきにいます</text><text x="32" y="208" class="en">Read today’s notice before leaving.</text></svg>
