<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 265" role="img"><title>ja-NEW-01-l05-img-public-note</title><desc>A large nighttime gathering notice and a smaller public memo at the shop entrance. The memo addresses the reading room and announces the caretaker’s visit tomorrow morning. No private note is removed.</desc><style>text{font-family:sans-serif;fill:#18352d}.jp{font-size:22px}.small{font-size:18px}.en{font-size:17px}.line{stroke:#45675e;stroke-width:5;fill:none}.paper{fill:#fffdf4;stroke:#526b60;stroke-width:2}</style><rect width="360" height="265" rx="12" fill="#e8f0e6"/><text x="180" y="30" class="jp" text-anchor="middle">まちのおしらせ</text><rect x="10" y="48" width="170" height="178" class="paper"/><text x="95" y="84" class="small" text-anchor="middle">よるのあつまり</text><rect x="190" y="63" width="160" height="136" class="paper"/><g font-size="16"><text x="198" y="88">ほんのへやへ</text><text x="198" y="113">あしたのあさ</text><text x="198" y="138">へやへいきます</text><text x="198" y="163">かぎのかかりから</text></g><text x="180" y="253" class="en" text-anchor="middle">A public shop notice; it stays here.</text></svg>
