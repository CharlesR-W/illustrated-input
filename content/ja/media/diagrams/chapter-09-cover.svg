<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 275" role="img" aria-labelledby="title desc"><title id="title">A cupboard and two separate packets</title><desc id="desc">The cupboard doors are closed. On the table are the original staff-invitation packet and a separate money envelope. No amount, key fault or cupboard contents is revealed.</desc><style>text{font-family:sans-serif;fill:#203c37}.jp{font-size:21px}.small{font-size:18px}.paper{fill:#fffdf5;stroke:#617369;stroke-width:2}</style><rect width="360" height="275" rx="12" fill="#e9f0e5"/><rect x="112" y="18" width="136" height="110" rx="3" fill="#b6afa0" stroke="#566257" stroke-width="3"/><path d="M180 20v106" stroke="#566257" stroke-width="3"/><circle cx="180" cy="73" r="6" fill="#3d4b42"/><path d="M180 76v7" stroke="#3d4b42" stroke-width="3"/><text x="180" y="153" class="jp" text-anchor="middle">とだな</text><rect x="15" y="171" width="330" height="91" fill="#b9a587" rx="5"/><path d="M27 181h155v67H27z" class="paper"/><path d="M35 188l69 29 69-29" fill="none" stroke="#617369" stroke-width="2"/><text x="105" y="241" font-size="17" text-anchor="middle">じゅうさんにち</text><rect x="199" y="181" width="133" height="67" class="paper"/><path d="M204 188l62 29 61-29" fill="none" stroke="#617369" stroke-width="2"/><text x="266" y="241" class="small" text-anchor="middle">おかね</text></svg>
