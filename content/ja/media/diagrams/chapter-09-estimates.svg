<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">Parts and hired tools are separate costs</title><desc id="desc">The blue repair-parts box is offered for2000yen. A separate hired tool kit costs1000yen. The combined3000yen uses the whole fund. These are estimates, not a successful repair.</desc><style>text{font-family:sans-serif;fill:#203c37}.jp{font-size:21px}.small{font-size:18px}.paper{fill:#fffdf5;stroke:#617369;stroke-width:2}</style><rect width="360" height="240" rx="12" fill="#e9f0e5"/><text x="180" y="30" class="jp" text-anchor="middle">みせのねだん</text><rect x="17" y="52" width="153" height="128" class="paper"/><rect x="190" y="52" width="153" height="128" class="paper"/><rect x="50" y="64" width="85" height="43" rx="4" fill="#83b0cf" stroke="#376984" stroke-width="2"/><text x="94" y="135" class="jp" text-anchor="middle">ぶひん</text><text x="94" y="164" class="small" text-anchor="middle">にせんえん</text><rect x="224" y="64" width="85" height="43" rx="4" fill="#adb3b0" stroke="#52635a" stroke-width="2"/><text x="267" y="135" class="jp" text-anchor="middle">どうぐ</text><text x="267" y="164" class="small" text-anchor="middle">せんえん</text><text x="180" y="216" class="small" text-anchor="middle">ぜんぶで　さんぜんえん</text></svg>
