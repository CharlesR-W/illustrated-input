<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 307" role="img" aria-labelledby="title desc"><title id="title">Small prepared invitation sheets and their prices</title><desc id="desc">This price reference shows one through four small prepared invitation sheets, costing100,200,300and400yen. It illustrates the quoted quantities, not cards already bought. No untaught value is printed.</desc><style>text{font-family:sans-serif;fill:#203c37}.jp{font-size:21px}.small{font-size:18px}.paper{fill:#fffdf5;stroke:#617369;stroke-width:2}</style><rect width="360" height="307" rx="12" fill="#e9f0e5"/><text x="180" y="29" class="jp" text-anchor="middle">ちいさいかみのねだん</text><rect x="25" y="53" width="42" height="27" rx="2" class="paper"/><text x="105" y="77" class="small">いちまい　ひゃくえん</text><rect x="25" y="113" width="42" height="27" rx="2" class="paper"/><rect x="34" y="117" width="42" height="27" rx="2" class="paper"/><text x="105" y="137" class="small">にまい　にひゃくえん</text><rect x="25" y="173" width="42" height="27" rx="2" class="paper"/><rect x="34" y="177" width="42" height="27" rx="2" class="paper"/><rect x="43" y="181" width="42" height="27" rx="2" class="paper"/><text x="105" y="197" class="small">さんまい　さんびゃくえん</text><rect x="25" y="233" width="42" height="27" rx="2" class="paper"/><rect x="34" y="237" width="42" height="27" rx="2" class="paper"/><rect x="43" y="241" width="42" height="27" rx="2" class="paper"/><rect x="52" y="245" width="42" height="27" rx="2" class="paper"/><text x="105" y="257" class="small">よんまい　よんひゃくえん</text></svg>
