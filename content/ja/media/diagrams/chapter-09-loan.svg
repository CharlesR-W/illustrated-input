<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 308" role="img" aria-labelledby="title desc"><title id="title">Haru lends her own tools without taking money</title><desc id="desc">Haru, an older female retired sign painter in a cardigan and trousers, places her labelled red tool case on the table. Her own-name loan tag preserves ownership. The cupboard stays shut and no unknown parcel is opened.</desc><style>text{font-family:sans-serif;fill:#203c37}.jp{font-size:21px}.small{font-size:18px}.paper{fill:#fffdf5;stroke:#617369;stroke-width:2}</style><rect width="360" height="308" rx="12" fill="#e9f0e5"/><circle cx="80" cy="65" r="23" fill="#dcbba1"/><path d="M58 63q-5-35 24-33 28 0 24 35l-10-13-18-5-18 14" fill="#89908c"/><path d="M56 88q24-8 48 0l20 76H37z" fill="#756088" stroke="#554466" stroke-width="2"/><path d="M58 103l-19 61 15 5 26-49M102 103l33 39 36 4-1 14-43-4-38-35" fill="#756088" stroke="#554466" stroke-width="3"/><ellipse cx="171" cy="153" rx="12" ry="8" fill="#dcbba1"/><path d="M48 164l4 61h23l5-54 7 54h24l-4-61" fill="#40566d"/><text x="82" y="251" class="jp" text-anchor="middle">はる</text><rect x="151" y="166" width="191" height="13" rx="3" fill="#a18b6f"/><path d="M163 179v48M330 179v48" stroke="#856f55" stroke-width="9"/><rect x="193" y="107" width="116" height="58" rx="7" fill="#b55d58" stroke="#7e3835" stroke-width="3"/><path d="M225 107v-12h51v12" fill="none" stroke="#7e3835" stroke-width="5"/><rect x="199" y="121" width="104" height="31" class="paper"/><text x="251" y="143" font-size="18" text-anchor="middle">はる</text><text x="246" y="204" class="small" text-anchor="middle">かします</text><text x="180" y="286" class="small" text-anchor="middle">おかねは、うけとりません</text></svg>
