<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img"><title>The agreed reading order</title><desc>A clear reference lists four successive turns: Yui with a picture book, Ren with a newspaper, Mei with a story and Haru with a song. The caption identifies the reverse of the memo.</desc><style>text{font-family:"Noto Sans JP",sans-serif;font-size:32px;fill:#273f42}.small{font-size:30px}.line{stroke:#526c6c;stroke-width:3;fill:none}</style><rect width="640" height="440" rx="18" fill="#f5f0e4"/><text x="230" y="43">じゅんばん</text><rect x="40" y="66" width="560" height="315" rx="12" fill="#fffdf8" stroke="#8a9a8f" stroke-width="3"/><path d="M246 80V366" class="line"/><path d="M57 145H583M57 224H583M57 303H583" stroke="#d6ddd0" stroke-width="2"/><text x="103" y="117">ゆい</text><text x="330" y="117">えほん</text><text x="103" y="196">れん</text><text x="315" y="196">しんぶん</text><text x="103" y="275">めい</text><text x="299" y="275">ものがたり</text><text x="103" y="354">はる</text><text x="346" y="354">うた</text><path d="M75 154V210M64 197L75 211L86 197 M75 232V288M64 275L75 289L86 275 M75 311V366M64 353L75 367L86 353" class="line"/><text x="204" y="423">メモの うら</text></svg>
