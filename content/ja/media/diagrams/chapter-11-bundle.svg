<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="title desc"><title id="title">An intact bundle on protective paper</title><desc id="desc">After the move: a tied and sealed wrapped bundle lies on ordinary protective paper. Water stains touch the outer wrapper and protective paper; no contents, address or signature is visible.</desc><rect width="360" height="270" rx="16" fill="#f4efdf"/><style>text{font-family:sans-serif;font-size:18px;fill:#29373a}.line{fill:none;stroke:#34484c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect x="22" y="65" width="316" height="153" fill="#fffdf8" stroke="#b0aea2" stroke-width="2"/><path d="M48 86L294 71L315 176L65 195Z" fill="#bfa88a" stroke="#76664e" stroke-width="3"/><path d="M160 80L177 187M53 135L305 120" stroke="#735739" stroke-width="5"/><circle cx="173" cy="128" r="17" fill="#aa5f50" stroke="#743f38" stroke-width="2"/><path d="M251 147Q303 118 310 160Q326 184 286 189Q268 219 238 192Q214 174 251 147Z" fill="#769ca9" opacity=".4"/><text x="180" y="38" text-anchor="middle">ひも と ふう</text><text x="180" y="250" text-anchor="middle">みずの しみ</text></svg>
