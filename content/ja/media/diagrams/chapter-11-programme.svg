<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="title desc"><title id="title">Large separate programme</title><desc id="desc">The new large sheet gives the unchanged four named turns, today evening, and the clarified song and story titles. It is a new sheet, not the financial memo or invitations.</desc><rect width="360" height="270" rx="16" fill="#f4efdf"/><style>text{font-family:sans-serif;font-size:18px;fill:#29373a}.line{fill:none;stroke:#34484c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect x="38" y="15" width="284" height="240" rx="5" fill="#fffdf6" stroke="#8e947f" stroke-width="2"/><text x="180" y="43" text-anchor="middle">きょうの よる</text><text x="180" y="78" text-anchor="middle">ゆい　えほん</text><text x="180" y="110" text-anchor="middle">れん　しんぶん</text><text x="180" y="142" text-anchor="middle">めい　ものがたり</text><text x="180" y="174" text-anchor="middle">かわのものがたり</text><text x="180" y="207" text-anchor="middle">はる　うた</text><text x="180" y="238" text-anchor="middle">まちのみち</text></svg>
