<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc"><title id="title">Carrying books while holding a basin</title><desc id="desc">Mei carries dry books while Ren holds a wide basin beneath roof drips. A separate bucket stands beside him. The basin and bucket are visibly different containers.</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#203b45;font-size:30px;font-weight:600} .small{font-size:28px} .outline{stroke:#355563;stroke-width:4;stroke-linejoin:round;stroke-linecap:round} .label{fill:#fff9e9;stroke:#d9caa6;stroke-width:2}</style><rect width="640" height="510" rx="18" fill="#edf3ef"/><text x="24" y="42" class="">はこびます／もっています</text><circle cx="332" cy="153" r="24" fill="#f0c7a4" class="outline"/><path d="M309 147Q312 115 352 135" fill="#3f3936"/><path d="M300 185Q332 165 364 185L372 253H292Z" fill="#6b8da5" class="outline"/><text x="301" y="294" class="">れん</text><circle cx="103" cy="166" r="24" fill="#f0c7a4" class="outline"/><path d="M80 160Q83 128 123 148" fill="#3f3936"/><path d="M71 198Q103 178 135 198L143 266H63Z" fill="#bd8e76" class="outline"/><text x="72" y="307" class="">めい</text><rect x="40" y="212" width="130" height="41" rx="10" fill="#a3b87d" class="outline" /><rect x="53" y="201" width="103" height="16" rx="10" fill="#eee0b8" class="outline" /><path d="M252 226Q332 257 413 226L394 281Q332 311 272 281Z" fill="#a7d4df" class="outline"/><path d="M302 202L267 230" fill="none" stroke="#355563" stroke-width="4" stroke-linecap="round"/><path d="M363 202L400 230" fill="none" stroke="#355563" stroke-width="4" stroke-linecap="round"/><path d="M334 75L334 105" fill="none" stroke="#4c9eb4" stroke-width="5" stroke-linecap="round"/><path d="M334 115L334 137" fill="none" stroke="#4c9eb4" stroke-width="5" stroke-linecap="round"/><text x="246" y="345" class="">たらい</text><path d="M468 274H571L557 367H485Z" fill="#6e9db3" class="outline"/><path d="M480 275Q520 209 560 275" fill="none" class="outline"/><text x="460" y="411" class="">バケツ</text><text x="25" y="466" class="small">ほんをはこんでいます</text></svg>
