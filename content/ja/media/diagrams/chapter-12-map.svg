<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc"><title id="title">An unfinished map face</title><desc id="desc">A schematic inland reading-room-to-river line stops at the river. A station is separately labelled without a connecting line. The name field is blank; the picture does not identify author, owner, signature or a parcel.</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#203b45;font-size:30px;font-weight:600} .small{font-size:28px} .outline{stroke:#355563;stroke-width:4;stroke-linejoin:round;stroke-linecap:round} .label{fill:#fff9e9;stroke:#d9caa6;stroke-width:2}</style><rect width="640" height="510" rx="18" fill="#edf3ef"/><text x="25" y="43" class="">みかんせいのちず</text><rect x="24" y="68" width="592" height="414" rx="10" fill="#fff8df" class="outline" /><rect x="52" y="100" width="185" height="58" rx="10" fill="#e9c99e" class="outline" /><text x="68" y="141" class="">ほんのへや</text><path d="M81 216Q210 188 323 249T565 229" fill="none" stroke="#8ac3d6" stroke-width="32"/><text x="489" y="211" class="">かわ</text><path d="M143 158L143 192L261 192L261 227" fill="none" stroke="#ae7951" stroke-width="10" stroke-linecap="round"/><text x="303" y="167" class="">せん</text><path d="M301 174L269 196" fill="none" stroke="#ae7951" stroke-width="3" stroke-linecap="round"/><rect x="413" y="325" width="139" height="62" rx="10" fill="#b6c8bd" class="outline" /><text x="462" y="366" class="">えき</text><text x="63" y="360" class="">ここまで</text><text x="61" y="438" class="">なまえ</text><path d="M168 441L549 441" fill="none" stroke="#a7a18a" stroke-width="3" stroke-linecap="round"/></svg>
