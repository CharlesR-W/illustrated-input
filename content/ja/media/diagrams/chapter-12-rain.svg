<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc"><title id="title">Rain entering the reading room</title><desc id="desc">An open window admits rain and wind. A separate roof drip threatens the small table where a corded sealed bundle rests on blank protective paper. Dry books are on a chair.</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#203b45;font-size:30px;font-weight:600} .small{font-size:28px} .outline{stroke:#355563;stroke-width:4;stroke-linejoin:round;stroke-linecap:round} .label{fill:#fff9e9;stroke:#d9caa6;stroke-width:2}</style><rect width="640" height="510" rx="18" fill="#edf3ef"/><text x="26" y="43" class="">あめと、やねのみず</text><rect x="28" y="75" width="200" height="172" rx="10" fill="#bbd8e5" class="outline" /><path d="M128 76L128 246" fill="none" stroke="#355563" stroke-width="4" stroke-linecap="round"/><path d="M28 159L228 159" fill="none" stroke="#355563" stroke-width="4" stroke-linecap="round"/><path d="M52 99L44 118" fill="none" stroke="#4d92ad" stroke-width="5" stroke-linecap="round"/><path d="M91 120L83 139" fill="none" stroke="#4d92ad" stroke-width="5" stroke-linecap="round"/><path d="M170 94L162 113" fill="none" stroke="#4d92ad" stroke-width="5" stroke-linecap="round"/><path d="M194 127L186 146" fill="none" stroke="#4d92ad" stroke-width="5" stroke-linecap="round"/><path d="M58 191L50 210" fill="none" stroke="#4d92ad" stroke-width="5" stroke-linecap="round"/><path d="M166 189L158 208" fill="none" stroke="#4d92ad" stroke-width="5" stroke-linecap="round"/><path d="M201 74L258 108V254L201 245Z" fill="#d5e6e8" class="outline"/><text x="37" y="291" class="">まど</text><path d="M285 85L604 85" fill="none" stroke="#8e7356" stroke-width="18" stroke-linecap="round"/><path d="M385 90L385 150" fill="none" stroke="#4c9eb4" stroke-width="5" stroke-linecap="round"/><path d="M385 153q-20 26 0 31q20-5 0-31" fill="#4c9eb4"/><rect x="288" y="281" width="304" height="20" rx="10" fill="#ad8b65" class="outline" /><path d="M309 301L309 433" fill="none" stroke="#947455" stroke-width="10" stroke-linecap="round"/><path d="M572 301L572 433" fill="none" stroke="#947455" stroke-width="10" stroke-linecap="round"/><rect x="336" y="273" width="189" height="8" rx="10" fill="#fff9e9" class="outline" /><rect x="352" y="224" width="155" height="55" rx="10" fill="#d9bb86" class="outline" /><path d="M428 225L428 278" fill="none" stroke="#866239" stroke-width="6" stroke-linecap="round"/><rect x="412" y="224" width="31" height="23" rx="10" fill="#b64b3d" class="outline" /><text x="334" y="208" class="">つつみ</text><rect x="38" y="362" width="185" height="20" rx="10" fill="#ad8b65" class="outline" /><rect x="68" y="321" width="112" height="35" rx="10" fill="#a6b5d3" class="outline" /><text x="48" y="433" class="">ほんは、</text><text x="48" y="471" class="">ぬれていません</text><text x="306" y="471" class="">ふうは、あけません</text></svg>
