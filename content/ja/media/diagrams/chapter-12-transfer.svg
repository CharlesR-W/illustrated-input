<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc"><title id="title">A leaf falls through the torn bottom</title><desc id="desc">The upper seal and cord remain on a bundle. Its wet lower wrapping has torn; one wet leaf falls out below onto the protected tray. The illustration does not display any other bundle contents.</desc><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#203b45;font-size:30px;font-weight:600} .small{font-size:28px} .outline{stroke:#355563;stroke-width:4;stroke-linejoin:round;stroke-linecap:round} .label{fill:#fff9e9;stroke:#d9caa6;stroke-width:2}</style><rect width="640" height="510" rx="18" fill="#edf3ef"/><text x="24" y="44" class="">したが、やぶれています</text><rect x="76" y="104" width="354" height="174" rx="10" fill="#d9bb86" class="outline" /><path d="M250 106L250 265" fill="none" stroke="#88683a" stroke-width="7" stroke-linecap="round"/><rect x="221" y="102" width="58" height="42" rx="10" fill="#ad4e3f" class="outline" /><text x="461" y="137" class="">ふう</text><path d="M438 145L282 125" fill="none" stroke="#ad4e3f" stroke-width="3" stroke-linecap="round"/><text x="461" y="207" class="">ひも</text><path d="M446 214L255 187" fill="none" stroke="#88683a" stroke-width="3" stroke-linecap="round"/><path d="M118 276L144 248L173 277L197 253L221 278L247 255L266 278" fill="#735c45" stroke="#355563" stroke-width="4"/><path d="M157 279L326 289L316 376L147 362Z" fill="#fff5d7" class="outline"/><path d="M179 304L283 317" fill="none" stroke="#5c8ca1" stroke-width="6" stroke-linecap="round"/><path d="M55 392Q320 429 586 392L572 437Q320 468 70 437Z" fill="#b6ced0" class="outline"/><text x="357" y="365" class="">ページ</text><text x="257" y="491" class="">おぼん</text></svg>
