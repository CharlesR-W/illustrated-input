<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="title desc"><title id="title">The borrowed book and the separate copy</title><desc id="desc">A closed blue public book labelled Town River, a pencil and a separate blank working sheet; the map author and final route segment are not shown.</desc><rect width="360" height="270" rx="16" fill="#f4efdf"/><style>text{font-family:sans-serif;fill:#283f45}path,line{stroke-linecap:round;stroke-linejoin:round}</style><path d="M38 50H172V217H38Q27 214 27 203V65Q27 54 38 50Z" fill="#557f9a" stroke="#324d66" stroke-width="3"/><path d="M38 50V215" stroke="#b6d1dd" stroke-width="4"/><text x="104" y="110" text-anchor="middle" font-size="17">まちのかわ</text><rect x="192" y="80" width="135" height="148" transform="rotate(5 260 155)" fill="#fffef7" stroke="#b4b29c" stroke-width="2"/><path d="M222 61L294 24L302 39L230 76L216 77Z" fill="#cc9b4a" stroke="#78582f" stroke-width="2"/><text x="256" y="156" text-anchor="middle" font-size="18">うつし</text><text x="180" y="253" text-anchor="middle" font-size="18">としょかん</text></svg>
