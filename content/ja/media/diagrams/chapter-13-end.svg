<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="title desc"><title id="title">The route’s final segment</title><desc id="desc">An unfinished route runs from a reading-room square toward a curved river. Its terminal segment is highlighted, while a separate station label remains isolated. This identifies a route segment, not its author or the chronological order of strokes.</desc><rect width="360" height="270" rx="16" fill="#f4efdf"/><style>text{font-family:sans-serif;fill:#283f45}path,line{stroke-linecap:round;stroke-linejoin:round}</style><path d="M251 44Q203 92 256 128Q298 163 237 224" fill="none" stroke="#7297a9" stroke-width="7"/><rect x="41" y="54" width="55" height="40" fill="#cbb08a" stroke="#715e46" stroke-width="2"/><path d="M96 74H155V135H202" fill="none" stroke="#676b60" stroke-width="4"/><path d="M202 135L267 144" fill="none" stroke="#b06c4b" stroke-width="6"/><text x="72" y="37" text-anchor="middle" font-size="18">へや</text><text x="298" y="91" text-anchor="middle" font-size="18">かわ</text><text x="89" y="216" text-anchor="middle" font-size="18">えき</text><text x="174" y="186" text-anchor="middle" font-size="17">さいごのせん</text></svg>
