<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="title desc"><title id="title">Two roles in one book loan</title><desc id="desc">Two adult people, a library lender on the left and the regular male borrower on the right, exchange one blue book across the desk. The people have different borrowing/lending descriptions without invented personal names.</desc><rect width="360" height="270" rx="16" fill="#f4efdf"/><style>text{font-family:sans-serif;fill:#283f45}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect x="29" y="168" width="302" height="25" rx="4" fill="#ac8a68"/><path d="M60 168V113Q60 84 100 84Q140 84 140 113V168" fill="#9b9e79"/><circle cx="100" cy="64" r="23" fill="#c9a984"/><path d="M220 168V113Q220 84 260 84Q300 84 300 113V168" fill="#647c92"/><circle cx="260" cy="64" r="23" fill="#bd9878"/><path d="M83 116L149 151M276 116L210 151" stroke="#c6a27d" stroke-width="15"/><rect x="145" y="124" width="70" height="45" rx="3" fill="#557f9a" stroke="#324d66" stroke-width="2"/><text x="100" y="224" text-anchor="middle" font-size="18">かすひと</text><text x="260" y="224" text-anchor="middle" font-size="18">かりるひと</text></svg>
