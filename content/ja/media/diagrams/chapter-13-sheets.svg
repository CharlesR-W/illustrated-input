<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="title desc"><title id="title">Three separate sheets</title><desc id="desc">The older exposed map remains at the reading room. The new copy carried by Yui and the new river sketch carried by Ren are separate sheets; the two new sheets travel back to the older one.</desc><rect width="360" height="270" rx="16" fill="#f4efdf"/><style>text{font-family:sans-serif;fill:#283f45}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect x="20" y="55" width="93" height="137" fill="#ddd1b6" stroke="#9d8b69" stroke-width="2"/><rect x="133" y="55" width="93" height="137" fill="#fffdf5" stroke="#9d8b69" stroke-width="2"/><rect x="246" y="55" width="93" height="137" fill="#fffdf5" stroke="#9d8b69" stroke-width="2"/><path d="M74 75Q43 110 79 136Q95 157 68 177M187 75Q156 110 192 136Q208 157 181 177M300 75Q269 110 305 136Q321 157 294 177" fill="none" stroke="#648fa1" stroke-width="5"/><text x="66" y="30" text-anchor="middle" font-size="16">ふるいかみ</text><text x="180" y="30" text-anchor="middle" font-size="17">うつし</text><text x="294" y="30" text-anchor="middle" font-size="17">かわのえ</text><text x="66" y="222" text-anchor="middle" font-size="18">めい</text><text x="180" y="222" text-anchor="middle" font-size="18">ゆい</text><text x="294" y="222" text-anchor="middle" font-size="18">れん</text><text x="180" y="253" text-anchor="middle" font-size="18">ほんのへやへ</text><path d="M30 115H49V148H80M143 115H162V148H193M256 115H271V134" fill="none" stroke="#b06c4b" stroke-width="3"/><text x="33" y="176" font-size="14">えき</text><text x="146" y="176" font-size="14">えき</text><text x="249" y="153" font-size="14">えき</text></svg>
