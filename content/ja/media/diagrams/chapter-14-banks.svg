<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">No bridge at the marked crossing</title><desc id="desc">The current crossing at the left has a barrier on each bank and no bridge between them. The existing park bridge is separately visible at the right.</desc><rect width="480" height="320" rx="16" fill="#f4efdf"/><style>text{font-family:sans-serif;fill:#283f45}path,line{stroke-linecap:round;stroke-linejoin:round}</style><path d="M20 135H460M20 175H460" stroke="#7297a9" stroke-width="5"/><rect x="331" y="124" width="38" height="62" fill="#d2b48c" stroke="#6e6451" stroke-width="3"/><text x="425" y="110" text-anchor="middle" font-size="19">かわ</text><text x="350" y="100" text-anchor="middle" font-size="19">はし</text><text x="350" y="288" text-anchor="middle" font-size="19">こうえん</text><path d="M110 40V110M110 200V270" stroke="#a07d60" stroke-width="5"/><path d="M80 115H140M80 195H140" stroke="#a85c47" stroke-width="6"/><text x="170" y="75" font-size="19">きし</text><text x="170" y="240" font-size="19">きし</text><text x="110" y="305" text-anchor="middle" font-size="19">はしがないところ</text></svg>
