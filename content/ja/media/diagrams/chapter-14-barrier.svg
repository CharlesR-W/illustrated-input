<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">The closed entrance and the detour</title><desc id="desc">At the lower entrance the straight left road meets a construction barrier. A right path leads through the park to an existing bridge. Schematic fictional positions only.</desc><rect width="480" height="320" rx="16" fill="#f4efdf"/><style>text{font-family:sans-serif;fill:#283f45}path,line{stroke-linecap:round;stroke-linejoin:round}</style><path d="M20 135H460M20 175H460" stroke="#7297a9" stroke-width="5"/><rect x="331" y="124" width="38" height="62" fill="#d2b48c" stroke="#6e6451" stroke-width="3"/><text x="425" y="110" text-anchor="middle" font-size="19">かわ</text><text x="300" y="100" text-anchor="middle" font-size="19">はし</text><text x="410" y="255" text-anchor="middle" font-size="19">こうえん</text><path d="M90 275V205M90 205V185" stroke="#a07d60" stroke-width="5" fill="none"/><path d="M90 275H350V190" stroke="#568378" stroke-width="5" fill="none"/><path d="M60 205H120M65 197L80 213M90 197L105 213" stroke="#a85c47" stroke-width="5"/><text x="45" y="245" text-anchor="middle" font-size="19">さく</text><text x="145" y="195" font-size="18">こうじ</text><text x="230" y="305" text-anchor="middle" font-size="18">とおまわり</text></svg>
