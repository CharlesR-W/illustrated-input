<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Separate evidence</title><desc id="desc">The old wet sheet remains on the table while a separate copy and memo can be carried. No route outcome is shown.</desc><rect width="480" height="320" rx="16" fill="#f4efdf"/><style>text{font-family:sans-serif;fill:#283f45}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect x="40" y="60" width="170" height="175" fill="#d9ceb6" stroke="#8a795d" stroke-width="2"/><rect x="260" y="60" width="140" height="110" fill="#fffdf6" stroke="#8a795d" stroke-width="2"/><rect x="290" y="200" width="130" height="60" fill="#fffdf6" stroke="#8a795d" stroke-width="2"/><text x="125" y="285" text-anchor="middle" font-size="20">ふるいかみ</text><text x="330" y="40" text-anchor="middle" font-size="20">うつし</text><text x="355" y="290" text-anchor="middle" font-size="20">メモ</text></svg>
