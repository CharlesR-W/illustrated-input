<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Two routes on a separate memo</title><desc id="desc">The separate memo distinguishes the used park route crossing the bridge from the avoided route that stops at the barrier. The original old map is not edited.</desc><rect width="480" height="320" rx="16" fill="#f4efdf"/><style>text{font-family:sans-serif;fill:#283f45}path,line{stroke-linecap:round;stroke-linejoin:round}</style><path d="M20 135H460M20 175H460" stroke="#7297a9" stroke-width="5"/><rect x="331" y="124" width="38" height="62" fill="#d2b48c" stroke="#6e6451" stroke-width="3"/><text x="425" y="110" text-anchor="middle" font-size="19">かわ</text><text x="300" y="100" text-anchor="middle" font-size="19">はし</text><text x="410" y="255" text-anchor="middle" font-size="19">こうえん</text><path d="M90 275H350V65H410" stroke="#568378" stroke-width="5" fill="none"/><path d="M90 275V205M65 205H115" stroke="#a85c47" stroke-width="5" fill="none"/><text x="160" y="240" font-size="19">とおるみち</text><text x="120" y="45" text-anchor="middle" font-size="19">とおらないみち</text><text x="425" y="50" text-anchor="middle" font-size="19">えき</text></svg>
