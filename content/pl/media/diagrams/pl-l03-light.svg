<svg xmlns="http://www.w3.org/2000/svg" width="720" height="880" viewBox="0 0 720 880" role="img" aria-labelledby="title desc"><title id="title">Dzień — wieczór</title><desc id="desc">Compare a window during daylight, with an illuminated floor, and the same window at sunset, with a low half-sun and no illuminated floor. The labels identify day, evening, and light.</desc><rect width="720" height="880" fill="#f5f1e6"/><g font-family="sans-serif"><text x="45" y="60" font-size="72" fill="#303633">Dzień</text><g transform="translate(260 100)"><rect width="190" height="175" rx="5" fill="#a9d5de" stroke="#303633" stroke-width="8"/><path d="M95 0 L95 175" fill="none" stroke="#303633" stroke-width="5"/><path d="M0 87 L190 87" fill="none" stroke="#303633" stroke-width="5"/></g><path d="M260 275 L70 380 L650 380 L450 275Z" fill="#f4df8c"/><text x="60" y="460" font-size="72" fill="#303633">światło</text><text x="45" y="555" font-size="72" fill="#303633">Wieczór</text><g transform="translate(260 600)"><rect width="190" height="175" rx="5" fill="#c88d7f" stroke="#303633" stroke-width="8"/><path d="M0 135 H190 V175 H0Z" fill="#6d6b74"/><path d="M116 135 A26 26 0 0 1 168 135Z" fill="#f3c16b"/><path d="M95 0 L95 175" fill="none" stroke="#303633" stroke-width="5"/><path d="M0 87 L190 87" fill="none" stroke="#303633" stroke-width="5"/></g><text x="60" y="860" font-size="72" fill="#303633">nie ma światła</text></g></svg>
