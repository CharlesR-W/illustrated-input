<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc"><title id="title">Ewa ma kartkę</title><desc id="desc">Ewa holds a flat inventory note. Its heading is Lampa and its status is Brak. Below, adjacent labelled doors establish Jan and Ewa as male and female neighbours. This is a separate note, not Ala’s addressed envelope.</desc><rect width="720" height="900" fill="#f5f1e6"/><g font-family="sans-serif"><text x="45" y="55" font-size="40" fill="#303633">Kartka</text><g transform="translate(140 175)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#803e4e" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#803e4e" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#93948f"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><text x="75" y="460" font-size="40" fill="#303633">Ewa</text><rect x="315" y="100" width="340" height="350" rx="4" fill="white" stroke="#303633" stroke-width="5"/><text x="350" y="170" font-size="48" fill="#303633">Lampa</text><g transform="translate(485 210) scale(0.95)"><path d="M-45 48 L-27 0 L27 0 L45 48Z M0 48 L0 112 M-35 112 L35 112" fill="#e3c66b" stroke="#303633" stroke-width="5"/></g><text x="365" y="410" font-size="48" fill="#303633">Brak</text><path d="M198 297 L300 240" fill="none" stroke="#303633" stroke-width="5"/><path d="M35 500 L685 500" fill="none" stroke="#303633" stroke-width="5"/><rect x="65" y="545" width="590" height="285" fill="#dfd6c3" stroke="#303633" stroke-width="5"/><rect x="115" y="595" width="190" height="235" fill="#b88632" stroke="#303633" stroke-width="5"/><rect x="415" y="595" width="190" height="235" fill="#803e4e" stroke="#303633" stroke-width="5"/><text x="165" y="650" font-size="40" fill="white">Jan</text><text x="462" y="650" font-size="40" fill="white">Ewa</text><text x="82" y="885" font-size="40" fill="#303633">sąsiad</text><text x="410" y="885" font-size="40" fill="#303633">sąsiadka</text></g></svg>
