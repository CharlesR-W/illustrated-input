<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">Półka, nie lampa</title><desc id="desc">Ala shows the established lamp drawing, retaining its line ending in an arrow and Ala’s added small circular mark. Jan looks towards an empty shelf. The original pencil lies on the worktable near Jan, not on the shelf. Daylight enters the window; there is no physical lamp.</desc><rect width="720" height="650" fill="#f5f1e6"/><g font-family="sans-serif"><text x="40" y="58" font-size="40" fill="#303633">Półka</text><g transform="translate(475 100)"><rect width="190" height="175" rx="5" fill="#a9d5de" stroke="#303633" stroke-width="8"/><path d="M95 0 L95 175" fill="none" stroke="#303633" stroke-width="5"/><path d="M0 87 L190 87" fill="none" stroke="#303633" stroke-width="5"/></g><path d="M55 210 L395 210 L395 245 L55 245Z" fill="#b88632" stroke="#303633" stroke-width="5"/><rect x="335" y="475" width="340" height="28" fill="#b88632" stroke="#303633" stroke-width="5"/><path d="M350 503 L350 600 M655 503 L655 600" stroke="#303633" stroke-width="12"/><path d="M520 462 L610 462" stroke="#b88632" stroke-width="12"/><g transform="translate(160 335)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#337b77" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#337b77" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#282d2b"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><g transform="translate(430 335)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#b8863