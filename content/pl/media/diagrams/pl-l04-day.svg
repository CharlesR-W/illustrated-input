<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">Wieczór · dzień</title><desc id="desc">The same workshop window contrasts the preceding evening episode with the present daylight visit. The large labels remain readable at the reader’s small vignette width.</desc><rect width="720" height="1000" fill="#f5f1e6"/><g font-family="sans-serif" fill="#303633"><text x="35" y="145" font-size="120">Wieczór</text><rect x="90" y="200" width="540" height="230" fill="#28344b" stroke="#303633" stroke-width="7"/><path d="M360 200 L360 430 M90 315 L630 315" stroke="#f5f1e6" stroke-width="8"/><text x="35" y="625" font-size="120">Dzień</text><rect x="90" y="680" width="540" height="230" fill="#cfe1e6" stroke="#303633" stroke-width="7"/><circle cx="520" cy="750" r="45" fill="#e3c66b"/><path d="M360 680 L360 910 M90 795 L630 795" stroke="#f5f1e6" stroke-width="8"/></g></svg>