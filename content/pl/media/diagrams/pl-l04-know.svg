<svg xmlns="http://www.w3.org/2000/svg" width="720" height="970" viewBox="0 0 720 970" role="img" aria-labelledby="title desc"><title id="title">Wiem · nie wiem</title><desc id="desc">Jan can identify the visible key’s actual position on the table. The lower empty shelf and open drawer provide no lamp location; he cannot identify where the absent lamp is. Known fact versus unavailable information, with no invented hidden lamp.</desc><rect width="720" height="970" fill="#f5f1e6"/><g font-family="sans-serif"><text x="40" y="90" font-size="70" fill="#303633">Wiem</text><text x="40" y="185" font-size="70" fill="#303633">Klucz jest tu.</text><rect x="40" y="390" width="640" height="35" fill="#b88632"/><g transform="translate(525 200) scale(0.8)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#b88632" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#b88632" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#634735"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><circle cx="170" cy="340" r="35" fill="none" stroke="#303633" stroke-width="12"/><path d="M205 340 L320 340 M285 340 L285 365 M310 340 L310 365" stroke="#303633" stroke-width="12"/><text x="30" y="560" font-size="70" fill="#303633">Nie wiem</text><text x="30" y="650" font-size="70" fill="#303633">Gdzie jest</text><text x="30" y="735" font-size="70" fill="#303633">lampa?</text><path d="M60 810 L280 810 M60 835 L280 835" stroke="#303633" stroke-width="10"/><rect x="430" y="810" width="220" height="110" fill="white" stroke="#303633" stroke-width="7"/></g></svg>