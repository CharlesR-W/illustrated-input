<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">Cudza koperta</title><desc id="desc">The original already-open envelope lies on the far side of the table and bears Ala’s visible name. Ala is the established addressee, whereas Ewa is a different person. From Ewa’s perspective it belongs to someone else. No new owner is named for the lamp; no new letter or physical lamp appears. Bindings and old practice sheet are outside this tightly cropped envelope detail.</desc><rect width="720" height="1100" fill="#f5f1e6"/><g font-family="sans-serif"><text x="30" y="85" font-size="70" fill="#303633">Ala</text><text x="440" y="85" font-size="70" fill="#303633">Ewa</text><g transform="translate(140 130) scale(1.05)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#337b77" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#337b77" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#303633"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><g transform="translate(550 130) scale(1.05)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#803e4e" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#803e4e" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#93948f"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" 