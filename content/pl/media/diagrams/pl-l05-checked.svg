<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">W szufladzie; na podłodze</title><desc id="desc">The open box now stands on the floor. The open drawer is empty: the sheet removed in chapter4 remains the distinct shelf/drawer sketch on the table. The known lower shelf is still lamp-free. No upper shelf or physical lamp has yet been revealed.</desc><rect width="720" height="850" fill="#f5f1e6"/><g font-family="sans-serif"><text x="40" y="55" font-size="40" fill="#303633">W warsztacie</text><g transform="translate(505 100)"><rect width="150" height="150" fill="#b6dce4" stroke="#303633" stroke-width="6"/><path d="M75 0V150 M0 75H150" stroke="#303633" stroke-width="5"/></g><path d="M70 270H365" stroke="#b88632" stroke-width="20"/><rect x="55" y="460" width="610" height="35" fill="#b88632" stroke="#303633" stroke-width="5"/><path d="M80 495V700 M640 495V700" stroke="#303633" stroke-width="15"/><path d="M210 500H470L515 610H165Z" fill="#c7a571" stroke="#303633" stroke-width="5"/><g transform="translate(0 260) scale(1 .4)"><g transform="translate(75 330) scale(0.7)"><rect width="180" height="155" fill="white" stroke="#303633" stroke-width="4"/><text x="25" y="36" font-size="30" fill="#303633">Lampa</text><g transform="translate(126 100) scale(0.4)"><path d="M-60 -70L-35 -145H35L60 -70Z" fill="#e6c46f" stroke="#303633" stroke-width="5"/><path d="M-20 -70V-15L-55 5H55L20 -15V-70" fill="#839793" stroke="#303633" stroke-width="5"/><path d="M10 4Q70 40 95 2" fill="none" stroke="#303633" stroke-width="5"/></g><path d="M17 120H60V78H87 M78 70L87 78L78 86" fill="none" stroke="#303633" stroke-width="4"/><circle cx="30" cy="140" r="8" fill="none" stroke="#803e4e" stroke-width="3"/><path d="M20 55H68" stroke="#b88632" stroke-width="8"/></g><g transform="translate(250 335) scale(0.65)"><rect width="180" height="155" fill="white" stroke="#303633" stroke-width="4"/><text x="20" y="50" font-size="32" fill="#303633">Lampa</text><text x="20" y="105" font-size="36" fill="#303633">Brak</text></g><g transform="translate(420 330) scale(0.65)"><rect width="180" height="155" fill="white" stroke="#303633" stroke-width="4"/><path d="M15 50H165 M20 95H160V135H20Z" fill="none" stroke="#303633" stroke-width="5"/></g></g><g transform="translate(420 720) scale(1)"><path d="M0 0H150V90H0Z M0 0L25 -55H175L150 0Z" fill="#c7a571" stroke="#303633" stroke-width="5"/><path d="M18 20H132V70H18Z" fill="#947141" stroke="#303633" stroke-width="3"/></g><text x="130" y="665" font-size="40" fill="#303633">w szufladzie</text><text x="50" y="820" font-size="40" fill="#303633">na podłodze</text></g></svg>
