<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">Pęknięcie</title><desc id="desc">The physical lamp stands on the table. An enlarged view of the same cable shows a crack through its outer covering. No repair, plug connection or electrical test has been made. The crack is a property of the cable, not a new verb tense or participle.</desc><rect width="720" height="760" fill="#f5f1e6"/><g font-family="sans-serif"><text x="35" y="60" font-size="40" fill="#303633">Kabel</text><rect x="45" y="300" width="630" height="35" fill="#b88632" stroke="#303633" stroke-width="5"/><path d="M70 335V540 M650 335V540" stroke="#303633" stroke-width="15"/><g transform="translate(200 290) scale(1.2)"><path d="M-60 -70L-35 -145H35L60 -70Z" fill="#e6c46f" stroke="#303633" stroke-width="5"/><path d="M-20 -70V-15L-55 5H55L20 -15V-70" fill="#839793" stroke="#303633" stroke-width="5"/><path d="M10 4Q70 40 95 2" fill="none" stroke="#303633" stroke-width="5"/></g><path d="M315 285Q420 240 590 285" fill="none" stroke="#303633" stroke-width="12"/><text x="210" y="435" font-size="40" fill="#303633">pęknięcie</text><path d="M80 560H640" stroke="#303633" stroke-width="55"/><path d="M345 530L325 547L350 563L330 589" fill="none" stroke="#f0c0a8" stroke-width="15"/><circle cx="340" cy="560" r="70" fill="none" stroke="#803e4e" stroke-width="5"/><text x="30" y="710" font-size="38" fill="#303633">Lampa stoi na stole.</text></g></svg>
