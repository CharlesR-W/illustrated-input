<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img" aria-labelledby="title desc"><title id="title">Lampa stoi na półce</title><desc id="desc">The wider view newly reveals a physical lamp standing on the upper shelf with a cable hanging below it. The lower shelf remains empty. Ala stands on the floor and can reach the upper shelf without climbing; at this illustrated instant she has not yet taken the lamp.</desc><rect width="720" height="930" fill="#f5f1e6"/><g font-family="sans-serif"><text x="40" y="60" font-size="40" fill="#303633">Na półce</text><g transform="translate(520 100)"><rect width="150" height="150" fill="#b6dce4" stroke="#303633" stroke-width="6"/><path d="M75 0V150 M0 75H150" stroke="#303633" stroke-width="5"/></g><path d="M65 370H410 M65 550H410" stroke="#b88632" stroke-width="22"/><g transform="translate(240 360) scale(1)"><path d="M-60 -70L-35 -145H35L60 -70Z" fill="#e6c46f" stroke="#303633" stroke-width="5"/><path d="M-20 -70V-15L-55 5H55L20 -15V-70" fill="#839793" stroke="#303633" stroke-width="5"/><path d="M10 4Q70 40 95 2" fill="none" stroke="#303633" stroke-width="5"/></g><path d="M335 362Q390 460 340 505" fill="none" stroke="#303633" stroke-width="10"/><text x="70" y="325" font-size="40" fill="#303633">wysoko</text><text x="70" y="610" font-size="40" fill="#303633">nisko</text><g transform="translate(520 410) scale(1.5)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#337b77" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#337b77" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#282d2b"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><tex