<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc"><title id="title">Stary stół · nowy stół</title><desc id="desc">Compare the original large brown worktable occupied by the real lamp, cable, paper and tool with a distinct new clear red candidate table. Both are large. Usable surface rather than a changed claim about the old table’s absolute size motivates the choice. This is a comparison of the two current tables; no fault in the new table is exposed yet.</desc><rect width="720" height="1040" fill="#f5f1e6"/><g font-family="sans-serif"><text x="35" y="85" font-size="70" fill="#303633">Stary stół</text><rect x="35" y="340" width="650" height="30" fill="#b88632" stroke="#303633" stroke-width="6"/><path d="M65 370V485 M655 370V485" stroke="#303633" stroke-width="18"/><g transform="translate(210 335) scale(1.1)"><path d="M-60 -70 L-35 -145 H35 L60 -70Z" fill="#e6c46f" stroke="#303633" stroke-width="5"/><path d="M-20 -70 V-15 L-55 5 H55 L20 -15 V-70" fill="#839793" stroke="#303633" stroke-width="5"/><path d="M10 4 Q70 40 95 2" fill="none" stroke="#303633" stroke-width="5"/></g><rect x="360" y="250" width="230" height="75" fill="white" stroke="#303633" stroke-width="5"/><path d="M305 330 Q440 240 635 330" stroke="#303633" stroke-width="12" fill="none"/><path d="M590 300 L625 300" stroke="#803e4e" stroke-width="25"/><path d="M565 390L590 390L590 350Q602 340 607 354L607 375L645 375Q655 375 650 400L642 425L590 425L565 425Z" fill="#e3b698" stroke="#303633" stroke-width="5"/><path d="M65 350L105 345 M120 360L155 355 M400 358L445 353" stroke="#8f672b" stroke-width="3"/><text x="35" y="610" font-size="70" fill="#303633">Nowy stół</text><rect x="35" y="725" width="650" height="30" fill="#bd493d" stroke="#303633" stroke-width="6"/><path d="M65 755V875 M655 755V875" stroke="#303633" stroke-width="18"/><text x="35" y="975" font-size="70" fill="#303633">Potrzebny</text><path d="M495 955L535 775 M541.8333094212877 794.9576021193164L535 775L520.3571940972407 790.185132047306" stroke="#337b77" stroke-width="7" fill="none"/></g></svg>