<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">Miasto, ulica, mieszkaniec</title><desc id="desc">The newly drawn schematic city and street are shown above. The lower reference places Jan, the stated city resident, at a home in Łódź: a generic meaning reference, not an invented address or workshop-ownership claim. This is a new separate sheet and no earlier drawing is overwritten.</desc><rect width="720" height="850" fill="#f5f1e6"/><g font-family="sans-serif"><text x="30" y="65" font-size="60" fill="#303633">miasto: Łódź</text><rect x="30" y="95" width="660" height="390" rx="18" fill="#dbe1d4" stroke="#303633" stroke-width="5"/><path d="M40 350H680" stroke="#c3c0b5" stroke-width="85"/><path d="M70 280V180L140 130L210 180V280Z" fill="#dfb991" stroke="#303633" stroke-width="5"/><path d="M280 280V180L350 130L420 180V280Z" fill="#dfb991" stroke="#303633" stroke-width="5"/><path d="M490 280V180L560 130L630 180V280Z" fill="#dfb991" stroke="#303633" stroke-width="5"/><text x="245" y="370" font-size="54" fill="#303633">ulica</text><text x="40" y="550" font-size="56" fill="#303633">mieszkaniec: Jan</text><rect x="85" y="655" width="550" height="160" fill="#dfb991" stroke="#303633" stroke-width="5"/><path d="M70 655L355 580L650 655" fill="none" stroke="#303633" stroke-width="6"/><rect x="140" y="680" width="115" height="115" fill="#b9d6df" stroke="#303633" stroke-width="5"/><g transform="translate(198 690) scale(0.4)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#b37d3e" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#b37d3e" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#3b322d"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><text x="330" y="770" font-size="68" fill="#303633">Łódź</text></g></svg>
