<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">My i wy</title><desc id="desc">Two reference panels keep the same named pairs in the same workshop. In Ala’s turn my includes Ala and Ewa, while wy means Jan and Irena. In Irena’s turn the pronouns reverse relative to the speaker. No movement, third-person pronoun paradigm or plural job noun is introduced.</desc><rect width="720" height="850" fill="#f5f1e6"/><g font-family="sans-serif"><text x="25" y="65" font-size="72" fill="#303633">Ala:</text><rect x="20" y="90" width="680" height="290" rx="20" fill="#fffdf8" stroke="#303633" stroke-width="4"/><text x="55" y="170" font-size="90" fill="#303633">my</text><text x="400" y="170" font-size="90" fill="#303633">wy</text><text x="50" y="265" font-size="72" fill="#303633">Ala</text><text x="50" y="345" font-size="72" fill="#303633">Ewa</text><text x="390" y="265" font-size="72" fill="#303633">Jan</text><text x="390" y="345" font-size="72" fill="#303633">Irena</text><text x="25" y="470" font-size="72" fill="#303633">Irena:</text><rect x="20" y="495" width="680" height="290" rx="20" fill="#fffdf8" stroke="#303633" stroke-width="4"/><text x="55" y="575" font-size="90" fill="#303633">wy</text><text x="400" y="575" font-size="90" fill="#303633">my</text><text x="50" y="670" font-size="72" fill="#303633">Ala</text><text x="50" y="750" font-size="72" fill="#303633">Ewa</text><text x="390" y="670" font-size="72" fill="#303633">Jan</text><text x="390" y="750" font-size="72" fill="#303633">Irena</text></g></svg>
