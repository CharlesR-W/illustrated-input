<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc"><title id="title">Kim jesteś?</title><desc id="desc">Opening instant: Irena still holds the old lamp sheet, including lamp/caption/line/arrow/circle/added shelf. Jan’s question is a mistaken hypothesis, not an ownership identification. The red table leg remains attached and loose; the separate physical lamp is upright on the old brown table.</desc><rect width="720" height="900" fill="#f5f1e6"/><g font-family="sans-serif"><text x="35" y="60" font-size="52" fill="#303633">Kim jesteś?</text><g transform="translate(155 200) scale(1.3)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#337b77" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#337b77" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#705340"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><g transform="translate(215 315) scale(1)"><rect width="180" height="155" fill="white" stroke="#303633" stroke-width="4"/><text x="25" y="36" font-size="30" fill="#303633">Lampa</text><g transform="translate(126 100) scale(0.4)"><path d="M-60 -70L-35 -145H35L60 -70Z" fill="#e6c46f" stroke="#303633" stroke-width="5"/><path d="M-20 -70V-15L-55 5H55L20 -15V-70" fill="#839793" stroke="#303633" stroke-width="5"/><path d="M10 4Q70 40 95 2" fill="none" stroke="#303633" stroke-width="5"/></g><path d="M17 120H60V78H87 M78 70L87 78L78 86" fill="none" stroke="#303633" stroke-width="4"/><circle cx="30" cy="140" r="8" fill="none" stroke="#803e4e" stroke-width="3"/><path d="M20 55H68" stroke="#b88632" stroke-width="8"/></g><text x="80" y="550" font-size="4