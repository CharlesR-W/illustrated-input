<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc"><title id="title">SMS; planuję wizytę</title><desc id="desc">The actual phone has a Warsztat topic and Właściciel sender header. Jestem and Planuję are written by that absent sender, not words identifying Jan. The separately labelled middle reference depicts a visit; the bottom reference shows a person marking a calendar to plan a visit. These are meaning references, not an actual arrival, date or schedule in the story. No time, name, lamp ownership, repair or visit outcome is asserted.</desc><rect width="720" height="1500" fill="#f5f1e6"/><g font-family="sans-serif"><text x="30" y="58" font-size="52" fill="#303633">Telefon — SMS</text><rect x="65" y="90" width="590" height="605" rx="35" fill="#313b3d"/><rect x="85" y="120" width="550" height="545" rx="12" fill="#fffdf6"/><text x="110" y="180" font-size="46" fill="#303633">Warsztat</text><text x="110" y="238" font-size="43" fill="#303633">Właściciel</text><path d="M105 260H615" stroke="#303633" stroke-width="3"/><text x="110" y="320" font-size="38" fill="#303633">Jestem właścicielem.</text><text x="110" y="380" font-size="43" fill="#303633">Planuję wizytę</text><text x="110" y="438" font-size="43" fill="#303633">w warsztacie.</text><text x="110" y="505" font-size="40" fill="#303633">Czy wy jesteście</text><text x="110" y="560" font-size="40" fill="#303633">w warsztacie?</text><text x="30" y="755" font-size="48" fill="#303633">Przykład: wizyta</text><rect x="25" y="785" width="670" height="265" rx="20" fill="#fffdf8" stroke="#303633" stroke-width="4"/><path d="M60 1010V840H280V1010 M240 840V1010" fill="#e7dfca" stroke="#303633" stroke-width="7"/><text x="70" y="885" font-size="30" fill="#303633">Warsztat</text><g transform="translate(360 835) scale(0.7)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#70746d" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#70746d" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#4a4945"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><g transform="translate(565 835) scale(0.7)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#337b77" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#337b77" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#705340"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><text x="30" y="1120" font-size="43" fill="#303633">Przykład: planuję wizytę</text><g transform="translate(140 1185) scale(1)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#70746d" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#70746d" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#4a4945"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><rect x="310" y="1170" width="365" height="240" rx="12" fill="white" stroke="#303633" stroke-width="6"/><path d="M310 1220H675 M430 1220V1410 M550 1220V1410 M310 1315H675" fill="none" stroke="#303633" stroke-width="5"/><path d="M365 1150V1190 M620 1150V1190" stroke="#303633" stroke-width="10"/><circle cx="490" cy="1360" r="45" fill="#dfd4bc" stroke="#803e4e" stroke-width="6"/><path d="M198 1305L330 1275" stroke="#303633" stroke-width="9"/><text x="370" y="1470" font-size="54" fill="#303633">wizyta</text></g></svg>
