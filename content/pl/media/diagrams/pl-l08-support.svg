<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc"><title id="title">Jan trzyma stół</title><desc id="desc">Later state after the hand-off: Jan supports the red table, leaving Irena free to indicate its attached loose leg. No repair or table relocation. Large caption supports the narrow vignette; detailed close view opens on click.</desc><rect width="720" height="800" fill="#f5f1e6"/><g font-family="sans-serif"><text x="45" y="125" font-size="125" fill="#303633">Jan</text><g transform="translate(140 210) scale(1.4)"><path d="M-28 142 L-28 225 L-6 225 L0 165 L8 225 L30 225 L27 142" fill="#405055"/><path d="M-42 66 Q0 47 42 66 L33 153 L-33 153Z" fill="#b37d3e" stroke="#303633" stroke-width="3"/><path d="M-36 79 L-56 130 M35 79 L58 122" fill="none" stroke="#b37d3e" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24 Q-35 -17 0 -10 Q34 -15 34 24 Q8 0 -33 24" fill="#3b322d"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44 Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><g transform="translate(280 410) scale(1.2)"><rect width="330" height="25" fill="#ad5050" stroke="#303633" stroke-width="5"/><path d="M20 25V200 M305 25L295 200" stroke="#303633" stroke-width="18"/><circle cx="304" cy="28" r="26" fill="none" stroke="#803e4e" stroke-width="5" stroke-dasharray="9 6"/></g><path d="M215 390L330 420" stroke="#303633" stroke-width="20" fill="none"/><text x="45" y="765" font-size="112" fill="#303633">trzyma</text></g></svg>
