<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc"><title id="title">Moja torba</title><desc id="desc">Ownership reference: Ala is the owner of the white bag and Jan of the red bag. Each says moja about their own bag. Captions are below each bag, not printed across it. No key or lamp ownership is represented.</desc><rect width="720" height="1040" fill="#f5f1e6"/><g font-family="sans-serif"><text x="30" y="80" font-size="72" fill="#303633">Przykład</text><rect x="25" y="110" width="670" height="430" rx="16" fill="#fffdf8" stroke="#303633" stroke-width="5"/><text x="50" y="190" font-size="72" fill="#303633">Ala</text><text x="45" y="270" font-size="70" fill="#303633">właścicielka</text><g transform="translate(105 290) scale(0.65)"><path d="M-28 142L-28 225H-6L0 165L8 225H30L27 142" fill="#405055"/><path d="M-42 66Q0 47 42 66L33 153H-33Z" fill="#337b77" stroke="#303633" stroke-width="3"/><path d="M-36 79L-56 130M35 79L58 122" fill="none" stroke="#337b77" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24Q-35-17 0-10Q34-15 34 24Q8 0-33 24" fill="#303633"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><g transform="translate(425 275) scale(0.8)"><path d="M35 40V10Q90-70 145 10V40" fill="none" stroke="#303633" stroke-width="13"/><path d="M5 30H175L190 190H-10Z" fill="#fbfaf2" stroke="#303633" stroke-width="7"/><path d="M15 70H165" stroke="#303633" stroke-width="4"/></g><path d="M210 400H390M369 388L390 400L369 412" fill="none" stroke="#303633" stroke-width="7" stroke-linecap="round"/><text x="280" y="515" font-size="70" fill="#303633">moja torba</text><rect x="25" y="580" width="670" height="430" rx="16" fill="#fffdf8" stroke="#303633" stroke-width="5"/><text x="50" y="660" font-size="72" fill="#303633">Jan</text><text x="