<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">Dom; adres</title><desc id="desc">Jan’s newly drawn home on a separate fresh sheet. Lower panel enlarges the contact label on his red bag: Łódź — ulica Biała. City and street only, no number, no assertion of legal house ownership. This is not the older city/street sketch and not the small tool label.</desc><rect width="720" height="1000" fill="#f5f1e6"/><g font-family="sans-serif"><text x="30" y="75" font-size="70" fill="#303633">Jan: mój dom</text><rect x="30" y="105" width="660" height="440" rx="16" fill="white" stroke="#303633" stroke-width="5"/><g transform="translate(240 145) scale(1.2)"><path d="M0 100L120 0L240 100" fill="#b8795e" stroke="#303633" stroke-width="7"/><path d="M25 85V270H215V85" fill="#e5d9bb" stroke="#303633" stroke-width="7"/><path d="M95 270V170H145V270M50 120H80V155H50Z M165 120H195V155H165Z" fill="white" stroke="#303633" stroke-width="5"/></g><text x="45" y="625" font-size="72" fill="#303633">mój adres</text><g transform="translate(45 715) scale(1.1)"><path d="M35 40V10Q90-70 145 10V40" fill="none" stroke="#303633" stroke-width="13"/><path d="M5 30H175L190 190H-10Z" fill="#b95d4f" stroke="#303633" stroke-width="7"/><path d="M15 70H165" stroke="#303633" stroke-width="4"/></g><rect x="285" y="690" width="400" height="270" rx="16" fill="#fffdf8" stroke="#303633" stroke-width="5"/><text x="305" y="780" font-size="70" fill="#303633">Łódź —</text><text x="305" y="875" font-size="70" fill="#303633">ulica Biała</text><path d="M265 820L285 820" fill="none" stroke="#303633" stroke-width="7" stroke-linecap="round"/></g></svg>
