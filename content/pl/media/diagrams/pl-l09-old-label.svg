<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">Łódź — ulica Lipowa</title><desc id="desc">Stage4 close reference to the newly revealed small unfamiliar tool’s old attached label, enlarged below the tool. Exact label Łódź — ulica Lipowa, no number. It is distinct from Ala’s large repair tool and Jan’s red bag/contact label; no owner, origin or lamp connection is identified.</desc><rect width="720" height="850" fill="#f5f1e6"/><g font-family="sans-serif"><text x="30" y="75" font-size="72" fill="#303633">stary adres</text><path d="M110 390L165 280H590L620 390Z" fill="#9b7450" stroke="#303633" stroke-width="8"/><path d="M290 280V200Q350 135 410 200V280" fill="none" stroke="#7f5e40" stroke-width="28"/><path d="M110 390H620" stroke="#7b8c89" stroke-width="24"/><rect x="80" y="480" width="560" height="330" rx="16" fill="#fffdf8" stroke="#303633" stroke-width="5"/><text x="115" y="585" font-size="78" fill="#303633">Łódź —</text><text x="115" y="705" font-size="72" fill="#303633">ulica Lipowa</text><path d="M390 395L390 480" fill="none" stroke="#303633" stroke-width="7" stroke-linecap="round"/></g></svg>
