<svg xmlns="http://www.w3.org/2000/svg" width="720" height="875" viewBox="0 0 720 875" role="img" aria-labelledby="title desc"><title id="title">Ala; Jan — swoją torbę</title><desc id="desc">Two independent action panels: Ala takes her own white bag; Jan takes his own red bag. Same feminine singular accusative swoją agrees with torbę; its owner changes with the grammatical subject. No transfer between owners.</desc><rect width="720" height="875" fill="#f5f1e6"/><g font-family="sans-serif"><rect x="20" y="15" width="680" height="405" rx="16" fill="#fffdf8" stroke="#303633" stroke-width="5"/><text x="45" y="95" font-size="72" fill="#303633">Ala</text><g transform="translate(160 130) scale(0.9)"><path d="M-28 142L-28 225H-6L0 165L8 225H30L27 142" fill="#405055"/><path d="M-42 66Q0 47 42 66L33 153H-33Z" fill="#337b77" stroke="#303633" stroke-width="3"/><path d="M-36 79L-56 130M35 79L58 122" fill="none" stroke="#337b77" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24Q-35-17 0-10Q34-15 34 24Q8 0-33 24" fill="#303633"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><g transform="translate(370 155) scale(0.9)"><path d="M35 40V10Q90-70 145 10V40" fill="none" stroke="#303633" stroke-width="13"/><path d="M5 30H175L190 190H-10Z" fill="#fbfaf2" stroke="#303633" stroke-width="7"/><path d="M15 70H165" stroke="#303633" stroke-width="4"/></g><path d="M215 245L375 245" fill="none" stroke="#303633" stroke-width="7" stroke-linecap="round"/><text x="35" y="400" font-size="70" fill="#303633">bierze swoją torbę</text><rect x="20" y="445" width="680" height="405" rx="16" fill="#fffdf8" stroke="#303633" stroke-width="5"/><text x="45" y="525" font-size="72" fill="#303633">Jan</text><g transform="translate(160 560) scale(0.9)"><path d="M-28 142L-28 225H-6L0 165L8 225H30L27 142" fill="#405055"/><path d="M-42 66Q0 47 42