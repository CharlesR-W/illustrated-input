<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1020" viewBox="0 0 720 1020" role="img" aria-labelledby="title desc"><title id="title">Krzesło · dwa krzesła · trzy krzesła</title><desc id="desc">Reference panels show the same chair category singly, as a pair, and as all three chairs. They teach the base noun before numeral/plural combinations; they do not add six separate story chairs. The room scene has exactly three actual chairs.</desc><rect width="720" height="1020" rx="18" fill="#f5f1e6"/><text x="35" y="65" font-family="sans-serif" font-size="60" text-anchor="start" fill="#303633">Krzesło</text><g transform="translate(280 100) scale(1.1)"><rect x="15" y="15" width="90" height="75" rx="4" fill="#c7a571" stroke="#303633" stroke-width="5"/><rect x="0" y="105" width="120" height="18" rx="4" fill="#c7a571" stroke="#303633" stroke-width="5"/><path d="M12 123 L7 215 M108 123 L115 215 M22 88 V105 M98 88 V105" stroke="#303633" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M35 365 H685" stroke="#d7d0c2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="430" font-family="sans-serif" font-size="48" text-anchor="start" fill="#303633">Dwa krzesła</text><g transform="translate(180 470) scale(0.9)"><rect x="15" y="15" width="90" height="75" rx="4" fill="#c7a571" stroke="#303633" stroke-width="5"/><rect x="0" y="105" width="120" height="18" rx="4" fill="#c7a571" stroke="#303633" stroke-width="5"/><path d="M12 123 L7 215 M108 123 L115 215 M22 88 V105 M98 88 V105" stroke="#303633" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(420 470) scale(0.9)"><rect x="15" y="15" width="90" height="75" rx="4" fill="#c7a571" stroke="#303633" stroke-width="5"/><rect x="0" y="105" width="120" height="18" rx="4" fill="#c7a571" stroke="#303633" stroke-width="5"/><path d="M12 123 L7 215 M108 123 L115 215 M22 88 V105 M98 88 V105" stroke="#30363