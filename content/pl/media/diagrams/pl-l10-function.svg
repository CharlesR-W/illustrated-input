<svg xmlns="http://www.w3.org/2000/svg" width="720" height="950" viewBox="0 0 720 950" role="img" aria-labelledby="title desc"><title id="title">Sprawna · zepsuta</title><desc id="desc">The same new white lamp changes from unlit to supplying a clear cone of light with a continuous connected cable. The new red lamp is unlit with a visibly broken disconnected cable; it is never energised. This demonstrates function and a visible fault, not an electrical safety certificate from cable appearance. The original lamp is outside the close view and untouched.</desc><rect width="720" height="950" rx="18" fill="#f5f1e6"/><text x="30" y="60" font-family="sans-serif" font-size="48" text-anchor="start" fill="#303633">Biała lampa</text><g transform="translate(45 95) scale(0.75)"><path d="M100 90 V220 M50 220 H150" stroke="#65726e" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 30 H150 L180 90 H20Z" stroke="#303633" stroke-width="5" fill="#fff" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="218" r="6" fill="#f5f1e6" stroke="#303633" stroke-width="2"/><path d="M150 220 Q220 260 280 230" stroke="#303633" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="278" y="218" width="18" height="28" rx="3" fill="#65726e" stroke="#303633" stroke-width="2"/><path d="M296 224 h12 M296 238 h12" stroke="#303633" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(380 95) scale(0.75)"><path d="M30 92 L-20 235 H220 L170 92Z" stroke="#eadc8e" stroke-width="1" fill="#fff4ad" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 90 V220 M50 220 H150" stroke="#65726e" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 30 H150 L180 90 H20Z" stroke="#303633" stroke-width="5" fill="#fff" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="218" r="6" fill="#f5f1e6" stroke="#303633" stroke-widt