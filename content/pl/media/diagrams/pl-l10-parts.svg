<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc"><title id="title">Część · części</title><desc id="desc">Whole-to-part reference relates the new red lamp to its disconnected loose cable. The lower view shows exactly two already-loose broken components: that cable with an insulation fault and a distinct newly present bent screw. Neither is removed by the crew; neither is the working white cable, original cracked cable, or existing screw inside the floor box. No nominal genitive is used.</desc><rect width="720" height="920" rx="18" fill="#f5f1e6"/><text x="35" y="65" font-family="sans-serif" font-size="48" text-anchor="start" fill="#303633">Lampa ma kabel.</text><g transform="translate(45 105) scale(1.2)"><path d="M100 90 V220 M50 220 H150" stroke="#65726e" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 30 H150 L180 90 H20Z" stroke="#303633" stroke-width="5" fill="#bc4f49" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="218" r="6" fill="#f5f1e6" stroke="#303633" stroke-width="2"/><path d="M195 225 Q240 275 295 225" stroke="#303633" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="210" width="20" height="30" rx="3" fill="#65726e" stroke="#303633" stroke-width="2"/><rect x="292" y="210" width="20" height="30" rx="3" fill="#65726e" stroke="#303633" stroke-width="2"/><path d="M235 246 l7 -12 l7 13" stroke="#f5f1e6" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M239 248 l4 -6 l4 7" stroke="#b88632" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M480 365 L390 385" stroke="#337b77" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M401.5013860328977 373.87713529155974 L390 385 L405.1297629886703 390.20483159253627" stroke="#337b77" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="300" font-family="sans-serif" font-size="48" text-anchor="start" fill="#303633">część</text><path d="M35 480 H685" stroke="#d7d0c2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="550" font-family="sans-serif" font-size="48" text-anchor="start" fill="#303633">Dwie luźne części</text><path d="M80 650 Q170 705 265 645" stroke="#303633" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="625" width="35" height="50" rx="4" fill="#65726e" stroke="#303633" stroke-width="4"/><rect x="260" y="620" width="35" height="50" rx="4" fill="#65726e" stroke="#303633" stroke-width="4"/><path d="M160 682 l7 -16 l7 16" stroke="#f5f1e6" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M153 675 Q167 682 184 676" stroke="#b88632" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="595" width="70" height="35" rx="3" fill="#839793" stroke="#303633" stroke-width="5"/><path d="M510 630 L510 680 L565 730" stroke="#839793" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 650 L525 640 M497 670 L527 660 M525 700 L545 680 M545 720 L565 700" stroke="#303633" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="800" font-family="sans-serif" font-size="40" text-anchor="start" fill="#303633">zepsuty kabel</text><text x="370" y="860" font-family="sans-serif" font-size="40" text-anchor="start" fill="#303633">zepsuty wkręt</text></svg>
