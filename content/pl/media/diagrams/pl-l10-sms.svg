<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">Stary SMS · nowy SMS</title><desc id="desc">Two reference views of the same phone distinguish the earlier absent owner’s singular message from the new separate plural-sendership help offer. The new message says exactly My jesteśmy w Łodzi. Czy jest potrzebna nasza pomoc? It does not place its senders in the workshop or establish a link to either street label.</desc><rect width="720" height="1080" rx="18" fill="#f5f1e6"/><text x="35" y="65" font-family="sans-serif" font-size="50" text-anchor="start" fill="#303633">Stary SMS</text><rect x="70" y="105" width="580" height="230" rx="25" fill="white" stroke="#303633" stroke-width="5"/><text x="100" y="165" font-family="sans-serif" font-size="43" text-anchor="start" fill="#303633">Warsztat</text><text x="100" y="225" font-family="sans-serif" font-size="42" text-anchor="start" fill="#303633">Jestem właścicielem.</text><path d="M35 380 H685" stroke="#d7d0c2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="445" font-family="sans-serif" font-size="50" text-anchor="start" fill="#303633">Nowy SMS</text><rect x="70" y="480" width="580" height="550" rx="25" fill="white" stroke="#303633" stroke-width="5"/><text x="100" y="545" font-family="sans-serif" font-size="45" text-anchor="start" fill="#303633">Pomoc</text><text x="100" y="620" font-family="sans-serif" font-size="42" text-anchor="start" fill="#303633">My jesteśmy</text><text x="100" y="680" font-family="sans-serif" font-size="42" text-anchor="start" fill="#303633">w Łodzi.</text><text x="100" y="775" font-family="sans-serif" font-size="42" text-anchor="start" fill="#303633">Czy jest potrzebna</text><text x="100" y="835" font-family="sans-serif" font-size="42" text-anchor="start" fill="#303633">nasza pomoc?</text></svg>
