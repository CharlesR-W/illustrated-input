<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Dwa narzędzia · bierze narzędzia</title><desc id="desc">The reference pair is Ala’s existing large repair tool and the distinct unclaimed small tool with its attached old address tag. In the second panel one clothed Ewa holds one in each hand, illustrating a singular actor taking a plural affirmative object. This is temporary custody, not shared ownership; the original hammer is a separate third tool outside this close view.</desc><rect width="720" height="980" rx="18" fill="#f5f1e6"/><text x="35" y="65" font-family="sans-serif" font-size="48" text-anchor="start" fill="#303633">Dwa narzędzia</text><g transform="translate(155 125) scale(0.95)"><path d="M0 0 V120" stroke="#839793" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="-20" y="110" width="40" height="90" rx="7" fill="#803e4e" stroke="#303633" stroke-width="4"/></g><g transform="translate(465 125) scale(0.95)"><path d="M-75 100 L-58 65 H65 L80 100Z" stroke="#303633" stroke-width="4" fill="#9b7450" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 65 V40 Q0 10 20 40 V65" stroke="#7f5e40" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-75 100 H80" stroke="#7b8c89" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 102 L110 128" stroke="#303633" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="105" y="120" width="75" height="45" rx="4" fill="#fffdf8" stroke="#303633" stroke-width="2"/></g><text x="395" y="330" font-family="sans-serif" font-size="40" text-anchor="start" fill="#303633">Łódź — ulica</text><text x="395" y="375" font-family="sans-serif" font-size="40" text-anchor="start" fill="#303633">Lipowa</text><path d="M35 390 H685" stroke="#d7d0c2" stroke-width="3" fill="none" stroke-linecap="round" strok