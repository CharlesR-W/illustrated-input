<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc"><title id="title">Gość; wejście</title><desc id="desc">First observation in stage4: a new unidentified guest holds a distinct large neutral-colour bag outside a small entrance; the existing small chair obstructs the opening. No motion/arrival or diagnosis is represented. This is not Jan’s red bag or Ala’s white bag; holding does not assign legal ownership. The guest is not identified with the absent owner or unseen SMS group. Jan removes the chair only in the following paragraph.</desc><rect width="720" height="900" fill="#f5f1e6"/><g font-family="sans-serif"><text x="30" y="65" font-size="48" fill="#303633">Wejście</text><path d="M360 150H520V690H360" fill="#ded7c5" stroke="#303633" stroke-width="12"/><path d="M395 195H490V690H395Z" fill="#fffdf8" stroke="#303633" stroke-width="6"/><g transform="translate(140 310) scale(1.15)"><path d="M-28 142L-28 225H-6L0 165L8 225H30L27 142" fill="#405055"/><path d="M-42 66Q0 47 42 66L33 153H-33Z" fill="#68726c" stroke="#303633" stroke-width="3"/><path d="M-36 79L-56 130M35 79L58 122" fill="none" stroke="#68726c" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24Q-35-17 0-10Q34-15 34 24Q8 0-33 24" fill="#645b50"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><path d="M90 510Q170 440 245 510L265 670H70Z" fill="#827158" stroke="#303633" stroke-width="8"/><path d="M110 520V490Q165 445 220 490V520" fill="none" stroke="#303633" stroke-width="10"/><g transform="translate(395 500) scale(0.65)"><path d="M0 0H95V105H0ZM0 55H95" fill="#c6ad81" stroke="#303633" stroke-width="7"/><path d="M-10 105H110V125H-10ZM0 125V205M95 125V205" fill="#c6ad81" stroke="#303633" stroke-width="8"/></g><text x="40" y="270" font-size="48" fill="#303633">gość</text><text x="350" y="775" font-size="44" fill="#303633">małe krzesło</text><text x="30" y="850" font-size="48" fill="#303633">duża torba</text></g></svg>
