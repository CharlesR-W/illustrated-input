<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">Pomoc; pomagamy</title><desc id="desc">Opening support hand-off in two time panels: Jan first holds the unrepaired red table; Irena then holds it, freeing him to help with chairs. Same table, attached loose leg in both panels. No repair, table reorientation or lamp handling. Other established props remain outside the crop.</desc><rect width="720" height="850" fill="#f5f1e6"/><g font-family="sans-serif"><text x="30" y="65" font-size="48" fill="#303633">Pomoc → pomagamy</text><rect x="20" y="100" width="680" height="340" rx="18" fill="#fffdf8" stroke="#303633" stroke-width="4"/><text x="40" y="160" font-size="48" fill="#303633">Jan</text><g transform="translate(140 185) scale(0.75)"><path d="M-28 142L-28 225H-6L0 165L8 225H30L27 142" fill="#405055"/><path d="M-42 66Q0 47 42 66L33 153H-33Z" fill="#b88632" stroke="#303633" stroke-width="3"/><path d="M-36 79L-56 130M35 79L58 122" fill="none" stroke="#b88632" stroke-width="23" stroke-linecap="round"/><circle cy="29" r="33" fill="#e3b698" stroke="#303633" stroke-width="3"/><path d="M-33 24Q-35-17 0-10Q34-15 34 24Q8 0-33 24" fill="#705340"/><circle cx="-10" cy="29" r="3"/><circle cx="10" cy="29" r="3"/><path d="M-8 44Q0 49 9 43" fill="none" stroke="#303633" stroke-width="3"/></g><g transform="translate(280 205) scale(0.8)"><path d="M0 0H260V35H0Z" fill="#af594e" stroke="#303633" stroke-width="6"/><path d="M20 35V190M235 35L210 190" stroke="#af594e" stroke-width="25"/><path d="M20 35V190M235 35L210 190" stroke="#303633" stroke-width="4"/><path d="M210 40L230 58M209 55L224 72" stroke="#303633" stroke-width="6"/></g><path d="M180 275L285 225" fill="none" stroke="#b88632" stroke-width="12" stroke-linecap="round"/><text x="250" y="415" font-size="48" fill="#303633">trzyma stół</text><g transform="translate(0 40)"><rect x="20" y="440" width="680" height="340" rx="18" fill="#fffdf8" strok