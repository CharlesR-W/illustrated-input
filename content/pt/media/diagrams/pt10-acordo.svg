<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><title>pt10-acordo</title><desc>Original Portuguese course illustration with clothed characters and exact schedule relations.</desc><rect width="900" height="600" fill="#fff5de"/><style>text{font-family:Arial,sans-serif;fill:#28323b}.line{fill:none;stroke:#28323b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}</style><text x="35" y="48" font-size="32">sábado</text><g transform="translate(145 350)"><ellipse cy="-60" rx="23" ry="28" fill="#bd8464"/><path d="M-23 -62Q-30 -105 14 -90L25 -65Q0 -85 -23 -62" fill="#777"/><circle cx="-7" cy="-61" r="2.7"/><circle cx="8" cy="-61" r="2.7"/><path d="M-6 -45Q0 -40 7 -45" fill="none" stroke="#5c3530" stroke-width="2"/><path d="M-22 -31Q0 -39 22 -31L32 43H-32Z" fill="#4677a0"/><path d="M-17 43V100M17 43V100" stroke="#31465f" stroke-width="21"/><path d="M-22 -21L-42 18M22 -21L65 8" fill="none" stroke="#bd8464" stroke-width="12" stroke-linecap="round"/><text x="-30" y="-110" font-size="28">Rosa</text></g><circle cx="123" cy="272" r="8" fill="#777"/><circle cx="132" cy="261" r="8" fill="#777"/><circle cx="145" cy="258" r="8" fill="#777"/><circle cx="158" cy="263" r="8" fill="#777"/><circle cx="168" cy="273" r="8" fill="#777"/><rect x="55" y="440" width="220" height="120" rx="12" fill="#d7ad76" stroke="#6f5945" stroke-width="3"/><rect x="305" y="85" width="555" height="200" rx="16" fill="#dceccd" stroke="#b3a795" stroke-width="2"/><text x="330" y="130" font-size="30">primeiro: 15 livros</text><text x="330" y="180" font-size="29">à uma hora da tarde</text><text x="330" y="230" font-size="30">13:00   → café</text><rect x="305" y="315" width="555" height="230" rx="16" fill="#e3edf6" stroke="#b3a795" stroke-width="2"/><text x="330" y="365" font-size="30">depois: 10 cadeiras</text><text x="330" y="420" font-size="29">às duas horas e meia</text><text x="330" y="475" font-size="30">14:30   → pátio</text><text x="330" y="520" font-size="25">entrada pequena</text><g transform="translate(115 475) scale(1)"><path d="M-45 -35L35 -43L45 35L-35 43Z" fill="#fff" stroke="#28323b" stroke-width="3"/><path d="M-35 43L-32 49L47 40L45 35" fill="#fff9ed" stroke="#28323b" stroke-width="2"/></g><rect x="190" y="285" width="42" height="73" rx="7" fill="#28323b"/><rect x="196" y="294" width="30" height="48" fill="#dceccd"/></svg>