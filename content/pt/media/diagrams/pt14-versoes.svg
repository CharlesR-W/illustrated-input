<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><title>Duas versões</title><desc>Uma lista com três nomes; uma lista com cinco nomes.</desc><rect width="800" height="520" fill="#fff5e6"/><g font-family="sans-serif" text-anchor="middle" fill="#183749"><text x="400" y="40" font-size="27">Duas versões</text><rect x="35" y="80" width="340" height="390" fill="white" stroke="#183749" stroke-width="3"/><rect x="425" y="80" width="340" height="390" fill="white" stroke="#183749" stroke-width="3"/><text x="205" y="118" font-size="22">Café da Esquina</text><text x="595" y="118" font-size="22">Café da Esquina</text><text x="205" y="155" font-size="21">sábado · seis</text><text x="595" y="155" font-size="21">sábado · treze</text><text x="205" y="197" font-size="20">Paulo</text><text x="595" y="197" font-size="20">Rosa</text><text x="205" y="252" font-size="23">nome 1</text><text x="205" y="292" font-size="23">nome 2</text><text x="205" y="332" font-size="23">nome 3</text><text x="595" y="252" font-size="23">nome 1</text><text x="595" y="292" font-size="23">nome 2</text><text x="595" y="332" font-size="23">nome 4</text><text x="595" y="372" font-size="23">nome 5</text><text x="595" y="412" font-size="23">nome 6</text><text x="205" y="450" font-size="20">página cinco · três nomes</text><text x="595" y="450" font-size="20">papel de Rosa · cinco nomes</text><text x="400" y="505" font-size="20">duas semanas diferentes · antes da semana passada</text></g></svg>
