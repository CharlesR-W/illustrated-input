    .small { font-style: italic; fill: #5f5f5f; }
    .river { font-style: italic; fill: #2f5f8a; }
    .gub { fill: #f3ecd9; stroke: #8a7a5c; stroke-width: 1.5; }
    .uezd { fill: #e9dfc2; stroke: #8a7a5c; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .water { fill: none; stroke: #4a86b8; stroke-width: 2.5; stroke-linecap: round; }
    .rail-a { fill: none; stroke: #2b2b2b; stroke-width: 4; }
    .rail-b { fill: none; stroke: #ffffff; stroke-width: 2; stroke-dasharray: 7 7; }
    .road { fill: none; stroke: #9a6b3c; stroke-width: 2.5; stroke-dasharray: 3 4; }
  </style>
