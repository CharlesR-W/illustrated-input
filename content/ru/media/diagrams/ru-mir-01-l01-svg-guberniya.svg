<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-labelledby="t d">
  <title id="t">губе́рния → уе́зд → дере́вня</title>
  <desc id="d">Zoom map. A large outline labelled Рязанская губерния with Рязань on the Ока; inside it a smaller outline labelled уезд with the уездный город; a railway line through Рязань and the district town; a road from the district town to the village Берёзовка on a small river.</desc>
