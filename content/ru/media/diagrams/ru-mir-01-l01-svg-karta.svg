<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-labelledby="t d">
  <title id="t">Росси́я на ка́рте</title>
  <desc id="d">Schematic map of European Russia. Left of a dashed line: Европа; right of it: Азия. Петербург in the north-west, Москва in the centre, the Volga flowing east then south, the Oka joining it, Рязань on the Oka.</desc>
  <style>
    text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; font-size: 18px; }
    .big { font-size: 24px; font-weight: 700; fill: #5a4a2c; letter-spacing: 2px; }
    .reg { font-style: italic; fill: #6b6b6b; }
    .river { font-style: italic; fill: #2f5f8a; }
    .water { fill: none; stroke: #4a86b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .border { fill: none; stroke: #8a7a5c; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .dot { fill: #2b2b2b; }
  </style>
  <rect x="1" y="1" width="318" height="238" fill="#fbf7ee" stroke="#c9bb9a"/>
  <text class="big" x="140" y="32" text-anchor="middle">Росси́я</text>
  <path class="border" d="M262 10 L256 70 L266 130 L256 190 L264 232"/>
  <text class="reg" x="12" y="230">Евро́па</text>
  <text class="reg" x="266" y="96">А́зия</text>
  <path class="water" d="M74 96 C110 86 140 84 170 98 C196 110 210 114 220 132 C232 152 238 172 228 196 C222 212 220 222 224 236"/>
  <path class="water" d="M88 196 C104 182 118 168 140 160 C160 152 172 130 186 110"/>
  <text class="river" x="146" y="78">Во́лга</text>
  <text class="river" x="96" y="216">Ока́</text>
  <circle class="dot" cx="62" cy="52" r="4.5"/>
  <text x="20" y="76">Петербу́рг</text>
  <circle class="dot" cx="112" cy="130" r="5.5"/>
  <text x="28" y="136">Москва́</text>
  <circle class="dot" cx="142" cy="159" r="4.5"/>
  <text x="122" y="184">Ряза́нь</text>
</svg>
