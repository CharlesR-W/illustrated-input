<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-labelledby="t d">
  <title id="t">семья́ Соколо́вых</title>
  <desc id="d">Family tree. Top: дед Матвей. Below: отец Пётр and мать Марья. Below them: Фёдор with his wife Дарья, Иван, Настя. Bottom: Фёдор and Дарья's children Миша and Лиза.</desc>
  <style>
    text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; font-size: 18px; }
    .role { font-style: italic; fill: #6b5a3a; }
    line, path { stroke: #8a7a5c; stroke-width: 1.5; fill: none; }
    .wed { stroke: #b0452f; stroke-dasharray: 3 3; }
  </style>
  <rect x="1" y="1" width="318" height="258" fill="#fbf7ee" stroke="#c9bb9a"/>
  <text x="160" y="26" text-anchor="middle"><tspan class="role">дед</tspan> Матве́й</text>
  <line x1="160" y1="34" x2="160" y2="50"/>
  <text x="82" y="72" text-anchor="middle"><tspan class="role">оте́ц</tspan> Пётр</text>
  <text x="246" y="72" text-anchor="middle"><tspan class="role">мать</tspan> Ма́рья</text>
  <line class="wed" x1="138" y1="66" x2="188" y2="66"/>
  <line x1="82" y1="50" x2="160" y2="50"/>
  <line x1="82" y1="50" x2="82" y2="54"/>
  <line x1="160" y1="66" x2="160" y2="108"/>
  <line x1="56" y1="108" x2="272" y2="108"/>
  <line x1="56" y1="108" x2="56" y2="122"/>
  <line x1="182" y1="108" x2="182" y2="122"/>
  <line x1="272" y1="108" x2="272" y2="122"/>
  <text x="56" y="142" text-anchor="middle">Фёдор</text>
  <text x="182" y="142" text-anchor="middle">Ива́н</text>
  <text x="272" y="142" text-anchor="middle">На́стя</text>
  <text x="182" y="164" text-anchor="middle" class="role">сын, брат</text>
  <text x="272" y="164" text-anchor="middle" class="role">дочь</text>
  <line class="wed" x1="56" y1="150" x2="56" y2="174"/>
  <text x="56" y="194" text-anchor="middle"><tspan class="role">жена́</tspan> Да́рья</text>
  <line x1="56" y1="202" x2="56" y2="214"/>
  <line x1="24" y1="214" x2="104" y2="214"/>
  <line x1="24" y1="214" x2="24" y2="226"/>
  <line x1="104" y1="214" x2="104" y2="226"/>
  <text x="34" y="246" text-anchor="middle">Ми́ша</text>
  <text x="108" y="246" text-anchor="middle">Ли́за</text>
  <text x="150" y="246" class="role">← де́ти</text>
</svg>
