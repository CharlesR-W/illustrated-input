<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-labelledby="t d">
  <title id="t">изба</title>
  <desc id="d">Plan of a one-room peasant house seen from above. The big stove in the corner by the door; the icon corner diagonally opposite with the icon above the table; benches along the walls; windows in the walls by the icon corner.</desc>
  <style>
    text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; font-size: 18px; }
    .wall { fill: #f3ecd9; stroke: #6b5a3a; stroke-width: 6; }
    .pech { fill: #ffffff; stroke: #8a7a5c; stroke-width: 2; }
    .table { fill: #d9c49a; stroke: #8a7a5c; stroke-width: 1.5; }
    .bench { fill: #e6d6b0; stroke: #8a7a5c; stroke-width: 1; }
    .win { fill: #cfe3f1; stroke: #6b5a3a; stroke-width: 1; }
    .lab { font-style: italic; fill: #6b5a3a; }
  </style>
  <rect x="1" y="1" width="318" height="258" fill="#fbf7ee" stroke="#c9bb9a"/>
  <rect class="wall" x="24" y="24" width="272" height="200"/>
  <rect x="30" y="220" width="56" height="10" fill="#fbf7ee"/>
  <text x="30" y="250">дверь</text>
  <rect class="pech" x="30" y="122" width="100" height="96"/>
  <text x="56" y="176">печь</text>
  <rect class="win" x="150" y="18" width="56" height="12"/>
  <rect class="win" x="290" y="120" width="12" height="56"/>
  <text x="70" y="62">окно ↗</text>
  <rect class="bench" x="140" y="30" width="150" height="14"/>
  <rect class="bench" x="276" y="44" width="14" height="150"/>
  <rect class="table" x="176" y="70" width="80" height="54"/>
  <text x="196" y="103">стол</text>
  <polygon points="290,30 290,62 258,30" fill="#b0452f"/>
  <rect x="270" y="33" width="13" height="17" fill="#c9a24a" stroke="#6b5a3a" stroke-width="1"/>
  <text x="150" y="152" class="lab">красный угол,</text>
  <text x="150" y="174" class="lab">икона</text>
  <path d="M262 134 L276 56" stroke="#6b5a3a" stroke-width="1.2" fill="none"/>
</svg>
