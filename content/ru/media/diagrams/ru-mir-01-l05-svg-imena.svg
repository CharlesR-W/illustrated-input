<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-labelledby="t d">
  <title id="t">Ваня, Ванька, Иван Петрович</title>
  <desc id="d">A name card. In the centre: Иван. Three arrows point to it from three speakers: мать says Ваня, Фёдор says Ванька, учительница says Иван Петрович.</desc>
  <style>
    text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; font-size: 18px; }
    .who { font-style: italic; fill: #6b5a3a; }
    .name { font-weight: 700; fill: #b0452f; }
    line { stroke: #8a7a5c; stroke-width: 1.5; }
  </style>
  <rect x="1" y="1" width="318" height="218" fill="#fbf7ee" stroke="#c9bb9a"/>
  <rect x="112" y="92" width="96" height="36" rx="6" fill="#f3ecd9" stroke="#6b5a3a"/>
  <text x="160" y="116" text-anchor="middle" font-size="20" font-weight="700">Иван</text>
  <text x="14" y="30" class="who">мать:</text>
  <text x="14" y="54" class="name">«Ваня»</text>
  <line x1="70" y1="62" x2="118" y2="94"/>
  <text x="214" y="30" class="who">Фёдор:</text>
  <text x="214" y="54" class="name">«Ванька»</text>
  <line x1="246" y1="62" x2="202" y2="94"/>
  <text x="160" y="164" text-anchor="middle" class="who">учительница:</text>
  <text x="160" y="192" text-anchor="middle" class="name">«Иван Петрович»</text>
  <line x1="160" y1="128" x2="160" y2="146"/>
</svg>
