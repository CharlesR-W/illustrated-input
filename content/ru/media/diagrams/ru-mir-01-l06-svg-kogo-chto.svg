<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="t d">
  <title id="t">что? ↔ кого́?</title>
  <desc id="d">Two columns. Left, headed что?: ла́мпу, стол, до́ску. Right, headed кого́?: Ива́на, Его́ра, Ве́ру. Above both: Ве́ра ви́дит …</desc>
  <style>
    text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; }
    .h { font-size: 20px; font-weight: 700; }
    .w { font-size: 18px; }
    .top { font-size: 18px; font-style: italic; }
    line { stroke: #8a7a5c; stroke-width: 1.5; }
  </style>
  <text class="top" x="160" y="24" text-anchor="middle">Ве́ра ви́дит …</text>
  <line x1="160" y1="40" x2="160" y2="190"/>
  <text class="h" x="80" y="62" text-anchor="middle">что?</text>
  <text class="h" x="240" y="62" text-anchor="middle">кого́?</text>
  <line x1="20" y1="72" x2="300" y2="72"/>
  <text class="w" x="80" y="104" text-anchor="middle">ла́мпу</text>
  <text class="w" x="80" y="136" text-anchor="middle">стол</text>
  <text class="w" x="80" y="168" text-anchor="middle">до́ску</text>
  <text class="w" x="240" y="104" text-anchor="middle">Ива́на</text>
  <text class="w" x="240" y="136" text-anchor="middle">Его́ра</text>
  <text class="w" x="240" y="168" text-anchor="middle">Ве́ру</text>
</svg>
