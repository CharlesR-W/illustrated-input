<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 560" width="290" height="560" role="img" aria-labelledby="t d">
  <title id="t">Как идёт слух</title>
  <desc id="d">A map of the rumour in Berezovka, top to bottom: the sweep well, then Silanty's shop («Фёдор хочет отруб»), then the priest's house («Фёдор хочет жить в Москве»), then the Sokolovs' izba («Фёдор продаёт землю»).</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8a3b22"/>
    </marker>
  </defs>
  <style>text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; } .node { font-size: 19px; } .ver { font-size: 17px; font-style: italic; fill: #6b3a22; } .top { font-size: 20px; }</style>
  <rect x="1" y="1" width="288" height="558" fill="#fbf7ee" stroke="#c9bb9a"/>
  <text class="top" x="145" y="30" text-anchor="middle">Как идёт слух</text>

  <!-- 1 колодец (sweep well) -->
  <g transform="translate(6 34)" stroke="#5a4630" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="30" y="50" width="44" height="24" fill="#b48a5a"/>
    <line x1="30" y1="58" x2="74" y2="58"/><line x1="30" y1="66" x2="74" y2="66"/>
    <line x1="44" y1="74" x2="44" y2="16" stroke-width="3"/>
    <path d="M39 16 L44 11 L49 16" fill="none"/>
    <line x1="10" y1="6" x2="96" y2="30" stroke-width="3"/>
    <rect x="3" y="1" width="13" height="10" fill="#8a6a44" transform="rotate(16 10 6)"/>
    <line x1="92" y1="29" x2="70" y2="48" stroke-width="1.5"/>
    <path d="M64 44 L76 44 L74 51 L66 51 Z" fill="#a0764a"/>
  </g>
  <text class="node" x="120" y="96">колодец</text>

  <!-- arrow 1 -->
  <line x1="56" y1="120" x2="56" y2="168" stroke="#8a3b22" stroke-width="2.5" marker-end="url(#ah)"/>
  <text class="ver" x="76" y="140">«Фёдор хочет</text>
  <text class="ver" x="76" y="160">отруб»</text>

  <!-- 2 лавка -->
  <g transform="translate(6 172)" stroke="#5a4630" stroke-width="2" stroke-linejoin="round">
    <path d="M4 26 L50 4 L96 26 Z" fill="#8f6f4a"/>
    <rect x="10" y="26" width="80" height="44" fill="#c49a66"/>
    <line x1="10" y1="40" x2="90" y2="40" stroke-width="1"/><line x1="10" y1="54" x2="90" y2="54" stroke-width="1"/>
    <rect x="24" y="29" width="52" height="9" fill="#e9dcc0"/>
    <rect x="42" y="46" width="16" height="24" fill="#6b4f33"/>
  </g>
  <text class="node" x="120" y="222">лавка</text>

  <!-- arrow 2 -->
  <line x1="56" y1="250" x2="56" y2="308" stroke="#8a3b22" stroke-width="2.5" marker-end="url(#ah)"/>
  <text class="ver" x="76" y="268">«Фёдор хочет</text>
  <text class="ver" x="76" y="288">жить в Москве»</text>

  <!-- 3 дом батюшки -->
  <g transform="translate(6 312)" stroke="#5a4630" stroke-width="2" stroke-linejoin="round">
    <path d="M4 26 L50 4 L96 26 Z" fill="#7d8a6a"/>
    <rect x="10" y="26" width="80" height="44" fill="#d8c7a0"/>
    <rect x="18" y="36" width="16" height="14" fill="#f4ecd4"/>
    <rect x="66" y="36" width="16" height="14" fill="#f4ecd4"/>
    <rect x="43" y="46" width="14" height="24" fill="#6b4f33"/>
  </g>
  <text class="node" x="120" y="362">у батюшки</text>

  <!-- arrow 3 -->
  <line x1="56" y1="390" x2="56" y2="448" stroke="#8a3b22" stroke-width="2.5" marker-end="url(#ah)"/>
  <text class="ver" x="76" y="408">«Фёдор продаёт</text>
  <text class="ver" x="76" y="428">землю»</text>

  <!-- 4 изба -->
  <g transform="translate(6 452)" stroke="#5a4630" stroke-width="2" stroke-linejoin="round">
    <rect x="66" y="0" width="9" height="18" fill="#9a8a78"/>
    <path d="M4 30 L50 6 L96 30 Z" fill="#a8925e"/>
    <rect x="10" y="30" width="80" height="44" fill="#b48a5a"/>
    <line x1="10" y1="44" x2="90" y2="44" stroke-width="1"/><line x1="10" y1="58" x2="90" y2="58" stroke-width="1"/>
    <rect x="38" y="38" width="24" height="20" fill="#f1d27a"/>
    <line x1="50" y1="38" x2="50" y2="58" stroke-width="1.5"/><line x1="38" y1="48" x2="62" y2="48" stroke-width="1.5"/>
  </g>
  <text class="node" x="120" y="508">изба</text>
</svg>
