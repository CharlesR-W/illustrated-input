    .w { font-size: 20px; font-weight: 700; }
    .v { font-size: 17px; font-style: italic; }
    .s { font-size: 17px; }
  </style>
  <rect x="1" y="1" width="298" height="228" fill="#fbf7ee" stroke="#c9bb9a"/>
