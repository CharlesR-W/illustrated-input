<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230" role="img" aria-labelledby="t d">
  <title id="t">Кому? Иван даёт Насте пряник</title>
  <desc id="d">Ivan, a young peasant in a red shirt, stands on the left holding out a round gingerbread; an arrow runs from him through the gingerbread to Nastya, a girl in a red kerchief and blue sarafan, on the right. Labels: кто? Иван; что? пряник; кому? Насте; on the arrow даёт. Below: Иван даёт Насте пряник.</desc>
