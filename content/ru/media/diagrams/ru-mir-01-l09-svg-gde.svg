<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280" role="img" aria-labelledby="t d">
  <title id="t">Где? Стол — перед церковью</title>
  <desc id="d">A wooden church with one onion dome. In front of it a table; the village elder, bald with a long grey beard and a brass badge, sits behind the table with a slate board on it. To the left the constable in a dark uniform stands with a sabre at his side. To the right a cart; the grey-and-white dog lies under it. Labels: где?; сабля; под телегой; за столом; Стол — перед церковью.</desc>
