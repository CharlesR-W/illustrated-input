  <title id="t">С кем? Фёдор — с Силантием, Пётр — с миром, Иван — с семьёй</title>
  <desc id="d">Three rows. Top: Fyodor, dark-bearded in a blue-grey shirt, stands beside Silanty in a white shirt and dark waistcoat; label Фёдор — с Силантием. Middle: Pyotr, grey-brown beard, linen shirt with a red sash, stands in front of three smaller village men; label Пётр — с миром. Bottom: Ivan in a red shirt stands with his mother in a brown kerchief and Nastya in a blue kerchief; label Иван — с семьёй.</desc>
