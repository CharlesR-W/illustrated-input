<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 430" width="300" height="430" role="img" aria-labelledby="t d">
  <title id="t">чита́л → прочита́л · убира́ли → убра́л · звони́л → позвони́л</title>
  <desc id="d">Three timelines. In each, a long wavy line (the action going on) ends in a large dot (the action brought to its end: the word read, the rye harvested, the ringing over). Top: Ivan in a red shirt reading a sheet of paper; the wavy line is labelled чита́л, the dot прочита́л. Middle: a bound sheaf of rye with a sickle; the wavy line is labelled убира́ли, the dot убра́л. Bottom: a church bell on its beam; the wavy line is labelled звони́л, the dot позвони́л.</desc>
  <style>
    text { font-family: 'Noto Serif', 'PT Serif', Georgia, serif; fill: #2b2b2b; }
    .ipf { font-size: 19px; font-style: italic; }
    .pf { font-size: 19px; font-weight: 700; fill: #8b2e22; }
  </style>
  <rect x="1" y="1" width="298" height="428" fill="#fbf7ee" stroke="#c9bb9a"/>
  <path d="M10 143 H290 M10 286 H290" stroke="#e3d8bf" stroke-width="1.5"/>

  <!-- row 1: Ivan reads -->
  <g transform="translate(52 130) scale(0.62)">
    <path d="M-10 -46 L-12 -4 L-3 -4 L0 -38 L3 -4 L12 -4 L10 -46 Z" fill="#6f675c" stroke="#3b2f27" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M-15 -4 h12 v4 h-14 Z M3 -4 h12 l2 4 h-14 Z" fill="#2f2a26" stroke="#3b2f27" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M-16 -90 L16 -90 L15 -42 L-15 -42 Z" fill="#b0452f" stroke="#3b2f27" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M-15 -62 H15" stroke="#8a6440" stroke-width="3"/>
    <path d="M-16 -88 L-26 -62 L-20 -58 L-12 -76" fill="#b0452f" stroke="#3b2f27" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M16 -88 L26 -62 L20 -58 L12 -76" fill="#b0452f" stroke="#3b2f27" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M-24 -84 L24 -84 L22 -54 L-22 -54 Z" fill="#fbfbf5" stroke="#3b2f27" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-16 -77 H16 M-16 -70 H14 M-16 -63 H10" stroke="#9a9488" stroke-width="2"/>
    <circle cx="-24" cy="-58" r="3.5" fill="#e6caa8" stroke="#3b2f27" stroke-width="2"/><circle cx="24" cy="-58" r="3.5" fill="#e6caa8" stroke="#3b2f27" stroke-width="2"/>
    <circle cx="0" cy="-104" r="11" fill="#e6caa8" stroke="#3b2f27" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M-12 -107 C-12 -120 12 -120 12 -107 L15 -106 L-14 -106 Z" fill="#d8b56a" stroke="#3b2f27" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="-4" cy="-101" r="1.2" fill="#3b2f27"/><circle cx="4" cy="-101" r="1.2" fill="#3b2f27"/>
  </g>
  <text class="ipf" x="112" y="62">чита́л</text>
  <path d="M106 86 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#6b5a3a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="262" cy="86" r="9" fill="#8b2e22" stroke="#fbf7ee" stroke-width="2"/>
  <text class="pf" x="290" y="122" text-anchor="end">прочита́л</text>

  <!-- row 2: sheaf and sickle -->
  <g transform="translate(44 268) scale(0.85)">
    <path d="M-14 0 L-8 -60 M-8 0 L-4 -64 M-2 0 L0 -66 M4 0 L4 -64 M10 0 L8 -60 M15 0 L11 -56" stroke="#b8902f" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 -58 l-4 -12 l6 4 Z M-5 -62 l-2 -14 l5 6 Z M0 -64 l0 -14 l4 7 Z M4 -62 l3 -14 l2 8 Z M8 -58 l5 -12 l0 8 Z" fill="#d9b44a" stroke="#7a5a1c" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M-12 -30 C-4 -26 6 -26 14 -30" fill="none" stroke="#7a5236" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 -10 C34 -40 62 -36 66 -14 C58 -30 40 -32 26 -8 Z" fill="#9aa0a6" stroke="#3b2f27" stroke-width="2" stroke-linejoin="round"/>
    <path d="M18 -10 L8 4" stroke="#7a5236" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text class="ipf" x="112" y="205">убира́ли</text>
  <path d="M106 229 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#6b5a3a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="262" cy="229" r="9" fill="#8b2e22" stroke="#fbf7ee" stroke-width="2"/>
  <text class="pf" x="290" y="265" text-anchor="end">убра́л</text>

  <!-- row 3: bell -->
  <g transform="translate(52 400)">
    <path d="M-34 -78 H34" stroke="#5a4029" stroke-width="7" stroke-linecap="round"/>
    <path d="M-6 -78 V-70 M6 -78 V-70" stroke="#3b2f27" stroke-width="3"/>
    <path d="M-12 -70 C-14 -60 -16 -40 -26 -22 L26 -22 C16 -40 14 -60 12 -70 Z" fill="#a7793a" stroke="#3b2f27" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-20 -32 H20 M-16 -44 H16" stroke="#7d5a2a" stroke-width="2"/>
    <circle cx="0" cy="-15" r="5" fill="#5a4029" stroke="#3b2f27" stroke-width="2"/>
    <path d="M0 -10 C2 0 8 6 14 10" fill="none" stroke="#c9a66b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text class="ipf" x="112" y="348">звони́л</text>
  <path d="M106 372 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#6b5a3a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="262" cy="372" r="9" fill="#8b2e22" stroke="#fbf7ee" stroke-width="2"/>
  <text class="pf" x="290" y="408" text-anchor="end">позвони́л</text>
</svg>
