<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>усадьба</title>
  <desc>A white two-storey provincial manor house with a portico of four white columns under a triangular pediment and a green roof, among rounded lime trees.</desc>
  <g stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="160" cy="176" rx="156" ry="12" fill="#cfd8b6" stroke="none" opacity="0.6"/>
    <!-- back trees -->
    <rect x="44" y="120" width="8" height="50" fill="#7a5634"/>
    <path d="M18 110 C10 80 30 50 52 52 C78 50 92 78 84 108 C78 128 26 130 18 110 Z" fill="#5d7842"/>
    <!-- roof -->
    <rect x="96" y="40" width="10" height="20" fill="#b0443a" stroke-width="2"/>
    <rect x="214" y="40" width="10" height="20" fill="#b0443a" stroke-width="2"/>
    <path d="M62 82 L258 82 L232 54 L88 54 Z" fill="#6e8b4e"/>
    <path d="M62 82 L258 82 L250 74 L70 74 Z" fill="#5d7842" stroke="none"/>
    <!-- house -->
    <rect x="70" y="82" width="180" height="84" fill="#f4f0e6"/>
    <path d="M70 124 H250" fill="none" stroke-width="1.5"/>
    <g fill="#4a5a78" stroke-width="2">
      <rect x="80" y="92" width="12" height="20"/><rect x="100" y="92" width="12" height="20"/>
      <rect x="208" y="92" width="12" height="20"/><rect x="228" y="92" width="12" height="20"/>
      <rect x="80" y="134" width="12" height="22"/><rect x="100" y="134" width="12" height="22"/>
      <rect x="208" y="134" width="12" height="22"/><rect x="228" y="134" width="12" height="22"/>
      <rect x="140" y="94" width="12" height="20"/><rect x="168" y="94" width="12" height="20"/>
    </g>
    <path d="M152 166 V138 Q160 130 168 138 V166 Z" fill="#7a5634" stroke-width="2"/>
    <!-- portico -->
    <rect x="120" y="80" width="80" height="8" fill="#f4f0e6"/>
    <path d="M116 80 L160 52 L204 80 Z" fill="#f4f0e6"/>
    <path d="M132 76 L160 59 L188 76 Z" fill="#e2dccd" stroke-width="1.5"/>
    <g fill="#f4f0e6">
      <rect x="125" y="88" width="9" height="74"/>
      <rect x="143" y="88" width="9" height="74"/>
      <rect x="168" y="88" width="9" height="74"/>
      <rect x="186" y="88" width="9" height="74"/>
    </g>
    <g fill="#d8d1c0" stroke="none">
      <rect x="131" y="90" width="2" height="70"/><rect x="149" y="90" width="2" height="70"/>
      <rect x="174" y="90" width="2" height="70"/><rect x="192" y="90" width="2" height="70"/>
    </g>
    <rect x="116" y="162" width="88" height="5" fill="#e2dccd" stroke-width="2"/>
    <rect x="110" y="167" width="100" height="5" fill="#e2dccd" stroke-width="2"/>
    <!-- front trees -->
    <rect x="22" y="146" width="7" height="28" fill="#7a5634"/>
    <path d="M6 140 C0 118 14 100 28 102 C46 100 54 122 48 140 C42 154 12 156 6 140 Z" fill="#6e8b4e"/>
    <path d="M14 122 C16 112 24 108 30 108" fill="none" stroke="#9cb87a" stroke-width="3"/>
    <rect x="284" y="130" width="8" height="44" fill="#7a5634"/>
