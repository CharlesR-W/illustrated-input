      <rect x="154" y="106" width="72" height="7" fill="#87a466" stroke="none"/>
      <g fill="#eee3c8" stroke-width="2"><rect x="162" y="116" width="12" height="13"/><rect x="184" y="116" width="12" height="13"/><rect x="206" y="116" width="12" height="13"/></g>
