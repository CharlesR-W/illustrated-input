<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>доска́</title>
  <desc>A child's school slate in a light wooden frame, broken across into two halves with a gap between them, one corner chewed away, with a few chalk scribbles.</desc>
  <defs>
    <path id="halfL" d="M30 56 H118 L126 82 L114 104 L128 128 L116 154 L124 184 H30 Z"/>
    <path id="halfR" d="M118 56 H210 V130 A9 9 0 0 0 202 143 A8 8 0 0 0 194 154 A9 9 0 0 0 184 165 A8 8 0 0 0 174 175 A9 9 0 0 0 160 184 H124 L116 154 L128 128 L114 104 L126 82 Z"/>
    <clipPath id="cL"><use href="#halfL"/></clipPath>
    <clipPath id="cR"><use href="#halfR"/></clipPath>
    <g id="slate">
      <rect x="30" y="56" width="180" height="128" rx="5" fill="#c8a06a"/>
      <path d="M34 60 H206 V66 H34 Z" fill="#dcbb88" stroke="none"/>
      <rect x="42" y="68" width="156" height="104" rx="2" fill="#4b5156" stroke-width="2"/>
      <path d="M48 74 L120 74 L60 120 L48 120 Z" fill="#5a6166" stroke="none"/>
      <g fill="none" stroke="#dcd9cf" stroke-width="2" opacity="0.8">
        <path d="M54 92 C62 82 70 100 78 90 C86 80 92 98 100 88"/>
        <path d="M58 142 L74 128 L84 146 L98 130 L108 150"/>
        <path d="M140 86 C152 80 166 96 178 84"/>
        <path d="M144 142 C152 134 160 148 168 138 C174 132 178 140 182 136"/>
      </g>
    </g>
  </defs>
  <g stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="120" cy="200" rx="104" ry="10" fill="#d9cfb8" stroke="none" opacity="0.55"/>
    <g transform="translate(-8 4) rotate(-4 74 120)">
      <g clip-path="url(#cL)"><use href="#slate"/></g>
      <use href="#halfL" fill="none"/>
    </g>
    <g transform="translate(8 -2) rotate(3 166 120)">
      <g clip-path="url(#cR)"><use href="#slate"/></g>
      <use href="#halfR" fill="none"/>
      <path d="M198 135 L194 131 M190 147 L186 143 M180 158 L176 154 M170 169 L166 165" fill="none" stroke="#7a5634" stroke-width="1.5"/>
    </g>
  </g>
</svg>
