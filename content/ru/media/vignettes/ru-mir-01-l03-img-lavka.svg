<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <title>лавка</title>
  <desc>A small log-built village shop with a plank roof, a wide double door up one step, an unreadable painted signboard over the door, a barrel and two sacks beside it.</desc>
  <g stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="160" cy="204" rx="152" ry="10" fill="#d9cfb8" stroke="none" opacity="0.6"/>
    <!-- log walls -->
    <rect x="34" y="66" width="252" height="132" fill="#8d8579"/>
    <path d="M34 66 H286 V78 H34 Z" fill="#6f675c" stroke="none"/>
    <path d="M34 80 H286 M34 94 H286 M34 108 H286 M34 122 H286 M34 136 H286 M34 150 H286 M34 164 H286 M34 178 H286 M34 192 H286" fill="none" stroke-width="1.5"/>
    <g fill="#a0764a" stroke-width="1.5">
      <circle cx="32" cy="87" r="6"/><circle cx="32" cy="115" r="6"/><circle cx="32" cy="143" r="6"/><circle cx="32" cy="171" r="6"/>
      <circle cx="288" cy="87" r="6"/><circle cx="288" cy="115" r="6"/><circle cx="288" cy="143" r="6"/><circle cx="288" cy="171" r="6"/>
    </g>
