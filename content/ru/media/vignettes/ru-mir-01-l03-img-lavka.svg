    <path d="M18 70 L302 70 L272 22 L48 22 Z" fill="#a0764a"/>
    <path d="M18 70 L302 70 L296 62 L24 62 Z" fill="#7a5634" stroke="none"/>
    <path d="M18 70 L302 70 L272 22 L48 22 Z" fill="none"/>
    <path d="M78 22 L68 70 M112 22 L106 70 M146 22 L143 70 M180 22 L180 70 M214 22 L217 70 M248 22 L254 70" fill="none" stroke-width="1.5"/>
    <!-- window -->
    <rect x="52" y="100" width="40" height="44" fill="#f4f0e6"/>
    <rect x="58" y="106" width="28" height="32" fill="#4a5a78" stroke-width="2"/>
    <path d="M72 106 V138 M58 122 H86" fill="none" stroke="#f4f0e6" stroke-width="3"/>
    <path d="M48 100 L72 90 L96 100 Z" fill="#f4f0e6" stroke-width="2"/>
    <!-- signboard -->
    <rect x="112" y="76" width="96" height="26" fill="#eee3c8"/>
    <rect x="116" y="80" width="88" height="18" fill="none" stroke="#4a5a78" stroke-width="1.8"/>
    <g fill="none" stroke="#3d2f25" stroke-width="3.5">
      <path d="M124 89 C127 85 130 93 133 89 C136 85 139 93 142 89"/>
      <path d="M150 89 C152 86 155 92 158 88 C161 85 163 92 167 89 C170 86 173 92 176 89"/>
      <path d="M184 89 C186 86 190 92 193 88 C195 86 196 90 197 89"/>
    </g>
    <circle cx="116" cy="80" r="1.6" fill="#5c5f63" stroke="none"/><circle cx="204" cy="80" r="1.6" fill="#5c5f63" stroke="none"/>
    <!-- double door -->
    <rect x="126" y="110" width="68" height="80" fill="#7a5634"/>
    <path d="M160 110 V190 M143 110 V190 M177 110 V190" fill="none" stroke-width="1.5"/>
    <path d="M160 110 V190" fill="none"/>
    <path d="M128 126 L158 172 M162 172 L192 126" fill="none" stroke="#5a3f26" stroke-width="4"/>
    <g fill="#5c5f63" stroke-width="1.5"><rect x="152" y="144" width="4" height="10"/><rect x="164" y="144" width="4" height="10"/></g>
    <rect x="120" y="106" width="80" height="6" fill="#a0764a" stroke-width="2"/>
    <rect x="118" y="190" width="84" height="10" fill="#a0764a"/>
