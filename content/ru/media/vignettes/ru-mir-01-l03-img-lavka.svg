    <path d="M204 198 C200 182 204 168 212 162 L208 154 L222 152 L220 162 C232 168 236 184 232 198 Z" fill="#eee3c8"/>
    <path d="M208 160 L224 160" fill="none" stroke="#8a6a3a" stroke-width="2"/>
    <path d="M230 198 C228 186 232 176 240 172 L238 164 L252 163 L250 172 C260 178 264 188 262 198 Z" fill="#e2d4b2"/>
    <path d="M238 170 L252 170" fill="none" stroke="#8a6a3a" stroke-width="2"/>
