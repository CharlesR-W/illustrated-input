<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <title>ворота</title>
  <desc>The wooden double gate of a peasant yard between two thick posts under a small plank roof; the left leaf is shut with a latch bar, the right leaf stands half open, swung inward.</desc>
  <g stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="160" cy="204" rx="152" ry="10" fill="#d9cfb8" stroke="none" opacity="0.6"/>
    <!-- yard seen through the opening -->
    <path d="M160 62 L210 72 L210 186 L160 200 Z" fill="#e9dfc6" stroke="none"/>
    <path d="M160 150 L210 150 L210 186 L160 200 Z" fill="#cdbf98" stroke="none"/>
    <path d="M160 150 H210" fill="none" stroke="#a89a78" stroke-width="1.5"/>
    <path d="M166 150 V128 M178 150 V126 M190 150 V128 M202 150 V126" fill="none" stroke="#a89a78" stroke-width="2"/>
    <!-- open leaf, swung inward -->
    <path d="M262 62 L262 200 L210 186 L210 72 Z" fill="#7a5634"/>
    <path d="M249 65 L249 196 M236 68 L236 193 M223 70 L223 189" fill="none" stroke-width="1.5"/>
    <path d="M262 84 L210 90 M262 178 L210 170 M262 178 L210 90" fill="none" stroke="#5a3f26" stroke-width="5"/>
    <path d="M262 84 L210 90 M262 178 L210 170 M262 178 L210 90" fill="none" stroke-width="1.2"/>
    <!-- closed leaf -->
    <rect x="58" y="62" width="102" height="138" fill="#a0764a"/>
    <path d="M58 62 H160 V72 H58 Z" fill="#b8905e" stroke="none"/>
    <path d="M78 62 V200 M98 62 V200 M118 62 V200 M138 62 V200" fill="none" stroke-width="1.5"/>
    <g fill="#8a6440">
      <rect x="58" y="78" width="102" height="10"/>
      <rect x="58" y="172" width="102" height="10"/>
      <path d="M62 172 L150 88 L160 88 L72 172 Z"/>
    </g>
    <!-- latch -->
    <rect x="132" y="120" width="46" height="8" rx="2" fill="#7a5634" stroke-width="2"/>
    <rect x="142" y="114" width="7" height="20" fill="#7a5634" stroke-width="2"/>
    <circle cx="137" cy="124" r="2" fill="#3b2f27" stroke="none"/>
    <!-- posts -->
    <rect x="36" y="40" width="24" height="164" fill="#8d8579"/>
    <rect x="260" y="40" width="24" height="164" fill="#8d8579"/>
    <path d="M38 44 V200 M262 44 V200" fill="none" stroke="#a69f93" stroke-width="3"/>
    <path d="M54 46 V200 M278 46 V200" fill="none" stroke="#6f675c" stroke-width="3"/>
    <!-- beam and plank roof -->
    <rect x="28" y="40" width="264" height="12" fill="#7a5634"/>
    <path d="M14 42 L306 42 L290 18 L30 18 Z" fill="#8d8579"/>
    <path d="M14 42 L306 42 L302 36 L18 36 Z" fill="#6f675c" stroke="none"/>
    <path d="M14 42 L306 42 L290 18 L30 18 Z" fill="none"/>
    <path d="M62 18 L58 42 M98 18 L96 42 M134 18 L133 42 M170 18 L170 42 M206 18 L207 42 M242 18 L244 42 M276 18 L280 42" fill="none" stroke-width="1.5"/>
    <path d="M30 18 L290 18" fill="none" stroke-width="3"/>
  </g>
</svg>
