<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>борона</title>
  <desc>A wooden peasant harrow lying on bare black earth: a square lattice of wooden bars lashed together, with a short wooden tooth driven down through every crossing, and a rope drawn forward from the front corner.</desc>
