    <path d="M150 124 C174 148 190 180 180 204 L150 204 C166 178 162 148 140 116 Z" fill="#d8c9a6" stroke="none"/>
    <path d="M60 132 C54 146 50 162 54 178" fill="none" stroke="#faf5e8" stroke-width="5"/>
    <path d="M34 204 C22 184 30 150 56 128 C72 114 92 100 104 84 L130 84 C138 100 156 116 170 134 C190 158 196 186 182 204 Z" fill="none"/>
    <g fill="none" stroke="#a8977a" stroke-width="1.6">
