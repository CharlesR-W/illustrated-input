    <path d="M100 52 L106 74 M120 46 L118 76 M136 48 L128 76" fill="none" stroke="#a8977a" stroke-width="1.5"/>
    <!-- cord -->
    <path d="M100 82 C110 88 124 88 134 82" fill="none" stroke="#3b2f27" stroke-width="8"/>
    <path d="M100 82 C110 88 124 88 134 82" fill="none" stroke="#a0764a" stroke-width="4.5"/>
    <path d="M132 84 C142 92 146 104 140 114 M132 84 C146 88 154 96 156 106" fill="none" stroke="#3b2f27" stroke-width="6"/>
    <path d="M132 84 C142 92 146 104 140 114 M132 84 C146 88 154 96 156 106" fill="none" stroke="#a0764a" stroke-width="3"/>
    </g>
    <!-- spilled oats -->
    <g fill="#e2c98a" stroke-width="1.4">
