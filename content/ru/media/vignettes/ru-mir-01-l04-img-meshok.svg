<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>мешок</title>
  <desc>A coarse linen grain sack, half full and slouching, tied at the neck with cord, with a few oat grains spilled on the ground beside it.</desc>
  <g stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
