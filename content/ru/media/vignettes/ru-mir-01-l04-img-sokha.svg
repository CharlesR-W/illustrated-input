<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>соха</title>
  <desc>A Russian wooden plough: a slanted board forked at the bottom into two prongs with iron shares, a crossbar with two curved handles at the top back, and two long shafts reaching forward for the horse.</desc>
  <g stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="180" cy="184" rx="130" ry="8" fill="#d9cfb8" stroke="none" opacity="0.6"/>
    <!-- turned soil ahead of the shares -->
    <path d="M86 188 C96 174 116 170 130 176 C138 180 136 188 128 188 Z" fill="#3d2f25"/>
    <!-- far shaft (behind the board) -->
    <path d="M246 56 L14 80 L14 86 L246 63 Z" fill="#7a5634"/>
    <!-- far handle -->
    <path d="M236 48 C254 42 270 30 282 12" fill="none" stroke="#3b2f27" stroke-width="10"/>
    <path d="M236 48 C254 42 270 30 282 12" fill="none" stroke="#7a5634" stroke-width="5"/>
    <!-- far share -->
    <path d="M178 166 L198 166 L192 178 L156 184 Z" fill="#4c4f53"/>
    <!-- forked board (rassokha) -->
    <path d="M226 52 L252 52 L198 170 L178 170 L190 128 L162 170 L142 170 Z" fill="#a0764a"/>
    <path d="M232 56 L240 56 L160 166 L150 166 Z" fill="#c09464" stroke="none"/>
    <path d="M214 82 L248 66 L198 170 L186 170 Z" fill="#8a6440" stroke="none" opacity="0.6"/>
    <path d="M226 52 L252 52 L198 170 L178 170 L190 128 L162 170 L142 170 Z" fill="none"/>
    <!-- near share -->
    <path d="M140 164 L164 164 L158 178 L116 188 Z" fill="#5c5f63"/>
    <path d="M146 170 L124 184" fill="none" stroke="#9a9da1" stroke-width="2"/>
    <!-- rope binding from shaft to board -->
    <path d="M176 82 L204 112" fill="none" stroke="#3b2f27" stroke-width="6"/>
    <path d="M176 82 L204 112" fill="none" stroke="#c9a86a" stroke-width="3"/>
    <!-- near shaft -->
    <path d="M244 64 L6 98 L6 107 L244 74 Z" fill="#a0764a"/>
    <path d="M234 67 L18 98" fill="none" stroke="#c09464" stroke-width="2.5"/>
    <path d="M244 64 L6 98 L6 107 L244 74 Z" fill="none"/>
    <!-- crossbar and near handle -->
    <rect x="220" y="44" width="46" height="14" rx="4" fill="#7a5634"/>
    <path d="M258 52 C276 46 292 34 302 16 C304 12 310 14 308 20" fill="none" stroke="#3b2f27" stroke-width="11"/>
    <path d="M258 52 C276 46 292 34 302 16 C304 12 310 14 308 20" fill="none" stroke="#a0764a" stroke-width="6"/>
  </g>
</svg>
