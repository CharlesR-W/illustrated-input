<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <title>вы́веска</title>
  <desc>A long pale painted wooden signboard with a dark border and rows of dark brush strokes, nailed to a log wall above the top of a door.</desc>
  <g stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- log wall behind -->
    <g fill="#8d8579" stroke-width="2">
      <rect x="4" y="2" width="312" height="18" rx="9"/>
      <rect x="4" y="22" width="312" height="18" rx="9"/>
      <rect x="4" y="122" width="312" height="18" rx="9"/>
      <rect x="4" y="142" width="312" height="16" rx="8"/>
    </g>
    <g fill="#6f675c" stroke="none">
      <rect x="10" y="14" width="300" height="4" rx="2"/><rect x="10" y="34" width="300" height="4" rx="2"/>
      <rect x="10" y="134" width="300" height="4" rx="2"/>
    </g>
    <!-- door frame below -->
    <rect x="114" y="126" width="92" height="34" fill="#7a5634"/>
    <rect x="104" y="118" width="112" height="9" fill="#a0764a"/>
    <path d="M160 127 V160" fill="none" stroke-width="1.5"/>
    <!-- board -->
    <rect x="16" y="36" width="288" height="78" rx="3" fill="#eee3c8"/>
    <path d="M20 40 H300 V48 H20 Z" fill="#f7f0dc" stroke="none"/>
    <rect x="26" y="46" width="268" height="58" rx="2" fill="none" stroke="#4a5a78" stroke-width="4"/>
    <!-- painted strokes, not letters -->
    <g fill="none" stroke="#3d2f25" stroke-width="6">
      <path d="M44 66 C50 58 56 74 62 66 C68 58 74 74 80 66 C86 58 90 70 94 66"/>
      <path d="M112 66 C118 58 124 74 130 66 C136 58 142 74 148 66 C154 58 160 74 166 66 C170 62 174 68 178 66"/>
      <path d="M198 66 C204 58 210 74 216 66 C222 58 228 74 234 66 C240 60 246 72 252 66 C258 60 264 70 274 66"/>
    </g>
    <g fill="none" stroke="#b0443a" stroke-width="5">
      <path d="M78 90 C84 84 90 96 96 90 C102 84 108 96 114 90 C120 84 126 96 132 90 C136 86 140 92 144 90"/>
      <path d="M166 90 C172 84 178 96 184 90 C190 84 196 96 202 90 C208 84 214 96 220 90 C226 86 232 92 240 90"/>
    </g>
    <g fill="#5c5f63" stroke-width="1.5">
      <circle cx="22" cy="75" r="3.5"/><circle cx="298" cy="75" r="3.5"/>
    </g>
  </g>
</svg>
