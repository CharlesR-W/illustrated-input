<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>лампа</title>
  <desc>A kerosene table lamp with a brass base and glass font, a burner collar, a tall clear glass chimney bulging at the bottom, a small yellow flame and a warm glow behind.</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6d77a" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#f6d77a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6d77a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="104" r="92" fill="url(#glow)"/>
  <g stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="120" cy="222" rx="60" ry="8" fill="#d9cfb8" stroke="none" opacity="0.6"/>
    <!-- base -->
    <path d="M80 220 C84 208 100 204 108 196 L132 196 C140 204 156 208 160 220 Z" fill="#c9a24a"/>
    <path d="M90 214 C96 208 104 204 110 200" fill="none" stroke="#e6c878" stroke-width="3"/>
    <rect x="110" y="182" width="20" height="16" fill="#b8913f"/>
    <!-- glass font with kerosene -->
    <path d="M120 186 C92 186 82 172 82 160 C82 146 96 136 120 136 C144 136 158 146 158 160 C158 172 148 186 120 186 Z" fill="#cfe0d6" fill-opacity="0.75"/>
    <path d="M86 164 C90 176 104 184 120 184 C136 184 150 176 154 164 Z" fill="#d9b45a" fill-opacity="0.8" stroke="none"/>
    <path d="M120 186 C92 186 82 172 82 160 C82 146 96 136 120 136 C144 136 158 146 158 160 C158 172 148 186 120 186 Z" fill="none"/>
    <path d="M94 152 C96 146 102 142 110 140" fill="none" stroke="#ffffff" stroke-width="3"/>
    <!-- burner collar -->
    <rect x="98" y="122" width="44" height="16" rx="3" fill="#c9a24a"/>
    <path d="M102 128 H138" fill="none" stroke="#9c7a34" stroke-width="1.5"/>
    <path d="M142 128 H152" fill="none" stroke-width="3"/>
    <circle cx="155" cy="128" r="5" fill="#c9a24a" stroke-width="2"/>
    <!-- chimney -->
    <path d="M108 122 C92 112 92 90 108 80 L110 34 L130 34 L132 80 C148 90 148 112 132 122 Z" fill="#eef3f2" fill-opacity="0.55"/>
    <!-- flame -->
    <path d="M120 88 C126 98 129 106 126 112 C124 116 116 116 114 112 C111 106 114 98 120 88 Z" fill="#f2b83a" stroke="#c9822a" stroke-width="1.5"/>
    <path d="M120 98 C123 104 123 109 120 112 C117 109 117 104 120 98 Z" fill="#fff3b0" stroke="none"/>
    <path d="M108 122 C92 112 92 90 108 80 L110 34 L130 34 L132 80 C148 90 148 112 132 122" fill="none"/>
    <ellipse cx="120" cy="34" rx="10" ry="3" fill="none" stroke-width="2"/>
    <path d="M114 40 L113 76 M101 92 C99 98 99 106 102 112" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
