<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <title>тетрадь</title>
  <desc>A thin school exercise book lying open, with two blank pale pages ruled in fine blue-grey lines and the edge of its plain paper cover showing beneath.</desc>
  <defs>
    <linearGradient id="gutter" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3b2f27" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3b2f27" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b2f27" stop-opacity="0"/>
    </linearGradient>
    <g id="rules" fill="none" stroke="#8fa0b4" stroke-width="1.2">
      <path d="M0 0 H116 M0 12 H116 M0 24 H116 M0 36 H116 M0 48 H116 M0 60 H116 M0 72 H116 M0 84 H116 M0 96 H116 M0 108 H116 M0 120 H116 M0 132 H116"/>
    </g>
  </defs>
  <g transform="rotate(-4 160 110)" stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="162" cy="200" rx="146" ry="9" fill="#d9cfb8" stroke="none" opacity="0.6"/>
    <!-- cover -->
    <path d="M16 30 Q88 22 160 32 Q232 22 304 30 L304 198 Q232 190 160 200 Q88 190 16 198 Z" fill="#a9b6c3"/>
    <!-- pages -->
    <path d="M24 34 Q92 24 160 38 L160 194 Q92 182 24 192 Z" fill="#faf6ea"/>
    <path d="M296 34 Q228 24 160 38 L160 194 Q228 182 296 192 Z" fill="#faf6ea"/>
    <use href="#rules" transform="translate(34 52)"/>
    <use href="#rules" transform="translate(172 52)"/>
    <rect x="140" y="36" width="40" height="158" fill="url(#gutter)" stroke="none"/>
    <path d="M24 34 Q92 24 160 38 L160 194 Q92 182 24 192 Z" fill="none"/>
    <path d="M296 34 Q228 24 160 38 L160 194 Q228 182 296 192 Z" fill="none"/>
    <path d="M160 70 V80 M160 150 V160" fill="none" stroke="#7a8a9c" stroke-width="2"/>
  </g>
</svg>
