<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>колодец</title>
  <desc>A village sweep well: a square log well-head with notched corners, a tall forked post beside it, and a long sweep beam pivoting in the fork, with a pole and wooden bucket hanging over the well and a lashed counterweight log on the low end.</desc>
  <g stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="124" cy="212" rx="106" ry="11" fill="#d9cfb8" stroke="none" opacity="0.6"/>
    <!-- post -->
    <path d="M170 212 V88" fill="none" stroke="#3b2f27" stroke-width="13"/>
    <path d="M170 212 V88" fill="none" stroke="#8a6440" stroke-width="8"/>
    <path d="M167 206 V92" fill="none" stroke="#a0764a" stroke-width="2.5"/>
    <!-- sweep beam -->
    <path d="M58 20 L224 103" fill="none" stroke="#3b2f27" stroke-width="10"/>
    <path d="M58 20 L224 103" fill="none" stroke="#a0764a" stroke-width="5.5"/>
    <!-- counterweight log -->
    <path d="M190 86 L222 102" fill="none" stroke="#3b2f27" stroke-width="22"/>
    <path d="M190 86 L222 102" fill="none" stroke="#7a5634" stroke-width="17"/>
    <path d="M192 82 L220 96" fill="none" stroke="#a0764a" stroke-width="4"/>
    <path d="M198 82 L194 92 M214 90 L210 100" fill="none" stroke="#c9a86a" stroke-width="3"/>
    <!-- fork prongs and pin -->
    <path d="M170 92 L160 62 M170 92 L180 62" fill="none" stroke="#3b2f27" stroke-width="9"/>
    <path d="M170 92 L160 62 M170 92 L180 62" fill="none" stroke="#8a6440" stroke-width="5"/>
    <circle cx="170" cy="76" r="4" fill="#5c5f63" stroke-width="2"/>
    <!-- hanging pole -->
    <path d="M62 22 V126" fill="none" stroke="#3b2f27" stroke-width="6"/>
    <path d="M62 22 V126" fill="none" stroke="#c09464" stroke-width="3"/>
    <!-- bucket -->
    <path d="M50 134 C52 120 72 120 74 134" fill="none" stroke-width="2"/>
    <path d="M47 134 L51 154 L73 154 L77 134 Z" fill="#a0764a"/>
    <path d="M66 134 L77 134 L73 154 L66 154 Z" fill="#7a5634" stroke="none"/>
    <path d="M47 134 L51 154 L73 154 L77 134 Z" fill="none"/>
    <path d="M48 140 H76 M50 149 H74" fill="none" stroke="#5c5f63" stroke-width="2.5"/>
    <!-- well-head: back log and dark opening -->
    <rect x="28" y="152" width="70" height="10" rx="5" fill="#7a5634"/>
    <path d="M30 162 H96" fill="none" stroke="#3d2f25" stroke-width="5"/>
    <!-- front logs -->
    <g fill="#a0764a">
      <rect x="18" y="164" width="90" height="12" rx="6"/>
      <rect x="26" y="176" width="74" height="12" rx="6"/>
      <rect x="18" y="188" width="90" height="12" rx="6"/>
      <rect x="26" y="200" width="74" height="12" rx="6"/>
    </g>
    <path d="M24 168 H102 M32 180 H94 M24 192 H102 M32 204 H94" fill="none" stroke="#c09464" stroke-width="2"/>
    <!-- side log ends at the notched corners -->
    <g fill="#c09464">
      <circle cx="27" cy="182" r="6.5"/><circle cx="99" cy="182" r="6.5"/>
      <circle cx="27" cy="206" r="6.5"/><circle cx="99" cy="206" r="6.5"/>
    </g>
    <g fill="none" stroke="#8a6440" stroke-width="1.4">
      <circle cx="27" cy="182" r="3"/><circle cx="99" cy="182" r="3"/>
      <circle cx="27" cy="206" r="3"/><circle cx="99" cy="206" r="3"/>
    </g>
  </g>
</svg>
