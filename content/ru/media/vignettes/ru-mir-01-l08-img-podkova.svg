<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>подкова</title>
  <desc>A worn iron horseshoe lying flat with its open end down, a groove along each branch with four nail holes in it, and two square-shanked horseshoe nails lying beside it.</desc>
  <g stroke="#3b2f27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="124" cy="200" rx="106" ry="13" fill="#d9cfb8" stroke="none" opacity="0.6"/>
    <!-- horseshoe -->
    <g transform="translate(0 30) scale(1 0.84)">
    <path d="M56 188 C32 140 36 52 110 52 C184 52 188 140 164 188 L143 189 C160 148 156 80 110 80 C64 80 60 148 77 189 Z" fill="#3b2f27" stroke="none" opacity="0.12" transform="translate(5 6)"/>
    <path d="M56 188 C32 140 36 52 110 52 C184 52 188 140 164 188 L143 189 C160 148 156 80 110 80 C64 80 60 148 77 189 Z" fill="#5c5f63"/>
    <path d="M154 62 C182 84 186 146 164 188 L143 189 C160 148 156 84 124 80 C136 76 146 70 154 62 Z" fill="#45474b" stroke="none"/>
    <path d="M50 156 C40 116 48 66 104 59" fill="none" stroke="#8d9196" stroke-width="3.5"/>
    <path d="M56 188 C32 140 36 52 110 52 C184 52 188 140 164 188 L143 189 C160 148 156 80 110 80 C64 80 60 148 77 189 Z" fill="none"/>
    <!-- groove along the branches -->
    <path d="M67 180 C52 146 50 104 78 74 M153 180 C168 146 170 104 142 74" fill="none" stroke="#2f3134" stroke-width="2.5"/>
    <!-- nail holes -->
    <g fill="#1f2022" stroke="none">
      <rect x="-2.5" y="-4" width="5" height="8" transform="translate(64 168) rotate(-20)"/>
      <rect x="-2.5" y="-4" width="5" height="8" transform="translate(57 145) rotate(-6)"/>
      <rect x="-2.5" y="-4" width="5" height="8" transform="translate(57 121) rotate(10)"/>
      <rect x="-2.5" y="-4" width="5" height="8" transform="translate(65 97) rotate(32)"/>
      <rect x="-2.5" y="-4" width="5" height="8" transform="translate(156 168) rotate(20)"/>
      <rect x="-2.5" y="-4" width="5" height="8" transform="translate(163 145) rotate(6)"/>
      <rect x="-2.5" y="-4" width="5" height="8" transform="translate(163 121) rotate(-10)"/>
      <rect x="-2.5" y="-4" width="5" height="8" transform="translate(155 97) rotate(-32)"/>
    </g>
    <!-- wear nick at the toe -->
    <path d="M98 55 C104 57 112 57 118 55" fill="none" stroke="#8d9196" stroke-width="2"/>
    </g>
    <!-- two horseshoe nails -->
    <g fill="#5c5f63" stroke-width="2">
      <path d="M0 -7 L11 -5.5 L11 -2.5 L46 0 L11 2.5 L11 5.5 L0 7 Z" transform="translate(192 148) rotate(52)"/>
      <path d="M0 -7 L11 -5.5 L11 -2.5 L46 0 L11 2.5 L11 5.5 L0 7 Z" transform="translate(176 204) rotate(-6)"/>
    </g>
    <g fill="none" stroke="#8d9196" stroke-width="1.8">
      <path d="M2 -4 L9 -3.5 M13 -1 L36 -0.3" transform="translate(192 148) rotate(52)"/>
      <path d="M2 -4 L9 -3.5 M13 -1 L36 -0.3" transform="translate(176 204) rotate(-6)"/>
    </g>
  </g>
</svg>
