    <g fill="none">
      <circle cx="123" cy="175" r="25" stroke="#3b2f27" stroke-width="8"/>
      <circle cx="123" cy="175" r="25" stroke="#7a5634" stroke-width="4"/>
      <circle cx="207" cy="169" r="31" stroke="#3b2f27" stroke-width="8"/>
      <circle cx="207" cy="169" r="31" stroke="#7a5634" stroke-width="4"/>
    </g>
    <!-- far shaft -->
    <path d="M100 150 L30 136" fill="none" stroke="#3b2f27" stroke-width="8"/>
    <path d="M100 150 L30 136" fill="none" stroke="#7a5634" stroke-width="4"/>
    <!-- sack -->
    <path d="M132 124 C130 104 146 96 164 98 C184 96 204 100 206 112 C210 118 208 124 204 128 Z" fill="#eee3c8"/>
    <path d="M190 100 C202 102 208 110 206 124 L192 126 C196 116 196 106 190 100 Z" fill="#d8c9a6" stroke="none"/>
    <path d="M146 106 C152 102 162 101 170 102" fill="none" stroke="#faf5e8" stroke-width="3"/>
    <path d="M132 124 C130 104 146 96 164 98 C184 96 204 100 206 112 C210 118 208 124 204 128" fill="none"/>
    <path d="M136 110 C128 104 122 104 118 108 C118 116 120 122 126 124 C130 120 134 118 138 120 Z" fill="#eee3c8"/>
    <path d="M122 110 L130 114 M122 118 L130 117" fill="none" stroke="#a8977a" stroke-width="1.5"/>
    <path d="M134 110 C138 114 138 118 136 122" fill="none" stroke="#a0764a" stroke-width="4"/>
    <!-- box: slats, rail and bottom planks -->
    <path d="M84 122 V146 M102 122 V146 M120 122 V146 M138 122 V146 M156 122 V146 M174 122 V146 M192 122 V146 M210 122 V146 M226 122 V146" fill="none" stroke="#3b2f27" stroke-width="7"/>
    <path d="M84 122 V146 M102 122 V146 M120 122 V146 M138 122 V146 M156 122 V146 M174 122 V146 M192 122 V146 M210 122 V146 M226 122 V146" fill="none" stroke="#a0764a" stroke-width="3.5"/>
    <rect x="78" y="116" width="154" height="8" rx="2" fill="#a0764a"/>
    <path d="M82 119 H228" fill="none" stroke="#c09464" stroke-width="2"/>
    <rect x="76" y="144" width="158" height="14" rx="2" fill="#8a6440"/>
    <path d="M78 151 H232" fill="none" stroke="#7a5634" stroke-width="1.5"/>
    <path d="M80 147 H230" fill="none" stroke="#a0764a" stroke-width="2"/>
    <!-- near shaft -->
    <path d="M110 160 L22 148" fill="none" stroke="#3b2f27" stroke-width="9"/>
    <path d="M110 160 L22 148" fill="none" stroke="#a0764a" stroke-width="5"/>
    <!-- shaft-bow -->
    <path d="M22 150 C12 104 26 76 36 76 C46 76 54 104 46 139" fill="none" stroke="#3b2f27" stroke-width="10"/>
    <path d="M22 150 C12 104 26 76 36 76 C46 76 54 104 46 139" fill="none" stroke="#b5532e" stroke-width="5.5"/>
    <path d="M19 120 C18 102 24 88 32 82" fill="none" stroke="#d9885a" stroke-width="2"/>
