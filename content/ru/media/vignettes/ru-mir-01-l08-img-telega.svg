<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>телега</title>
  <desc>A wooden peasant cart seen from the side, without a horse: four spoked wheels, a long plank box with low slatted sides holding one grain sack, and two shafts reaching forward with a painted shaft-bow arching over their front ends.</desc>
