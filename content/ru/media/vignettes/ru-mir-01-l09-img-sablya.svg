<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>сабля</title>
  <desc>A slightly curved guardless sabre in a dark leather scabbard with brass fittings, hanging diagonally from a narrow shoulder belt; wooden grip with a split pommel and a small cord tassel.</desc>
  <g stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- shoulder belt and the hanging strap -->
    <path d="M6 34 C58 36 118 56 160 82" stroke="#3b2f27" stroke-width="9"/>
    <path d="M6 34 C58 36 118 56 160 82" stroke="#7a5236" stroke-width="5"/>
    <path d="M98 55 L123 125" stroke="#3b2f27" stroke-width="8"/>
    <path d="M98 55 L123 125" stroke="#7a5236" stroke-width="4"/>
    <!-- soft shadow -->
    <path d="M174 76 Q126 156 52 212" stroke="#3b2f27" stroke-width="16" opacity="0.12"/>
    <!-- scabbard -->
    <path d="M168 70 Q120 150 46 206" stroke="#2a201a" stroke-width="19"/>
    <path d="M168 70 Q120 150 46 206" stroke="#4a3426" stroke-width="13"/>
    <path d="M163 76 Q118 148 52 197" stroke="#6e5040" stroke-width="2.5" opacity="0.8"/>
    <!-- brass mouth, middle band and chape -->
    <path d="M168 70 L158 86" stroke="#2a201a" stroke-width="21"/>
    <path d="M168 70 L158 86" stroke="#b8903a" stroke-width="16" stroke-linecap="butt"/>
    <path d="M166 73 L160 83" stroke="#e0c070" stroke-width="3"/>
    <path d="M131 118 L119 133" stroke="#2a201a" stroke-width="22" stroke-linecap="butt"/>
    <path d="M131 118 L119 133" stroke="#b8903a" stroke-width="18" stroke-linecap="butt"/>
    <path d="M64 194 L46 206" stroke="#2a201a" stroke-width="20"/>
    <path d="M64 194 L46 206" stroke="#b8903a" stroke-width="14"/>
    <path d="M60 195 L50 202" stroke="#e0c070" stroke-width="2.5"/>
    <!-- belt rings -->
    <circle cx="160" cy="83" r="6" stroke="#2a201a" stroke-width="4.5"/>
    <circle cx="160" cy="83" r="6" stroke="#c9a24a" stroke-width="2"/>
    <circle cx="123" cy="126" r="6" stroke="#2a201a" stroke-width="4.5"/>
    <circle cx="123" cy="126" r="6" stroke="#c9a24a" stroke-width="2"/>
    <!-- wooden grip, no guard -->
    <path d="M168 70 Q178 48 192 28" stroke="#2a201a" stroke-width="14"/>
    <path d="M168 70 Q178 48 192 28" stroke="#8a5a30" stroke-width="9"/>
    <path d="M172 60 L178 63 M176 51 L183 54 M181 42 L188 45" stroke="#5a3a20" stroke-width="1.8"/>
    <!-- split pommel -->
    <path d="M186 30 C186 18 196 12 204 16 C198 20 196 24 198 28 C200 24 206 22 210 26 C206 32 198 36 190 34 Z" fill="#8a5a30" stroke="#2a201a" stroke-width="2.5"/>
    <!-- cord and tassel -->
    <path d="M200 30 C212 42 214 56 210 70" stroke="#7a2a22" stroke-width="2.5"/>
    <path d="M210 68 C204 72 204 88 207 94 L215 94 C218 88 217 72 210 68 Z" fill="#a33b2e" stroke="#2a201a" stroke-width="2"/>
    <path d="M208 78 L208 92 M211 77 L211 93 M214 78 L214 92" stroke="#6e2018" stroke-width="1.2"/>
  </g>
</svg>
