<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Illustrated Input — graded illustrated readers for language learners.">
  <title>Illustrated Input</title>
  <script>try { if (localStorage.getItem("illustrated-input:theme") === "light") document.documentElement.dataset.theme = "light"; if (localStorage.getItem("illustrated-input:nav-collapsed") === "1") document.documentElement.classList.add("nav-collapsed"); } catch {}</script>
  <link rel="stylesheet" href="styles.css?v=414a4042bd">
</head>
<body>
  <a class="skip-link" href="#main" data-ui="skip">Skip to the text</a>
  <header class="site-header">
    <div class="header-start">
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="course-nav" data-ui-label="nav_lessons" aria-label="Lessons" title="Lessons">
        <svg class="icon-panel" viewBox="0 0 24 24" aria-hidden="true"><rect class="pane" x="3.5" y="4.5" width="5.5" height="15" rx="1"/><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
        <svg class="icon-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <a class="brand" href="#contents" id="brand">
        <span class="brand-mark" aria-hidden="true">Ii</span>
        <span><strong id="brand-title">Illustrated Input</strong><small id="brand-subtitle" lang="en">Learn through the story</small></span>
      </a>
    </div>
    <div class="header-actions">
      <button id="theme-toggle" class="pill theme-toggle" type="button" lang="en"></button>
      <button id="english-toggle" class="pill" type="button" aria-pressed="false" lang="en" hidden>English</button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="course-panel" id="course-nav">
      <nav class="course-switch" id="course-switch" aria-labelledby="course-switch-label" hidden></nav>
      <div class="course-heading">
        <p class="eyebrow" id="course-language"></p>
        <p class="course-title" id="course-title">…</p>
        <p id="course-description"></p>
      </div>
      <div class="progress-block">
        <div class="progress-copy"><span id="progress-label" data-ui="course_progress">Course progress</span><strong id="progress-count">0 / 0</strong></div>
        <div class="progress-track" role="progressbar" aria-labelledby="progress-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="progress-fill"></span></div>
      </div>
      <p class="panel-links"><a href="#contents" data-ui="contents">Contents</a><a href="#intro" id="intro-link" data-ui="how_to_read" hidden>How to read this book</a><a href="#whats-next" id="next-link" data-ui="whats_next" hidden>What next</a></p>
      <div class="book-switch" id="book-switch" role="group" hidden></div>
      <nav id="lesson-nav"></nav>
    </aside>

    <main id="main" tabindex="-1">
      <div id="loading" class="status-card" role="status" data-ui="loading">Opening the course…</div>
      <div id="error" class="status-card error" role="alert" hidden></div>
      <section id="intro" class="intro" hidden aria-labelledby="intro-title"></section>
      <section id="overview" class="overview" hidden aria-labelledby="overview-title"></section>
      <article id="lesson" class="lesson" hidden aria-labelledby="lesson-title"></article>
      <section id="whats-next" class="intro" hidden aria-labelledby="whats-next-title"></section>
    </main>
  </div>

  <dialog id="lightbox" class="lightbox" aria-label="Enlarge picture">
    <figure>
      <img id="lightbox-image" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <form method="dialog"><button class="button secondary" type="submit" id="lightbox-close" data-ui="close">Close</button></form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="audio-dock" class="audio-dock" role="group" hidden>
    <button id="audio-pause" class="audio-dock-main" type="button"></button>
    <button id="audio-stop" class="audio-dock-stop" type="button"></button>
  </div>
  <script src="greek.js?v=b377390089" defer></script>
  <script src="russian.js?v=45affd5821" defer></script>
  <script src="core.js?v=8321061b1a" defer></script>
  <script src="app.js?v=6007b4dc41" defer></script>
</body>
</html>
